<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transparent Canvas Fireworks</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            cursor: crosshair;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
"use strict";


/* =========================================================
   Canvas
   ========================================================= */

const canvas =
    document.getElementById("canvas");


const ctx =
    canvas.getContext("2d", {
        alpha: true,
        desynchronized: true
    });


/* =========================================================
   화면 크기
   ========================================================= */

let width = 0;
let height = 0;


/*
 * DPR을 최대 1.5로 제한합니다.
 *
 * 모바일에서 2x / 3x Canvas를 그대로 사용하면
 * 렌더링 픽셀이 급격하게 증가합니다.
 */
let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    );


function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);


resize();


/* =========================================================
   수학
   ========================================================= */

const TAU =
    Math.PI * 2;


function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


function randomInt(min, max) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


function easeOutCubic(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


/* =========================================================
   불꽃 색상
   ========================================================= */

const COLORS = [

    "#fff7d6",
    "#ffd166",
    "#ff9f43",
    "#ff5c7a",
    "#ff6bd6",
    "#bd7cff",
    "#7189ff",
    "#55d9ff",
    "#62ffe4",
    "#8cff72"

];


/* =========================================================
   파티클 수
   ========================================================= */

const MAX_PARTICLES =
    Math.min(
        220,
        Math.max(
            110,
            Math.floor(
                (width * height) /
                10000
            )
        )
    );


/* =========================================================
   파티클
   ========================================================= */

class Particle {

    constructor() {

        this.active =
            false;

        this.x = 0;
        this.y = 0;

        this.vx = 0;
        this.vy = 0;

        this.life = 0;
        this.maxLife = 0;

        this.size = 1;

        this.color =
            "#fff";

        this.gravity =
            .05;
    }


    reset(
        x,
        y,
        vx,
        vy,
        color,
        life,
        size
    ) {

        this.active =
            true;

        this.x =
            x;

        this.y =
            y;

        this.vx =
            vx;

        this.vy =
            vy;

        this.color =
            color;

        this.life =
            life;

        this.maxLife =
            life;

        this.size =
            size;

        this.gravity =
            random(
                .025,
                .065
            );
    }


    update() {

        this.vx *=
            .988;

        this.vy *=
            .988;

        this.vy +=
            this.gravity;

        this.x +=
            this.vx;

        this.y +=
            this.vy;

        this.life--;


        if (
            this.life <= 0 ||
            this.y > height + 40 ||
            this.x < -50 ||
            this.x > width + 50
        ) {

            this.active =
                false;
        }
    }


    draw() {

        if (
            !this.active
        ) {

            return;
        }


        const alpha =
            this.life /
            this.maxLife;


        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            this.color;


        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            TAU
        );

        ctx.fill();
    }
}


/* =========================================================
   파티클 Pool
   ========================================================= */

const particlePool = [];


for (
    let i = 0;
    i < 260;
    i++
) {

    particlePool.push(
        new Particle()
    );
}


function getParticle() {

    for (
        let i = 0;
        i < particlePool.length;
        i++
    ) {

        if (
            !particlePool[i].active
        ) {

            return particlePool[i];
        }
    }


    return null;
}


/* =========================================================
   Audio
   ========================================================= */

let audioContext =
    null;


/*
 * Noise Buffer는 한 번만 생성합니다.
 */
let noiseBuffer =
    null;


function initAudio() {

    if (
        audioContext
    ) {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        return;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return;
    }


    audioContext =
        new AudioContext();


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


/* =========================================================
   Noise Buffer
   ========================================================= */

function getNoiseBuffer() {

    if (
        !audioContext
    ) {

        return null;
    }


    if (
        noiseBuffer
    ) {

        return noiseBuffer;
    }


    const size =
        audioContext.sampleRate;


    noiseBuffer =
        audioContext.createBuffer(
            1,
            size,
            audioContext.sampleRate
        );


    const data =
        noiseBuffer.getChannelData(0);


    for (
        let i = 0;
        i < size;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;
    }


    return noiseBuffer;
}


/* =========================================================
   로켓 상승 비행음
   ========================================================= */

/*
 * 실제 로켓이 날아가는 것처럼
 *
 * 0초
 * ↓
 * 낮은 Whoosh
 *
 * 0.7초
 * ↓
 * 중간 음역
 *
 * 1.4초
 * ↓
 * 높은 Whoosh
 *
 * 이후 폭발
 *
 * 형태로 만듭니다.
 */

function playRocketFlightSound() {

    if (
        !audioContext
    ) {

        return null;
    }


    const now =
        audioContext.currentTime;


    /*
     * -----------------------------------------------------
     * 1. Noise 기반 Whoosh
     * -----------------------------------------------------
     */

    const source =
        audioContext.createBufferSource();


    source.buffer =
        getNoiseBuffer();


    /*
     * Band-pass 필터
     *
     * 180Hz
     * →
     * 700Hz
     * →
     * 1800Hz
     * →
     * 2800Hz
     */
    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "bandpass";


    filter.frequency.setValueAtTime(
        180,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        700,
        now + .45
    );


    filter.frequency.exponentialRampToValueAtTime(
        1800,
        now + 1.05
    );


    filter.frequency.exponentialRampToValueAtTime(
        2800,
        now + 1.38
    );


    filter.Q.value =
        .75;


    /*
     * -----------------------------------------------------
     * Whoosh 볼륨
     * -----------------------------------------------------
     */

    const gain =
        audioContext.createGain();


    /*
     * 처음에는 거의 들리지 않게 합니다.
     */
    gain.gain.setValueAtTime(
        .0001,
        now
    );


    /*
     * 상승하면서 점점 커집니다.
     */
    gain.gain.exponentialRampToValueAtTime(
        .025,
        now + .15
    );


    gain.gain.exponentialRampToValueAtTime(
        .07,
        now + .7
    );


    gain.gain.exponentialRampToValueAtTime(
        .13,
        now + 1.15
    );


    /*
     * 폭발 직전에 다시 살짝 감소합니다.
     */
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + 1.42
    );


    source
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );


    source.start(
        now
    );


    source.stop(
        now + 1.45
    );


    /*
     * -----------------------------------------------------
     * 2. 상승음을 조금 더 선명하게 만들어주는
     *    고주파 Oscillator
     * -----------------------------------------------------
     */

    const oscillator =
        audioContext.createOscillator();


    oscillator.type =
        "sine";


    /*
     * 240Hz → 1250Hz
     */
    oscillator.frequency.setValueAtTime(
        240,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        1250,
        now + 1.35
    );


    const oscillatorGain =
        audioContext.createGain();


    oscillatorGain.gain.setValueAtTime(
        .0001,
        now
    );


    oscillatorGain.gain.exponentialRampToValueAtTime(
        .025,
        now + .2
    );


    oscillatorGain.gain.exponentialRampToValueAtTime(
        .055,
        now + 1.15
    );


    oscillatorGain.gain.exponentialRampToValueAtTime(
        .0001,
        now + 1.42
    );


    oscillator
        .connect(oscillatorGain)
        .connect(
            audioContext.destination
        );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + 1.45
    );


    /*
     * 오디오 객체를 반환합니다.
     *
     * 필요하면 나중에 로켓 폭발 순간에
     * 소리를 강제로 끊을 수도 있습니다.
     */
    return {
        source,
        oscillator,
        gain,
        oscillatorGain
    };
}


/* =========================================================
   발사음
   ========================================================= */

function playLaunchSound() {

    if (
        !audioContext
    ) {

        return;
    }


    const now =
        audioContext.currentTime;


    const source =
        audioContext.createBufferSource();


    source.buffer =
        getNoiseBuffer();


    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "bandpass";


    /*
     * 발사 순간의 짧은 저음
     */
    filter.frequency.setValueAtTime(
        260,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        1500,
        now + .28
    );


    filter.Q.value =
        1.1;


    const gain =
        audioContext.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .09,
        now + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .3
    );


    source
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );


    source.start(
        now
    );


    source.stop(
        now + .35
    );
}


/* =========================================================
   폭발음
   ========================================================= */

function playExplosionSound() {

    if (
        !audioContext
    ) {

        return;
    }


    const now =
        audioContext.currentTime;


    /*
     * 저역 Sine
     */
    const oscillator =
        audioContext.createOscillator();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        70,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        25,
        now + 1
    );


    const bassGain =
        audioContext.createGain();


    bassGain.gain.setValueAtTime(
        .0001,
        now
    );


    bassGain.gain.exponentialRampToValueAtTime(
        .38,
        now + .01
    );


    bassGain.gain.exponentialRampToValueAtTime(
        .0001,
        now + 1
    );


    oscillator
        .connect(bassGain)
        .connect(
            audioContext.destination
        );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + 1.05
    );


    /*
     * 폭발 Noise
     */
    const noise =
        audioContext.createBufferSource();


    noise.buffer =
        getNoiseBuffer();


    /*
     * Low-pass
     */
    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "lowpass";


    filter.frequency.setValueAtTime(
        3200,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        280,
        now + 1
    );


    filter.Q.value =
        .7;


    /*
     * Noise 볼륨
     */
    const gain =
        audioContext.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .34,
        now + .008
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + 1
    );


    noise
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );


    noise.start(
        now
    );


    noise.stop(
        now + 1.05
    );
}


/* =========================================================
   Rocket
   ========================================================= */

class Rocket {

    constructor(
        targetX,
        targetY
    ) {

        /*
         * 지상에서 랜덤한 위치에서 발사합니다.
         */
        this.startX =
            random(
                width * .15,
                width * .85
            );


        this.startY =
            height + 10;


        this.x =
            this.startX;


        this.y =
            this.startY;


        this.targetX =
            targetX;


        this.targetY =
            targetY;


        /*
         * 약 1.4초 상승
         */
        this.elapsed =
            0;


        this.duration =
            1400;


        this.dead =
            false;


        /*
         * 상승 궤적
         */
        this.trail =
            [];


        /*
         * 불꽃 색상
         */
        this.color =
            COLORS[
                randomInt(
                    0,
                    COLORS.length - 1
                )
            ];


        /*
         * 해당 로켓의 비행음
         */
        this.flightSound =
            null;
    }


    update(dt) {

        /*
         * 오디오 초기화 이후
         * 비행음을 한 번만 생성합니다.
         */
        if (
            !this.flightSound &&
            audioContext
        ) {

            this.flightSound =
                playRocketFlightSound();
        }


        /*
         * 시간 진행
         */
        this.elapsed +=
            dt;


        const t =
            clamp(
                this.elapsed /
                this.duration,
                0,
                1
            );


        const progress =
            easeOutCubic(t);


        /*
         * X
         */
        this.x =
            this.startX +
            (
                this.targetX -
                this.startX
            ) *
            progress;


        /*
         * Y
         */
        this.y =
            this.startY +
            (
                this.targetY -
                this.startY
            ) *
            progress;


        /*
         * 궤적
         */
        this.trail.push({
            x: this.x,
            y: this.y
        });


        /*
         * 최대 10개
         */
        if (
            this.trail.length >
            10
        ) {

            this.trail.shift();
        }


        /*
         * 목표 지점 도착
         */
        if (
            t >= 1
        ) {

            this.dead =
                true;


            /*
             * 폭발
             */
            explode(
                this.targetX,
                this.targetY,
                this.color
            );
        }
    }


    draw() {

        /*
         * 상승 궤적
         */
        for (
            let i = 0;
            i < this.trail.length;
            i++
        ) {

            const p =
                this.trail[i];


            ctx.globalAlpha =
                (
                    i /
                    this.trail.length
                ) * .65;


            ctx.fillStyle =
                this.color;


            ctx.fillRect(
                p.x,
                p.y,
                1.5,
                1.5
            );
        }


        /*
         * 로켓 본체
         */
        ctx.globalAlpha =
            1;


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            this.x - 1,
            this.y - 1,
            3,
            3
        );
    }
}


/* =========================================================
   폭발
   ========================================================= */

let flash =
    0;


function explode(
    x,
    y,
    color
) {

    /*
     * 화면 섬광
     */
    flash =
        1;


    /*
     * 메인 파티클
     */
    const count =
        Math.min(
            MAX_PARTICLES,
            170
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const particle =
            getParticle();


        if (
            !particle
        ) {

            break;
        }


        const angle =
            Math.random() *
            TAU;


        const speed =
            Math.pow(
                Math.random(),
                .55
            ) *
            random(
                2.2,
                7
            );


        particle.reset(
            x,
            y,

            Math.cos(angle) *
                speed,

            Math.sin(angle) *
                speed,

            color,

            randomInt(
                45,
                95
            ),

            random(
                .7,
                1.8
            )
        );
    }


    /*
     * 하얀 중심부
     */
    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const particle =
            getParticle();


        if (
            !particle
        ) {

            break;
        }


        const angle =
            Math.random() *
            TAU;


        const speed =
            random(
                .5,
                4.5
            );


        particle.reset(
            x,
            y,

            Math.cos(angle) *
                speed,

            Math.sin(angle) *
                speed,

            "#ffffff",

            randomInt(
                18,
                40
            ),

            random(
                .8,
                2
            )
        );
    }


    /*
     * 폭발음
     */
    playExplosionSound();
}


/* =========================================================
   파티클 업데이트
   ========================================================= */

function updateParticles() {

    for (
        let i = 0;
        i < particlePool.length;
        i++
    ) {

        const particle =
            particlePool[i];


        if (
            particle.active
        ) {

            particle.update();
        }
    }
}


/* =========================================================
   파티클 렌더링
   ========================================================= */

function drawParticles() {

    for (
        let i = 0;
        i < particlePool.length;
        i++
    ) {

        particlePool[i].draw();
    }


    ctx.globalAlpha =
        1;
}


/* =========================================================
   불꽃 발사
   ========================================================= */

const rockets = [];


function launch(
    targetX,
    targetY
) {

    /*
     * 브라우저의 Audio autoplay 정책 때문에
     * 사용자 입력 이후 AudioContext를 활성화합니다.
     */
    initAudio();


    /*
     * 동시에 최대 5개의 로켓
     */
    if (
        rockets.length >= 5
    ) {

        return;
    }


    /*
     * 발사음
     */
    playLaunchSound();


    /*
     * 로켓 생성
     *
     * Rocket.update()에서
     * 1.4초짜리 비행음도 시작됩니다.
     */
    rockets.push(
        new Rocket(
            targetX,
            targetY
        )
    );
}


/* =========================================================
   클릭 발사
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
         * 클릭 즉시 AudioContext 활성화
         */
        initAudio();


        launch(
            event.clientX,
            event.clientY
        );
    },
    {
        passive: true
    }
);


/* =========================================================
   자동 불꽃
   ========================================================= */

let autoTimer =
    800;


function automaticFireworks(dt) {

    autoTimer -=
        dt;


    if (
        autoTimer > 0
    ) {

        return;
    }


    autoTimer =
        random(
            850,
            1800
        );


    launch(
        random(
            width * .12,
            width * .88
        ),

        random(
            height * .15,
            height * .53
        )
    );
}


/* =========================================================
   화면 섬광
   ========================================================= */

function drawFlash() {

    if (
        flash <= 0
    ) {

        return;
    }


    ctx.globalAlpha =
        flash * .055;


    ctx.fillStyle =
        "#fff3d0";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    flash *=
        .78;


    if (
        flash < .01
    ) {

        flash =
            0;
    }


    ctx.globalAlpha =
        1;
}


/* =========================================================
   메인 렌더링
   ========================================================= */

let lastTime =
    performance.now();


function render(time) {

    const dt =
        Math.min(
            time - lastTime,
            40
        );


    lastTime =
        time;


    /*
     * 투명 Canvas 초기화
     */
    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * 자동 불꽃
     */
    automaticFireworks(
        dt
    );


    /*
     * 로켓
     */
    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            rockets[i];


        rocket.update(
            dt
        );


        rocket.draw();


        if (
            rocket.dead
        ) {

            rockets.splice(
                i,
                1
            );
        }
    }


    /*
     * 파티클
     */
    updateParticles();

    drawParticles();


    /*
     * 섬광
     */
    drawFlash();


    /*
     * 다음 프레임
     */
    requestAnimationFrame(
        render
    );
}


/* =========================================================
   시작
   ========================================================= */

requestAnimationFrame(
    render
);


/* =========================================================
   시작 연출
   ========================================================= */

setTimeout(
    () => {

        launch(
            width * .50,
            height * .30
        );

    },
    700
);


setTimeout(
    () => {

        launch(
            width * .30,
            height * .42
        );

    },
    1600
);


setTimeout(
    () => {

        launch(
            width * .70,
            height * .34
        );

    },
    2400
);

</script>
