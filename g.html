<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Transparent Fireworks Overlay</title>
    <style>
        /* 완벽한 투명 배경 유지 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999999;
            background: transparent;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <script>
        /**
         * 1. 캔버스 설정 (모바일 호환성을 위해 오류 유발 옵션 제거)
         */
        const canvas = document.getElementById('fireworks');
        // desynchronized 옵션을 제거하여 모바일 블랙스크린(Crash) 현상 해결
        const ctx = canvas.getContext('2d'); 

        let cw = window.innerWidth;
        let ch = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 1.5); // 고해상도 렉 방지

        function resize() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = Math.floor(cw * dpr);
            canvas.height = Math.floor(ch * dpr);
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * 2. Web Audio API 절차적 사운드 (안전장치 추가)
         */
        let audioCtx = null;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    audioInitialized = true;
                }
            } catch (e) {
                console.warn("오디오 초기화 실패 (모바일 정책 등):", e);
            }
        }

        // 터치 및 클릭 시 오디오 활성화
        window.addEventListener('pointerdown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('keydown', initAudio, { once: true });

        function playLaunchSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const now = audioCtx.currentTime;
                const bufferSize = audioCtx.sampleRate * 1.2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const bpf = audioCtx.createBiquadFilter();
                bpf.type = 'bandpass';
                bpf.Q.value = 3.5;
                bpf.frequency.setValueAtTime(260, now);
                bpf.frequency.exponentialRampToValueAtTime(1500, now + 1.1);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                whiteNoise.connect(bpf);
                bpf.connect(gain);
                gain.connect(audioCtx.destination);

                whiteNoise.start(now);
                whiteNoise.stop(now + 1.2);
            } catch(e) {}
        }

        function playExplosionSound(delaySec) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            setTimeout(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const oscGain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(32, now + 0.7);

                    oscGain.gain.setValueAtTime(0.6, now);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                    osc.connect(oscGain);
                    oscGain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.8);

                    const bufferSize = audioCtx.sampleRate * 1.5;
                    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const out = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) out[i] = Math.random() * 2 - 1;

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;

                    const lpf = audioCtx.createBiquadFilter();
                    lpf.type = 'lowpass';
                    lpf.frequency.setValueAtTime(450, now);
                    lpf.frequency.exponentialRampToValueAtTime(60, now + 1.3);

                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.5, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

                    noise.connect(lpf);
                    lpf.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);

                    noise.start(now);
                    noise.stop(now + 1.4);
                } catch(e) {}
            }, delaySec * 1000);
        }

        function playCrackSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(random(1200, 3200), now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            } catch(e) {}
        }

        /**
         * 3. 그래픽 물리 엔진
         */
        const random = (min, max) => Math.random() * (max - min) + min;

        const PALETTES = [
            { r: 255, g: 215, b: 0 },   
            { r: 255, g: 70,  b: 50 },   
            { r: 0,   g: 220, b: 255 },  
            { r: 255, g: 105, b: 180 },  
            { r: 160, g: 60,  b: 255 },  
            { r: 50,  g: 255, b: 120 },  
            { r: 255, g: 150, b: 40 },   
            { r: 245, g: 245, b: 255 }   
        ];

        const TYPES = ['Sphere', 'Peony', 'Chrysanthemum', 'Willow', 'Ring', 'Double', 'Crackling'];

        let shells = [];
        let particles = [];
        let flashes = [];
        let smokes = [];

        class Shell {
            constructor(targetX, targetY) {
                this.x = targetX !== undefined ? targetX : random(cw * 0.15, cw * 0.85);
                this.y = ch;
                this.targetY = targetY !== undefined ? targetY : random(ch * 0.12, ch * 0.38);

                this.lifeTime = 84; 
                this.gravity = 0.18;
                // 하단 클릭 방어 코드
                if(this.targetY >= ch - 50) this.targetY = ch - 150;
                
                this.vy = -((ch - this.targetY) / this.lifeTime + 0.5 * this.gravity * this.lifeTime);
                this.vx = random(-1.0, 1.0);

                this.color = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                this.type = TYPES[Math.floor(Math.random() * TYPES.length)];
                this.history = [];
                this.dead = false;

                playLaunchSound();
            }

            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 5) this.history.shift();

                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (Math.random() < 0.6) {
                    particles.push(new Spark(this.x, this.y, this.color));
                }

                if (this.vy >= -0.5 || this.y <= this.targetY) {
                    this.explode();
                    this.dead = true;
                }
            }

            draw() {
                if (this.history.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }
                ctx.strokeStyle = `rgba(255, 235, 180, 0.8)`;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            explode() {
                flashes.push(new Flash(this.x, this.y));
                const delay = random(0.6, 1.2);
                playExplosionSound(delay);

                let count = Math.floor(random(90, 140));
                let color = this.color;

                switch (this.type) {
                    case 'Sphere':
                    case 'Peony':
                        for (let i = 0; i < count; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(2, this.type === 'Peony' ? 5.5 : 8.5);
                            particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, 0.95, false));
                        }
                        break;
                    case 'Chrysanthemum':
                        for (let i = 0; i < count; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(3, 9.5);
                            let p = new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, 0.965, false);
                            p.maxHistory = 8;
                            p.life = p.maxLife = random(60, 95);
                            particles.push(p);
                        }
                        break;
                    case 'Willow':
                        for (let i = 0; i < count; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(1.5, 6);
                            let p = new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, { r: 255, g: 200, b: 90 }, 0.93, false);
                            p.gravity = 0.28;
                            p.maxHistory = 12;
                            p.life = p.maxLife = random(80, 120);
                            particles.push(p);
                        }
                        break;
                    case 'Ring':
                        count = 45;
                        for (let i = 0; i < count; i++) {
                            let angle = (Math.PI * 2 / count) * i;
                            let spd = 7.5;
                            particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, 0.955, false));
                        }
                        break;
                    case 'Double':
                        let color2 = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                        for (let i = 0; i < count * 0.65; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(6, 10);
                            particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, 0.95, false));
                        }
                        for (let i = 0; i < count * 0.35; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(1.5, 4.5);
                            particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color2, 0.93, false));
                        }
                        break;
                    case 'Crackling':
                        for (let i = 0; i < count; i++) {
                            let angle = random(0, Math.PI * 2);
                            let spd = random(2.5, 8.5);
                            particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, 0.93, true));
                        }
                        break;
                }

                for (let i = 0; i < 2; i++) smokes.push(new Smoke(this.x, this.y));
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color, friction, crackling) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.friction = friction;
                this.gravity = 0.14;
                this.crackling = crackling;
                this.life = random(40, 75);
                this.maxLife = this.life;
                this.history = [];
                this.maxHistory = 4;
                this.dead = false;
            }

            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) this.history.shift();

                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life <= 0) {
                    if (this.crackling && Math.random() < 0.4) {
                        flashes.push(new MiniFlash(this.x, this.y));
                        playCrackSound();
                    }
                    this.dead = true;
                }
                if (this.x < 0 || this.x > cw || this.y > ch) this.dead = true;
            }

            drawGlow(ctx) {
                if (this.history.length < 2) return;
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.45})`;
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }

            drawCore(ctx) {
                if (this.history.length < 2) return;
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(this.history[this.history.length - 1].x, this.history[this.history.length - 1].y);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        class Spark {
            constructor(x, y, color) {
                this.x = x + random(-2, 2);
                this.y = y;
                this.vx = random(-0.6, 0.6);
                this.vy = random(1.5, 3.5);
                this.color = color;
                this.alpha = 0.8;
                this.dead = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.05;
                if (this.alpha <= 0) this.dead = true;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 220, 150, ${this.alpha})`;
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        class Flash {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 1.0;
                this.dead = false;
            }
            update() {
                this.life -= 0.14;
                if (this.life <= 0) this.dead = true;
            }
            draw() {
                let r = 85 * (1 - this.life) + 25;
                let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                grad.addColorStop(0, `rgba(255, 255, 255, ${this.life * 0.8})`);
                grad.addColorStop(0.3, `rgba(255, 230, 180, ${this.life * 0.3})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class MiniFlash {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 1.0;
                this.dead = false;
            }
            update() {
                this.life -= 0.3;
                if (this.life <= 0) this.dead = true;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Smoke {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = random(-0.3, 0.3);
                this.vy = random(-0.2, -0.6);
                this.radius = random(18, 30);
                this.alpha = 0.08;
                this.dead = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.radius += 0.25;
                this.alpha -= 0.0009;
                if (this.alpha <= 0) this.dead = true;
            }
            draw() {
                ctx.fillStyle = `rgba(200, 200, 200, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /**
         * 4. 메인 루프 & 인터랙션
         */
        let isAuto = true;
        let nextLaunch = 0;

        // 키보드 조작
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.code === 'Space') {
                shells.push(new Shell());
            } else if (e.code === 'KeyA') {
                isAuto = !isAuto;
            } else if (e.code === 'KeyC') {
                shells = [];
                particles = [];
                flashes = [];
                smokes = [];
            }
        });

        // 모바일/PC 클릭 지원
        window.addEventListener('pointerdown', (e) => {
            initAudio();
            shells.push(new Shell(e.clientX, e.clientY));
        });

        function animate(timestamp) {
            // Scale 크기에 맞춰 clearRect 적용
            ctx.clearRect(0, 0, cw, ch);

            if (isAuto && timestamp > nextLaunch) {
                let burstCount = Math.random() < 0.25 ? Math.floor(random(2, 4)) : 1;
                for (let i = 0; i < burstCount; i++) {
                    setTimeout(() => shells.push(new Shell()), i * random(120, 280));
                }
                nextLaunch = timestamp + (Math.random() < 0.2 ? random(2500, 4200) : random(600, 1600));
            }

            // 1. 연기 (source-over)
            ctx.globalCompositeOperation = 'source-over';
            for (let i = smokes.length - 1; i >= 0; i--) {
                smokes[i].update();
                smokes[i].draw();
                if (smokes[i].dead) smokes.splice(i, 1);
            }

            // 2. 가산 혼합 (빛 발광 효과)
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';

            for (let i = shells.length - 1; i >= 0; i--) {
                shells[i].update();
                shells[i].draw();
                if (shells[i].dead) shells.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].dead) {
                    particles.splice(i, 1);
                } else {
                    particles[i].drawGlow(ctx);
                }
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].drawCore(ctx);
            }

            for (let i = flashes.length - 1; i >= 0; i--) {
                flashes[i].update();
                flashes[i].draw();
                if (flashes[i].dead) flashes.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
