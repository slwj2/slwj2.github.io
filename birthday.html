        /* ============================================================
           Audio 초기화
        ============================================================ */

        function initAudio() {

            if (
                audioContext
            ) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();

                }


                return;

            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();


            musicGain =
                audioContext.createGain();


            effectGain =
                audioContext.createGain();


            masterGain.gain.value =
                APP_VOLUME;


            musicGain.gain.value =
                0.58;


            effectGain.gain.value =
                0.75;


            musicGain.connect(
                masterGain
            );


            effectGain.connect(
                masterGain
            );


            masterGain.connect(
                audioContext.destination
            );

        }


        /* ============================================================
           음악 소스 정리
        ============================================================ */

        function stopAllMusicSources() {

            /*
             * 현재 추적 중인 모든 oscillator를
             * 즉시 정지합니다.
             */

            activeMusicSources.forEach(
                source => {

                    try {

                        source.stop();

                    } catch (error) {

                        /*
                         * 이미 정지된 oscillator는
                         * 무시합니다.
                         */

                    }

                }
            );


            activeMusicSources.clear();

        }


        /* ============================================================
           ADSR
        ============================================================ */

        function applyADSR(
            gainNode,
            startTime,
            duration,
            peak = 0.12,
            attack = 0.015,
            decay = 0.18,
            sustain = 0.42,
            release = 0.45
        ) {

            const gain =
                gainNode.gain;


            const attackEnd =
                startTime +
                attack;


            const decayEnd =
                attackEnd +
                decay;


            const releaseStart =
                Math.max(
                    decayEnd,
                    startTime +
                    duration -
                    release
                );


            const releaseEnd =
                releaseStart +
                release;


            gain.cancelScheduledValues(
                startTime
            );


            gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.linearRampToValueAtTime(
                peak,
                attackEnd
            );


            gain.linearRampToValueAtTime(
                peak *
                sustain,
                decayEnd
            );


            gain.setValueAtTime(
                peak *
                sustain,
                releaseStart
            );


            gain.exponentialRampToValueAtTime(
                0.0001,
                releaseEnd
            );

        }


        /* ============================================================
           피아노 음
        ============================================================ */

        function playPianoNote(
            frequency,
            startTime,
            duration,
            volume = 0.12,
            generation = musicGeneration
        ) {

            if (
                !audioContext
            ) {

                return;

            }


            /*
             * 오래된 음악 루프가 예약되지 않도록
             * generation을 검사합니다.
             */

            if (
                generation !==
                musicGeneration
            ) {

                return;

            }


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );


            const gain =
                audioContext.createGain();


            applyADSR(
                gain,
                startTime,
                duration,
                volume,
                0.012,
                0.12,
                0.32,
                0.55
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                musicGain
            );


            /*
             * oscillator를 추적합니다.
             */

            activeMusicSources.add(
                oscillator
            );


            oscillator.addEventListener(
                "ended",
                () => {

                    activeMusicSources.delete(
                        oscillator
                    );

                }
            );


            oscillator.start(
                startTime
            );


            oscillator.stop(
                startTime +
                duration +
                0.7
            );

        }


        /* ============================================================
           벨
        ============================================================ */

        function playBell(
            frequency,
            startTime,
            volume = 0.035,
            generation = musicGeneration
        ) {

            if (
                !audioContext
            ) {

                return;

            }


            if (
                generation !==
                musicGeneration
            ) {

                return;

            }


            const bell =
                audioContext.createOscillator();


            bell.type =
                "sine";


            bell.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.gain.exponentialRampToValueAtTime(
                volume,
                startTime +
                0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime +
                1.15
            );


            bell.connect(
                gain
            );


            gain.connect(
                musicGain
            );


            activeMusicSources.add(
                bell
            );


            bell.addEventListener(
                "ended",
                () => {

                    activeMusicSources.delete(
                        bell
                    );

                }
            );


            bell.start(
                startTime
            );


            bell.stop(
                startTime +
                1.2
            );

        }


        /* ============================================================
           생일 음악 스케줄
        ============================================================ */

        function scheduleBirthdaySong(
            generation
        ) {

            if (
                !audioContext
            ) {

                return 0;

            }


            if (
                generation !==
                musicGeneration
            ) {

                return 0;

            }


            const now =
                audioContext.currentTime +
                0.08;


            let cursor =
                now;


            birthdayMelody.forEach(
                (
                    [frequency, duration],
                    index
                ) => {

                    /*
                     * 현재 세대인지 다시 확인합니다.
                     */

                    if (
                        generation !==
                        musicGeneration
                    ) {

                        return;

                    }


                    playPianoNote(
                        frequency,
                        cursor,
                        duration,
                        0.115,
                        generation
                    );


                    playBell(
                        frequency,
                        cursor,
                        0.018,
                        generation
                    );


                    /*
                     * 낮은 베이스 음을 추가합니다.
                     */

                    if (
                        index % 4 ===
                        0
                    ) {

                        playPianoNote(
                            frequency / 2,
                            cursor,
                            duration,
                            0.025,
                            generation
                        );

                    }


                    cursor +=
                        duration +
                        0.02;

                }
            );


            return cursor -
                now;

        }


        /* ============================================================
           음악 시작
        ============================================================ */

        function startMusic() {

            initAudio();


            /*
             * 이미 음악이 재생 중이면
             * 절대로 새로운 음악을 추가하지 않습니다.
             */

            if (
                musicPlaying
            ) {

                return;

            }


            /*
             * 이전 음악을 완전히 제거합니다.
             */

            musicGeneration++;


            stopAllMusicSources();


            if (
                musicTimer
            ) {

                clearTimeout(
                    musicTimer
                );


                musicTimer =
                    null;

            }


            musicPlaying =
                true;


            musicButton.textContent =
                "🔊";


            const generation =
                musicGeneration;


            function loop() {

                /*
                 * 현재 음악이 아니면
                 * 절대로 다음 곡을 예약하지 않습니다.
                 */

                if (
                    !musicPlaying ||
                    generation !==
                    musicGeneration
                ) {

                    return;

                }


                const duration =
                    scheduleBirthdaySong(
                        generation
                    );


                musicTimer =
                    setTimeout(
                        loop,
                        Math.max(
                            1000,
                            duration *
                            1000 -
                            100
                        )
                    );

            }


            loop();

        }


        /* ============================================================
           음악 정지
        ============================================================ */

        function stopMusic() {

            /*
             * 먼저 음악 상태를 false로 바꿉니다.
             */

            musicPlaying =
                false;


            /*
             * 음악 세대를 변경하여
             * 이전 예약 음악을 무효화합니다.
             */

            musicGeneration++;


            /*
             * 예약된 루프를 제거합니다.
             */

            if (
                musicTimer
            ) {

                clearTimeout(
                    musicTimer
                );


                musicTimer =
                    null;

            }


            /*
             * 이미 재생 예약되어 있던 음도
             * 모두 정리합니다.
             */

            stopAllMusicSources();


            if (
                musicGain &&
                audioContext
            ) {

                const now =
                    audioContext.currentTime;


                musicGain.gain.cancelScheduledValues(
                    now
                );


                musicGain.gain.setValueAtTime(
                    0.0001,
                    now
                );


                musicGain.gain.setValueAtTime(
                    0.58,
                    now + 0.03
                );

            }


            musicButton.textContent =
                "🔇";

        }


        /* ============================================================
           음악 버튼
        ============================================================ */

        musicButton.addEventListener(
            "click",
            () => {

                if (
                    musicPlaying
                ) {

                    stopMusic();

                } else {

                    startMusic();

                }

            }
        );


        /* ============================================================
           촛불 끄기 효과음
        ============================================================ */

        function playExtinguishSound() {

            if (
                !audioContext
            ) {

                return;

            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                520,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                150,
                now +
                0.18
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                0.16,
                now +
                0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now +
                0.22
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                effectGain
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now +
                0.25
            );

        }


        /* ============================================================
           축하 효과음
        ============================================================ */

        function playCelebrationSound() {

            if (
                !audioContext
            ) {

                return;

            }


            const now =
                audioContext.currentTime;


            const notes = [

                NOTE.C5,

                NOTE.E5,

                NOTE.G5,

                NOTE.C5 * 2

            ];


            notes.forEach(
                (
                    frequency,
                    index
                ) => {

                    playBellEffect(
                        frequency,
                        now +
                        index *
                        0.13,
                        0.07
                    );

                }
            );

        }


        /* ============================================================
           효과음 전용 벨
        ============================================================ */

        function playBellEffect(
            frequency,
            startTime,
            volume
        ) {

            if (
                !audioContext
            ) {

                return;

            }


            const bell =
                audioContext.createOscillator();


            bell.type =
                "sine";


            bell.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.gain.exponentialRampToValueAtTime(
                volume,
                startTime +
                0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime +
                1.2
            );


            bell.connect(
                gain
            );


            gain.connect(
                effectGain
            );


            bell.start(
                startTime
            );


            bell.stop(
                startTime +
                1.25
            );

        }


        /* ============================================================
           촛불 클릭
        ============================================================ */

        function handlePointer(
            clientX,
            clientY
        ) {

            if (
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            if (
                celebrationStarted
            ) {

                return;

            }


            const rect =
                canvas.getBoundingClientRect();


            const x =
                clientX -
                rect.left;


            const y =
                clientY -
                rect.top;


            const positions =
                getCandlePositions();


            /*
             * 앞쪽 촛불부터 검사합니다.
             */

            const indices =
                candles
                    .map(
                        (_, index) =>
                            index
                    )
                    .sort(
                        (a, b) =>
                            positions[b].depth -
                            positions[a].depth
                    );


            for (
                const i of indices
            ) {

                const candle =
                    candles[i];


                if (
                    candle.blown
                ) {

                    continue;

                }


                const position =
                    positions[i];


                const scale =
                    position.scale ||
                    1;


                const candleHeight =
                    (
                        candle.type ===
                        "long"
                            ? 76
                            : 45
                    ) *
                    scale;


                const hitWidth =
                    34 *
                    scale;


                const hitTop =
                    position.y -
                    candleHeight -
                    31 *
                    scale;


                const hitBottom =
                    position.y +
                    18 *
                    scale;


                if (

                    x >=
                    position.x -
                    hitWidth / 2 &&

                    x <=
                    position.x +
                    hitWidth / 2 &&

                    y >=
                    hitTop &&

                    y <=
                    hitBottom

                ) {

                    candle.blown =
                        true;


                    createParticle(
                        position.x,
                        position.y -
                        candleHeight,
                        20
                    );


                    createSmoke(
                        position.x,
                        position.y -
                        candleHeight -
                        10
                    );


                    playExtinguishSound();


                    const remaining =
                        candles.filter(
                            item =>
                                !item.blown
                        ).length;


                    if (
                        remaining ===
                        0
                    ) {

                        startCelebration();

                    }


                    break;

                }

            }

        }


        /* ============================================================
           축하 시작
        ============================================================ */

        function startCelebration() {

            if (
                celebrationStarted
            ) {

                return;

            }


            celebrationStarted =
                true;


            setTimeout(
                () => {

                    createConfetti(
                        190
                    );


                    createCelebrationSparkles();


                    playCelebrationSound();


                    birthdayTitle.textContent =
                        `🎉 ${birthdayName}님, 정말 축하합니다! 🎉`;


                    birthdaySubtitle.textContent =
                        "오늘 하루도 행복한 순간으로 가득하세요 ✨";


                    hint.textContent =
                        "🎂 생일을 다시 축하하려면 아래 버튼을 눌러주세요 🎂";


                    restartButton.style.display =
                        "block";


                },
                500
            );

        }


        /* ============================================================
           마우스
        ============================================================ */

        canvas.addEventListener(
            "click",
            event => {

                handlePointer(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* ============================================================
           터치
        ============================================================ */

        canvas.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches &&
                    event.touches.length
                ) {

                    const touch =
                        event.touches[0];


                    handlePointer(
                        touch.clientX,
                        touch.clientY
                    );

                }


                event.preventDefault();

            },
            {
                passive: false
            }
        );


        /* ============================================================
           생일 시작
        ============================================================ */

        function startBirthday() {

            birthdayName =
                nameInput.value.trim();


            if (
                !birthdayName
            ) {

                nameInput.focus();

                return;

            }


            let age =
                Number(
                    ageInput.value
                );


            if (
                !Number.isFinite(
                    age
                )
            ) {

                age = 1;

            }


            age =
                Math.max(
                    1,
                    Math.min(
                        100,
                        Math.floor(age)
                    )
                );


            /*
             * 혹시 이전 생일에서
             * 음악이 남아 있다면 완전히 종료합니다.
             */

            stopMusic();


            particles = [];

            smokeParticles = [];

            confetti = [];

            celebrationSparkles = [];


            createCandles(
                age
            );


            birthdayTitle.textContent =
                `🎂 ${birthdayName}님, 생일 축하합니다!`;


            birthdaySubtitle.textContent =
                "촛불을 하나씩 눌러 꺼주세요 🕯️";


            hint.textContent =
                "✨ 모든 촛불을 끄면 특별한 축하가 시작됩니다 ✨";


            setup.classList.add(
                "hidden"
            );


            sceneUI.style.display =
                "block";


            musicButton.style.display =
                "block";


            restartButton.style.display =
                "none";


            initAudio();


            startMusic();

        }


        startButton.addEventListener(
            "click",
            startBirthday
        );


        /* ============================================================
           Enter 키
        ============================================================ */

        nameInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    startBirthday();

                }

            }
        );


        ageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    startBirthday();

                }

            }
        );


        /* ============================================================
           다시 시작
        ============================================================ */

        restartButton.addEventListener(
            "click",
            () => {

                /*
                 * 음악을 먼저 완전히 정리합니다.
                 */

                stopMusic();


                /*
                 * 화면을 시작 화면으로 되돌립니다.
                 */

                setup.classList.remove(
                    "hidden"
                );


                sceneUI.style.display =
                    "none";


                musicButton.style.display =
                    "none";


                restartButton.style.display =
                    "none";


                /*
                 * 모든 이펙트를 초기화합니다.
                 */

                particles = [];

                smokeParticles = [];

                confetti = [];

                celebrationSparkles = [];

                candles = [];


                celebrationStarted =
                    false;

            }
        );


        /* ============================================================
           렌더링
        ============================================================ */

        function render(
            time
        ) {

            drawBackground(
                time
            );


            if (
                setup.classList.contains(
                    "hidden"
                )
            ) {

                drawCake();


                drawCandles(
                    time
                );


                drawCelebrationSparkles(
                    time
                );


                updateParticles();


                updateSmoke();


                updateConfetti();

            }


            requestAnimationFrame(
                render
            );

        }


        requestAnimationFrame(
            render
        );

    </script>

</body>
