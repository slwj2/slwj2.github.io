        /* ============================================================
           전체 케이크
        ============================================================ */

        function drawCake() {

            const cake =
                getCakeData();


            const colors =
                cakeColors[
                    selectedCake
                ];


            drawCakeGlow(
                cake
            );


            drawCakeBase(
                cake,
                colors
            );


            drawCreamDrips(
                cake,
                colors
            );


            if (
                selectedCake ===
                "strawberry"
            ) {

                drawStrawberryCake(
                    cake
                );

            }


            if (
                selectedCake ===
                "cream"
            ) {

                drawCreamCake(
                    cake
                );

            }


            if (
                selectedCake ===
                "chocolate"
            ) {

                drawChocolateCake(
                    cake
                );

            }


            if (
                selectedCake ===
                "cheese"
            ) {

                drawCheeseCake(
                    cake
                );

            }


            drawCakeDecoration(
                cake
            );

        }


        /* ============================================================
           촛불
        ============================================================ */

        function drawCandle(
            candle,
            position,
            time
        ) {

            const scale =
                position.scale ||
                1;


            const height =
                (
                    candle.type ===
                    "long"
                        ? 76
                        : 46
                ) *
                scale;


            const widthCandle =
                14 *
                scale;


            const x =
                position.x -
                widthCandle / 2;


            const y =
                position.y -
                height;


            /*
             * 그림자
             */

            ctx.fillStyle =
                "rgba(70,20,45,0.18)";


            ctx.beginPath();

            ctx.ellipse(
                position.x,
                position.y,
                widthCandle,
                4 *
                scale,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * 촛불 몸체
             */

            const candleGradient =
                ctx.createLinearGradient(
                    x,
                    0,
                    x +
                    widthCandle,
                    0
                );


            candleGradient.addColorStop(
                0,
                "#b95d89"
            );


            candleGradient.addColorStop(
                0.2,
                "#f18ab3"
            );


            candleGradient.addColorStop(
                0.5,
                "#fff4fa"
            );


            candleGradient.addColorStop(
                0.78,
                "#ef8ab4"
            );


            candleGradient.addColorStop(
                1,
                "#a94f7d"
            );


            ctx.fillStyle =
                candleGradient;


            roundRect(
                ctx,
                x,
                y,
                widthCandle,
                height,
                5 *
                scale
            );


            ctx.fill();


            /*
             * 사선 무늬
             */

            ctx.save();

            roundRect(
                ctx,
                x,
                y,
                widthCandle,
                height,
                5 *
                scale
            );

            ctx.clip();

            ctx.strokeStyle =
                "rgba(255,100,160,0.4)";

            ctx.lineWidth =
                3 *
                scale;


            for (
                let i = -2;
                i <
                height / 14 + 2;
                i++
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    x - 5,
                    y +
                    i *
                    14
                );

                ctx.lineTo(
                    x +
                    widthCandle +
                    5,
                    y +
                    i *
                    14 -
                    8
                );

                ctx.stroke();

            }

            ctx.restore();


            /*
             * 심지
             */

            ctx.strokeStyle =
                "#39241f";

            ctx.lineWidth =
                Math.max(
                    1,
                    1.5 *
                    scale
                );


            ctx.beginPath();

            ctx.moveTo(
                position.x,
                y
            );

            ctx.lineTo(
                position.x,
                y -
                7 *
                scale
            );

            ctx.stroke();


            /*
             * 불꽃
             */

            if (
                !candle.blown
            ) {

                const flicker =
                    Math.sin(
                        time *
                        0.016 +
                        candle.flame
                    ) *
                    2.5 *
                    scale;


                const flameX =
                    position.x +
                    flicker;


                const flameY =
                    y -
                    17 *
                    scale;


                /*
                 * 불꽃 광원
                 */

                const glow =
                    ctx.createRadialGradient(
                        flameX,
                        flameY,
                        1,
                        flameX,
                        flameY,
                        25 *
                        scale
                    );


                glow.addColorStop(
                    0,
                    "rgba(255,255,230,0.9)"
                );


                glow.addColorStop(
                    0.25,
                    "rgba(255,220,100,0.65)"
                );


                glow.addColorStop(
                    1,
                    "rgba(255,120,20,0)"
                );


                ctx.fillStyle =
                    glow;


                ctx.beginPath();

                ctx.arc(
                    flameX,
                    flameY,
                    25 *
                    scale,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                /*
                 * 실제 불꽃
                 */

                ctx.save();

                ctx.translate(
                    flameX,
                    flameY
                );

                ctx.scale(
                    scale,
                    scale
                );


                const flame =
                    ctx.createLinearGradient(
                        0,
                        -18,
                        0,
                        10
                    );


                flame.addColorStop(
                    0,
                    "#ffffff"
                );


                flame.addColorStop(
                    0.25,
                    "#fff7a3"
                );


                flame.addColorStop(
                    0.65,
                    "#ffad32"
                );


                flame.addColorStop(
                    1,
                    "#ff5a18"
                );


                ctx.fillStyle =
                    flame;


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    -18
                );

                ctx.bezierCurveTo(
                    11,
                    -8,
                    9,
                    5,
                    0,
                    10
                );

                ctx.bezierCurveTo(
                    -9,
                    5,
                    -8,
                    -8,
                    0,
                    -18
                );

                ctx.closePath();

                ctx.fill();


                /*
                 * 불꽃 중심
                 */

                ctx.fillStyle =
                    "#fffde1";


                ctx.beginPath();

                ctx.ellipse(
                    0,
                    1,
                    3,
                    7,
                    0,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                ctx.restore();

            }

        }


        /* ============================================================
           촛불 전체
        ============================================================ */

        function drawCandles(
            time
        ) {

            const positions =
                getCandlePositions();


            const order =
                candles
                    .map(
                        (candle, index) => ({
                            candle,
                            index,
                            position:
                                positions[index]
                        })
                    )
                    .sort(
                        (a, b) =>
                            a.position.depth -
                            b.position.depth
                    );


            order.forEach(
                item => {

                    drawCandle(
                        item.candle,
                        item.position,
                        time
                    );

                }
            );

        }


        /* ============================================================
           배경
        ============================================================ */

        function drawBackground(
            time
        ) {

            const gradient =
                ctx.createRadialGradient(
                    width / 2,
                    height * 0.52,
                    20,
                    width / 2,
                    height * 0.52,
                    Math.max(
                        width,
                        height
                    )
                );


            gradient.addColorStop(
                0,
                "#292d50"
            );


            gradient.addColorStop(
                0.38,
                "#161a30"
            );


            gradient.addColorStop(
                0.72,
                "#0c0f1c"
            );


            gradient.addColorStop(
                1,
                "#05070d"
            );


            ctx.fillStyle =
                gradient;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
             * 위쪽 은은한 빛
             */

            const light =
                ctx.createRadialGradient(
                    width / 2,
                    height * 0.18,
                    10,
                    width / 2,
                    height * 0.18,
                    width * 0.65
                );


            light.addColorStop(
                0,
                "rgba(255,160,210,0.09)"
            );


            light.addColorStop(
                1,
                "rgba(255,160,210,0)"
            );


            ctx.fillStyle =
                light;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
             * 별
             */

            for (
                let i = 0;
                i < 55;
                i++
            ) {

                const x =
                    (
                        i *
                        137.31
                    ) %
                    width;


                const y =
                    (
                        i *
                        79.17
                    ) %
                    (
                        height *
                        0.72
                    );


                const alpha =
                    0.2 +
                    (
                        Math.sin(
                            time *
                            0.001 +
                            i
                        ) +
                        1
                    ) *
                    0.12;


                ctx.globalAlpha =
                    alpha;


                ctx.fillStyle =
                    "#ffffff";


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.1,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.globalAlpha = 1;

        }


        /* ============================================================
           파티클 업데이트
        ============================================================ */

        function updateParticles() {

            for (
                let i =
                    particles.length - 1;
                i >= 0;
                i--
            ) {

                const p =
                    particles[i];


                p.x +=
                    p.vx;

                p.y +=
                    p.vy;

                p.vy +=
                    p.gravity;

                p.life -=
                    0.025;


                if (
                    p.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );

                    continue;

                }


                ctx.globalAlpha =
                    p.life;


                ctx.fillStyle =
                    "#ffd7e9";


                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.globalAlpha =
                1;

        }


        /* ============================================================
           연기 업데이트
        ============================================================ */

        function updateSmoke() {

            for (
                let i =
                    smokeParticles.length - 1;
                i >= 0;
                i--
            ) {

                const smoke =
                    smokeParticles[i];


                smoke.x +=
                    smoke.vx;

                smoke.y +=
                    smoke.vy;

                smoke.vx +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.025;

                smoke.size +=
                    0.06;

                smoke.life -=
                    0.018;


                if (
                    smoke.life <= 0
                ) {

                    smokeParticles.splice(
                        i,
                        1
                    );

                    continue;

                }


                ctx.globalAlpha =
                    smoke.life *
                    0.35;


                ctx.fillStyle =
                    "#d5d8df";


                ctx.beginPath();

                ctx.arc(
                    smoke.x,
                    smoke.y,
                    smoke.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.globalAlpha =
                1;

        }


        /* ============================================================
           컨페티 업데이트
        ============================================================ */

        function updateConfetti() {

            for (
                let i =
                    confetti.length - 1;
                i >= 0;
                i--
            ) {

                const c =
                    confetti[i];


                c.x +=
                    c.vx;

                c.y +=
                    c.vy;

                c.vy +=
                    0.025;

                c.rotation +=
                    c.rotationSpeed;


                if (
                    c.y >
                    height + 40
                ) {

                    /*
                     * 다시 위에서 생성하여
                     * 축하가 계속 이어지도록 합니다.
                     */

                    c.x =
                        Math.random() *
                        width;

                    c.y =
                        -20;

                    c.vy =
                        1 +
                        Math.random() *
                        3;

                }


                ctx.save();

                ctx.translate(
                    c.x,
                    c.y
                );

                ctx.rotate(
                    c.rotation
                );

                ctx.globalAlpha =
                    c.life;


                ctx.fillStyle =
                    `hsl(${c.hue}, 85%, 70%)`;


                ctx.fillRect(
                    -c.size / 2,
                    -c.size / 2,
                    c.size,
                    c.size * 0.55
                );


                ctx.restore();

            }


            ctx.globalAlpha =
                1;

        }


        /* ============================================================
           Audio
        ============================================================ */

        let audioContext =
            null;

        let masterGain =
            null;

        let musicGain =
            null;

        let effectGain =
            null;

        let musicPlaying =
            false;

        let musicTimer =
            null;


        const APP_VOLUME =
            0.42;


        const NOTE = {

            C4: 261.63,
            D4: 293.66,
            E4: 329.63,
            F4: 349.23,
            G4: 392.00,
            A4: 440.00,
            B4: 493.88,
            C5: 523.25,
            D5: 587.33,
            E5: 659.25,
            F5: 698.46,
            G5: 783.99

        };


        const birthdayMelody = [

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.A4, 0.58],
            [NOTE.G4, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.B4, 0.90],

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.A4, 0.58],
            [NOTE.G4, 0.58],
            [NOTE.D5, 0.58],
            [NOTE.C5, 0.90],

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.G5, 0.58],
            [NOTE.E5, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.B4, 0.58],
            [NOTE.A4, 0.90],

            [NOTE.F5, 0.32],
            [NOTE.F5, 0.32],
            [NOTE.E5, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.D5, 0.58],
            [NOTE.C5, 1.05]

        ];


        /* ============================================================
           Audio 초기화
        ============================================================ */

        function initAudio() {

            if (
                audioContext
            ) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();

                }

                return;

            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();


            musicGain =
                audioContext.createGain();


            effectGain =
                audioContext.createGain();


            masterGain.gain.value =
                APP_VOLUME;


            musicGain.gain.value =
                0.58;


            effectGain.gain.value =
                0.75;


            musicGain.connect(
                masterGain
            );


            effectGain.connect(
                masterGain
            );


            masterGain.connect(
                audioContext.destination
            );

        }


        /* ============================================================
           ADSR
        ============================================================ */

        function applyADSR(
            gainNode,
            startTime,
            duration,
            peak = 0.12,
            attack = 0.015,
            decay = 0.18,
            sustain = 0.42,
            release = 0.45
        ) {

            const gain =
                gainNode.gain;


            const attackEnd =
                startTime +
                attack;


            const decayEnd =
                attackEnd +
                decay;


            const releaseStart =
                Math.max(
                    decayEnd,
                    startTime +
                    duration -
                    release
                );


            const releaseEnd =
                releaseStart +
                release;


            gain.cancelScheduledValues(
                startTime
            );


            gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.linearRampToValueAtTime(
                peak,
                attackEnd
            );


            gain.linearRampToValueAtTime(
                peak *
                sustain,
                decayEnd
            );


            gain.setValueAtTime(
                peak *
                sustain,
                releaseStart
            );


            gain.exponentialRampToValueAtTime(
                0.0001,
                releaseEnd
            );

        }


        /* ============================================================
           피아노
        ============================================================ */

        function playPianoNote(
            frequency,
            startTime,
            duration,
            volume = 0.12
        ) {

            if (
                !audioContext
            ) {
                return;
            }


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );


            const gain =
                audioContext.createGain();


            applyADSR(
                gain,
                startTime,
                duration,
                volume,
                0.012,
                0.12,
                0.32,
                0.55
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                musicGain
            );


            oscillator.start(
                startTime
            );


            oscillator.stop(
                startTime +
                duration +
                0.7
            );

        }


        /* ============================================================
           벨
        ============================================================ */

        function playBell(
            frequency,
            startTime,
            volume = 0.035
        ) {

            if (
                !audioContext
            ) {
                return;
            }


            const bell =
                audioContext.createOscillator();


            bell.type =
                "sine";


            bell.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.gain.exponentialRampToValueAtTime(
                volume,
                startTime +
                0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime +
                1.15
            );


            bell.connect(
                gain
            );


            gain.connect(
                musicGain
            );


            bell.start(
                startTime
            );


            bell.stop(
                startTime +
                1.2
            );

        }


        /* ============================================================
           생일 음악
        ============================================================ */

        function scheduleBirthdaySong() {

            if (
                !audioContext
            ) {
                return 0;
            }


            const now =
                audioContext.currentTime +
                0.08;


            let cursor =
                now;


            birthdayMelody.forEach(
                (
                    [frequency, duration],
                    index
                ) => {

                    playPianoNote(
                        frequency,
                        cursor,
                        duration,
                        0.115
                    );


                    playBell(
                        frequency,
                        cursor,
                        0.018
                    );


                    if (
                        index % 4 ===
                        0
                    ) {

                        playPianoNote(
                            frequency / 2,
                            cursor,
                            duration,
                            0.025
                        );

                    }


                    cursor +=
                        duration +
                        0.02;

                }
            );


            return cursor -
                now;

        }


        /* ============================================================
           음악 시작
        ============================================================ */

        function startMusic() {

            initAudio();


            if (
                musicPlaying
            ) {
                return;
            }


            musicPlaying =
                true;


            musicButton.textContent =
                "🔊";


            function loop() {

                if (
                    !musicPlaying
                ) {
                    return;
                }


                const duration =
                    scheduleBirthdaySong();


                musicTimer =
                    setTimeout(
                        loop,
                        Math.max(
                            1000,
                            duration *
                            1000 -
                            100
                        )
                    );

            }


            loop();

        }


        /* ============================================================
           음악 정지
        ============================================================ */

        function stopMusic() {

            musicPlaying =
                false;


            if (
                musicTimer
            ) {

                clearTimeout(
                    musicTimer
                );

                musicTimer =
                    null;

            }


            musicButton.textContent =
                "🔇";

        }


        musicButton.addEventListener(
            "click",
            () => {

                if (
                    musicPlaying
                ) {

                    stopMusic();

                } else {

                    startMusic();

                }

            }
        );


        /* ============================================================
           촛불 끄기 효과음
        ============================================================ */

        function playExtinguishSound() {

            if (
                !audioContext
            ) {
                return;
            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                520,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                150,
                now +
                0.18
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                0.16,
                now +
                0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now +
                0.22
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                effectGain
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now +
                0.25
            );

        }


        /* ============================================================
           축하 효과음
        ============================================================ */

        function playCelebrationSound() {

            if (
                !audioContext
            ) {
                return;
            }


            const now =
                audioContext.currentTime;


            const notes = [

                NOTE.C5,
                NOTE.E5,
                NOTE.G5,
                NOTE.C5 * 2

            ];


            notes.forEach(
                (
                    frequency,
                    index
                ) => {

                    playBell(
                        frequency,
                        now +
                        index *
                        0.13,
                        0.07
                    );

                }
            );

        }


        /* ============================================================
           촛불 클릭
        ============================================================ */

        function handlePointer(
            clientX,
            clientY
        ) {

            if (
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            const rect =
                canvas.getBoundingClientRect();


            const x =
                clientX -
                rect.left;


            const y =
                clientY -
                rect.top;


            const positions =
                getCandlePositions();


            /*
             * 앞쪽 촛불부터 검사합니다.
             */

            const indices =
                candles
                    .map(
                        (_, index) =>
                            index
                    )
                    .sort(
                        (a, b) =>
                            positions[b].depth -
                            positions[a].depth
                    );


            for (
                const i of indices
            ) {

                const candle =
                    candles[i];


                if (
                    candle.blown
                ) {
                    continue;
                }


                const position =
                    positions[i];


                const scale =
                    position.scale ||
                    1;


                const candleHeight =
                    (
                        candle.type ===
                        "long"
                            ? 76
                            : 46
                    ) *
                    scale;


                /*
                 * 실제 초보다 훨씬 넓게
                 * 클릭 영역을 설정합니다.
                 */

                const hitWidth =
                    32 *
                    scale;


                const hitTop =
                    position.y -
                    candleHeight -
                    30 *
                    scale;


                const hitBottom =
                    position.y +
                    18 *
                    scale;


                if (
                    x >=
                    position.x -
                    hitWidth / 2 &&

                    x <=
                    position.x +
                    hitWidth / 2 &&

                    y >=
                    hitTop &&

                    y <=
                    hitBottom
                ) {

                    candle.blown =
                        true;


                    createParticle(
                        position.x,
                        position.y -
                        candleHeight,
                        20
                    );


                    createSmoke(
                        position.x,
                        position.y -
                        candleHeight -
                        10
                    );


                    playExtinguishSound();


                    const remaining =
                        candles.filter(
                            item =>
                                !item.blown
                        ).length;


                    if (
                        remaining ===
                        0
                    ) {

                        startCelebration();

                    }


                    break;

                }

            }

        }


        /* ============================================================
           축하 시작
        ============================================================ */

        function startCelebration() {

            if (
                celebrationStarted
            ) {
                return;
            }


            celebrationStarted =
                true;


            setTimeout(
                () => {

                    createConfetti(
                        180
                    );


                    playCelebrationSound();


                    restartButton.style.display =
                        "block";


                    birthdayTitle.textContent =
                        `🎉 ${birthdayName}님, 정말 축하합니다! 🎉`;

                },
                500
            );

        }


        /* ============================================================
           마우스
        ============================================================ */

        canvas.addEventListener(
            "click",
            event => {

                handlePointer(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* ============================================================
           터치
        ============================================================ */

        canvas.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches &&
                    event.touches.length
                ) {

                    const touch =
                        event.touches[0];


                    handlePointer(
                        touch.clientX,
                        touch.clientY
                    );

                }


                event.preventDefault();

            },
            {
                passive: false
            }
        );


        /* ============================================================
           시작
        ============================================================ */

        function startBirthday() {

            birthdayName =
                nameInput.value.trim();


            if (
                !birthdayName
            ) {

                nameInput.focus();

                return;

            }


            let age =
                Number(
                    ageInput.value
                );


            if (
                !Number.isFinite(
                    age
                )
            ) {

                age = 1;

            }


            age =
                Math.max(
                    1,
                    Math.min(
                        100,
                        Math.floor(age)
                    )
                );


            particles = [];

            smokeParticles = [];

            confetti = [];


            createCandles(
                age
            );


            birthdayTitle.textContent =
                `🎂 ${birthdayName}님, 생일 축하합니다!`;


            setup.classList.add(
                "hidden"
            );


            sceneUI.style.display =
                "block";


            musicButton.style.display =
                "block";


            restartButton.style.display =
                "none";


            initAudio();

            startMusic();

        }


        startButton.addEventListener(
            "click",
            startBirthday
        );


        /* ============================================================
           Enter 키로 시작
        ============================================================ */

        nameInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    startBirthday();

                }

            }
        );


        ageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    startBirthday();

                }

            }
        );


        /* ============================================================
           다시 시작
        ============================================================ */

        restartButton.addEventListener(
            "click",
            () => {

                stopMusic();


                setup.classList.remove(
                    "hidden"
                );


                sceneUI.style.display =
                    "none";


                musicButton.style.display =
                    "none";


                restartButton.style.display =
                    "none";


                particles = [];

                smokeParticles = [];

                confetti = [];

                candles = [];

                celebrationStarted =
                    false;

            }
        );


        /* ============================================================
           렌더링
        ============================================================ */

        function render(
            time
        ) {

            drawBackground(
                time
            );


            if (
                setup.classList.contains(
                    "hidden"
                )
            ) {

                drawCake();

                drawCandles(
                    time
                );

                updateParticles();

                updateSmoke();

                updateConfetti();

            }


            requestAnimationFrame(
                render
            );

        }


        requestAnimationFrame(
            render
        );

    </script>

</body>
