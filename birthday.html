<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>생일 축하합니다 🎂</title>

    <style>

        /* ============================================================
           기본 초기화
        ============================================================ */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;
            background: #070910;
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* ============================================================
           시작 화면
        ============================================================ */

        .setup {
            position: relative;
            z-index: 10;

            width: min(92vw, 540px);

            padding: 32px;

            border: 1px solid rgba(255, 255, 255, 0.13);

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31, 35, 57, 0.96),
                    rgba(15, 18, 31, 0.94)
                );

            backdrop-filter: blur(22px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            transition:
                opacity 0.45s ease,
                transform 0.45s ease;
        }

        .setup.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            pointer-events: none;
        }

        .setup h1 {
            margin: 0;

            text-align: center;

            font-size: clamp(28px, 7vw, 36px);

            font-weight: 900;

            letter-spacing: -1.8px;

            text-shadow:
                0 4px 20px rgba(255, 130, 190, 0.3);
        }

        .subtitle {
            margin-top: 9px;
            margin-bottom: 28px;

            text-align: center;

            color: #aeb6ca;

            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;

            margin: 18px 0 8px;

            color: #d7dceb;

            font-size: 14px;

            font-weight: 700;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 16px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 15px;

            outline: none;

            background:
                rgba(8, 11, 21, 0.75);

            color: #ffffff;

            font-size: 16px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input::placeholder {
            color: #6f778d;
        }

        input:focus {
            border-color: #ff8fba;

            background:
                rgba(12, 15, 28, 0.95);

            box-shadow:
                0 0 0 3px rgba(255, 143, 186, 0.11),
                0 8px 30px rgba(255, 100, 170, 0.08);
        }

        /* ============================================================
           케이크 선택
        ============================================================ */

        .cakes {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        .cake {
            min-height: 82px;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    #171b2c,
                    #101322
                );

            color: #dce1ef;

            cursor: pointer;

            font-family: inherit;

            font-size: 13px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .cake span {
            display: block;

            margin-bottom: 5px;

            font-size: 27px;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(0, 0, 0, 0.25)
                );
        }

        .cake:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    145deg,
                    #20253b,
                    #15192a
                );
        }

        .cake:active {
            transform: translateY(0) scale(0.97);
        }

        .cake.selected {
            border-color: #ff8fb9;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 143, 185, 0.18),
                    rgba(168, 113, 255, 0.10)
                );

            box-shadow:
                0 0 0 1px rgba(255, 143, 185, 0.08),
                0 10px 35px rgba(255, 100, 170, 0.12);
        }

        /* ============================================================
           시작 버튼
        ============================================================ */

        .start {
            width: 100%;
            height: 54px;

            margin-top: 26px;

            border: 0;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ff72a9,
                    #bd7aff 55%,
                    #7f9cff
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 12px 35px rgba(213, 91, 180, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start:hover {
            transform: translateY(-3px);

            filter: brightness(1.08);

            box-shadow:
                0 16px 42px rgba(213, 91, 180, 0.35);
        }

        .start:active {
            transform: translateY(0) scale(0.98);
        }

        /* ============================================================
           장면 UI
        ============================================================ */

        .scene-ui {
            position: fixed;

            z-index: 5;

            inset: 0;

            pointer-events: none;
        }

        .birthday-title {
            position: absolute;

            top:
                max(
                    5%,
                    env(safe-area-inset-top)
                );

            width: 100%;

            padding: 0 15px;

            text-align: center;

            font-size:
                clamp(
                    25px,
                    5vw,
                    58px
                );

            font-weight: 900;

            letter-spacing: -2px;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.45),
                0 0 30px rgba(255, 130, 190, 0.45),
                0 8px 35px rgba(0, 0, 0, 0.35);
        }

        .birthday-subtitle {
            position: absolute;

            top:
                calc(
                    max(
                        5%,
                        env(safe-area-inset-top)
                    )
                    +
                    clamp(43px, 7vw, 78px)
                );

            width: 100%;

            padding: 0 20px;

            text-align: center;

            color: #d1d6e5;

            font-size: 14px;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.6);
        }

        /* ============================================================
           음악 버튼
        ============================================================ */

        .music-button {
            position: fixed;

            z-index: 20;

            right:
                max(
                    18px,
                    env(safe-area-inset-right)
                );

            top:
                max(
                    18px,
                    env(safe-area-inset-top)
                );

            width: 46px;
            height: 46px;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 50%;

            background:
                rgba(20, 24, 40, 0.76);

            color: #ffffff;

            cursor: pointer;

            backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .music-button:active {
            transform: scale(0.92);
        }

        .hint {
            position: fixed;

            z-index: 5;

            bottom:
                max(
                    5%,
                    env(safe-area-inset-bottom)
                );

            width: 100%;

            padding: 0 10px;

            text-align: center;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-size: 14px;

            pointer-events: none;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.5);
        }

        /* ============================================================
           다시 시작 버튼
        ============================================================ */

        .restart {
            position: fixed;

            z-index: 20;

            left: 50%;

            bottom:
                max(
                    25px,
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            min-width: 150px;

            height: 45px;

            padding: 0 22px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 999px;

            background:
                rgba(22, 26, 42, 0.82);

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            backdrop-filter: blur(12px);
        }

        /* ============================================================
           모바일
        ============================================================ */

        @media (max-width: 500px) {

            .setup {
                padding: 24px;

                border-radius: 25px;
            }

            .cakes {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .cake {
                min-height: 75px;
            }

        }

        @media (max-height: 650px) {

            .birthday-title {
                top: 3%;
            }

            .birthday-subtitle {
                top: calc(3% + 45px);
            }

            .hint {
                bottom: 2%;
            }

        }

    </style>

</head>

<body>

    <!-- ============================================================
         Canvas
    ============================================================ -->

    <canvas id="canvas"></canvas>


    <!-- ============================================================
         시작 화면
    ============================================================ -->

    <div
        class="setup"
        id="setup"
    >

        <h1>
            🎂 생일 축하하기
        </h1>

        <div class="subtitle">
            이름과 케이크를 선택하고<br>
            특별한 생일을 시작해보세요.
        </div>


        <label for="name">
            이름
        </label>

        <input
            id="name"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="예: 홍길동"
        >


        <label>
            케이크
        </label>

        <div class="cakes">

            <button
                class="cake selected"
                data-cake="strawberry"
                type="button"
            >
                <span>🍓</span>
                딸기
            </button>

            <button
                class="cake"
                data-cake="cream"
                type="button"
            >
                <span>🍰</span>
                생크림
            </button>

            <button
                class="cake"
                data-cake="chocolate"
                type="button"
            >
                <span>🍫</span>
                초콜릿
            </button>

            <button
                class="cake"
                data-cake="cheese"
                type="button"
            >
                <span>🧀</span>
                치즈
            </button>

        </div>


        <label for="age">
            나이 / 초 개수
        </label>

        <input
            id="age"
            type="number"
            min="1"
            max="100"
            value="10"
            inputmode="numeric"
            placeholder="나이를 입력하세요"
        >


        <button
            class="start"
            id="startButton"
            type="button"
        >
            🎉 생일 시작하기
        </button>

    </div>


    <!-- ============================================================
         장면 UI
    ============================================================ -->

    <div
        class="scene-ui"
        id="sceneUI"
        style="display:none;"
    >

        <div
            class="birthday-title"
            id="birthdayTitle"
        ></div>

        <div class="birthday-subtitle">
            촛불을 하나씩 눌러 꺼주세요 🕯️
        </div>

        <div class="hint">
            ✨ 모든 촛불을 끄면 특별한 축하가 시작됩니다 ✨
        </div>

    </div>


    <!-- ============================================================
         음악
    ============================================================ -->

    <button
        class="music-button"
        id="musicButton"
        style="display:none;"
        type="button"
        aria-label="음악 켜기 또는 끄기"
    >
        🔊
    </button>


    <!-- ============================================================
         다시 시작
    ============================================================ -->

    <button
        class="restart"
        id="restartButton"
        type="button"
        style="display:none;"
    >
        🎂 다시 시작
    </button>


    <script>

        "use strict";


        /* ============================================================
           Canvas
        ============================================================ */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext(
                "2d",
                {
                    alpha: false,
                    desynchronized: true
                }
            );


        let width = 0;

        let height = 0;

        let dpr = 1;


        function resizeCanvas() {

            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            width =
                window.innerWidth;

            height =
                window.innerHeight;

            canvas.width =
                Math.floor(
                    width * dpr
                );

            canvas.height =
                Math.floor(
                    height * dpr
                );

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

        }


        window.addEventListener(
            "resize",
            resizeCanvas,
            {
                passive: true
            }
        );


        resizeCanvas();


        /* ============================================================
           UI
        ============================================================ */

        const setup =
            document.getElementById(
                "setup"
            );

        const sceneUI =
            document.getElementById(
                "sceneUI"
            );

        const birthdayTitle =
            document.getElementById(
                "birthdayTitle"
            );

        const nameInput =
            document.getElementById(
                "name"
            );

        const ageInput =
            document.getElementById(
                "age"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );

        const musicButton =
            document.getElementById(
                "musicButton"
            );

        const restartButton =
            document.getElementById(
                "restartButton"
            );


        let selectedCake =
            "strawberry";

        let birthdayName =
            "친구";

        let celebrationStarted =
            false;


        /* ============================================================
           케이크 선택
        ============================================================ */

        document
            .querySelectorAll(".cake")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".cake"
                                )
                                .forEach(
                                    item => {

                                        item.classList
                                            .remove(
                                                "selected"
                                            );

                                    }
                                );

                            button.classList.add(
                                "selected"
                            );

                            selectedCake =
                                button.dataset.cake;

                        }
                    );

                }
            );


        /* ============================================================
           케이크 색상
        ============================================================ */

        const cakeColors = {

            strawberry: {
                bodyTop: "#fff7fa",
                bodyBottom: "#e978a2",
                cream: "#fffafd",
                accent: "#ff3d6d",
                dark: "#c62950"
            },

            cream: {
                bodyTop: "#fffef9",
                bodyBottom: "#d9b981",
                cream: "#ffffff",
                accent: "#f1d59d",
                dark: "#c7a46b"
            },

            chocolate: {
                bodyTop: "#a96d50",
                bodyBottom: "#4a2117",
                cream: "#f5d8c0",
                accent: "#713421",
                dark: "#34140e"
            },

            cheese: {
                bodyTop: "#ffe98a",
                bodyBottom: "#c9891b",
                cream: "#fff2a9",
                accent: "#e3ad31",
                dark: "#9d6813"
            }

        };


        /* ============================================================
           촛불
        ============================================================ */

        let candles = [];

        let smokeParticles = [];

        let particles = [];

        let confetti = [];


        function createCandles(age) {

            candles = [];

            celebrationStarted = false;


            /*
             * 나이만큼 모두 생성하지 않고
             * 100개까지 제한합니다.
             */

            age =
                Math.max(
                    1,
                    Math.min(
                        Math.floor(age),
                        100
                    )
                );


            /*
             * 10살 단위는 긴 초,
             * 나머지는 짧은 초입니다.
             */

            const longCount =
                Math.floor(
                    age / 10
                );

            const shortCount =
                age % 10;


            for (
                let i = 0;
                i < longCount;
                i++
            ) {

                candles.push({

                    type: "long",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }


            for (
                let i = 0;
                i < shortCount;
                i++
            ) {

                candles.push({

                    type: "short",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }

        }


        /* ============================================================
           치즈 구멍
        ============================================================ */

        const cheeseHoles = [

            [0.15, 0.34, 5],

            [0.25, 0.22, 4],

            [0.37, 0.40, 7],

            [0.49, 0.25, 4],

            [0.61, 0.39, 6],

            [0.74, 0.23, 4],

            [0.85, 0.40, 5],

            [0.22, 0.52, 4],

            [0.46, 0.50, 5],

            [0.70, 0.51, 4]

        ];


        /* ============================================================
           파티클 생성
        ============================================================ */

        function createParticle(
            x,
            y,
            amount = 20
        ) {

            amount =
                Math.min(
                    amount,
                    35
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const angle =
                    Math.random() *
                    Math.PI *
                    2;

                const speed =
                    1.5 +
                    Math.random() *
                    5;

                particles.push({

                    x: x,

                    y: y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    gravity: 0.06,

                    life: 1,

                    size:
                        1 +
                        Math.random() *
                        3

                });

            }

        }


        /* ============================================================
           연기 생성
        ============================================================ */

        function createSmoke(
            x,
            y
        ) {

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                smokeParticles.push({

                    x:
                        x +
                        (
                            Math.random() -
                            0.5
                        ) *
                        8,

                    y:
                        y,

                    vx:
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.5,

                    vy:
                        -0.8 -
                        Math.random() *
                        0.8,

                    life: 1,

                    size:
                        3 +
                        Math.random() *
                        4

                });

            }

        }


        /* ============================================================
           컨페티
        ============================================================ */

        function createConfetti(
            amount = 140
        ) {

            /*
             * 기존 컨페티를 정리합니다.
             */

            confetti = [];


            amount =
                Math.min(
                    amount,
                    220
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                confetti.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        -Math.random() *
                        height,

                    vx:
                        (
                            Math.random() -
                            0.5
                        ) *
                        2.5,

                    vy:
                        1 +
                        Math.random() *
                        4,

                    rotation:
                        Math.random() *
                        Math.PI,

                    rotationSpeed:
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.18,

                    size:
                        4 +
                        Math.random() *
                        7,

                    hue:
                        Math.random() *
                        360,

                    life: 1

                });

            }

        }


        /* ============================================================
           케이크 데이터
        ============================================================ */

        function getCakeData() {

            /*
             * 모바일 세로 화면에서는
             * 케이크를 자동으로 작게 만듭니다.
             */

            const maxWidth =
                Math.min(
                    width * 0.82,
                    650
                );


            const maxHeight =
                Math.min(
                    height * 0.36,
                    270
                );


            let cakeWidth =
                maxWidth;


            let cakeHeight =
                maxHeight;


            /*
             * 화면 높이가 작은 경우
             * 케이크 높이를 더 줄입니다.
             */

            if (
                height < 700
            ) {

                cakeWidth =
                    Math.min(
                        width * 0.78,
                        570
                    );

                cakeHeight =
                    Math.min(
                        height * 0.31,
                        220
                    );

            }


            const bottom =
                Math.min(
                    height * 0.84,
                    height - 40
                );


            return {

                x:
                    width / 2,

                width:
                    cakeWidth,

                height:
                    cakeHeight,

                bottom:
                    bottom

            };

        }


        /* ============================================================
           촛불 위치
        ============================================================ */

        function getCandlePositions() {

            const cake =
                getCakeData();


            const positions =
                new Array(
                    candles.length
                );


            const surfaceY =
                cake.bottom -
                cake.height +
                40;


            /*
             * 촛불 개수가 많으면
             * 여러 줄로 자동 분리합니다.
             */

            const total =
                candles.length;


            let columns;


            if (
                total <= 5
            ) {

                columns = total;

            } else if (
                total <= 10
            ) {

                columns = 5;

            } else if (
                total <= 20
            ) {

                columns = 7;

            } else {

                columns = 8;

            }


            candles.forEach(
                (candle, index) => {

                    const row =
                        Math.floor(
                            index /
                            columns
                        );


                    const col =
                        index %
                        columns;


                    const rowCount =
                        Math.min(
                            columns,
                            total -
                            row *
                            columns
                        );


                    const usableWidth =
                        cake.width *
                        (
                            total <= 5
                                ? 0.62
                                : 0.76
                        );


                    const spacing =
                        rowCount <= 1
                            ? 0
                            :
                            usableWidth /
                            (
                                rowCount -
                                1
                            );


                    const rowWidth =
                        spacing *
                        (
                            rowCount -
                            1
                        );


                    const normalized =
                        rowCount <= 1
                            ? 0
                            :
                            (
                                col /
                                (
                                    rowCount -
                                    1
                                )
                            ) *
                            2 -
                            1;


                    /*
                     * 가운데는 낮고 양쪽은
                     * 조금 높게 배치합니다.
                     */

                    const curve =
                        Math.abs(
                            normalized
                        ) *
                        9;


                    const x =
                        cake.x -
                        rowWidth / 2 +
                        col *
                        spacing;


                    /*
                     * 긴 초는 뒤,
                     * 짧은 초는 앞쪽으로 배치합니다.
                     */

                    let y =
                        surfaceY +
                        row *
                        30 +
                        curve;


                    if (
                        candle.type === "short"
                    ) {

                        y += 24;

                    }


                    /*
                     * 촛불이 너무 많아질 경우
                     * 크기를 자동으로 축소합니다.
                     */

                    const scale =
                        Math.max(
                            0.55,
                            Math.min(
                                1,
                                1 -
                                Math.max(
                                    0,
                                    total -
                                    12
                                ) *
                                0.025
                            )
                        );


                    positions[index] = {

                        x: x,

                        y: y,

                        depth:
                            row +
                            (
                                candle.type ===
                                "long"
                                    ? 0
                                    : 0.5
                            ),

                        scale:
                            scale

                    };

                }
            );


            return positions;

        }


        /* ============================================================
           둥근 사각형
        ============================================================ */

        function roundRect(
            context,
            x,
            y,
            w,
            h,
            r
        ) {

            const radius =
                Math.min(
                    r,
                    w / 2,
                    h / 2
                );


            context.beginPath();

            context.moveTo(
                x + radius,
                y
            );

            context.arcTo(
                x + w,
                y,
                x + w,
                y + h,
                radius
            );

            context.arcTo(
                x + w,
                y + h,
                x,
                y + h,
                radius
            );

            context.arcTo(
                x,
                y + h,
                x,
                y,
                radius
            );

            context.arcTo(
                x,
                y,
                x + w,
                y,
                radius
            );

            context.closePath();

        }

            ctx.beginPath();

            ctx.arc(
                cake.x,
                cake.bottom -
                cake.height * 0.55,
                cake.width * 0.72,

        /* ============================================================

        function drawCakeBase(

        ) {

                cake.width / 2;


            const top =

             */

            ctx.save();

            ctx.fillStyle =
                "rgba(0,0,0,0.34)";

            ctx.filter =
                "blur(5px)";

            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                cake.bottom + 15,
                cake.width * 0.46,
                18,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();


            /*

             */

            const plate =
                ctx.createLinearGradient(

                    cake.bottom - 5,
                    0,
                    cake.bottom + 32
                );


            plate.addColorStop(
                0,
                "#ffffff"
            );


            plate.addColorStop(
                0.45,
                "#f9d9e8"
            );


            plate.addColorStop(
                1,
                "#b87598"
            );


            ctx.fillStyle =
                plate;


            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                cake.bottom + 6,
                cake.width * 0.54,
                25,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * 케이크 몸체
             */

            const body =
                ctx.createLinearGradient(
                    0,
                    top + 50,
                    0,
                    cake.bottom
                );


            body.addColorStop(
                0,
                colors.bodyTop
            );


            body.addColorStop(
                0.42,
                colors.bodyTop
            );


            body.addColorStop(
                1,
                colors.bodyBottom
            );


            ctx.fillStyle =
                body;


            roundRect(
                ctx,
                left,
                top + 45,
                cake.width,
                cake.height * 0.68,
                27
            );


            ctx.fill();


            /*
             * 케이크 앞쪽 음영
             */

            const shade =
                ctx.createLinearGradient(
                    0,
                    top + 90,
                    0,
                    cake.bottom

            );


            shade.addColorStop(
                1,
                "rgba(60,15,30,0.16)"
            );

            roundRect(
                ctx,
                left + 2,
                top + 48,
                cake.width - 4,
                cake.height * 0.65,

            );


            ctx.fill();


            /*
             * 윗면
             */

            const topGradient =
                ctx.createRadialGradient(
                    cake.x -
                    cake.width * 0.12,

                    5,
                    cake.x,

            );

            );

            );

        /* ============================================================
           크림 드립
        ============================================================ */

        function drawCreamDrips(
            cake,
            colors
        ) {

            const left =
                cake.x -
                cake.width / 2;


            const top =
                cake.bottom -
                cake.height;


            ctx.fillStyle =
                colors.cream;


            ctx.beginPath();

            ctx.moveTo(
                left,
                top + 54
            );


            const steps = 32;


            for (
                let i = 0;
                i <= steps;
                i++
            ) {

                const px =
                    left +
                    cake.width *
                    (
                        i /
                        steps
                    );


                const wave =
                    Math.sin(
                        i *
                        1.15
                    ) *
                    3;


                const py =
                    top +
                    70 +
                    wave;


                ctx.lineTo(
                    px,
                    py
                );

            }


            ctx.lineTo(
                left + cake.width,
                top + 105
            );


            ctx.lineTo(
                left,
                top + 105
            );


            ctx.closePath();

            ctx.fill();


            /*
             * 자연스러운 크림 방울
             */

            for (
                let i = 0;
                i < 11;
                i++
            ) {

                const px =
                    left +
                    20 +
                    i *
                    (
                        (
                            cake.width -
                            40
                        ) /
                        10
                    );


                const py =
                    top +
                    91 +
                    Math.sin(
                        i *
                        1.5
                    ) *
                    3;


                ctx.beginPath();

                ctx.ellipse(
                    px,
                    py,
                    14,
                    18,
                    0,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        }


        /* ============================================================
           딸기 케이크
        ============================================================ */

        function drawStrawberryCake(
            cake
        ) {

            const left =
                cake.x -
                cake.width / 2;


            const top =
                cake.bottom -
                cake.height;


            const berries = [

                [0.18, 0.46, 15],

                [0.32, 0.28, 17],

                [0.50, 0.43, 18],

                [0.68, 0.28, 17],

                [0.82, 0.46, 15]

            ];


            berries.forEach(
                berry => {

                    const x =
                        left +
                        cake.width *
                        berry[0];


                    const y =
                        top +
                        berry[1] *
                        90;


                    const r =
                        berry[2];


                    /*
                     * 딸기 그림자
                     */

                    ctx.fillStyle =
                        "rgba(110,20,40,0.18)";

                    ctx.beginPath();

                    ctx.ellipse(
                        x,
                        y + 4,
                        r,
                        r * 1.13,
                        0,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();


                    /*
                     * 딸기
                     */

                    const gradient =
                        ctx.createRadialGradient(
                            x - r * 0.35,
                            y - r * 0.4,
                            1,
                            x,
                            y,
                            r
                        );


                    gradient.addColorStop(
                        0,
                        "#ff9bb0"
                    );


                    gradient.addColorStop(
                        0.45,
                        "#ff426b"
                    );


                    gradient.addColorStop(
                        1,
                        "#c91f48"
                    );


                    ctx.fillStyle =
                        gradient;


                    ctx.beginPath();

                    ctx.ellipse(
                        x,
                        y,
                        r,
                        r * 1.12,
                        0,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();


                    /*
                     * 딸기 씨
                     */

                    ctx.fillStyle =
                        "#ffe27a";


                    for (
                        let i = 0;
                        i < 8;
                        i++
                    ) {

                        const angle =
                            i *
                            0.78;


                        const sx =
                            x +
                            Math.cos(angle) *
                            r *
                            0.52;


                        const sy =
                            y +
                            Math.sin(angle) *
                            r *
                            0.72;


                        ctx.beginPath();

                        ctx.ellipse(
                            sx,
                            sy,
                            1.3,
                            2.2,
                            0,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }


                    /*
                     * 딸기 잎
                     */

                    ctx.fillStyle =
                        "#5ca052";


                    ctx.beginPath();

                    ctx.ellipse(
                        x - 5,
                        y - r + 3,
                        5,
                        9,
                        -0.45,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();


                    ctx.beginPath();

                    ctx.ellipse(
                        x + 5,
                        y - r + 3,
                        5,
                        9,
                        0.45,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }
            );


            /*
             * 작은 딸기 장식
             */

            ctx.fillStyle =
                "#ff6686";


            for (
                let i = 0;
                i < 7;
                i++
            ) {

                const x =
                    left +
                    35 +
                    i *
                    (
                        (
                            cake.width -
                            70
                        ) /
                        6
                    );


                const y =
                    cake.bottom -
                    34 +
                    Math.sin(i) *
                    3;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        }

        /* ============================================================
           초콜릿 케이크
        ============================================================ */

        function drawChocolateCake(

        ) {

            const left =
                cake.x -
                cake.width / 2;


            const top =
                cake.bottom -
                cake.height;


            /*
             * 초콜릿 드립
             */

            ctx.fillStyle =
                "#63301e";


            ctx.beginPath();

            ctx.moveTo(
                left,
                top + 55
            );


            for (
                let i = 0;
                i <= 30;
                i++
            ) {

                const x =
                    left +
                    cake.width *
                    (
                        i /
                        30
                    );


                const wave =
                    Math.sin(
                        i *
                        1.2
                    ) *
                    3;


                const y =
                    top +
                    73 +
                    wave;


                ctx.lineTo(
                    x,
                    y
                );

            }


            ctx.lineTo(
                left + cake.width,
                top + 100
            );


            ctx.lineTo(
                left,
                top + 100
            );


            ctx.closePath();

            ctx.fill();


            /*
             * 초콜릿 조각
             */

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                const x =
                    left +
                    35 +
                    i *
                    (
                        (
                            cake.width -
                            70
                        ) /
                        7
                    );


                const y =
                    top +
                    81 +
                    Math.sin(
                        i *
                        1.3
                    ) *
                    5;


                ctx.save();

                ctx.translate(
                    x,
                    y
                );

                ctx.rotate(
                    (
                        i -
                        4
                    ) *
                    0.08
                );


                const chocolate =
                    ctx.createLinearGradient(
                        -15,
                        -7,
                        15,
                        7
                    );


                chocolate.addColorStop(
                    0,
                    "#9b5337"
                );


                chocolate.addColorStop(
                    0.5,
                    "#6d3423"
                );


                chocolate.addColorStop(
                    1,
                    "#3f1b13"
                );


                ctx.fillStyle =
                    chocolate;


                roundRect(
                    ctx,
                    -15,
                    -5,
                    30,
                    10,
                    4
                );


                ctx.fill();

                ctx.restore();

            }

        }
