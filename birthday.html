<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>생일 축하합니다 🎂</title>

    <style>

        /* ============================================================
           기본 초기화
        ============================================================ */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;

            background: #070910;
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;
        }

        canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            touch-action: none;
        }

        button,
        input {
            font-family: inherit;
        }

        /* ============================================================
           시작 화면
        ============================================================ */

        .setup {
            position: relative;
            z-index: 10;

            width: min(92vw, 540px);

            padding: 32px;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31, 35, 57, 0.97),
                    rgba(15, 18, 31, 0.96)
                );

            backdrop-filter: blur(22px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            transition:
                opacity 0.45s ease,
                transform 0.45s ease;
        }

        .setup.hidden {
            opacity: 0;

            transform:
                translateY(20px)
                scale(0.96);

            pointer-events: none;
        }

        .setup h1 {
            margin: 0;

            text-align: center;

            font-size:
                clamp(
                    28px,
                    7vw,
                    36px
                );

            font-weight: 900;

            letter-spacing: -1.8px;

            text-shadow:
                0 4px 20px
                rgba(255, 130, 190, 0.3);
        }

        .subtitle {
            margin-top: 9px;
            margin-bottom: 28px;

            text-align: center;

            color: #aeb6ca;

            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;

            margin:
                18px 0 8px;

            color: #d7dceb;

            font-size: 14px;

            font-weight: 700;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 16px;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 15px;

            outline: none;

            background:
                rgba(8, 11, 21, 0.75);

            color: #ffffff;

            font-size: 16px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input::placeholder {
            color: #6f778d;
        }

        input:focus {
            border-color: #ff8fba;

            background:
                rgba(12, 15, 28, 0.95);

            box-shadow:
                0 0 0 3px
                rgba(255, 143, 186, 0.11),

                0 8px 30px
                rgba(255, 100, 170, 0.08);
        }

        /* ============================================================
           케이크 선택
        ============================================================ */

        .cakes {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        .cake {
            position: relative;

            min-height: 82px;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    #171b2c,
                    #101322
                );

            color: #dce1ef;

            cursor: pointer;

            font-family: inherit;

            font-size: 13px;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .cake::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.08),
                    transparent 45%
                );

            pointer-events: none;
        }

        .cake span {
            display: block;

            margin-bottom: 5px;

            font-size: 27px;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(0, 0, 0, 0.25)
                );
        }

        .cake:hover {
            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    145deg,
                    #20253b,
                    #15192a
                );
        }

        .cake:active {
            transform:
                translateY(0)
                scale(0.97);
        }

        .cake.selected {
            border-color: #ff8fb9;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 143, 185, 0.18),
                    rgba(168, 113, 255, 0.10)
                );

            box-shadow:
                0 0 0 1px
                rgba(255, 143, 185, 0.08),

                0 10px 35px
                rgba(255, 100, 170, 0.12);
        }

        /* ============================================================
           시작 버튼
        ============================================================ */

        .start {
            width: 100%;
            height: 54px;

            margin-top: 26px;

            border: 0;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ff72a9,
                    #bd7aff 55%,
                    #7f9cff
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 12px 35px
                rgba(213, 91, 180, 0.28),

                inset 0 1px 0
                rgba(255, 255, 255, 0.25);

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start:hover {
            transform:
                translateY(-3px);

            filter:
                brightness(1.08);

            box-shadow:
                0 16px 42px
                rgba(213, 91, 180, 0.35);
        }

        .start:active {
            transform:
                translateY(0)
                scale(0.98);
        }

        /* ============================================================
           장면 UI
        ============================================================ */

        .scene-ui {
            position: fixed;

            z-index: 5;

            inset: 0;

            pointer-events: none;
        }

        .birthday-title {
            position: absolute;

            top:
                max(
                    5%,
                    env(safe-area-inset-top)
                );

            width: 100%;

            padding: 0 15px;

            text-align: center;

            font-size:
                clamp(
                    25px,
                    5vw,
                    58px
                );

            font-weight: 900;

            letter-spacing: -2px;

            text-shadow:
                0 0 10px
                rgba(255, 255, 255, 0.45),

                0 0 30px
                rgba(255, 130, 190, 0.45),

                0 8px 35px
                rgba(0, 0, 0, 0.35);
        }

        .birthday-subtitle {
            position: absolute;

            top:
                calc(
                    max(
                        5%,
                        env(safe-area-inset-top)
                    )
                    +
                    clamp(
                        43px,
                        7vw,
                        78px
                    )
                );

            width: 100%;

            padding: 0 20px;

            text-align: center;

            color: #d1d6e5;

            font-size: 14px;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.6);
        }

        /* ============================================================
           음악 버튼
        ============================================================ */

        .music-button {
            position: fixed;

            z-index: 20;

            right:
                max(
                    18px,
                    env(safe-area-inset-right)
                );

            top:
                max(
                    18px,
                    env(safe-area-inset-top)
                );

            width: 46px;
            height: 46px;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 50%;

            background:
                rgba(20, 24, 40, 0.76);

            color: #ffffff;

            cursor: pointer;

            backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s ease;
        }

        .music-button:active {
            transform:
                scale(0.92);
        }

        /* ============================================================
           안내
        ============================================================ */

        .hint {
            position: fixed;

            z-index: 5;

            bottom:
                max(
                    5%,
                    env(safe-area-inset-bottom)
                );

            width: 100%;

            padding: 0 10px;

            text-align: center;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-size: 14px;

            pointer-events: none;

            text-shadow:
                0 2px 10px
                rgba(0, 0, 0, 0.5);

            transition:
                opacity 0.3s ease;
        }

        /* ============================================================
           다시 시작
        ============================================================ */

        .restart {
            position: fixed;

            z-index: 20;

            left: 50%;

            bottom:
                max(
                    25px,
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            min-width: 150px;

            height: 45px;

            padding: 0 22px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 999px;

            background:
                rgba(22, 26, 42, 0.82);

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);
        }

        /* ============================================================
           모바일
        ============================================================ */

        @media (max-width: 500px) {

            .setup {
                padding: 24px;

                border-radius: 25px;
            }

            .cakes {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .cake {
                min-height: 75px;
            }

        }

        @media (max-height: 650px) {

            .birthday-title {
                top: 3%;
            }

            .birthday-subtitle {
                top:
                    calc(
                        3% + 45px
                    );
            }

            .hint {
                bottom: 2%;
            }

        }

        /* ============================================================
           모션 감소 환경
        ============================================================ */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

        }

    </style>

</head>

<body>

    <!-- ============================================================
         Canvas
    ============================================================ -->

    <canvas id="canvas"></canvas>


    <!-- ============================================================
         시작 화면
    ============================================================ -->

    <div
        class="setup"
        id="setup"
    >

        <h1>
            🎂 생일 축하하기
        </h1>

        <div class="subtitle">
            이름과 케이크를 선택하고<br>
            특별한 생일을 시작해보세요.
        </div>


        <label for="name">
            이름
        </label>

        <input
            id="name"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="예: 홍길동"
        >


        <label>
            케이크
        </label>

        <div class="cakes">

            <button
                class="cake selected"
                data-cake="strawberry"
                type="button"
            >
                <span>🍓</span>
                딸기
            </button>

            <button
                class="cake"
                data-cake="cream"
                type="button"
            >
                <span>🍰</span>
                생크림
            </button>

            <button
                class="cake"
                data-cake="chocolate"
                type="button"
            >
                <span>🍫</span>
                초콜릿
            </button>

            <button
                class="cake"
                data-cake="cheese"
                type="button"
            >
                <span>🧀</span>
                치즈
            </button>

        </div>


        <label for="age">
            나이 / 초 개수
        </label>

        <input
            id="age"
            type="number"
            min="1"
            max="100"
            value="10"
            inputmode="numeric"
            placeholder="나이를 입력하세요"
        >


        <button
            class="start"
            id="startButton"
            type="button"
        >
            🎉 생일 시작하기
        </button>

    </div>


    <!-- ============================================================
         장면 UI
    ============================================================ -->

    <div
        class="scene-ui"
        id="sceneUI"
        style="display:none;"
    >

        <div
            class="birthday-title"
            id="birthdayTitle"
        ></div>

        <div
            class="birthday-subtitle"
            id="birthdaySubtitle"
        >
            촛불을 하나씩 눌러 꺼주세요 🕯️
        </div>

        <div
            class="hint"
            id="hint"
        >
            ✨ 모든 촛불을 끄면 특별한 축하가 시작됩니다 ✨
        </div>

    </div>


    <!-- ============================================================
         음악
    ============================================================ -->

    <button
        class="music-button"
        id="musicButton"
        style="display:none;"
        type="button"
        aria-label="음악 켜기 또는 끄기"
    >
        🔊
    </button>


    <!-- ============================================================
         다시 시작
    ============================================================ -->

    <button
        class="restart"
        id="restartButton"
        type="button"
        style="display:none;"
    >
        🎂 다시 시작
    </button>


    <script>

        "use strict";


        /* ============================================================
           Canvas
        ============================================================ */

        const canvas =
            document.getElementById(
                "canvas"
            );


        const ctx =
            canvas.getContext(
                "2d",
                {
                    alpha: false,
                    desynchronized: true
                }
            );


        let width = 0;

        let height = 0;

        let dpr = 1;


        /* ============================================================
           별 캐시
        ============================================================ */

        let stars = [];


        function resizeCanvas() {

            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            width =
                window.innerWidth;


            height =
                window.innerHeight;


            canvas.width =
                Math.floor(
                    width * dpr
                );


            canvas.height =
                Math.floor(
                    height * dpr
                );


            canvas.style.width =
                width + "px";


            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            /*
             * 별 위치를 매 프레임 계산하지 않고
             * 화면 크기가 바뀔 때만 생성합니다.
             */

            stars = [];


            for (
                let i = 0;
                i < 60;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        Math.random() *
                        height *
                        0.72,

                    size:
                        0.5 +
                        Math.random() *
                        1.5,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }

        }


        window.addEventListener(
            "resize",
            resizeCanvas,
            {
                passive: true
            }
        );


        resizeCanvas();


        /* ============================================================
           UI
        ============================================================ */

        const setup =
            document.getElementById(
                "setup"
            );


        const sceneUI =
            document.getElementById(
                "sceneUI"
            );


        const birthdayTitle =
            document.getElementById(
                "birthdayTitle"
            );


        const birthdaySubtitle =
            document.getElementById(
                "birthdaySubtitle"
            );


        const hint =
            document.getElementById(
                "hint"
            );


        const nameInput =
            document.getElementById(
                "name"
            );


        const ageInput =
            document.getElementById(
                "age"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const musicButton =
            document.getElementById(
                "musicButton"
            );


        const restartButton =
            document.getElementById(
                "restartButton"
            );


        let selectedCake =
            "strawberry";


        let birthdayName =
            "친구";


        let celebrationStarted =
            false;


        /* ============================================================
           케이크 선택
        ============================================================ */

        document
            .querySelectorAll(".cake")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".cake"
                                )
                                .forEach(
                                    item => {

                                        item.classList
                                            .remove(
                                                "selected"
                                            );

                                    }
                                );


                            button.classList.add(
                                "selected"
                            );


                            selectedCake =
                                button.dataset.cake;

                        }
                    );

                }
            );


        /* ============================================================
           케이크 색상
        ============================================================ */

        const cakeColors = {

            strawberry: {
                bodyTop: "#fff8fb",
                bodyBottom: "#f38aa6",
                cream: "#fffbfd",
                accent: "#ff6d93",
                dark: "#c23566",
                shadow: "#a83a5c"
            },

            cream: {
                bodyTop: "#fffef9",
                bodyBottom: "#e6cd9c",
                cream: "#ffffff",
                accent: "#eecf95",
                dark: "#b8925a",
                shadow: "#a17d49"
            },

            chocolate: {
                bodyTop: "#8d5d44",
                bodyBottom: "#4a2115",
                cream: "#f2d4bb",
                accent: "#75392a",
                dark: "#3a1710",
                shadow: "#2a120c"
            },

            cheese: {
                bodyTop: "#ffedb0",
                bodyBottom: "#dd9a34",
                cream: "#fff3b0",
                accent: "#e8b143",
                dark: "#a06b1c",
                shadow: "#8a5813"
            }

        };


        /* ============================================================
           촛불 및 이펙트
        ============================================================ */

        let candles = [];

        let smokeParticles = [];

        let particles = [];

        let confetti = [];

        let celebrationSparkles = [];


        /* ============================================================
           촛불 생성
        ============================================================ */

        function createCandles(age) {

            candles = [];

            celebrationStarted = false;


            age =
                Math.max(
                    1,
                    Math.min(
                        Math.floor(age),
                        100
                    )
                );


            const longCount =
                Math.floor(
                    age / 10
                );


            const shortCount =
                age % 10;


            for (
                let i = 0;
                i < longCount;
                i++
            ) {

                candles.push({

                    type: "long",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }


            for (
                let i = 0;
                i < shortCount;
                i++
            ) {

                candles.push({

                    type: "short",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }

        }


        /* ============================================================
           치즈 구멍
        ============================================================ */

        const cheeseHoles = [

            [0.13, 0.28, 6],

            [0.24, 0.45, 4],

            [0.34, 0.25, 5],

            [0.46, 0.43, 7],

            [0.57, 0.27, 4],

            [0.69, 0.43, 6],

            [0.80, 0.28, 5],

            [0.89, 0.46, 4],

            [0.27, 0.58, 4],

            [0.61, 0.58, 5],

            [0.77, 0.56, 4]

        ];


        /* ============================================================
           파티클 생성
        ============================================================ */

        function createParticle(
            x,
            y,
            amount = 20
        ) {

            amount =
                Math.min(
                    amount,
                    40
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const speed =
                    1.5 +
                    Math.random() *
                    5;


                particles.push({

                    x: x,

                    y: y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    gravity:
                        0.06,

                    life:
                        1,

                    size:
                        1 +
                        Math.random() *
                        3

                });

            }

        }


        /* ============================================================
           연기
        ============================================================ */

        function createSmoke(
            x,
            y
        ) {

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                smokeParticles.push({

                    x:
                        x +
                        (
                            Math.random() -
                            0.5
                        ) *
                        8,

                    y:
                        y,

                    vx:
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.5,

                    vy:
                        -0.8 -
                        Math.random() *
                        0.8,

                    life:
                        1,

                    size:
                        3 +
                        Math.random() *
                        4

                });

            }

        }


        /* ============================================================
           컨페티
        ============================================================ */

        function createConfetti(
            amount = 160
        ) {

            confetti = [];


            amount =
                Math.min(
                    amount,
                    220
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                confetti.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        -Math.random() *
                        height,

                    vx:
                        (
                            Math.random() -
                            0.5
                        ) *
                        2.5,

                    vy:
                        1 +
                        Math.random() *
                        4,

                    rotation:
                        Math.random() *
                        Math.PI,

                    rotationSpeed:
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.18,

                    size:
                        4 +
                        Math.random() *
                        7,

                    hue:
                        Math.random() *
                        360,

                    life:
                        1

                });

            }

        }


        /* ============================================================
           축하 반짝이
        ============================================================ */

        function createCelebrationSparkles() {

            celebrationSparkles = [];


            for (
                let i = 0;
                i < 80;
                i++
            ) {

                celebrationSparkles.push({

                    angle:
                        Math.random() *
                        Math.PI *
                        2,

                    radius:
                        80 +
                        Math.random() *
                        260,

                    speed:
                        0.002 +
                        Math.random() *
                        0.006,

                    size:
                        1 +
                        Math.random() *
                        3,

                    phase:
                        Math.random() *
                        Math.PI *
                        2

                });

            }

        }


        /* ============================================================
           케이크 위치 및 크기
        ============================================================ */

        function getCakeData() {

            const mobile =
                width < 600;


            let cakeWidth =
                Math.min(
                    width *
                    (
                        mobile
                            ? 0.86
                            : 0.72
                    ),
                    680
                );


            let cakeHeight =
                Math.min(
                    height *
                    (
                        mobile
                            ? 0.28
                            : 0.31
                    ),
                    250
                );


            /*
             * 화면이 매우 낮으면
             * 케이크를 더 작게 만듭니다.
             */

            if (
                height < 650
            ) {

                cakeWidth =
                    Math.min(
                        width * 0.78,
                        560
                    );


                cakeHeight =
                    Math.min(
                        height * 0.26,
                        205
                    );

            }


            const bottom =
                Math.min(
                    height * 0.84,
                    height - 35
                );


            return {

                x:
                    width / 2,

                width:
                    cakeWidth,

                height:
                    cakeHeight,

                bottom:
                    bottom

            };

        }


        /* ============================================================
           촛불 위치
        ============================================================ */

        function getCandlePositions() {

            const cake = getCakeData();
            const positions = new Array(candles.length);

            const surfaceY = cake.bottom - cake.height + 38;
            const upperWidth = cake.width * 0.82;

            const total = candles.length;
            const scale = Math.max(0.56, Math.min(1, 1 - Math.max(0, total - 8) * 0.032));

            const longIndexes = [];
            const shortIndexes = [];

            candles.forEach((candle, index) => {
                if (candle.type === "long") {
                    longIndexes.push(index);
                } else {
                    shortIndexes.push(index);
                }
            });

            function layoutArc(indexes, options) {

                const count = indexes.length;

                if (count === 0) {
                    return;
                }

                let arcWidth = options.spacing * (count - 1);

                if (arcWidth > options.maxWidth) {
                    arcWidth = options.maxWidth;
                }

                indexes.forEach((candleIndex, i) => {

                    const t = count === 1 ? 0 : (i / (count - 1)) * 2 - 1;
                    const x = cake.x + t * (arcWidth / 2);
                    const y = options.baseY + Math.abs(t) * options.curveDepth;

                    positions[candleIndex] = {
                        x: x,
                        y: y,
                        depth: options.depthBase + i / Math.max(1, count),
                        scale: scale
                    };

                });

            }

            /*
             * 십의 자리(긴 초)는 뒤쪽에 넓게 부채꼴로,
             * 일의 자리(짧은 초)는 앞쪽에 조금 더
             * 아늑하게 모아 배치합니다.
             */

            layoutArc(longIndexes, {
                baseY: surfaceY - 5 * scale,
                spacing: 46 * scale,
                maxWidth: upperWidth * 0.74,
                curveDepth: 9 * scale,
                depthBase: 0
            });

            layoutArc(shortIndexes, {
                baseY: surfaceY + 21 * scale,
                spacing: 40 * scale,
                maxWidth: upperWidth * 0.6,
                curveDepth: 7 * scale,
                depthBase: 1
            });

            return positions;

        }


        /* ============================================================
           둥근 사각형
        ============================================================ */

        function roundRect(
            context,
            x,
            y,
            w,
            h,
            r
        ) {

            const radius =
                Math.min(
                    r,
                    w / 2,
                    h / 2
                );


            context.beginPath();


            context.moveTo(
                x + radius,
                y
            );


            context.arcTo(
                x + w,
                y,
                x + w,
                y + h,
                radius
            );


            context.arcTo(
                x + w,
                y + h,
                x,
                y + h,
                radius
            );


            context.arcTo(
                x,
                y + h,
                x,
                y,
                radius
            );


            context.arcTo(
                x,
                y,
                x + w,
                y,
                radius
            );


            context.closePath();

        }

            body.addColorStop(1, colors.bodyBottom);

            ctx.fillStyle = body;
            roundRect(ctx, left, tierTop, cake.width, tierHeight, 26);
            ctx.fill();

            /*
             * 원통형 입체감을 위한 좌우 음영입니다.

            const shade = ctx.createLinearGradient(left, 0, left + cake.width, 0);

            shade.addColorStop(0.16, "rgba(20,10,15,0)");
            shade.addColorStop(0.82, "rgba(20,10,15,0)");

            ctx.fillStyle = shade;
            roundRect(ctx, left + 1, tierTop + 1, cake.width - 2, tierHeight - 2, 25);

            ctx.fillStyle = body;
            roundRect(ctx, left, top + 18, upperWidth, upperHeight, 24);

            shade.addColorStop(0.84, "rgba(20,10,15,0)");

            roundRect(ctx, left + 1, top + 19, upperWidth - 2, upperHeight - 2, 23);

        /* ============================================================
           크림 드립
        ============================================================ */

        function drawFrostingDrips(cake, colors) {

            const upperWidth = cake.width * 0.82;
            const left = cake.x - upperWidth / 2;
            const upperHeight = cake.height * 0.43;
            const bottom = cake.bottom - cake.height * 0.38;
            const top = bottom - upperHeight;

            const frostingTop = top + 38;
            const restY = frostingTop + 13;

            const dripCount = 6;
            const dripWidth = upperWidth / dripCount;
            const dripDepths = [15, 22, 13, 24, 14, 20];

            ctx.fillStyle = colors.cream;
            ctx.beginPath();
            ctx.moveTo(left, frostingTop);
            ctx.lineTo(left, restY);

            for (let i = 0; i < dripCount; i++) {

                const x0 = left + i * dripWidth;
                const xMid = x0 + dripWidth / 2;
                const x1 = x0 + dripWidth;
                const depth = restY + dripDepths[i % dripDepths.length];

                ctx.bezierCurveTo(
                    x0 + dripWidth * 0.2, restY + 2,
                    xMid - dripWidth * 0.15, depth,
                    xMid, depth
                );

                ctx.bezierCurveTo(
                    xMid + dripWidth * 0.15, depth,
                    x1 - dripWidth * 0.2, restY + 2,
                    x1, restY
                );

            }

            ctx.lineTo(left + upperWidth, frostingTop);
            ctx.closePath();
            ctx.fill();

            /*
             * 크림 위쪽의 부드러운 광택입니다.
             */

            ctx.strokeStyle = "rgba(255,255,255,0.7)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(left + upperWidth * 0.06, frostingTop + 3);
            ctx.quadraticCurveTo(cake.x, frostingTop - 2, left + upperWidth * 0.94, frostingTop + 3);
            ctx.stroke();

        }


        /* ============================================================
           하단 크림 띠
        ============================================================ */

        function drawLowerFrosting(cake, colors) {

            const left = cake.x - cake.width / 2;
            const bandTop = cake.bottom - cake.height * 0.46;
            const restY = bandTop + 10;

            const dripCount = 5;
            const dripWidth = cake.width / dripCount;
            const dripDepths = [8, 12, 7, 13, 9];

            ctx.fillStyle = colors.cream;
            ctx.beginPath();
            ctx.moveTo(left, bandTop);
            ctx.lineTo(left, restY);

            for (let i = 0; i < dripCount; i++) {

                const x0 = left + i * dripWidth;
                const xMid = x0 + dripWidth / 2;
                const x1 = x0 + dripWidth;
                const depth = restY + dripDepths[i % dripDepths.length];

                ctx.bezierCurveTo(
                    x0 + dripWidth * 0.2, restY + 1,
                    xMid - dripWidth * 0.15, depth,
                    xMid, depth
                );

                ctx.bezierCurveTo(
                    xMid + dripWidth * 0.15, depth,
                    x1 - dripWidth * 0.2, restY + 1,
                    x1, restY
                );

            }

            ctx.lineTo(left + cake.width, bandTop);
            ctx.closePath();
            ctx.fill();

            /*
             * 이음선 아래의 파이핑 도트입니다.
             */

            const dotCount = 13;

            for (let i = 0; i < dotCount; i++) {

                const x = left + 20 + i * ((cake.width - 40) / (dotCount - 1));
                const y = restY + 8;

                const gradient = ctx.createRadialGradient(x - 2, y - 3, 1, x, y, 8);
                gradient.addColorStop(0, "#ffffff");

                ctx.beginPath();
                ctx.arc(x, y, 6.5, 0, Math.PI * 2);

        /* ============================================================
           딸기 케이크 장식
        ============================================================ */

        function drawStrawberryDecoration(cake) {

            const upperWidth = cake.width * 0.82;
            const top = cake.bottom - cake.height + cake.height * 0.57;

            const berries = [
                [-0.32, 2, 15],
                [-0.13, -4, 17],
                [0.06, 3, 18],
                [0.24, -4, 16],
                [0.40, 3, 14]
            ];

            berries.forEach(item => {

                const x = cake.x + upperWidth * item[0];
                const y = top + item[1];
                const r = item[2];

                /*
                 * 딸기 그림자
                 */

                ctx.fillStyle = "rgba(90,10,30,0.18)";
                ctx.beginPath();
                ctx.ellipse(x, y + 4, r * 0.95, r * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                /*
                 * 딸기 본체
                 */

                const berry = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, 1, x, y, r);
                berry.addColorStop(0, "#ffc1cd");
                berry.addColorStop(0.42, "#ff5075");
                berry.addColorStop(1, "#c21f49");

                ctx.fillStyle = berry;
                ctx.beginPath();
                ctx.ellipse(x, y, r, r * 1.12, 0, 0, Math.PI * 2);
                ctx.fill();

                /*
                 * 씨앗은 나선형으로 자연스럽게 배치합니다.
                 */

                ctx.fillStyle = "#ffe58a";

                for (let i = 0; i < 9; i++) {

                    const angle = i * 0.9 - 0.4;
                    const radiusFactor = 0.3 + (i % 3) * 0.16;
                    const sx = x + Math.cos(angle) * r * radiusFactor;
                    const sy = y + Math.sin(angle) * r * (radiusFactor + 0.18) + r * 0.12;

                    ctx.beginPath();
                    ctx.ellipse(sx, sy, 1.3, 2.1, angle, 0, Math.PI * 2);
                    ctx.fill();

                }

                /*
                 * 광택
                 */

                ctx.fillStyle = "rgba(255,255,255,0.55)";
                ctx.beginPath();
                ctx.ellipse(x - r * 0.32, y - r * 0.4, r * 0.22, r * 0.32, -0.4, 0, Math.PI * 2);
                ctx.fill();

                /*
                 * 잎
                 */

                ctx.fillStyle = "#5fa356";
                ctx.beginPath();
                ctx.ellipse(x - 6, y - r + 2, 5.5, 9, -0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + 6, y - r + 2, 5.5, 9, 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x, y - r, 4.5, 7, 0, 0, Math.PI * 2);
                ctx.fill();

            });

            /*
             * 마무리로 얇은 딸기 글레이즈 드리즐을 더합니다.
             */

            ctx.strokeStyle = "rgba(255,90,130,0.55)";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cake.x - cake.width * 0.36, cake.bottom - 28);

            for (let i = 1; i <= 6; i++) {

                const x = cake.x - cake.width * 0.36 + i * (cake.width * 0.72) / 6;
                const y = cake.bottom - 28 + Math.sin(i * 1.1) * 3;

                ctx.lineTo(x, y);

            }

            ctx.stroke();

        }


        /* ============================================================

        /* ============================================================
           촛불 하나 그리기
        ============================================================ */

        function drawCandle(
            candle,
            position,
            time
        ) {

            const scale =
                position.scale ||
                1;


            const heightCandle =
                (
                    candle.type ===
                    "long"
                        ? 76
                        : 45
                ) *
                scale;


            const widthCandle =
                14 *
                scale;


            const x =
                position.x -
                widthCandle / 2;


            const y =
                position.y -
                heightCandle;


            /*
             * 초 그림자
             */

            ctx.fillStyle =
                "rgba(50,10,30,0.2)";


            ctx.beginPath();


            ctx.ellipse(
                position.x,
                position.y,
                widthCandle,
                4 * scale,
                0,
                0,
                Math.PI * 2
            );


            ctx.fill();


            /*
             * 초 몸체
             */

            const candleGradient =
                ctx.createLinearGradient(
                    x,
                    0,
                    x + widthCandle,
                    0
                );


            candleGradient.addColorStop(
                0,
                "#a94e7d"
            );


            candleGradient.addColorStop(
                0.2,
                "#f083ad"
            );


            candleGradient.addColorStop(
                0.5,
                "#fff5fa"
            );


            candleGradient.addColorStop(
                0.78,
                "#ee82ae"
            );


            candleGradient.addColorStop(
                1,
                "#9d4874"
            );


            ctx.fillStyle =
                candleGradient;


            roundRect(
                ctx,
                x,
                y,
                widthCandle,
                heightCandle,
                5 * scale
            );


            ctx.fill();


            /*
             * 사선 줄무늬
             */

            ctx.save();


            roundRect(
                ctx,
                x,
                y,
                widthCandle,
                heightCandle,
                5 * scale
            );


            ctx.clip();


            ctx.strokeStyle =
                "rgba(255,105,165,0.42)";


            ctx.lineWidth =
                3 * scale;


            for (
                let i = -2;
                i < heightCandle / 14 + 2;
                i++
            ) {

                ctx.beginPath();


                ctx.moveTo(
                    x - 5,
                    y +
                    i * 14
                );


                ctx.lineTo(
                    x +
                    widthCandle +
                    5,
                    y +
                    i * 14 -
                    8
                );


                ctx.stroke();

            }


            ctx.restore();


            /*
             * 심지
             */

            ctx.strokeStyle =
                "#34211e";


            ctx.lineWidth =
                Math.max(
                    1,
                    1.5 * scale
                );


            ctx.beginPath();


            ctx.moveTo(
                position.x,
                y
            );


            ctx.lineTo(
                position.x,
                y -
                7 * scale
            );


            ctx.stroke();


            /*
             * 불꽃
             */

            if (
                !candle.blown
            ) {

                const flicker =
                    Math.sin(
                        time * 0.016 +
                        candle.flame
                    ) *
                    2.5 *
                    scale;


                const flameX =
                    position.x +
                    flicker;


                const flameY =
                    y -
                    17 * scale;


                /*
                 * 불빛
                 */

                const glow =
                    ctx.createRadialGradient(
                        flameX,
                        flameY,
                        1,
                        flameX,
                        flameY,
                        25 * scale
                    );


                glow.addColorStop(
                    0,
                    "rgba(255,255,230,0.9)"
                );


                glow.addColorStop(
                    0.25,
                    "rgba(255,220,100,0.65)"
                );


                glow.addColorStop(
                    1,
                    "rgba(255,120,20,0)"
                );


                ctx.fillStyle =
                    glow;


                ctx.beginPath();


                ctx.arc(
                    flameX,
                    flameY,
                    25 * scale,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                /*
                 * 실제 불꽃
                 */

                ctx.save();


                ctx.translate(
                    flameX,
                    flameY
                );


                ctx.scale(
                    scale,
                    scale
                );


                const flame =
                    ctx.createLinearGradient(
                        0,
                        -18,
                        0,
                        10
                    );


                flame.addColorStop(
                    0,
                    "#ffffff"
                );


                flame.addColorStop(
                    0.25,
                    "#fff7a3"
                );


                flame.addColorStop(
                    0.65,
                    "#ffad32"
                );


                flame.addColorStop(
                    1,
                    "#ff5a18"
                );


                ctx.fillStyle =
                    flame;


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -18
                );


                ctx.bezierCurveTo(
                    11,
                    -8,
                    9,
                    5,
                    0,
                    10
                );


                ctx.bezierCurveTo(
                    -9,
                    5,
                    -8,
                    -8,
                    0,
                    -18
                );


                ctx.closePath();


                ctx.fill();


                /*
                 * 불꽃 중심
                 */

                ctx.fillStyle =
                    "#fffde1";


                ctx.beginPath();


                ctx.ellipse(
                    0,
                    1,
                    3,
                    7,
                    0,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();

            }

        }

        /* ============================================================
           파티클 업데이트
        ============================================================ */

        function updateParticles() {

            for (
                let i =
                    particles.length - 1;
                i >= 0;
                i--
            ) {

                const p =
                    particles[i];


                p.x +=
                    p.vx;


                p.y +=
                    p.vy;


                p.vy +=
                    p.gravity;


                p.life -=
                    0.025;


                if (
                    p.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );


                    continue;

                }


                ctx.globalAlpha =
                    p.life;


                ctx.fillStyle =
                    "#ffd7e9";


                ctx.beginPath();


                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }


            ctx.globalAlpha = 1;

        }


        /* ============================================================
           연기 업데이트
        ============================================================ */

        function updateSmoke() {

            for (
                let i =
                    smokeParticles.length - 1;
                i >= 0;
                i--
            ) {

                const smoke =
                    smokeParticles[i];


                smoke.x +=
                    smoke.vx;


                smoke.y +=
                    smoke.vy;


                smoke.vx +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.025;


                smoke.size +=
                    0.06;


                smoke.life -=
                    0.018;


                if (
                    smoke.life <= 0
                ) {

                    smokeParticles.splice(
                        i,
                        1
                    );


                    continue;

                }


                ctx.globalAlpha =
                    smoke.life *
                    0.35;


                ctx.fillStyle =
                    "#d5d8df";


                ctx.beginPath();


                ctx.arc(
                    smoke.x,
                    smoke.y,
                    smoke.size,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }


            ctx.globalAlpha = 1;

        }


        /* ============================================================
           컨페티
        ============================================================ */

        function updateConfetti() {

            for (
                let i =
                    confetti.length - 1;
                i >= 0;
                i--
            ) {

                const c =
                    confetti[i];


                c.x +=
                    c.vx;


                c.y +=
                    c.vy;


                c.vy +=
                    0.025;


                c.rotation +=
                    c.rotationSpeed;


                if (
                    c.y >
                    height + 40
                ) {

                    c.x =
                        Math.random() *
                        width;


                    c.y =
                        -20;


                    c.vy =
                        1 +
                        Math.random() *
                        3;

                }


                ctx.save();


                ctx.translate(
                    c.x,
                    c.y
                );


                ctx.rotate(
                    c.rotation
                );


                ctx.globalAlpha =
                    c.life;


                ctx.fillStyle =
                    `hsl(${c.hue}, 85%, 70%)`;


                ctx.fillRect(
                    -c.size / 2,
                    -c.size / 2,
                    c.size,
                    c.size * 0.55
                );


                ctx.restore();

            }


            ctx.globalAlpha = 1;

        }


        /* ============================================================

        ============================================================ */

        let audioContext =
            null;


        let masterGain =
            null;


        let musicGain =
            null;


        let effectGain =
            null;


        let musicPlaying =

        let musicTimer =

        /*
         * 핵심 수정:
         *
         * 음악 세대 번호입니다.
         *
         * 음악을 다시 시작할 때마다 번호를 증가시켜
         * 이전에 예약된 음악이 현재 음악으로 취급되지
         * 않도록 합니다.
         */

        let musicGeneration =
            0;


        /*
         * 현재 음악에서 생성한 oscillator를
         * 전부 추적합니다.
         */

        let activeMusicSources =
            new Set();


        const APP_VOLUME =
            0.42;


        const NOTE = {

            C4: 261.63,

            F4: 349.23,

            G4: 392.00,

            [NOTE.A4, 0.58],

            [NOTE.G4, 0.58],

            [NOTE.D5, 0.58],

            [NOTE.C5, 0.90],


            [NOTE.G4, 0.32],

            [NOTE.C5, 0.58],
