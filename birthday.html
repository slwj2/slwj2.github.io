<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 축하합니다 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;
            background: #080b14;
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .setup {
            position: relative;
            z-index: 10;
            width: min(92vw, 520px);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(18, 22, 36, 0.92);
            backdrop-filter: blur(18px);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .setup.hidden {
            display: none;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 26px;
            text-align: center;
            color: #aeb6ca;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #cbd2e3;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            background: #111626;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            border-color: #ff8fba;
            box-shadow: 0 0 0 3px rgba(255, 143, 186, 0.1);
        }

        .cakes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
        }

        .cake {
            min-height: 72px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            background: #111626;
            color: #dce1ef;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .cake span {
            display: block;
            margin-bottom: 4px;
            font-size: 25px;
        }

        .cake:hover {
            transform: translateY(-2px);
            background: #191e31;
        }

        .cake.selected {
            border-color: #ff8fb9;
            background: rgba(255, 143, 185, 0.13);
            box-shadow: 0 0 20px rgba(255, 143, 185, 0.1);
        }

        .start {
            width: 100%;
            height: 52px;
            margin-top: 25px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff79ae, #b978ff);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 100, 180, 0.25);
            transition: 0.2s ease;
        }

        .start:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .scene-ui {
            position: fixed;
            z-index: 5;
            inset: 0;
            pointer-events: none;
        }

        .birthday-title {
            position: absolute;
            top: 7%;
            width: 100%;
            text-align: center;
            font-size: clamp(28px, 6vw, 62px);
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 130, 190, 0.35);
        }

        .birthday-subtitle {
            position: absolute;
            top: calc(7% + clamp(40px, 7vw, 75px));
            width: 100%;
            text-align: center;
            color: #cbd1df;
            font-size: 14px;
        }

        .music-button {
            position: fixed;
            z-index: 20;
            right: 18px;
            top: 18px;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            background: rgba(20, 24, 40, 0.75);
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hint {
            position: fixed;
            z-index: 5;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .setup {
                padding: 23px;
            }

            .cakes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="setup" id="setup">
        <h1>🎂 생일 축하하기</h1>

        <div class="subtitle">
            이름과 케이크를 선택하고 생일을 시작해보세요.
        </div>

        <label for="name">이름</label>
        <input
            id="name"
            type="text"
            maxlength="20"
            placeholder="예: 홍길동"
        >

        <label>케이크</label>

        <div class="cakes">
            <button class="cake selected" data-cake="strawberry">
                <span>🍓</span>
                딸기
            </button>

            <button class="cake" data-cake="cream">
                <span>🍰</span>
                생크림
            </button>

            <button class="cake" data-cake="chocolate">
                <span>🍫</span>
                초콜릿
            </button>

            <button class="cake" data-cake="cheese">
                <span>🧀</span>
                치즈
            </button>
        </div>

        <label for="age">
            나이 / 초 개수
        </label>

        <input
            id="age"
            type="number"
            min="1"
            max="100"
            value="10"
            placeholder="나이를 입력하세요"
        >

        <button class="start" id="startButton">
            🎉 생일 시작하기
        </button>
    </div>

    <div class="scene-ui" id="sceneUI" style="display:none;">
        <div class="birthday-title" id="birthdayTitle"></div>

        <div class="birthday-subtitle">
            촛불을 클릭해서 꺼주세요 🕯️
        </div>

        <div class="hint">
            ✨ 촛불을 모두 끄면 축하가 시작됩니다 ✨
        </div>
    </div>

    <button
        class="music-button"
        id="musicButton"
        style="display:none;"
    >
        🔊
    </button>

    <script>
        "use strict";

        /* ============================================================
           Canvas 기본 설정
        ============================================================ */

        const canvas = document.getElementById("canvas");

        const ctx = canvas.getContext("2d", {
            alpha: false,
            desynchronized: true
        });

        let width = 0;
        let height = 0;
        let dpr = 1;

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();


        /* ============================================================
           UI
        ============================================================ */

        const setup = document.getElementById("setup");
        const sceneUI = document.getElementById("sceneUI");
        const birthdayTitle = document.getElementById("birthdayTitle");

        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");

        const startButton = document.getElementById("startButton");
        const musicButton = document.getElementById("musicButton");

        let selectedCake = "strawberry";
        let birthdayName = "친구";

        document.querySelectorAll(".cake").forEach(button => {
            button.addEventListener("click", () => {

                document.querySelectorAll(".cake").forEach(item => {
                    item.classList.remove("selected");
                });

                button.classList.add("selected");

                selectedCake = button.dataset.cake;
            });
        });


        /* ============================================================
           케이크 / 촛불 데이터
        ============================================================ */

        let candles = [];

        let cakeHoles = [];

        function createCandles(age) {

            candles = [];

            const longCount = Math.floor(age / 10);
            const shortCount = age % 10;

            for (let i = 0; i < longCount; i++) {
                candles.push({
                    type: "long",
                    blown: false,
                    flame: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i < shortCount; i++) {
                candles.push({
                    type: "short",
                    blown: false,
                    flame: Math.random() * Math.PI * 2
                });
            }
        }


        function createCheeseHoles() {

            cakeHoles = [];

            for (let i = 0; i < 16; i++) {

                cakeHoles.push({
                    x: Math.random(),
                    y: Math.random(),
                    r: 2 + Math.random() * 4
                });
            }
        }


        createCheeseHoles();


        /* ============================================================
           파티클
        ============================================================ */

        let particles = [];

        let confetti = [];

        function createParticle(x, y, amount = 20) {

            for (let i = 0; i < amount; i++) {

                const angle = Math.random() * Math.PI * 2;

                const speed = 1 + Math.random() * 5;

                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    size: 1 + Math.random() * 3
                });
            }
        }


        function createConfetti(amount = 100) {

            for (let i = 0; i < amount; i++) {

                confetti.push({
                    x: Math.random() * width,
                    y: -Math.random() * height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: 1 + Math.random() * 4,
                    rotation: Math.random() * Math.PI,
                    rotationSpeed:
                        (Math.random() - 0.5) * 0.15,
                    size: 4 + Math.random() * 7,
                    life: 1
                });
            }
        }


        /* ============================================================
           케이크 색상
        ============================================================ */

        const cakeColors = {

            strawberry: {
                top: "#fff2f7",
                bottom: "#ff91b9",
                cream: "#fff8fb"
            },

            cream: {
                top: "#fff8e9",
                bottom: "#e8d4aa",
                cream: "#ffffff"
            },

            chocolate: {
                top: "#8a5138",
                bottom: "#4d2418",
                cream: "#f0d4bd"
            },

            cheese: {
                top: "#ffe987",
                bottom: "#d89b24",
                cream: "#fff1a8"
            }
        };


        /* ============================================================
           케이크 위치
        ============================================================ */

        function getCakeData() {

            const cakeWidth = Math.min(width * 0.68, 580);

            const cakeHeight = Math.min(height * 0.32, 260);

            const x = width / 2;

            const bottom = height * 0.76;

            return {
                x,
                width: cakeWidth,
                height: cakeHeight,
                bottom
            };
        }


        /* ============================================================
           촛불 위치 계산
        ============================================================ */

        function getCandlePositions() {

            const cake = getCakeData();

            const total = candles.length;

            const positions = [];

            const maxPerRow =
                Math.max(
                    5,
                    Math.min(12, Math.ceil(Math.sqrt(total * 2)))
                );

            for (let i = 0; i < total; i++) {

                const row = Math.floor(i / maxPerRow);

                const index = i % maxPerRow;

                const rowCount = Math.min(
                    maxPerRow,
                    total - row * maxPerRow
                );

                const spacing =
                    cake.width * 0.72 /
                    Math.max(rowCount - 1, 1);

                const centerOffset =
                    (rowCount - 1) * spacing / 2;

                positions.push({
                    x:
                        cake.x -
                        centerOffset +
                        index * spacing,

                    y:
                        cake.bottom -
                        cake.height * 0.72 -
                        row * 52
                });
            }

            return positions;
        }


        /* ============================================================
           케이크 그리기
        ============================================================ */

        function drawCake() {

            const cake = getCakeData();

            const colors = cakeColors[selectedCake];

            const left =
                cake.x - cake.width / 2;

            const top =
                cake.bottom - cake.height;

            /* 그림자 */

            ctx.save();

            ctx.fillStyle = "rgba(0,0,0,0.25)";

            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                cake.bottom + 12,
                cake.width * 0.46,
                20,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();


            /* 케이크 본체 */

            const gradient =
                ctx.createLinearGradient(
                    0,
                    top,
                    0,
                    cake.bottom
                );

            gradient.addColorStop(
                0,
                colors.top
            );

            gradient.addColorStop(
                1,
                colors.bottom
            );

            ctx.fillStyle = gradient;

            roundRect(
                ctx,
                left,
                top + 35,
                cake.width,
                cake.height * 0.65,
                22
            );

            ctx.fill();


            /* 크림 */

            ctx.fillStyle = colors.cream;

            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                top + 35,
                cake.width / 2,
                32,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* 크림 물결 */

            ctx.beginPath();

            for (let i = 0; i <= 30; i++) {

                const px =
                    left +
                    (cake.width / 30) * i;

                const py =
                    top + 60 +
                    Math.sin(i * 0.9) * 5;

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }

            ctx.lineTo(
                left + cake.width,
                top + 95
            );

            ctx.lineTo(
                left,
                top + 95
            );

            ctx.closePath();

            ctx.fill();


            /* 케이크 장식 */

            if (selectedCake === "strawberry") {

                for (let i = 0; i < 6; i++) {

                    const px =
                        left +
                        45 +
                        i *
                        ((cake.width - 90) / 5);

                    const py =
                        top + 20 +
                        Math.sin(i * 2) * 7;

                    ctx.fillStyle = "#ff527e";

                    ctx.beginPath();

                    ctx.arc(
                        px,
                        py,
                        9,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                    ctx.fillStyle = "#64b95c";

                    ctx.beginPath();

                    ctx.ellipse(
                        px,
                        py - 8,
                        4,
                        8,
                        -0.5,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }


            if (selectedCake === "chocolate") {

                ctx.fillStyle =
                    "rgba(255,255,255,0.12)";

                for (let i = 0; i < 7; i++) {

                    ctx.fillRect(
                        left + 30 + i * 70,
                        top + 75,
                        35,
                        5
                    );
                }
            }


            if (selectedCake === "cheese") {

                for (const hole of cakeHoles) {

                    const px =
                        left +
                        hole.x *
                        cake.width;

                    const py =
                        top +
                        45 +
                        hole.y *
                        cake.height *
                        0.45;

                    ctx.fillStyle =
                        "rgba(130,85,10,0.28)";

                    ctx.beginPath();

                    ctx.arc(
                        px,
                        py,
                        hole.r,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }
        }


        function roundRect(
            context,
            x,
            y,
            w,
            h,
            r
        ) {

            context.beginPath();

            context.moveTo(x + r, y);

            context.arcTo(
                x + w,
                y,
                x + w,
                y + h,
                r
            );

            context.arcTo(
                x + w,
                y + h,
                x,
                y + h,
                r
            );

            context.arcTo(
                x,
                y + h,
                x,
                y,
                r
            );

            context.arcTo(
                x,
                y,
                x + w,
                y,
                r
            );

            context.closePath();
        }


        /* ============================================================
           촛불 그리기
        ============================================================ */

        function drawCandles(time) {

            const positions =
                getCandlePositions();

            for (let i = 0; i < candles.length; i++) {

                const candle = candles[i];

                const position = positions[i];

                const candleHeight =
                    candle.type === "long"
                        ? 76
                        : 42;

                const candleWidth = 14;

                const x =
                    position.x -
                    candleWidth / 2;

                const y =
                    position.y -
                    candleHeight;


                /* 촛불 몸체 */

                const gradient =
                    ctx.createLinearGradient(
                        x,
                        y,
                        x + candleWidth,
                        y
                    );

                gradient.addColorStop(
                    0,
                    "#e9a2c1"
                );

                gradient.addColorStop(
                    0.5,
                    "#fff4fa"
                );

                gradient.addColorStop(
                    1,
                    "#d77ca5"
                );

                ctx.fillStyle = gradient;

                roundRect(
                    ctx,
                    x,
                    y,
                    candleWidth,
                    candleHeight,
                    6
                );

                ctx.fill();


                /* 심지 */

                ctx.strokeStyle =
                    "#34251f";

                ctx.lineWidth = 2;

                ctx.beginPath();

                ctx.moveTo(
                    position.x,
                    y
                );

                ctx.lineTo(
                    position.x,
                    y - 8
                );

                ctx.stroke();


                /* 불꽃 */

                if (!candle.blown) {

                    const flicker =
                        Math.sin(
                            time * 0.018 +
                            candle.flame
                        ) * 2;

                    const flameX =
                        position.x + flicker;

                    const flameY =
                        y - 15;

                    const flameGradient =
                        ctx.createRadialGradient(
                            flameX,
                            flameY,
                            1,
                            flameX,
                            flameY,
                            15
                        );

                    flameGradient.addColorStop(
                        0,
                        "rgba(255,255,255,1)"
                    );

                    flameGradient.addColorStop(
                        0.2,
                        "rgba(255,230,120,0.95)"
                    );

                    flameGradient.addColorStop(
                        0.55,
                        "rgba(255,145,45,0.65)"
                    );

                    flameGradient.addColorStop(
                        1,
                        "rgba(255,100,20,0)"
                    );

                    ctx.fillStyle =
                        flameGradient;

                    ctx.beginPath();

                    ctx.arc(
                        flameX,
                        flameY,
                        15,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();


                    ctx.fillStyle =
                        "#fff6b0";

                    ctx.beginPath();

                    ctx.ellipse(
                        flameX,
                        flameY,
                        5,
                        10,
                        0,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }
        }


        /* ============================================================
           배경
        ============================================================ */

        function drawBackground(time) {

            const gradient =
                ctx.createRadialGradient(
                    width / 2,
                    height * 0.55,
                    20,
                    width / 2,
                    height * 0.55,
                    Math.max(width, height)
                );

            gradient.addColorStop(
                0,
                "#222642"
            );

            gradient.addColorStop(
                0.5,
                "#111526"
            );

            gradient.addColorStop(
                1,
                "#070910"
            );

            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /* 작은 별 */

            ctx.fillStyle =
                "rgba(255,255,255,0.45)";

            for (let i = 0; i < 55; i++) {

                const x =
                    (i * 137.31) %
                    width;

                const y =
                    (i * 79.17) %
                    (height * 0.65);

                const alpha =
                    0.25 +
                    Math.sin(
                        time * 0.001 + i
                    ) * 0.2;

                ctx.globalAlpha =
                    Math.max(alpha, 0.05);

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.globalAlpha = 1;
        }


        /* ============================================================
           파티클
        ============================================================ */

        function updateParticles() {

            for (
                let i = particles.length - 1;
                i >= 0;
                i--
            ) {

                const p = particles[i];

                p.x += p.vx;

                p.y += p.vy;

                p.vy += 0.06;

                p.life -= 0.025;

                if (p.life <= 0) {

                    particles.splice(i, 1);

                    continue;
                }

                ctx.globalAlpha =
                    p.life;

                ctx.fillStyle =
                    "#ffd9eb";

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.globalAlpha = 1;
        }


        /* ============================================================
           컨페티
        ============================================================ */

        function updateConfetti() {

            for (
                let i = confetti.length - 1;
                i >= 0;
                i--
            ) {

                const c = confetti[i];

                c.x += c.vx;

                c.y += c.vy;

                c.vy += 0.025;

                c.rotation +=
                    c.rotationSpeed;

                if (c.y > height + 30) {

                    confetti.splice(i, 1);

                    continue;
                }

                ctx.save();

                ctx.translate(
                    c.x,
                    c.y
                );

                ctx.rotate(
                    c.rotation
                );

                ctx.globalAlpha =
                    c.life;

                ctx.fillStyle =
                    `hsl(${(i * 47) % 360}, 85%, 70%)`;

                ctx.fillRect(
                    -c.size / 2,
                    -c.size / 2,
                    c.size,
                    c.size * 0.55
                );

                ctx.restore();
            }

            ctx.globalAlpha = 1;
        }


        /* ============================================================
           Web Audio
           
           오르골 / 피아노 사운드 엔진
           ============================================================ */

        let audioContext = null;

        let masterGain = null;

        let musicGain = null;

        let effectGain = null;

        let musicPlaying = false;

        let musicTimer = null;

        let musicStartTime = 0;


        /*
         * 브라우저는 Windows/Android 등의
         * 실제 시스템 마스터 볼륨을 읽을 수 없습니다.
         *
         * 따라서 여기서는 Web Audio 내부 음량을
         * 안전한 수준으로 설정하고,
         * 최종 음량은 OS/휴대폰의 볼륨을 따릅니다.
         */

        const APP_VOLUME = 0.42;


        /* ============================================================
           음계
        ============================================================ */

        const NOTE = {

            C4: 261.63,

            D4: 293.66,

            E4: 329.63,

            F4: 349.23,

            G4: 392.00,

            A4: 440.00,

            Bb4: 466.16,

            B4: 493.88,

            C5: 523.25,

            D5: 587.33,

            E5: 659.25,

            F5: 698.46,

            G5: 783.99
        };


        /* ============================================================
           Happy Birthday 멜로디
        ============================================================ */

        const birthdayMelody = [

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.A4, 0.58],
            [NOTE.G4, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.B4, 0.90],

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.A4, 0.58],
            [NOTE.G4, 0.58],
            [NOTE.D5, 0.58],
            [NOTE.C5, 0.90],

            [NOTE.G4, 0.32],
            [NOTE.G4, 0.32],
            [NOTE.G5, 0.58],
            [NOTE.E5, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.B4, 0.58],
            [NOTE.A4, 0.90],

            [NOTE.F5, 0.32],
            [NOTE.F5, 0.32],
            [NOTE.E5, 0.58],
            [NOTE.C5, 0.58],
            [NOTE.D5, 0.58],
            [NOTE.C5, 1.05]
        ];


        /* ============================================================
           코드 진행
        ============================================================ */

        const chords = [

            [NOTE.C4, NOTE.E4, NOTE.G4],

            [NOTE.G4, NOTE.B4, NOTE.D5],

            [NOTE.C4, NOTE.E4, NOTE.G4],

            [NOTE.F4, NOTE.A4, NOTE.C5]
        ];


        /* ============================================================
           Audio 초기화
        ============================================================ */

        function initAudio() {

            if (audioContext) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {
                    audioContext.resume();
                }

                return;
            }

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();

            musicGain =
                audioContext.createGain();

            effectGain =
                audioContext.createGain();


            masterGain.gain.value =
                APP_VOLUME;

            musicGain.gain.value =
                0.58;

            effectGain.gain.value =
                0.75;


            musicGain.connect(
                masterGain
            );

            effectGain.connect(
                masterGain
            );

            masterGain.connect(
                audioContext.destination
            );
        }


        /* ============================================================
           ADSR Envelope
           
           Attack
           Decay
           Sustain
           Release
        ============================================================ */

        function applyADSR(
            gainNode,
            startTime,
            duration,
            peak = 0.12,
            attack = 0.015,
            decay = 0.18,
            sustain = 0.42,
            release = 0.45
        ) {

            const gain =
                gainNode.gain;

            const attackEnd =
                startTime + attack;

            const decayEnd =
                attackEnd + decay;

            const releaseStart =
                Math.max(
                    decayEnd,
                    startTime +
                    duration -
                    release
                );

            const releaseEnd =
                releaseStart +
                release;


            gain.cancelScheduledValues(
                startTime
            );

            gain.setValueAtTime(
                0.0001,
                startTime
            );

            /* Attack */

            gain.linearRampToValueAtTime(
                peak,
                attackEnd
            );

            /* Decay */

            gain.linearRampToValueAtTime(
                peak * sustain,
                decayEnd
            );

            /* Sustain */

            gain.setValueAtTime(
                peak * sustain,
                releaseStart
            );

            /* Release */

            gain.exponentialRampToValueAtTime(
                0.0001,
                releaseEnd
            );
        }


        /* ============================================================
           피아노 / 오르골 한 음
        ============================================================ */

        function playPianoNote(
            frequency,
            startTime,
            duration,
            volume = 0.12
        ) {

            if (!audioContext) {
                return;
            }


            /* --------------------------------------------------------
               기본음
            -------------------------------------------------------- */

            const fundamental =
                audioContext.createOscillator();

            fundamental.type =
                "triangle";

            fundamental.frequency.setValueAtTime(
                frequency,
                startTime
            );


            /* --------------------------------------------------------
               배음 2
            -------------------------------------------------------- */

            const harmonic2 =
                audioContext.createOscillator();

            harmonic2.type =
                "sine";

            harmonic2.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            /* --------------------------------------------------------
               배음 3
            -------------------------------------------------------- */

            const harmonic3 =
                audioContext.createOscillator();

            harmonic3.type =
                "sine";

            harmonic3.frequency.setValueAtTime(
                frequency * 3,
                startTime
            );


            /* --------------------------------------------------------
               배음 4
            -------------------------------------------------------- */

            const harmonic4 =
                audioContext.createOscillator();

            harmonic4.type =
                "sine";

            harmonic4.frequency.setValueAtTime(
                frequency * 4,
                startTime
            );


            /* --------------------------------------------------------
               각각의 음량
            -------------------------------------------------------- */

            const fundamentalGain =
                audioContext.createGain();

            const harmonic2Gain =
                audioContext.createGain();

            const harmonic3Gain =
                audioContext.createGain();

            const harmonic4Gain =
                audioContext.createGain();


            fundamentalGain.gain.value =
                0.72;

            harmonic2Gain.gain.value =
                0.19;

            harmonic3Gain.gain.value =
                0.07;

            harmonic4Gain.gain.value =
                0.025;


            /* --------------------------------------------------------
               피아노 전체 ADSR
            -------------------------------------------------------- */

            const noteGain =
                audioContext.createGain();

            applyADSR(
                noteGain,
                startTime,
                duration,
                volume,
                0.012,
                0.12,
                0.32,
                0.55
            );


            fundamental.connect(
                fundamentalGain
            );

            harmonic2.connect(
                harmonic2Gain
            );

            harmonic3.connect(
                harmonic3Gain
            );

            harmonic4.connect(
                harmonic4Gain
            );


            fundamentalGain.connect(
                noteGain
            );

            harmonic2Gain.connect(
                noteGain
            );

            harmonic3Gain.connect(
                noteGain
            );

            harmonic4Gain.connect(
                noteGain
            );


            noteGain.connect(
                musicGain
            );


            fundamental.start(
                startTime
            );

            harmonic2.start(
                startTime
            );

            harmonic3.start(
                startTime
            );

            harmonic4.start(
                startTime
            );


            const stopTime =
                startTime +
                duration +
                0.7;


            fundamental.stop(
                stopTime
            );

            harmonic2.stop(
                stopTime
            );

            harmonic3.stop(
                stopTime
            );

            harmonic4.stop(
                stopTime
            );
        }


        /* ============================================================
           오르골 종소리
           
           높은 배음이 아주 짧게 반짝이는 구조
        ============================================================ */

        function playBell(
            frequency,
            startTime,
            volume = 0.035
        ) {

            if (!audioContext) {
                return;
            }


            const bell =
                audioContext.createOscillator();

            bell.type =
                "sine";

            bell.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const bell2 =
                audioContext.createOscillator();

            bell2.type =
                "sine";

            bell2.frequency.setValueAtTime(
                frequency * 3,
                startTime
            );


            const bellGain =
                audioContext.createGain();


            bellGain.gain.setValueAtTime(
                0.0001,
                startTime
            );

            bellGain.gain.exponentialRampToValueAtTime(
                volume,
                startTime + 0.008
            );

            bellGain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime + 1.15
            );


            bell.connect(
                bellGain
            );

            bell2.connect(
                bellGain
            );

            bellGain.connect(
                musicGain
            );


            bell.start(
                startTime
            );

            bell2.start(
                startTime
            );


            bell.stop(
                startTime + 1.2
            );

            bell2.stop(
                startTime + 1.2
            );
        }


        /* ============================================================
           베이스
        ============================================================ */

        function playBass(
            frequency,
            startTime,
            duration
        ) {

            if (!audioContext) {
                return;
            }


            const oscillator =
                audioContext.createOscillator();

            oscillator.type =
                "sine";

            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );


            const gain =
                audioContext.createGain();


            applyADSR(
                gain,
                startTime,
                duration,
                0.055,
                0.025,
                0.18,
                0.22,
                0.5
            );


            oscillator.connect(
                gain
            );

            gain.connect(
                musicGain
            );


            oscillator.start(
                startTime
            );

            oscillator.stop(
                startTime +
                duration +
                0.7
            );
        }


        /* ============================================================
           곡 한 번 스케줄
        ============================================================ */

        function scheduleBirthdaySong() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime + 0.08;

            let cursor = now;


            const beatLength = 0.31;


            birthdayMelody.forEach(
                ([frequency, duration], index) => {

                    const noteDuration =
                        duration * 1.02;

                    /* 메인 피아노 */

                    playPianoNote(
                        frequency,
                        cursor,
                        noteDuration,
                        0.115
                    );


                    /* 반짝이는 종소리 */

                    playBell(
                        frequency,
                        cursor,
                        0.022
                    );


                    /*
                     * 특정 음에서는
                     * 살짝 아래쪽에 보조음을 추가하여
                     * 오르골의 울림을 만듭니다.
                     */

                    if (index % 3 === 0) {

                        playPianoNote(
                            frequency / 2,
                            cursor,
                            noteDuration * 0.9,
                            0.025
                        );
                    }


                    cursor +=
                        duration +
                        beatLength * 0.06;
                }
            );


            /* --------------------------------------------------------
               베이스
            -------------------------------------------------------- */

            const phraseLength =
                3.9;

            const bassNotes = [

                NOTE.C4 / 2,
                NOTE.G4 / 2,
                NOTE.C4 / 2,
                NOTE.F4 / 2
            ];


            for (let i = 0; i < 4; i++) {

                playBass(
                    bassNotes[i],
                    now + i * phraseLength,
                    phraseLength * 0.82
                );
            }


            return cursor - now;
        }


        /* ============================================================
           음악 시작
        ============================================================ */

        function startMusic() {

            initAudio();

            if (musicPlaying) {
                return;
            }

            musicPlaying = true;

            musicButton.textContent =
                "🔊";


            function loop() {

                if (!musicPlaying) {
                    return;
                }

                const duration =
                    scheduleBirthdaySong();


                musicTimer =
                    setTimeout(
                        loop,
                        Math.max(
                            1000,
                            duration * 1000 - 100
                        )
                    );
            }


            loop();
        }


        /* ============================================================
           음악 정지
        ============================================================ */

        function stopMusic() {

            musicPlaying = false;

            if (musicTimer) {

                clearTimeout(
                    musicTimer
                );

                musicTimer = null;
            }

            musicButton.textContent =
                "🔇";
        }


        /* ============================================================
           음악 버튼
        ============================================================ */

        musicButton.addEventListener(
            "click",
            () => {

                if (musicPlaying) {
                    stopMusic();
                } else {
                    startMusic();
                }
            }
        );


        /* ============================================================
           촛불 끄기 효과음
        ============================================================ */

        function playExtinguishSound() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();

            oscillator.type =
                "triangle";

            oscillator.frequency.setValueAtTime(
                520,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                150,
                now + 0.18
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.16,
                now + 0.01
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.22
            );


            oscillator.connect(
                gain
            );

            gain.connect(
                effectGain
            );


            oscillator.start(
                now
            );

            oscillator.stop(
                now + 0.25
            );
        }


        /* ============================================================
           전체 촛불 완료 효과음
        ============================================================ */

        function playCelebrationSound() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime;


            const notes = [

                NOTE.C5,
                NOTE.E5,
                NOTE.G5,
                NOTE.C5 * 2
            ];


            notes.forEach(
                (frequency, index) => {

                    playBell(
                        frequency,
                        now + index * 0.13,
                        0.07
                    );
                }
            );
        }


        /* ============================================================
           촛불 클릭 판정
        ============================================================ */

        function handlePointer(
            clientX,
            clientY
        ) {

            if (!musicPlaying &&
                audioContext) {

                audioContext.resume();
            }


            const rect =
                canvas.getBoundingClientRect();

            const x =
                clientX - rect.left;

            const y =
                clientY - rect.top;


            const positions =
                getCandlePositions();


            for (
                let i = 0;
                i < candles.length;
                i++
            ) {

                const candle =
                    candles[i];

                if (candle.blown) {
                    continue;
                }


                const position =
                    positions[i];


                const candleHeight =
                    candle.type === "long"
                        ? 76
                        : 42;


                const candleWidth = 28;


                if (
                    x >=
                    position.x -
                    candleWidth / 2 &&

                    x <=
                    position.x +
                    candleWidth / 2 &&

                    y >=
                    position.y -
                    candleHeight -
                    25 &&

                    y <=
                    position.y + 10
                ) {

                    candle.blown = true;


                    createParticle(
                        position.x,
                        position.y -
                        candleHeight,
                        25
                    );


                    playExtinguishSound();


                    const remaining =
                        candles.filter(
                            item =>
                                !item.blown
                        ).length;


                    if (remaining === 0) {

                        setTimeout(
                            () => {

                                createConfetti(
                                    150
                                );

                                playCelebrationSound();

                            },
                            350
                        );
                    }


                    break;
                }
            }
        }


        canvas.addEventListener(
            "click",
            event => {

                handlePointer(
                    event.clientX,
                    event.clientY
                );
            }
        );


        canvas.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches &&
                    event.touches.length
                ) {

                    const touch =
                        event.touches[0];

                    handlePointer(
                        touch.clientX,
                        touch.clientY
                    );
                }

                event.preventDefault();

            },
            {
                passive: false
            }
        );


        /* ============================================================
           시작 버튼
        ============================================================ */

        startButton.addEventListener(
            "click",
            () => {

                birthdayName =
                    nameInput.value.trim();


                if (!birthdayName) {

                    nameInput.focus();

                    return;
                }


                let age =
                    Number(
                        ageInput.value
                    );


                if (
                    !Number.isFinite(age) ||
                    age < 1
                ) {

                    age = 1;
                }


                age =
                    Math.min(
                        Math.floor(age),
                        100
                    );


                createCandles(age);


                birthdayTitle.textContent =
                    `🎂 ${birthdayName}님, 생일 축하합니다!`;


                setup.classList.add(
                    "hidden"
                );


                sceneUI.style.display =
                    "block";


                musicButton.style.display =
                    "block";


                initAudio();

                startMusic();
            }
        );


        /* ============================================================
           렌더링
        ============================================================ */

        function render(time) {

            drawBackground(time);

            if (
                setup.classList.contains(
                    "hidden"
                )
            ) {

                drawCake();

                drawCandles(time);

                updateParticles();

                updateConfetti();
            }


            requestAnimationFrame(
                render
            );
        }


        requestAnimationFrame(
            render
        );
    </script>
</body>
