<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 축하합니다 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;
            background: #080b14;
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .setup {
            position: relative;
            z-index: 10;
            width: min(92vw, 520px);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(18, 22, 36, 0.92);
            backdrop-filter: blur(18px);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .setup.hidden {
            display: none;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 26px;
            text-align: center;
            color: #aeb6ca;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #cbd2e3;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            background: #111626;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            border-color: #ff8fba;
            box-shadow: 0 0 0 3px rgba(255, 143, 186, 0.1);
        }

        .cakes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
        }

        .cake {
            min-height: 72px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            background: #111626;
            color: #dce1ef;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .cake span {
            display: block;
            margin-bottom: 4px;
            font-size: 25px;
        }

        .cake:hover {
            transform: translateY(-2px);
            background: #191e31;
        }

        .cake.selected {
            border-color: #ff8fb9;
            background: rgba(255, 143, 185, 0.13);
            box-shadow: 0 0 20px rgba(255, 143, 185, 0.1);
        }

        .start {
            width: 100%;
            height: 52px;
            margin-top: 25px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff79ae, #b978ff);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 100, 180, 0.25);
            transition: 0.2s ease;
        }

        .start:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .scene-ui {
            position: fixed;
            z-index: 5;
            inset: 0;
            pointer-events: none;
        }

        .birthday-title {
            position: absolute;
            top: 7%;
            width: 100%;
            padding: 0 15px;
            text-align: center;
            font-size: clamp(25px, 5vw, 58px);
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 130, 190, 0.35);
        }

        .birthday-subtitle {
            position: absolute;
            top: calc(7% + clamp(40px, 7vw, 75px));
            width: 100%;
            text-align: center;
            color: #cbd1df;
            font-size: 14px;
        }

        .music-button {
            position: fixed;
            z-index: 20;
            right: 18px;
            top: 18px;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            background: rgba(20, 24, 40, 0.75);
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hint {
            position: fixed;
            z-index: 5;
            bottom: 5%;
            width: 100%;
            padding: 0 10px;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .setup {
                padding: 23px;
            }

            .cakes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="setup" id="setup">
        <h1>🎂 생일 축하하기</h1>

        <div class="subtitle">
            이름과 케이크를 선택하고 생일을 시작해보세요.
        </div>

        <label for="name">이름</label>

        <input
            id="name"
            type="text"
            maxlength="20"
            placeholder="예: 홍길동"
        >

        <label>케이크</label>

        <div class="cakes">

            <button class="cake selected" data-cake="strawberry">
                <span>🍓</span>
                딸기
            </button>

            <button class="cake" data-cake="cream">
                <span>🍰</span>
                생크림
            </button>

            <button class="cake" data-cake="chocolate">
                <span>🍫</span>
                초콜릿
            </button>

            <button class="cake" data-cake="cheese">
                <span>🧀</span>
                치즈
            </button>

        </div>

        <label for="age">
            나이 / 초 개수
        </label>

        <input
            id="age"
            type="number"
            min="1"
            max="100"
            value="10"
            placeholder="나이를 입력하세요"
        >

        <button class="start" id="startButton">
            🎉 생일 시작하기
        </button>
    </div>

    <div class="scene-ui" id="sceneUI" style="display:none;">

        <div
            class="birthday-title"
            id="birthdayTitle"
        ></div>

        <div class="birthday-subtitle">
            촛불을 클릭해서 꺼주세요 🕯️
        </div>

        <div class="hint">
            ✨ 촛불을 모두 끄면 축하가 시작됩니다 ✨
        </div>

    </div>

    <button
        class="music-button"
        id="musicButton"
        style="display:none;"
    >
        🔊
    </button>


    <script>
        "use strict";


        /* ============================================================
           Canvas 기본 설정
        ============================================================ */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: false,
                desynchronized: true
            });


        let width = 0;

        let height = 0;

        let dpr = 1;


        function resizeCanvas() {

            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            width =
                window.innerWidth;

            height =
                window.innerHeight;


            canvas.width =
                Math.floor(
                    width * dpr
                );

            canvas.height =
                Math.floor(
                    height * dpr
                );


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        /* ============================================================
           UI
        ============================================================ */

        const setup =
            document.getElementById("setup");

        const sceneUI =
            document.getElementById("sceneUI");

        const birthdayTitle =
            document.getElementById("birthdayTitle");


        const nameInput =
            document.getElementById("name");

        const ageInput =
            document.getElementById("age");


        const startButton =
            document.getElementById("startButton");

        const musicButton =
            document.getElementById("musicButton");


        let selectedCake =
            "strawberry";

        let birthdayName =
            "친구";


        document
            .querySelectorAll(".cake")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(".cake")
                            .forEach(item => {

                                item.classList.remove(
                                    "selected"
                                );

                            });


                        button.classList.add(
                            "selected"
                        );


                        selectedCake =
                            button.dataset.cake;
                    }
                );

            });


        /* ============================================================
           케이크 / 촛불 데이터
        ============================================================ */

        let candles = [];

        let cakeHoles = [];


        function createCandles(age) {

            candles = [];


            const longCount =
                Math.floor(age / 10);

            const shortCount =
                age % 10;


            /*
             * 긴 초는 먼저 생성합니다.
             * 렌더링에서도 뒤쪽에 배치됩니다.
             */

            for (
                let i = 0;
                i < longCount;
                i++
            ) {

                candles.push({

                    type: "long",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2

                });

            }


            /*
             * 짧은 초는 앞쪽에 배치됩니다.
             */

            for (
                let i = 0;
                i < shortCount;
                i++
            ) {

                candles.push({

                    type: "short",

                    blown: false,

                    flame:
                        Math.random() *
                        Math.PI *
                        2

                });

            }
        }


        /* ============================================================
           치즈 케이크 구멍
           
           한 번 생성한 위치를 계속 사용하여
           화면이 깜빡이지 않도록 합니다.
        ============================================================ */

        function createCheeseHoles() {

            cakeHoles = [];


            const holes = [

                [0.16, 0.34, 5],

                [0.27, 0.22, 4],

                [0.38, 0.39, 6],

                [0.52, 0.24, 4],

                [0.65, 0.36, 5],

                [0.78, 0.25, 4],

                [0.86, 0.42, 5],

                [0.21, 0.48, 3],

                [0.46, 0.48, 4],

                [0.70, 0.49, 3]

            ];


            holes.forEach(
                hole => {

                    cakeHoles.push({

                        x: hole[0],

                        y: hole[1],

                        r: hole[2]

                    });

                }
            );
        }


        createCheeseHoles();


        /* ============================================================
           파티클
        ============================================================ */

        let particles = [];

        let confetti = [];


        function createParticle(
            x,
            y,
            amount = 20
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const speed =
                    1 +
                    Math.random() *
                    5;


                particles.push({

                    x,

                    y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    life: 1,

                    size:
                        1 +
                        Math.random() *
                        3

                });

            }
        }


        function createConfetti(
            amount = 100
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                confetti.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        -Math.random() *
                        height,

                    vx:
                        (Math.random() - 0.5) *
                        2,

                    vy:
                        1 +
                        Math.random() *
                        4,

                    rotation:
                        Math.random() *
                        Math.PI,

                    rotationSpeed:
                        (Math.random() - 0.5) *
                        0.15,

                    size:
                        4 +
                        Math.random() *
                        7,

                    life: 1

                });

            }
        }


        /* ============================================================
           케이크 색상
        ============================================================ */

        const cakeColors = {

            strawberry: {

                top: "#fff4f8",

                bottom: "#f486ad",

                cream: "#fffafd",

                accent: "#ff4f78"

            },


            cream: {

                top: "#fffdf5",

                bottom: "#e5cfa3",

                cream: "#ffffff",

                accent: "#f3dca8"

            },


            chocolate: {

                top: "#a56a4e",

                bottom: "#552719",

                cream: "#f3d7c1",

                accent: "#6e3422"

            },


            cheese: {

                top: "#ffe990",

                bottom: "#d69b24",

                cream: "#fff2a8",

                accent: "#e7b63e"

            }

        };


        /* ============================================================
           케이크 위치 / 크기
        ============================================================ */

        function getCakeData() {

            /*
             * 기존보다 케이크를 조금 넓게 만들어
             * 촛불이 자연스럽게 배치될 공간을 확보합니다.
             */

            const cakeWidth =
                Math.min(
                    width * 0.74,
                    620
                );


            const cakeHeight =
                Math.min(
                    height * 0.31,
                    250
                );


            const x =
                width / 2;


            const bottom =
                height * 0.82;


            return {

                x,

                width: cakeWidth,

                height: cakeHeight,

                bottom

            };
        }


        /* ============================================================
           촛불 위치 계산
           
           핵심 변경 부분입니다.
           
           긴 초:
           - 케이크 뒤쪽
           - 조금 위
           - 넓게 퍼지는 곡선
           
           짧은 초:
           - 케이크 앞쪽
           - 조금 아래
           - 긴 초와 겹치지 않음
        ============================================================ */

        function getCandlePositions() {

            const cake =
                getCakeData();


            const longCandles =
                candles.filter(
                    candle =>
                        candle.type === "long"
                );


            const shortCandles =
                candles.filter(
                    candle =>
                        candle.type === "short"
                );


            const positions =
                new Array(
                    candles.length
                );


            /*
             * 케이크 윗면의 실제 크림 표면입니다.
             */

            const surfaceY =
                cake.bottom -
                cake.height +
                48;


            /*
             * 긴 초는 뒤쪽에 둡니다.
             */

            function placeRow(
                list,
                depth,
                isLong
            ) {

                const count =
                    list.length;


                if (count === 0) {
                    return;
                }


                /*
                 * 너무 많은 촛불이 들어갈 경우
                 * 자동으로 간격을 줄입니다.
                 */

                const usableWidth =
                    cake.width *
                    (
                        isLong
                            ? 0.72
                            : 0.82
                    );


                const maxSpacing =
                    isLong
                        ? 62
                        : 52;


                const spacing =
                    Math.min(
                        maxSpacing,
                        usableWidth /
                        Math.max(
                            count - 1,
                            1
                        )
                    );


                const actualWidth =
                    spacing *
                    Math.max(
                        count - 1,
                        1
                    );


                const startX =
                    cake.x -
                    actualWidth / 2;


                list.forEach(
                    (candle, index) => {

                        const originalIndex =
                            candles.indexOf(
                                candle
                            );


                        /*
                         * 양쪽은 살짝 높고
                         * 중앙은 살짝 낮게 만들어
                         * 원형 케이크의 곡선을 따라갑니다.
                         */

                        const normalized =
                            count <= 1
                                ? 0
                                :
                                (
                                    index /
                                    (count - 1)
                                ) * 2 - 1;


                        const curve =
                            Math.abs(
                                normalized
                            ) *
                            12;


                        /*
                         * 긴 초는 뒤,
                         * 짧은 초는 앞입니다.
                         */

                        const y =
                            surfaceY +
                            depth +
                            curve;


                        positions[
                            originalIndex
                        ] = {

                            x:
                                startX +
                                index *
                                spacing,

                            y,

                            depth,

                            scale:
                                count > 18
                                    ? 0.72
                                    : count > 12
                                        ? 0.82
                                        : 1

                        };

                    }
                );
            }


            /*
             * 긴 초를 먼저 배치합니다.
             * 화면상 뒤쪽에 존재합니다.
             */

            placeRow(
                longCandles,
                2,
                true
            );


            /*
             * 짧은 초는 앞쪽에 배치합니다.
             */

            placeRow(
                shortCandles,
                37,
                false
            );


            /*
             * 초가 너무 많아 한 줄에 들어가지 않는 경우를
             * 추가 행으로 재배치합니다.
             *
             * 20개 이상일 때는 긴 초와 짧은 초가
             * 겹치지 않도록 여러 줄을 사용합니다.
             */

            if (candles.length > 20) {

                const sorted =
                    candles.slice();


                const maxPerRow =
                    Math.min(
                        12,
                        Math.max(
                            7,
                            Math.ceil(
                                Math.sqrt(
                                    candles.length *
                                    1.7
                                )
                            )
                        )
                    );


                sorted.forEach(
                    (candle, index) => {

                        const row =
                            Math.floor(
                                index /
                                maxPerRow
                            );


                        const rowIndex =
                            index %
                            maxPerRow;


                        const rowCount =
                            Math.min(
                                maxPerRow,
                                candles.length -
                                row *
                                maxPerRow
                            );


                        const spacing =
                            cake.width *
                            0.72 /
                            Math.max(
                                rowCount - 1,
                                1
                            );


                        const rowWidth =
                            spacing *
                            Math.max(
                                rowCount - 1,
                                1
                            );


                        const x =
                            cake.x -
                            rowWidth / 2 +
                            rowIndex *
                            spacing;


                        const curve =
                            Math.abs(
                                (
                                    rowIndex /
                                    Math.max(
                                        rowCount - 1,
                                        1
                                    )
                                ) * 2 - 1
                            ) *
                            8;


                        const originalIndex =
                            candles.indexOf(
                                candle
                            );


                        positions[
                            originalIndex
                        ] = {

                            x,

                            y:
                                surfaceY +
                                8 +
                                row * 34 +
                                curve,

                            depth:
                                row,

                            scale:
                                Math.max(
                                    0.58,
                                    1 -
                                    row * 0.08
                                )

                        };

                    }
                );
            }


            return positions;
        }


        /* ============================================================
           둥근 사각형
        ============================================================ */

        function roundRect(
            context,
            x,
            y,
            w,
            h,
            r
        ) {

            const radius =
                Math.min(
                    r,
                    w / 2,
                    h / 2
                );


            context.beginPath();

            context.moveTo(
                x + radius,
                y
            );

            context.arcTo(
                x + w,
                y,
                x + w,
                y + h,
                radius
            );

            context.arcTo(
                x + w,
                y + h,
                x,
                y + h,
                radius
            );

            context.arcTo(
                x,
                y + h,
                x,
                y,
                radius
            );

            context.arcTo(
                x,
                y,
                x + w,
                y,
                radius
            );

            context.closePath();
        }


        /* ============================================================
           케이크 그리기
        ============================================================ */

        function drawCake() {

            const cake =
                getCakeData();


            const colors =
                cakeColors[
                    selectedCake
                ];


            const left =
                cake.x -
                cake.width / 2;


            const top =
                cake.bottom -
                cake.height;


            /* --------------------------------------------------------
               바닥 그림자
            -------------------------------------------------------- */

            ctx.save();

            ctx.fillStyle =
                "rgba(0,0,0,0.30)";


            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                cake.bottom + 25,
                cake.width * 0.46,
                22,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();


            /* --------------------------------------------------------
               접시
            -------------------------------------------------------- */

            ctx.save();

            const plateGradient =
                ctx.createLinearGradient(
                    0,
                    cake.bottom - 5,
                    0,
                    cake.bottom + 35
                );


            plateGradient.addColorStop(
                0,
                "#fff9fd"
            );

            plateGradient.addColorStop(
                1,
                "#dca6bd"
            );


            ctx.fillStyle =
                plateGradient;


            ctx.beginPath();

            ctx.ellipse(
                cake.x,
                cake.bottom + 7,
                cake.width * 0.53,
                25,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle =
                "rgba(255,255,255,0.5)";

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.restore();


            /* --------------------------------------------------------
               케이크 본체
            -------------------------------------------------------- */

            const bodyGradient =
                ctx.createLinearGradient(
                    0,
                    top + 45,
                    0,
                    cake.bottom
                );


            bodyGradient.addColorStop(
                0,
                colors.top
            );


            bodyGradient.addColorStop(
                0.45,
                colors.top
            );


            bodyGradient.addColorStop(
                1,
                colors.bottom
            );


            ctx.fillStyle =
                bodyGradient;


            roundRect(
                ctx,
                left,
                top + 45,
                cake.width,
                cake.height * 0.67,
                28
            );


            ctx.fill();


            /* --------------------------------------------------------
               케이크 앞면 부드러운 하이라이트
            -------------------------------------------------------- */

            const highlight =
                ctx.createLinearGradient(
                    left,
                    top + 70,
                    left + cake.width,
                    top + 70
                );


            highlight.addColorStop(
                0,
                "rgba(255,255,255,0.05)"
            );


            highlight.addColorStop(
                0.5,
                "rgba(255,255,255,0.25)"
            );


            highlight.addColorStop(
                1,
                "rgba(255,255,255,0.03)"
            );


            ctx.fillStyle =
                highlight;

        function drawCandles(time) {

            const positions =
                getCandlePositions();


            /*

             * 짧은 초 → 앞쪽
             */

            const drawOrder =
                candles
                    .map(
                        (candle, index) => ({
                            candle,
                            index,
                            position:
                                positions[index]
                        })
                    )
                    .sort(
                        (a, b) =>
                            a.position.depth -
                            b.position.depth
                    );


            drawOrder.forEach(
                item => {

                    const candle =
                        item.candle;


                    const position =
                        item.position;


                    const scale =
                        position.scale ||
                        1;


                    const candleHeight =
                        (
                            candle.type ===
                            "long"
                                ? 82
                                : 48
                        ) *
                        scale;


                    const candleWidth =
                        15 *
                        scale;


                    const x =
                        position.x -
                        candleWidth / 2;


                    const y =
                        position.y -
                        candleHeight;


                    /* ------------------------------------------------
                       촛불 아래쪽 그림자
                    ------------------------------------------------ */

                    ctx.save();

                    ctx.fillStyle =
                        "rgba(90,30,60,0.16)";


                    ctx.beginPath();

                    ctx.ellipse(
                        position.x,
                        position.y + 1,
                        candleWidth * 0.8,
                        5 * scale,
                        0,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                    ctx.restore();


                    /* ------------------------------------------------
                       초 몸체
                    ------------------------------------------------ */

                    const candleGradient =
                        ctx.createLinearGradient(
                            x,
                            y,
                            x + candleWidth,
                            y
                        );


                    candleGradient.addColorStop(
                        0,
                        "#d875a3"
                    );


                    candleGradient.addColorStop(
                        0.25,
                        "#ffb7d5"
                    );


                    candleGradient.addColorStop(
                        0.5,
                        "#fff8fc"
                    );


                    candleGradient.addColorStop(
                        0.75,
                        "#ffb7d5"
                    );


                    candleGradient.addColorStop(
                        1,
                        "#cf6b99"
                    );


                    ctx.fillStyle =
                        candleGradient;


                    roundRect(
                        ctx,
                        x,
                        y,
                        candleWidth,
                        candleHeight,
                        6 * scale
                    );


                    ctx.fill();


                    /* ------------------------------------------------
                       초의 줄무늬
                    ------------------------------------------------ */

                    ctx.save();

                    ctx.beginPath();

                    roundRect(
                        ctx,
                        x,
                        y,
                        candleWidth,
                        candleHeight,
                        6 * scale
                    );

                    ctx.clip();


                    ctx.strokeStyle =
                        "rgba(255,105,165,0.38)";

                    ctx.lineWidth =
                        3 * scale;


                    for (
                        let stripe = -2;
                        stripe <
                        candleHeight / 16 + 2;
                        stripe++
                    ) {

                        ctx.beginPath();

                        ctx.moveTo(
                            x - 5,
                            y +
                            stripe *
                            16
                        );

                        ctx.lineTo(
                            x +
                            candleWidth +
                            5,
                            y +
                            stripe *
                            16 -
                            9
                        );

                        ctx.stroke();

                    }

                    ctx.restore();


                    /* ------------------------------------------------
                       심지
                    ------------------------------------------------ */

                    ctx.strokeStyle =
                        "#4b302b";

                    ctx.lineWidth =
                        Math.max(
                            1,
                            2 *
                            scale
                        );


                    ctx.beginPath();

                    ctx.moveTo(
                        position.x,
                        y
                    );

                    ctx.lineTo(
                        position.x,
                        y -
                        7 *
                        scale
                    );

                    ctx.stroke();


                    /* ------------------------------------------------
                       불꽃
                    ------------------------------------------------ */

                    if (!candle.blown) {

                        const flicker =
                            Math.sin(
                                time *
                                0.018 +
                                candle.flame
                            ) *
                            2 *
                            scale;


                        const flameX =
                            position.x +
                            flicker;


                        const flameY =
                            y -
                            17 *
                            scale;


                        /* 불꽃 외부 광 */
                        const flameGlow =
                            ctx.createRadialGradient(
                                flameX,
                                flameY,
                                1,
                                flameX,
                                flameY,
                                22 *
                                scale
                            );


                        flameGlow.addColorStop(
                            0,
                            "rgba(255,255,255,0.95)"
                        );


                        flameGlow.addColorStop(
                            0.18,
                            "rgba(255,231,120,0.95)"
                        );


                        flameGlow.addColorStop(
                            0.55,
                            "rgba(255,140,30,0.55)"
                        );


                        flameGlow.addColorStop(
                            1,
                            "rgba(255,100,20,0)"
                        );


                        ctx.fillStyle =
                            flameGlow;


                        ctx.beginPath();

                        ctx.arc(
                            flameX,
                            flameY,
                            22 *
                            scale,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();


                        /* 실제 불꽃 */

                        ctx.save();

                        ctx.translate(
                            flameX,
                            flameY
                        );


                        ctx.scale(
                            scale,
                            scale
                        );


                        const flameGradient =
                            ctx.createLinearGradient(
                                0,
                                -17,
                                0,
                                9
                            );


                        flameGradient.addColorStop(
                            0,
                            "#fffde0"
                        );


                        flameGradient.addColorStop(
                            0.35,
                            "#fff08a"
                        );


                        flameGradient.addColorStop(
                            0.75,
                            "#ff9b28"
                        );


                        flameGradient.addColorStop(
                            1,
                            "#ff5a18"
                        );


                        ctx.fillStyle =
                            flameGradient;


                        ctx.beginPath();

                        ctx.moveTo(
                            0,
                            -18

                        ctx.bezierCurveTo(

                        ctx.closePath();

                        ctx.fill();


                        /* 불꽃 중심 */

                        ctx.beginPath();

                        ctx.ellipse(
                            0,
                            1,
                            3.5,
                            7,
                            0,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();


                        ctx.restore();

                    }

                }
            );
        }

            ctx.fillRect(

                width,
                height
            );


            /* --------------------------------------------------------
               작은 별
            -------------------------------------------------------- */

            ctx.fillStyle =
                "rgba(255,255,255,0.45)";


            for (
                let i = 0;
                i < 55;

            ) {

                    ) %

                        i
                    ) *
                    0.2;


                ctx.globalAlpha =
                    Math.max(
                        alpha,
                        0.05
                    );


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.globalAlpha = 1;

        /* ============================================================
           파티클
        ============================================================ */

        function updateParticles() {

            for (
                let i =
                    particles.length - 1;
                i >= 0;
                i--
            ) {

                const p =
                    particles[i];


                p.x += p.vx;

                p.y += p.vy;

                p.vy += 0.06;

                p.life -= 0.025;


                if (
                    p.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );

                    continue;
                }


                ctx.globalAlpha =
                    p.life;


                ctx.fillStyle =
                    "#ffd9eb";


                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.globalAlpha = 1;
        }


        /* ============================================================
           컨페티
        ============================================================ */

        function updateConfetti() {

            for (
                let i =
                    confetti.length - 1;
                i >= 0;
                i--
            ) {

                const c =
                    confetti[i];


                c.x += c.vx;

                c.y += c.vy;

                c.vy += 0.025;

                c.rotation +=
                    c.rotationSpeed;


                if (
                    c.y >
                    height + 30
                ) {

                    confetti.splice(
                        i,
                        1
                    );

                    continue;
                }


                ctx.save();


                ctx.translate(
                    c.x,
                    c.y
                );


                ctx.rotate(
                    c.rotation
                );


                ctx.globalAlpha =
                    c.life;


                ctx.fillStyle =
                    `hsl(${(i * 47) % 360}, 85%, 70%)`;


                ctx.fillRect(
                    -c.size / 2,
                    -c.size / 2,
                    c.size,
                    c.size * 0.55
                );


                ctx.restore();
            }


            ctx.globalAlpha = 1;
        }

        /* ============================================================
           Audio 초기화
        ============================================================ */

        function initAudio() {

            if (audioContext) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();

                }

                return;
            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();


            musicGain =
                audioContext.createGain();


            effectGain =
                audioContext.createGain();


            masterGain.gain.value =
                APP_VOLUME;


            musicGain.gain.value =
                0.58;


            effectGain.gain.value =
                0.75;


            musicGain.connect(
                masterGain
            );


            effectGain.connect(
                masterGain
            );


            masterGain.connect(
                audioContext.destination
            );
        }


        /* ============================================================
           ADSR Envelope
        ============================================================ */

        function applyADSR(
            gainNode,
            startTime,
            duration,
            peak = 0.12,
            attack = 0.015,
            decay = 0.18,
            sustain = 0.42,
            release = 0.45
        ) {

            const gain =
                gainNode.gain;


            const attackEnd =
                startTime +
                attack;


            const decayEnd =
                attackEnd +
                decay;


            const releaseStart =
                Math.max(
                    decayEnd,
                    startTime +
                    duration -
                    release
                );


            const releaseEnd =
                releaseStart +
                release;


            gain.cancelScheduledValues(
                startTime
            );


            gain.setValueAtTime(
                0.0001,
                startTime
            );


            gain.linearRampToValueAtTime(
                peak,
                attackEnd
            );


            gain.linearRampToValueAtTime(
                peak *
                sustain,
                decayEnd
            );


            gain.setValueAtTime(
                peak *
                sustain,
                releaseStart
            );


            gain.exponentialRampToValueAtTime(
                0.0001,
                releaseEnd
            );
        }


        /* ============================================================
           피아노 / 오르골 한 음
        ============================================================ */

        function playPianoNote(
            frequency,
            startTime,
            duration,
            volume = 0.12
        ) {

            if (!audioContext) {
                return;
            }


            const fundamental =
                audioContext.createOscillator();


            fundamental.type =
                "triangle";


            fundamental.frequency.setValueAtTime(
                frequency,
                startTime
            );


            const harmonic2 =
                audioContext.createOscillator();


            harmonic2.type =
                "sine";


            harmonic2.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const harmonic3 =
                audioContext.createOscillator();


            harmonic3.type =
                "sine";


            harmonic3.frequency.setValueAtTime(
                frequency * 3,
                startTime
            );


            const harmonic4 =
                audioContext.createOscillator();


            harmonic4.type =
                "sine";


            harmonic4.frequency.setValueAtTime(
                frequency * 4,
                startTime
            );


            const fundamentalGain =
                audioContext.createGain();


            const harmonic2Gain =
                audioContext.createGain();


            const harmonic3Gain =
                audioContext.createGain();


            const harmonic4Gain =
                audioContext.createGain();


            fundamentalGain.gain.value =
                0.72;


            harmonic2Gain.gain.value =
                0.19;


            harmonic3Gain.gain.value =
                0.07;


            harmonic4Gain.gain.value =
                0.025;


            const noteGain =
                audioContext.createGain();


            applyADSR(
                noteGain,
                startTime,
                duration,
                volume,
                0.012,
                0.12,
                0.32,
                0.55
            );


            fundamental.connect(
                fundamentalGain
            );


            harmonic2.connect(
                harmonic2Gain
            );


            harmonic3.connect(
                harmonic3Gain
            );


            harmonic4.connect(
                harmonic4Gain
            );


            fundamentalGain.connect(
                noteGain
            );


            harmonic2Gain.connect(
                noteGain
            );


            harmonic3Gain.connect(
                noteGain
            );


            harmonic4Gain.connect(
                noteGain
            );


            noteGain.connect(
                musicGain
            );


            fundamental.start(
                startTime
            );


            harmonic2.start(
                startTime
            );


            harmonic3.start(
                startTime
            );


            harmonic4.start(
                startTime
            );


            const stopTime =
                startTime +
                duration +
                0.7;


            fundamental.stop(
                stopTime
            );


            harmonic2.stop(
                stopTime
            );


            harmonic3.stop(
                stopTime
            );


            harmonic4.stop(
                stopTime
            );
        }


        /* ============================================================
           오르골 종소리
        ============================================================ */

        function playBell(
            frequency,
            startTime,
            volume = 0.035
        ) {

            if (!audioContext) {
                return;
            }


            const bell =
                audioContext.createOscillator();


            bell.type =
                "sine";


            bell.frequency.setValueAtTime(
                frequency * 2,
                startTime
            );


            const bell2 =
                audioContext.createOscillator();


            bell2.type =
                "sine";


            bell2.frequency.setValueAtTime(
                frequency * 3,
                startTime
            );


            const bellGain =
                audioContext.createGain();


            bellGain.gain.setValueAtTime(
                0.0001,
                startTime
            );


            bellGain.gain.exponentialRampToValueAtTime(
                volume,
                startTime + 0.008
            );


            bellGain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime + 1.15
            );


            bell.connect(
                bellGain
            );


            bell2.connect(
                bellGain
            );


            bellGain.connect(
                musicGain
            );


            bell.start(
                startTime
            );


            bell2.start(
                startTime
            );


            bell.stop(
                startTime + 1.2
            );


            bell2.stop(
                startTime + 1.2
            );
        }


        /* ============================================================
           베이스
        ============================================================ */

        function playBass(
            frequency,
            startTime,
            duration
        ) {

            if (!audioContext) {
                return;
            }


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );


            const gain =
                audioContext.createGain();


            applyADSR(
                gain,
                startTime,
                duration,
                0.055,
                0.025,
                0.18,
                0.22,
                0.5
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                musicGain
            );


            oscillator.start(
                startTime
            );


            oscillator.stop(
                startTime +
                duration +
                0.7
            );
        }


        /* ============================================================
           곡 스케줄
        ============================================================ */

        function scheduleBirthdaySong() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime +
                0.08;


            let cursor =
                now;


            const beatLength =
                0.31;


            birthdayMelody.forEach(
                ([frequency, duration], index) => {

                    const noteDuration =
                        duration *
                        1.02;


                    playPianoNote(
                        frequency,
                        cursor,
                        noteDuration,
                        0.115
                    );


                    playBell(
                        frequency,
                        cursor,
                        0.022
                    );


                    if (
                        index % 3 ===
                        0
                    ) {

                        playPianoNote(
                            frequency / 2,
                            cursor,
                            noteDuration *
                            0.9,
                            0.025
                        );
                    }


                    cursor +=
                        duration +
                        beatLength *
                        0.06;

                }
            );


            /* --------------------------------------------------------
               베이스
            -------------------------------------------------------- */

            const phraseLength =
                3.9;


            const bassNotes = [

                NOTE.C4 / 2,

                NOTE.G4 / 2,

                NOTE.C4 / 2,

                NOTE.F4 / 2

            ];


            for (
                let i = 0;
                i < 4;
                i++
            ) {

                playBass(
                    bassNotes[i],
                    now +
                    i *
                    phraseLength,
                    phraseLength *
                    0.82
                );
            }


            return cursor -
                now;
        }


        /* ============================================================
           음악 시작
        ============================================================ */

        function startMusic() {

            initAudio();


            if (musicPlaying) {
                return;
            }


            musicPlaying = true;


            musicButton.textContent =
                "🔊";


            function loop() {

                if (!musicPlaying) {
                    return;
                }


                const duration =
                    scheduleBirthdaySong();


                musicTimer =
                    setTimeout(
                        loop,
                        Math.max(
                            1000,
                            duration *
                            1000 -
                            100
                        )
                    );
            }


            loop();
        }


        /* ============================================================
           음악 정지
        ============================================================ */

        function stopMusic() {

            musicPlaying = false;


            if (musicTimer) {

                clearTimeout(
                    musicTimer
                );


                musicTimer =
                    null;
            }


            musicButton.textContent =
                "🔇";
        }


        /* ============================================================
           음악 버튼
        ============================================================ */

        musicButton.addEventListener(
            "click",
            () => {

                if (musicPlaying) {

                    stopMusic();

                } else {

                    startMusic();

                }

            }
        );


        /* ============================================================
           촛불 끄기 효과음
        ============================================================ */

        function playExtinguishSound() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                520,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                150,
                now + 0.18
            );


            const gain =
                audioContext.createGain();


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                0.16,
                now + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.22
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                effectGain
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now + 0.25
            );
        }


        /* ============================================================
           전체 촛불 완료 효과음
        ============================================================ */

        function playCelebrationSound() {

            if (!audioContext) {
                return;
            }


            const now =
                audioContext.currentTime;


            const notes = [

                NOTE.C5,

                NOTE.E5,

                NOTE.G5,

                NOTE.C5 * 2

            ];


            notes.forEach(
                (frequency, index) => {

                    playBell(
                        frequency,
                        now +
                        index *
                        0.13,
                        0.07
                    );

                }
            );
        }


        /* ============================================================
           촛불 클릭 판정
        ============================================================ */

        function handlePointer(
            clientX,
            clientY
        ) {

            if (
                !musicPlaying &&
                audioContext
            ) {

                audioContext.resume();

            }


            const rect =
                canvas.getBoundingClientRect();


            const x =
                clientX -
                rect.left;


            const y =
                clientY -
                rect.top;


            const positions =
                getCandlePositions();


            /*
             * 뒤쪽 초부터 검사합니다.
             * 겹치는 경우에도 클릭하기 쉬운 초가 우선됩니다.
             */

            const indices =
                candles
                    .map(
                        (_, index) =>
                            index
                    )
                    .sort(
                        (a, b) =>
                            positions[b].depth -
                            positions[a].depth
                    );


            for (
                const i of indices
            ) {

                const candle =
                    candles[i];


                if (
                    candle.blown
                ) {
                    continue;
                }


                const position =
                    positions[i];


                const scale =
                    position.scale ||
                    1;


                const candleHeight =
                    (
                        candle.type ===
                        "long"
                            ? 82
                            : 48
                    ) *
                    scale;


                const candleWidth =
                    34 *
                    scale;


                const hitTop =
                    position.y -
                    candleHeight -
                    32 *
                    scale;


                const hitBottom =
                    position.y +
                    14 *
                    scale;


                if (
                    x >=
                    position.x -
                    candleWidth / 2 &&

                    x <=
                    position.x +
                    candleWidth / 2 &&

                    y >=
                    hitTop &&

                    y <=
                    hitBottom
                ) {

                    candle.blown =
                        true;


                    createParticle(
                        position.x,
                        position.y -
                        candleHeight,
                        25
                    );


                    playExtinguishSound();


                    const remaining =
                        candles.filter(
                            item =>
                                !item.blown
                        ).length;


                    if (
                        remaining ===
                        0
                    ) {

                        setTimeout(
                            () => {

                                createConfetti(
                                    150
                                );


                                playCelebrationSound();

                            },
                            350
                        );

                    }


                    break;
                }
            }
        }


        /* ============================================================
           마우스 클릭
        ============================================================ */

        canvas.addEventListener(
            "click",
            event => {

                handlePointer(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* ============================================================
           모바일 터치
        ============================================================ */

        canvas.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches &&
                    event.touches.length
                ) {

                    const touch =
                        event.touches[0];


                    handlePointer(
                        touch.clientX,
                        touch.clientY
                    );

                }


                event.preventDefault();

            },
            {
                passive: false
            }
        );


        /* ============================================================
           시작 버튼
        ============================================================ */

        startButton.addEventListener(
            "click",
            () => {

                birthdayName =
                    nameInput.value.trim();


                if (
                    !birthdayName
                ) {

                    nameInput.focus();

                    return;
                }


                let age =
                    Number(
                        ageInput.value
                    );


                if (
                    !Number.isFinite(
                        age
                    ) ||
                    age < 1
                ) {

                    age = 1;
                }


                age =
                    Math.min(
                        Math.floor(age),
                        100
                    );


                createCandles(
                    age
                );


                birthdayTitle.textContent =
                    `🎂 ${birthdayName}님, 생일 축하합니다!`;


                setup.classList.add(
                    "hidden"
                );


                sceneUI.style.display =
                    "block";


                musicButton.style.display =
                    "block";


                initAudio();

                startMusic();

            }
        );


        /* ============================================================
           렌더링
        ============================================================ */

        function render(time) {

            drawBackground(
                time
            );


            if (
                setup.classList.contains(
                    "hidden"
                )
            ) {

                drawCake();

                drawCandles(
                    time
                );

                updateParticles();

                updateConfetti();

            }


            requestAnimationFrame(
                render
            );
        }


        requestAnimationFrame(
            render
        );

    </script>

</body>
