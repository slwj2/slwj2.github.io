<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ></script>

    <!-- Phosphor Icons -->
    <script
        src="https://unpkg.com/@phosphor-icons/web"
    ></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],

                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    }
                }
            }
        };
    </script>

    <style>

        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #333;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }


        /* =========================================================
           다이어리 용지
        ========================================================= */

        .diary-paper {
            position: relative;

            width: 100%;
            max-width: 1400px;

            height: 1220px;

            padding:
                58px
                46px
                34px
                46px;

            background: #FAF8F5;

            border:
                2px solid
                #E8DADA;

            border-radius: 24px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.08);

            overflow: visible;
        }


        /* =========================================================
           스프링
        ========================================================= */

        .spring-wrapper {
            position: absolute;

            top: -22px;
            left: 30px;
            right: 30px;

            height: 45px;

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            z-index: 20;

            pointer-events: none;
        }

        .spring {
            width: 18px;
            height: 43px;

            border-radius: 9px;

            background:
                linear-gradient(
                    to right,
                    #999 0%,
                    #eee 25%,
                    #fff 48%,
                    #bbb 75%,
                    #777 100%
                );

            box-shadow:
                1px 3px 4px rgba(0, 0, 0, 0.25);

            position: relative;
        }

        .spring::after {
            content: '';

            position: absolute;

            bottom: -6px;
            left: 2px;

            width: 14px;
            height: 12px;

            background: #555;

            border-radius: 50%;

            box-shadow:
                inset 1px 1px 2px rgba(255, 255, 255, 0.4);
        }


        /* =========================================================
           상단 제목
        ========================================================= */

        .calendar-title {
            color: #A94442;

            font-family:
                'Quicksand',
                sans-serif;

            font-size: 46px;

            font-weight: 700;

            letter-spacing: 2px;

            text-align: right;

            line-height: 1;

            margin-bottom: 14px;
        }


        /* =========================================================
           달력
        ========================================================= */

        .calendar-grid {
            width: 100%;

            height: 1010px;

            display: flex;
            flex-direction: column;

            background: #fff;

            border:
                2px solid
                #A94442;

            border-radius: 14px;

            overflow: hidden;
        }


        /* =========================================================
           요일
        ========================================================= */

        .calendar-week {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            height: 54px;

            flex-shrink: 0;

            background: #FDF0F1;

            border-bottom:
                2px solid
                #A94442;
        }

        .calendar-header-cell {
            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 25px;

            font-weight: bold;

            color: #A94442;

            border-right:
                1px solid
                #EBD9D9;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-header-cell.sun {
            color: #D9534F;
        }

        .calendar-header-cell.sat {
            color: #4285D4;
        }


        /* =========================================================
           날짜 영역
        ========================================================= */

        #calendar-days {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            grid-template-rows:
                repeat(var(--row-count), minmax(0, 1fr));

            flex: 1;

            min-height: 0;

            background: #fff;
        }


        /* =========================================================
           날짜 칸
        ========================================================= */

        .calendar-cell {
            position: relative;

            min-width: 0;
            min-height: 0;

            padding: 8px;

            background: #fff;

            border-right:
                1px solid
                #E9E3E3;

            border-bottom:
                1px solid
                #E9E3E3;

            cursor: pointer;

            overflow: hidden;

            transition:
                background-color 0.15s ease;
        }

        .calendar-cell:hover {
            background: #FFF9F9;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }


        /* =========================================================
           날짜 숫자
        ========================================================= */

        .day-number {
            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-family:
                'Quicksand',
                sans-serif;

            font-size: 20px;

            font-weight: 700;

            line-height: 1;

            flex-shrink: 0;
        }

        .day-number.sun {
            color: #D9534F;
        }

        .day-number.sat {
            color: #4285D4;
        }

        .day-number.normal {
            color: #444;
        }

        .day-number.other-month {
            color: #C8C8C8;
        }

        /* 오늘 날짜 */

        .day-number.today {
            background: #6757E8;

            color: #fff !important;

            box-shadow:
                0 2px 5px rgba(103, 87, 232, 0.25);
        }


        /* =========================================================
           일정 내용 영역
        ========================================================= */

        .day-content {
            width: 100%;

            min-width: 0;

            margin-top: 4px;

            display: block;

            text-align: left;

            overflow: hidden;
        }


        /* =========================================================
           일정 한 줄 / 여러 줄
        ========================================================= */

        .schedule-line {
            display: inline;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 22px;

            line-height: 1.25;

            word-break: keep-all;

            overflow-wrap: normal;

            white-space: pre-wrap;
        }


        /* =========================================================
           이모지 + 텍스트 그룹
           
           핵심:
           이모지 하나가 따로 떨어지거나
           이미지 때문에 강제로 줄바꿈되지 않도록
           inline-flex + white-space: nowrap 처리
        ========================================================= */

        .emoji-text-group {
            display: inline-flex;

            align-items: center;

            vertical-align: middle;

            white-space: nowrap;

            max-width: 100%;

            margin: 0 1px;

            line-height: 1;
        }


        /* =========================================================
           실제 치지직 이모지
        ========================================================= */

        .chat-emoji {
            width: 30px;
            height: 30px;

            min-width: 30px;
            min-height: 30px;

            object-fit: contain;

            display: inline-block;

            vertical-align: middle;

            margin:
                0 1px;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================================================
           작은 이모지
           
           일정 칸이 좁을 때 사용
        ========================================================= */

        .schedule-text .chat-emoji {
            width: 28px;
            height: 28px;

            min-width: 28px;
            min-height: 28px;
        }


        /* =========================================================
           메모
        ========================================================= */

        .desktop-memo {
            position: relative;

            width: 100%;

            height: 110px;

            margin-top: 12px;

            padding:
                22px
                24px
                12px;

            background: #FDF0F1;

            border:
                2px solid
                #A94442;

            border-radius: 12px;

            flex-shrink: 0;
        }

        .memo-title {
            position: absolute;

            top: -20px;
            left: 18px;

            padding:
                0 12px;

            background: #FAF8F5;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 30px;

            font-weight: bold;
        }

        #global-memo {
            width: 100%;
            height: 100%;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 24px;

            line-height: 1.3;

            color: #A94442;
        }


        /* =========================================================
           모바일
        ========================================================= */

        @media (max-width: 767px) {

            body {
                background: #FAF8F5;
            }

            .diary-paper {
                width: 100%;

                height: auto;
                min-height: 100vh;

                padding:
                    45px
                    8px
                    18px;

                border-radius: 0;

                border-left: none;
                border-right: none;
            }

            .spring-wrapper {
                left: 10px;
                right: 10px;
            }

            .spring {
                width: 10px;
                height: 30px;
            }

            .spring::after {
                width: 9px;
                height: 9px;

                left: 1px;
                bottom: -4px;
            }

            .calendar-title {
                font-size: 27px;

                margin-right: 4px;

                margin-bottom: 8px;
            }

            .calendar-grid {
                height: 720px;

                border-radius: 10px;
            }

            .calendar-week {
                height: 38px;
            }

            .calendar-header-cell {
                font-size: 18px;
            }

            .calendar-cell {
                padding: 4px;
            }

            .day-number {
                width: 25px;
                height: 25px;

                font-size: 14px;
            }

            .schedule-line {
                font-size: 16px;
            }

            .chat-emoji {
                width: 22px;
                height: 22px;

                min-width: 22px;
                min-height: 22px;
            }

            .desktop-memo {
                height: 100px;

                padding:
                    18px
                    12px
                    8px;
            }

            .memo-title {
                font-size: 24px;

                top: -16px;
            }

            #global-memo {
                font-size: 19px;
            }
        }


        /* =========================================================
           모달
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 16px;

            background:
                rgba(0, 0, 0, 0.55);

            backdrop-filter:
                blur(5px);
        }

        .modal {
            width: 100%;
            max-width: 560px;

            max-height: 92vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #fff;

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 15px 18px;

            background: #FCECEF;

            border-bottom:
                1px solid
                #F2D5DA;
        }

        .modal-body {
            padding: 18px;

            overflow-y: auto;
        }

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 12px 18px;

            background: #F8F8F8;

            border-top:
                1px solid
                #eee;
        }


        /* =========================================================
           이모지 입력창
        ========================================================= */

        #modal-text {
            width: 100%;

            min-height: 100px;

            resize: vertical;

            padding: 12px;

            border:
                1px solid
                #D5D5D5;

            border-radius: 10px;

            outline: none;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 22px;

            line-height: 1.4;
        }

        #modal-text:focus {
            border-color: #E5A5AF;

            box-shadow:
                0 0 0 3px rgba(236, 150, 164, 0.15);
        }


        /* =========================================================
           이모지 영역
        ========================================================= */

        .emoji-section {
            margin-top: 14px;
        }

        .emoji-search-row {
            display: flex;

            gap: 8px;

            margin-bottom: 8px;
        }

        #emoji-search {
            flex: 1;

            height: 38px;

            padding: 0 12px;

            border:
                1px solid
                #D8D8D8;

            border-radius: 8px;

            outline: none;

            font-family:
                'Quicksand',
                sans-serif;
        }

        #emoji-pack {
            width: 150px;

            height: 38px;

            padding:
                0 8px;

            border:
                1px solid
                #D8D8D8;

            border-radius: 8px;

            background: #fff;

            outline: none;

            font-size: 13px;
        }


        /* =========================================================
           이모지 개수
        ========================================================= */

        .emoji-status {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 7px;

            font-size: 12px;

            color: #888;
        }


        /* =========================================================
           이모지 보드
        ========================================================= */

        #emoji-board {
            height: 190px;

            padding: 8px;

            overflow-y: auto;

            background: #FAFAFA;

            border:
                1px solid
                #E5E5E5;

            border-radius: 10px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(42px, 1fr)
                );

            align-content: start;

            gap: 4px;
        }


        /* =========================================================
           이모지 버튼
        ========================================================= */

        .emoji-button {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 7px;

            background: transparent;

            cursor: pointer;

            transition:
                background-color 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-button:hover {
            background: #F1E8EA;

            transform: scale(1.08);
        }

        .emoji-button.selected {
            background: #F4DCE1;

            box-shadow:
                inset 0 0 0 1px #D9939E;
        }

        .emoji-button img {
            width: 32px;
            height: 32px;

            object-fit: contain;

            pointer-events: none;
        }


        /* =========================================================
           선택된 이모지 정보
        ========================================================= */

        .selected-emoji {
            min-height: 34px;

            margin-top: 8px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                6px
                9px;

            background: #FFF7F8;

            border:
                1px solid
                #F0D8DC;

            border-radius: 8px;

            font-size: 12px;

            color: #777;
        }

        .selected-emoji img {
            width: 26px;
            height: 26px;

            object-fit: contain;
        }


        /* =========================================================
           로딩
        ========================================================= */

        .emoji-loading {
            grid-column: 1 / -1;

            display: flex;

            align-items: center;
            justify-content: center;

            height: 100px;

            color: #999;

            font-size: 13px;
        }


        /* =========================================================
           캡처용
        ========================================================= */

        #hidden-capture-container {
            position: fixed;

            left: -10000px;
            top: 0;

            width: 1480px;
            height: 1309px;

            overflow: hidden;

            pointer-events: none;

            background: transparent;
        }

        #hidden-capture-container .diary-paper {
            width: 1400px !important;
            max-width: none !important;

            height: 1220px !important;

            padding:
                58px
                46px
                34px
                46px !important;

            box-shadow: none !important;
        }

        #hidden-capture-container .calendar-grid {
            height: 1010px !important;
        }

        #hidden-capture-container .calendar-title {
            font-size: 46px !important;
        }

        #hidden-capture-container .calendar-header-cell {
            font-size: 25px !important;
        }

        #hidden-capture-container .day-number {
            font-size: 20px !important;
        }

        #hidden-capture-container .schedule-line {
            font-size: 22px !important;
        }

        #hidden-capture-container .chat-emoji {
            width: 28px !important;
            height: 28px !important;

            min-width: 28px !important;
            min-height: 28px !important;
        }

        #hidden-capture-container .desktop-memo {
            height: 110px !important;
        }

    </style>
</head>


<body>

    <!-- =========================================================
         캡처용 영역
    ========================================================= -->

    <div id="hidden-capture-container"></div>


    <!-- =========================================================
         메인
    ========================================================= -->

    <main
        id="capture-area"
        class="w-full flex justify-center p-0 md:p-8"
    >

        <section class="diary-paper">

            <!-- 스프링 -->

            <div
                id="springs-container"
                class="spring-wrapper"
            ></div>


            <!-- =================================================
                 날짜 제목
            ================================================= -->

            <div
                id="calendar-title"
                class="calendar-title"
            >
                2026.09
            </div>


            <!-- =================================================
                 달력
            ================================================= -->

            <div class="calendar-grid">

                <!-- 요일 -->

                <div class="calendar-week">

                    <div class="calendar-header-cell sun">
                        Sun
                    </div>

                    <div class="calendar-header-cell">
                        Mon
                    </div>

                    <div class="calendar-header-cell">
                        Tue
                    </div>

                    <div class="calendar-header-cell">
                        Wed
                    </div>

                    <div class="calendar-header-cell">
                        Thu
                    </div>

                    <div class="calendar-header-cell">
                        Fri
                    </div>

                    <div class="calendar-header-cell sat">
                        Sat
                    </div>

                </div>


                <!-- 날짜 -->

                <div id="calendar-days"></div>

            </div>


            <!-- =================================================
                 메모
            ================================================= -->

            <div class="desktop-memo">

                <span class="memo-title">
                    Memo
                </span>

                <textarea
                    id="global-memo"
                    placeholder="여기에 중요한 메모나 공지를 적어보세요..."
                ></textarea>

            </div>

        </section>

    </main>


    <!-- =========================================================
         일정 편집 모달
    ========================================================= -->

    <div
        id="edit-modal"
        class="modal-overlay hidden"
    >

        <div class="modal">

            <!-- 헤더 -->

            <div class="modal-header">

                <div>

                    <div
                        id="modal-date-title"
                        class="font-bold text-lg text-gray-800"
                    >
                    </div>

                    <div class="text-xs text-gray-500 mt-1">
                        일정과 치지직 이모지를 입력하세요.
                    </div>

                </div>

                <button
                    onclick="closeModal()"
                    class="text-gray-500 hover:text-gray-900"
                >
                    <i class="ph ph-x text-2xl"></i>
                </button>

            </div>


            <!-- 본문 -->

            <div class="modal-body">

                <!-- 일정 -->

                <label
                    class="block text-sm font-bold text-gray-700 mb-2"
                >
                    일정 내용
                </label>

                <textarea
                    id="modal-text"
                    rows="3"
                    placeholder="예: 20:00 방송 {sub_01}"
                ></textarea>


                <!-- 색상 -->

                <div class="mt-4">

                    <label
                        class="block text-sm font-bold text-gray-700 mb-2"
                    >
                        글자 색상
                    </label>

                    <div class="flex items-center gap-3">

                        <input
                            type="color"
                            id="modal-color"
                            value="#333333"
                            class="w-12 h-9 border border-gray-200 rounded cursor-pointer"
                        >

                        <span class="text-xs text-gray-500">
                            일정 글자의 색상을 선택하세요.
                        </span>

                    </div>

                </div>


                <!-- 이모지 -->

                <div class="emoji-section">

                    <div
                        class="flex items-center justify-between mb-2"
                    >

                        <label
                            class="text-sm font-bold text-gray-700"
                        >
                            치지직 이모지
                        </label>

                        <span class="text-xs text-gray-400">
                            클릭하면 {이모지코드}가 입력됩니다.
                        </span>

                    </div>


                    <!-- 검색 / 팩 -->

                    <div class="emoji-search-row">

                        <input
                            id="emoji-search"
                            type="text"
                            placeholder="이모지 검색..."
                            autocomplete="off"
                        >

                        <select id="emoji-pack">

                            <option value="">
                                전체 이모지
                            </option>

                        </select>

                    </div>


                    <!-- 상태 -->

                    <div class="emoji-status">

                        <span id="emoji-count">
                            이모지를 불러오는 중...
                        </span>

                        <span>
                            클릭 → 코드 삽입
                        </span>

                    </div>


                    <!-- 보드 -->

                    <div id="emoji-board">

                        <div class="emoji-loading">
                            치지직 이모지를 불러오는 중...
                        </div>

                    </div>


                    <!-- 선택 -->

                    <div
                        id="selected-emoji"
                        class="selected-emoji"
                    >

                        <span>
                            선택된 이모지가 없습니다.
                        </span>

                    </div>

                </div>

            </div>


            <!-- 하단 -->

            <div class="modal-footer">

                <button
                    onclick="closeModal()"
                    class="px-4 py-2 rounded-lg font-bold text-gray-600 hover:bg-gray-200"
                >
                    취소
                </button>

                <button
                    onclick="saveDayData()"
                    class="px-5 py-2 rounded-lg font-bold text-white bg-pink-500 hover:bg-pink-600"
                >
                    저장하기
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JavaScript
    ========================================================= -->

    <script>

        /* ========================================================
           기본 설정
        ======================================================== */

        const EMOJI_API_URL =
            'https://chzzk.dico.page/emojipacks';

        const STORAGE_KEY =
            'diary-calendar-v4';


        /* ========================================================
           상태
        ======================================================== */

        let currentDate = new Date();

        let calendarData = {};

        let globalMemo = '';

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojis = [];

        let emojiMap = new Map();


        /* ========================================================
           초기화
        ======================================================== */

        async function init() {

            loadLocalData();

            generateSprings();

            renderCalendar();

            setupEvents();

            await loadEmojis();

        }


        /* ========================================================
           localStorage
        ======================================================== */

        function loadLocalData() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                calendarData =
                    parsed.calendarData || {};

                globalMemo =
                    parsed.globalMemo || '';

                document.getElementById(
                    'global-memo'
                ).value = globalMemo;

            } catch (error) {

                console.error(
                    '저장 데이터 불러오기 실패:',
                    error
                );

            }

        }


        /* ========================================================
           저장
        ======================================================== */

        function saveLocalData() {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify({
                        calendarData,
                        globalMemo
                    })
                );

            } catch (error) {

                console.error(
                    '저장 실패:',
                    error
                );

            }

        }


        /* ========================================================
           스프링 생성
        ======================================================== */

        function generateSprings() {

            const container =
                document.getElementById(
                    'springs-container'
                );

            container.innerHTML = '';

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                const spring =
                    document.createElement('div');

                spring.className =
                    'spring';

                container.appendChild(
                    spring
                );

            }

        }


        /* ========================================================
           이벤트
        ======================================================== */

        function setupEvents() {

            document
                .getElementById('global-memo')
                .addEventListener(
                    'input',
                    function () {

                        globalMemo =
                            this.value;

                        saveLocalData();

                    }
                );


            document
                .getElementById('emoji-search')
                .addEventListener(
                    'input',
                    renderEmojiBoard
                );


            document
                .getElementById('emoji-pack')
                .addEventListener(
                    'change',
                    renderEmojiBoard
                );


            document
                .getElementById('edit-modal')
                .addEventListener(
                    'click',
                    function (event) {

                        if (
                            event.target === this
                        ) {

                            closeModal();

                        }

                    }
                );

        }


        /* ========================================================
           오늘 날짜
        ======================================================== */

        function isToday(dateStr) {

            const today =
                new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, '0');

            const day =
                String(
                    today.getDate()
                ).padStart(2, '0');

            return (
                dateStr ===
                `${year}-${month}-${day}`
            );

        }


        /* ========================================================
           달력
        ======================================================== */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();

            const title =
                `${year}.${String(month + 1).padStart(2, '0')}`;

            document.getElementById(
                'calendar-title'
            ).textContent = title;


            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            const prevLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const rowCount =
                Math.ceil(
                    (firstDay + lastDay) / 7
                );


            const totalCells =
                rowCount * 7;


            const container =
                document.getElementById(
                    'calendar-days'
                );

            container.innerHTML = '';

            container.style.setProperty(
                '--row-count',
                rowCount
            );


            for (
                let i = 0;
                i < totalCells;
                i++
            ) {

                let dayNumber;

                let isCurrentMonth =
                    true;

                let dateStr = '';

                if (i < firstDay) {

                    dayNumber =
                        prevLastDay -
                        firstDay +
                        i +
                        1;

                    isCurrentMonth =
                        false;

                } else if (
                    i <
                    firstDay + lastDay
                ) {

                    dayNumber =
                        i -
                        firstDay +
                        1;

                    dateStr =
                        `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;

                } else {

                    dayNumber =
                        i -
                        firstDay -
                        lastDay +
                        1;

                    isCurrentMonth =
                        false;

                }


                const col =
                    i % 7;


                const cell =
                    document.createElement(
                        'div'
                    );

                cell.className =
                    'calendar-cell';


                if (
                    i >=
                    totalCells - 7
                ) {

                    cell.classList.add(
                        'last-row'
                    );

                }


                if (!isCurrentMonth) {

                    cell.style.background =
                        '#FCFCFC';

                    const number =
                        document.createElement(
                            'div'
                        );

                    number.className =
                        'day-number other-month';

                    number.textContent =
                        dayNumber;

                    cell.appendChild(
                        number
                    );

                    container.appendChild(
                        cell
                    );

                    continue;

                }


                /* ----------------------------------------------
                   날짜
                ---------------------------------------------- */

                const number =
                    document.createElement(
                        'div'
                    );


                let numberClass =
                    'day-number normal';


                if (col === 0) {

                    numberClass =
                        'day-number sun';

                } else if (col === 6) {

                    numberClass =
                        'day-number sat';

                }


                if (isToday(dateStr)) {

                    numberClass +=
                        ' today';

                }


                number.className =
                    numberClass;

                number.textContent =
                    dayNumber;


                cell.appendChild(
                    number
                );


                /* ----------------------------------------------
                   내용
                ---------------------------------------------- */

                const content =
                    document.createElement(
                        'div'
                    );

                content.className =
                    'day-content';


                const data =
                    calendarData[dateStr];


                if (data && data.text) {

                    const schedule =
                        document.createElement(
                            'div'
                        );

                    schedule.className =
                        'schedule-line schedule-text';


                    schedule.style.color =
                        data.color ||
                        '#333333';


                    renderScheduleText(
                        schedule,
                        data.text
                    );


                    content.appendChild(
                        schedule
                    );

                }


                cell.appendChild(
                    content
                );


                cell.addEventListener(
                    'click',
                    function () {

                        openModal(
                            dateStr
                        );

                    }
                );


                container.appendChild(
                    cell
                );

            }

        }


        /* ========================================================
           일정 텍스트 → 이모지 이미지 변환
           
           예:
           
           20:00 방송 {sub_01}

           ↓

           20:00 방송 [이미지]
           
           핵심은 모든 이모지를
           inline-flex 그룹으로 묶는 것
        ======================================================== */

        function renderScheduleText(
            element,
            text
        ) {

            const regex =
                /\{([^{}]+)\}/g;

            let lastIndex = 0;

            let match;


            while (
                (match =
                    regex.exec(text))
                !== null
            ) {

                /* ----------------------------------------------
                   이모지 앞 일반 텍스트
                ---------------------------------------------- */

                const before =
                    text.slice(
                        lastIndex,
                        match.index
                    );


                if (before) {

                    element.appendChild(
                        document.createTextNode(
                            before
                        )
                    );

                }


                /* ----------------------------------------------
                   이모지 코드
                ---------------------------------------------- */

                const code =
                    match[1];


                const emoji =
                    emojiMap.get(code);


                if (emoji) {

                    const group =
                        document.createElement(
                            'span'
                        );

                    group.className =
                        'emoji-text-group';


                    const img =
                        document.createElement(
                            'img'
                        );

                    img.className =
                        'chat-emoji';


                    img.src =
                        emoji.image;


                    img.alt =
                        `{${code}}`;


                    img.title =
                        `{${code}}`;


                    img.loading =
                        'lazy';


                    group.appendChild(
                        img
                    );


                    element.appendChild(
                        group
                    );

                } else {

                    /*
                     * 아직 로드되지 않았거나
                     * 존재하지 않는 이모지는
                     * 원래 코드 그대로 표시
                     */

                    element.appendChild(
                        document.createTextNode(
                            `{${code}}`
                        )
                    );

                }


                lastIndex =
                    regex.lastIndex;

            }


            /* ----------------------------------------------
               마지막 일반 텍스트
            ---------------------------------------------- */

            const after =
                text.slice(
                    lastIndex
                );


            if (after) {

                element.appendChild(
                    document.createTextNode(
                        after
                    )
                );

            }

        }


        /* ========================================================
           치지직 이모지 API
        ======================================================== */

        async function loadEmojis() {

            const board =
                document.getElementById(
                    'emoji-board'
                );


            try {

                board.innerHTML = `
                    <div class="emoji-loading">
                        치지직 이모지를 불러오는 중...
                    </div>
                `;


                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            method: 'GET',
                            cache: 'no-cache'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                const source =
                    json.emojis || {};


                emojis = [];

                emojiMap.clear();


                /*
                 * 실제 API 구조:
                 *
                 * {
                 *   "emojis": {
                 *      "{:sub_01:}": {
                 *          "sub_01":
                 *          "https://..."
                 *      }
                 *   }
                 * }
                 *
                 * 또는
                 *
                 * {
                 *   "emojis": {
                 *      "{sub_01}": {
                 *          "sub_01":
                 *          "https://..."
                 *      }
                 *   }
                 * }
                 */


                Object.entries(
                    source
                ).forEach(
                    (
                        [
                            outerCode,
                            emojiData
                        ]
                    ) => {

                        if (
                            !emojiData ||
                            typeof emojiData !==
                            'object'
                        ) {

                            return;

                        }


                        Object.entries(
                            emojiData
                        ).forEach(
                            (
                                [
                                    name,
                                    image
                                ]
                            ) => {

                                if (
                                    typeof image !==
                                    'string'
                                ) {

                                    return;

                                }


                                /*
                                 * API 이름에서
                                 * 앞뒤 기호 제거
                                 */

                                let cleanName =
                                    String(name)
                                        .replace(
                                            /^\{:/,
                                            ''
                                        )
                                        .replace(
                                            /:\}$/,
                                            ''
                                        )
                                        .replace(
                                            /^\{/,
                                            ''
                                        )
                                        .replace(
                                            /\}$/,
                                            ''
                                        );


                                /*
                                 * {sub_01} 형태
                                 */

                                const code =
                                    cleanName;


                                /*
                                 * 이모지팩 추출
                                 *
                                 * sub_01
                                 * ag_01
                                 * mlb_01
                                 */

                                const pack =
                                    cleanName.includes('_')
                                        ? cleanName.split('_')[0]
                                        : cleanName;


                                const item = {

                                    code: code,

                                    name: cleanName,

                                    image: image,

                                    pack: pack,

                                    search:
                                        cleanName.toLowerCase()

                                };


                                /*
                                 * 중복 제거
                                 */

                                if (
                                    emojiMap.has(
                                        code
                                    )
                                ) {

                                    return;

                                }


                                emojiMap.set(
                                    code,
                                    item
                                );


                                emojis.push(
                                    item
                                );

                            }
                        );

                    }
                );


                /*
                 * 이름순 정렬
                 */

                emojis.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name
                        )
                );


                buildEmojiPackList();

                renderEmojiBoard();


                document.getElementById(
                    'emoji-count'
                ).textContent =
                    `전체 ${emojis.length}개`;


                /*
                 * 이미 저장된 일정이 있다면
                 * 이모지가 로드된 뒤 다시 렌더링
                 */

                renderCalendar();


            } catch (error) {

                console.error(
                    '치지직 이모지 로딩 실패:',
                    error
                );


                board.innerHTML = `
                    <div class="emoji-loading">
                        이모지를 불러오지 못했습니다.
                        <br>
                        API 또는 CORS 설정을 확인해주세요.
                    </div>
                `;


                document.getElementById(
                    'emoji-count'
                ).textContent =
                    '이모지 로딩 실패';

            }

        }


        /* ========================================================
           이모지팩 목록
        ======================================================== */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    'emoji-pack'
                );


            const counts =
                new Map();


            emojis.forEach(
                emoji => {

                    counts.set(
                        emoji.pack,
                        (counts.get(
                            emoji.pack
                        ) || 0) + 1
                    );

                }
            );


            select.innerHTML = '';


            const allOption =
                document.createElement(
                    'option'
                );

            allOption.value = '';

            allOption.textContent =
                `전체 이모지 (${emojis.length})`;

            select.appendChild(
                allOption
            );


            Array.from(
                counts.entries()
            )
                .sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0]
                        )
                )
                .forEach(
                    (
                        [
                            pack,
                            count
                        ]
                    ) => {

                        const option =
                            document.createElement(
                                'option'
                            );

                        option.value =
                            pack;

                        option.textContent =
                            `${pack} (${count})`;

                        select.appendChild(
                            option
                        );

                    }
                );

        }


        /* ========================================================
           이모지 보드 렌더링
        ======================================================== */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    'emoji-board'
                );


            const search =
                document
                    .getElementById(
                        'emoji-search'
                    )
                    .value
                    .trim()
                    .toLowerCase();


            const pack =
                document
                    .getElementById(
                        'emoji-pack'
                    )
                    .value;


            const filtered =
                emojis.filter(
                    emoji => {

                        const searchMatch =
                            !search ||
                            emoji.search.includes(
                                search
                            );


                        const packMatch =
                            !pack ||
                            emoji.pack ===
                            pack;


                        return (
                            searchMatch &&
                            packMatch
                        );

                    }
                );


            board.innerHTML = '';


            if (!filtered.length) {

                board.innerHTML = `
                    <div class="emoji-loading">
                        검색 결과가 없습니다.
                    </div>
                `;

                document.getElementById(
                    'emoji-count'
                ).textContent =
                    '검색 결과 0개';

                return;

            }


            document.getElementById(
                'emoji-count'
            ).textContent =
                `${filtered.length}개 표시`;


            const fragment =
                document.createDocumentFragment();


            filtered.forEach(
                emoji => {

                    const button =
                        document.createElement(
                            'button'
                        );


                    button.type =
                        'button';


                    button.className =
                        'emoji-button';


                    if (
                        selectedEmoji &&
                        selectedEmoji.code ===
                        emoji.code
                    ) {

                        button.classList.add(
                            'selected'
                        );

                    }


                    button.title =
                        `{${emoji.code}}`;


                    const img =
                        document.createElement(
                            'img'
                        );


                    img.src =
                        emoji.image;


                    img.alt =
                        emoji.code;


                    img.loading =
                        'lazy';


                    button.appendChild(
                        img
                    );


                    button.addEventListener(
                        'click',
                        function () {

                            insertEmoji(
                                emoji
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            board.appendChild(
                fragment
            );

        }


        /* ========================================================
           이모지 삽입
           
           textarea에는 반드시
           
           {sub_01}
           
           형태로 들어감
        ======================================================== */

        function insertEmoji(
            emoji
        ) {

            const textarea =
                document.getElementById(
                    'modal-text'
                );


            const token =
                `{${emoji.code}}`;


            const start =
                textarea.selectionStart;


            const end =
                textarea.selectionEnd;


            const current =
                textarea.value;


            textarea.value =
                current.substring(
                    0,
                    start
                ) +
                token +
                current.substring(
                    end
                );


            textarea.focus();


            /*
             * 삽입 후 커서를
             * 이모지 코드 뒤로 이동
             */

            const cursor =
                start +
                token.length;


            textarea.selectionStart =
                cursor;

            textarea.selectionEnd =
                cursor;


            selectedEmoji =
                emoji;


            updateSelectedEmoji();


            renderEmojiBoard();

        }


        /* ========================================================
           선택 이모지 표시
        ======================================================== */

        function updateSelectedEmoji() {

            const area =
                document.getElementById(
                    'selected-emoji'
                );


            if (!selectedEmoji) {

                area.innerHTML = `
                    <span>
                        선택된 이모지가 없습니다.
                    </span>
                `;

                return;

            }


            area.innerHTML = `
                <img
                    src="${escapeAttribute(selectedEmoji.image)}"
                    alt="${escapeAttribute(selectedEmoji.code)}"
                >

                <span>
                    <strong>
                        {${escapeHtml(selectedEmoji.code)}}
                    </strong>
                    이모지가 입력됩니다.
                </span>
            `;

        }


        /* ========================================================
           모달 열기
        ======================================================== */

        function openModal(
            dateStr
        ) {

            editingDateStr =
                dateStr;


            const data =
                calendarData[dateStr] ||
                {
                    text: '',
                    color: '#333333'
                };


            const [
                year,
                month,
                day
            ] =
                dateStr.split('-');


            document.getElementById(
                'modal-date-title'
            ).textContent =
                `${year}년 ${parseInt(month)}월 ${parseInt(day)}일`;


            document.getElementById(
                'modal-text'
            ).value =
                data.text || '';


            document.getElementById(
                'modal-color'
            ).value =
                data.color ||
                '#333333';


            selectedEmoji =
                findLastEmoji(
                    data.text || ''
                );


            updateSelectedEmoji();

            renderEmojiBoard();


            document.getElementById(
                'edit-modal'
            ).classList.remove(
                'hidden'
            );


            setTimeout(
                () => {

                    document.getElementById(
                        'modal-text'
                    ).focus();

                },
                50
            );

        }


        /* ========================================================
           마지막 이모지 찾기
        ======================================================== */

        function findLastEmoji(
            text
        ) {

            const matches =
                [
                    ...text.matchAll(
                        /\{([^{}]+)\}/g
                    )
                ];


            for (
                let i = matches.length - 1;
                i >= 0;
                i--
            ) {

                const code =
                    matches[i][1];


                if (
                    emojiMap.has(
                        code
                    )
                ) {

                    return emojiMap.get(
                        code
                    );

                }

            }


            return null;

        }


        /* ========================================================
           모달 닫기
        ======================================================== */

        function closeModal() {

            document.getElementById(
                'edit-modal'
            ).classList.add(
                'hidden'
            );


            editingDateStr =
                null;


            selectedEmoji =
                null;

        }


        /* ========================================================
           일정 저장
        ======================================================== */

        function saveDayData() {

            if (!editingDateStr) {
                return;
            }


            const text =
                document.getElementById(
                    'modal-text'
                ).value;


            const color =
                document.getElementById(
                    'modal-color'
                ).value;


            if (
                !text.trim()
            ) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text:
                        text,

                    color:
                        color

                };

            }


            saveLocalData();

            closeModal();

            renderCalendar();

        }


        /* ========================================================
           이전 / 다음 달
        ======================================================== */

        function changeMonth(
            delta
        ) {

            currentDate.setMonth(
                currentDate.getMonth() +
                delta
            );

            renderCalendar();

        }


        /* ========================================================
           오늘
        ======================================================== */

        function goToToday() {

            currentDate =
                new Date();

            renderCalendar();

        }


        /* ========================================================
           HTML escape
        ======================================================== */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        /* ========================================================
           Attribute escape
        ======================================================== */

        function escapeAttribute(
            value
        ) {

            return escapeHtml(
                value
            );

        }


        /* ========================================================
           이미지 저장
        ======================================================== */

        async function downloadCalendar() {

            const source =
                document.getElementById(
                    'capture-area'
                );


            const capture =
                document.getElementById(
                    'hidden-capture-container'
                );


            try {

                await document.fonts.ready;


                const clone =
                    source.cloneNode(
                        true
                    );


                /*
                 * 캡처 영역 ID 제거
                 */

                clone.id =
                    'capture-clone';


                /*
                 * 모바일 클래스 영향을
                 * 받지 않도록 강제
                 */

                clone.style.width =
                    '1400px';

                clone.style.height =
                    '1220px';

                clone.style.maxWidth =
                    'none';


                /*
                 * textarea를 일반 텍스트로 변경
                 */

                const memoTextarea =
                    clone.querySelector(
                        '#global-memo'
                    );


                if (
                    memoTextarea
                ) {

                    const memo =
                        globalMemo ||
                        '';


                    const memoText =
                        document.createElement(
                            'div'
                        );


                    memoText.style.width =
                        '100%';

                    memoText.style.height =
                        '100%';

                    memoText.style.fontFamily =
                        "'Nanum Pen Script', cursive";

                    memoText.style.fontSize =
                        '24px';

                    memoText.style.lineHeight =
                        '1.3';

                    memoText.style.color =
                        '#A94442';

                    memoText.style.whiteSpace =
                        'pre-wrap';

                    memoText.textContent =
                        memo;


                    memoTextarea.replaceWith(
                        memoText
                    );

                }


                capture.innerHTML =
                    '';


                capture.appendChild(
                    clone
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            150
                        )
                );


                const canvas =
                    await html2canvas(
                        capture,
                        {

                            width:
                                1480,

                            height:
                                1309,

                            windowWidth:
                                1480,

                            windowHeight:
                                1309,

                            scale:
                                1,

                            backgroundColor:
                                null,

                            useCORS:
                                true,

                            allowTaint:
                                false,

                            logging:
                                false

                        }
                    );


                const link =
                    document.createElement(
                        'a'
                    );


                const title =
                    document
                        .getElementById(
                            'calendar-title'
                        )
                        .textContent
                        .replace(
                            '.',
                            '_'
                        );


                link.download =
                    `다이어리_${title}.png`;


                link.href =
                    canvas.toDataURL(
                        'image/png'
                    );


                link.click();


            } catch (error) {

                console.error(
                    '이미지 저장 실패:',
                    error
                );


                alert(
                    '이미지 저장 중 오류가 발생했습니다.'
                );

            } finally {

                capture.innerHTML =
                    '';

            }

        }


        /* ========================================================
           키보드 ESC
        ======================================================== */

        document.addEventListener(
            'keydown',
            function (event) {

                if (
                    event.key ===
                    'Escape'
                ) {

                    closeModal();

                }

            }
        );


        /* ========================================================
           시작
        ======================================================== */

        window.addEventListener(
            'load',
            init
        );

    </script>

</body>

</html>
