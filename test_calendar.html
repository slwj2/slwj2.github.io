<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 화면 대응 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>월간 일정표</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- html2canvas -->
    <script
        src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
    ></script>

    <style>

        /* =========================================================
           기본 설정
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Noto Sans KR", sans-serif;
            background: #f7f8fc;
            color: #252936;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================================================
           스크롤바
        ========================================================= */

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d7d9e2;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bfc2ce;
        }

        /* =========================================================
           캘린더
        ========================================================= */

        .calendar {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            overflow: hidden;
            border: 1px solid #e7e8ef;
            border-radius: 20px;
            background: white;
        }

        .calendar th {
            height: 48px;
            background: #fafaff;
            border-bottom: 1px solid #e7e8ef;
            color: #7b7f8d;
            font-size: 14px;
            font-weight: 700;
        }

        .calendar td {
            position: relative;
            height: 130px;
            padding: 9px;
            vertical-align: top;
            border-right: 1px solid #eeeeF4;
            border-bottom: 1px solid #eeeeF4;
            background: white;
            transition: background 0.15s ease;
        }

        .calendar td:last-child {
            border-right: 0;
        }

        .calendar tr:last-child td {
            border-bottom: 0;
        }

        .calendar td:hover {
            background: #fafaff;
        }

        .day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            color: #666b79;
        }

        .day-number.today {
            color: white;
            background: #6c63ff;
        }

        .day-number.other-month {
            color: #c6c8d1;
        }

        .day-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 6px;
        }

        /* =========================================================
           달력에 표시되는 치지직 이모지
        ========================================================= */

        .day-emoji {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 34px;
            overflow: hidden;
        }

        .day-emoji img {
            display: block;
            width: 30px;
            height: 30px;
            object-fit: contain;
            image-rendering: auto;
        }

        .day-text {
            width: 100%;
            max-height: 58px;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.45;
            font-size: 12px;
            font-weight: 600;
        }

        /* =========================================================
           모달
        ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 18, 28, 0.48);
            backdrop-filter: blur(5px);
        }

        .modal {
            width: min(650px, 100%);
            max-height: min(850px, calc(100vh - 40px));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            background: white;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 22px;
            border-bottom: 1px solid #eeeeF4;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 15px 22px;
            border-top: 1px solid #eeeeF4;
            background: #fff;
        }

        /* =========================================================
           입력
        ========================================================= */

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #5e6270;
        }

        .text-input,
        .text-area,
        .select-input {
            width: 100%;
            border: 1px solid #e1e3eb;
            border-radius: 12px;
            outline: none;
            background: white;
            color: #252936;
            transition: 0.15s ease;
        }

        .text-input {
            height: 44px;
            padding: 0 13px;
            font-size: 14px;
        }

        .text-area {
            min-height: 100px;
            resize: vertical;
            padding: 12px 13px;
            line-height: 1.5;
            font-size: 14px;
        }

        .select-input {
            height: 42px;
            padding: 0 12px;
            font-size: 13px;
        }

        .text-input:focus,
        .text-area:focus,
        .select-input:focus {
            border-color: #8b84ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
        }

        /* =========================================================
           이모지 영역
        ========================================================= */

        .emoji-section {
            margin-top: 20px;
        }

        .emoji-toolbar {
            display: grid;
            grid-template-columns: 1fr 150px;
            gap: 8px;
        }

        .emoji-board-wrap {
            position: relative;
            margin-top: 10px;
            min-height: 190px;
            max-height: 270px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e5e6ed;
            border-radius: 14px;
            background: #fafbfe;
        }

        /* =========================================================
           치지직 채팅형 이모지 그리드
        ========================================================= */

        .emoji-board {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 3px;
        }

        .emoji-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 4px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            transition:
                background 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-item:hover {
            background: #eceeff;
            transform: scale(1.06);
        }

        .emoji-item.selected {
            background: #e4e2ff;
            box-shadow: inset 0 0 0 2px #7169ff;
        }

        .emoji-item img {
            display: block;
            width: 34px;
            height: 34px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .emoji-empty {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 170px;
            color: #9699a6;
            font-size: 13px;
        }

        /* =========================================================
           선택된 이모지 미리보기
        ========================================================= */

        .selected-emoji-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f7f7fb;
        }

        .selected-emoji-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .selected-emoji-preview img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .selected-emoji-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            color: #777b89;
        }

        .emoji-remove {
            flex-shrink: 0;
            border: 0;
            background: transparent;
            color: #9a9daa;
            font-size: 12px;
        }

        .emoji-remove:hover {
            color: #ef596e;
        }

        /* =========================================================
           색상 선택
        ========================================================= */

        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input {
            width: 44px;
            height: 36px;
            padding: 3px;
            border: 1px solid #e0e2ea;
            border-radius: 9px;
            background: white;
            cursor: pointer;
        }

        .color-value {
            font-size: 12px;
            color: #858896;
        }

        /* =========================================================
           버튼
        ========================================================= */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
            padding: 0 15px;
            border: 0;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f1f5;
            color: #646875;
        }

        .btn-secondary:hover {
            background: #e6e7ed;
        }

        .btn-primary {
            background: #6c63ff;
            color: white;
        }

        .btn-primary:hover {
            background: #5b52ee;
        }

        /* =========================================================
           로딩
        ========================================================= */

        .emoji-loading {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 170px;
            color: #777b88;
            font-size: 13px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border: 2px solid #dcdde8;
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           반응형
        ========================================================= */

        @media (max-width: 768px) {

            .calendar {
                border-radius: 14px;
            }

            .calendar th {
                height: 38px;
                font-size: 11px;
            }

            .calendar td {
                height: 95px;
                padding: 5px;
            }

            .day-number {
                width: 23px;
                height: 23px;
                font-size: 11px;
            }

            .day-emoji {
                height: 29px;
            }

            .day-emoji img {
                width: 25px;
                height: 25px;
            }

            .day-text {
                font-size: 10px;
                max-height: 40px;
            }

            .emoji-toolbar {
                grid-template-columns: 1fr;
            }

            .emoji-board {
                grid-template-columns: repeat(7, minmax(0, 1fr));
            }

            .emoji-item img {
                width: 31px;
                height: 31px;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .modal {
                max-height: calc(100vh - 20px);
                border-radius: 18px;
            }

            .modal-header {
                padding: 16px;
            }

            .modal-body {
                padding: 16px;
            }

            .modal-footer {
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {

            .calendar td {
                height: 82px;
                padding: 4px;
            }

            .day-number {
                width: 21px;
                height: 21px;
            }

            .day-emoji img {
                width: 23px;
                height: 23px;
            }

            .day-text {
                font-size: 9px;
            }

            .emoji-board {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .emoji-item img {
                width: 29px;
                height: 29px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         전체 페이지
    ========================================================== -->

    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- 상단 -->
        <section class="mb-6">

            <div class="flex items-center justify-between gap-4">

                <div>
                    <h1
                        id="calendarTitle"
                        class="text-3xl md:text-4xl font-bold"
                        style="font-family: Jua, sans-serif;"
                    >
                        2026년 9월
                    </h1>

                    <p class="mt-2 text-sm text-gray-400">
                        하루의 일정을 기록해보세요.
                    </p>
                </div>

                <div class="flex items-center gap-2">

                    <button
                        id="prevMonth"
                        class="btn btn-secondary"
                        title="이전 달"
                    >
                        <i class="ph ph-caret-left"></i>
                    </button>

                    <button
                        id="todayButton"
                        class="btn btn-secondary"
                    >
                        오늘
                    </button>

                    <button
                        id="nextMonth"
                        class="btn btn-secondary"
                        title="다음 달"
                    >
                        <i class="ph ph-caret-right"></i>
                    </button>

                    <button
                        id="downloadButton"
                        class="btn btn-primary"
                    >
                        <i class="ph ph-download-simple"></i>
                        <span class="hidden sm:inline">PNG</span>
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================================
             캘린더
        ====================================================== -->

        <section id="calendarCapture">

            <table class="calendar">

                <thead>

                    <tr>

                        <th>일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>

                    </tr>

                </thead>

                <tbody id="calendarBody"></tbody>

            </table>

        </section>


        <!-- =====================================================
             메모
        ====================================================== -->

        <section class="mt-6">

            <label
                for="memo"
                class="input-label"
            >
                월간 메모
            </label>

            <textarea
                id="memo"
                class="text-area"
                placeholder="이번 달에 기억해둘 내용을 적어보세요."
                style="min-height: 80px;"
            ></textarea>

        </section>

    </main>


    <!-- =========================================================
         일정 입력 모달
    ========================================================== -->

    <div
        id="modalBackdrop"
        class="modal-backdrop hidden"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
        >

            <!-- 헤더 -->
            <div class="modal-header">

                <div>

                    <h2
                        id="modalDate"
                        class="text-xl font-bold"
                    >
                        일정 추가
                    </h2>

                    <p class="mt-1 text-xs text-gray-400">
                        해당 날짜의 일정과 치지직 이모지를 설정하세요.
                    </p>

                </div>

                <button
                    id="closeModal"
                    class="w-9 h-9 rounded-full flex items-center justify-center bg-gray-100 text-gray-500 hover:bg-gray-200"
                    title="닫기"
                >
                    <i class="ph ph-x"></i>
                </button>

            </div>


            <!-- 본문 -->
            <div class="modal-body">

                <!-- 일정 내용 -->
                <div>

                    <label
                        for="scheduleText"
                        class="input-label"
                    >
                        일정 내용
                    </label>

                    <textarea
                        id="scheduleText"
                        class="text-area"
                        placeholder="일정 내용을 입력해주세요."
                    ></textarea>

                </div>


                <!-- 글자 색 -->
                <div class="mt-5">

                    <label class="input-label">
                        텍스트 색상
                    </label>

                    <div class="color-row">

                        <input
                            id="textColor"
                            class="color-input"
                            type="color"
                            value="#252936"
                        >

                        <span
                            id="colorValue"
                            class="color-value"
                        >
                            #252936
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     치지직 이모지
                ================================================== -->

                <div class="emoji-section">

                    <label class="input-label">
                        치지직 이모지
                    </label>


                    <!-- 검색 / 팩 선택 -->
                    <div class="emoji-toolbar">

                        <input
                            id="emojiSearch"
                            class="text-input"
                            type="text"
                            placeholder="이모지 검색..."
                            autocomplete="off"
                        >


                        <select
                            id="emojiPack"
                            class="select-input"
                        >

                            <option value="">
                                이모지 불러오는 중...
                            </option>

                        </select>

                    </div>


                    <!-- 선택된 이모지 -->
                    <div
                        id="selectedEmojiBox"
                        class="selected-emoji-box hidden"
                    >

                        <div
                            id="selectedEmojiPreview"
                            class="selected-emoji-preview"
                        ></div>

                        <div
                            id="selectedEmojiName"
                            class="selected-emoji-name"
                        ></div>

                        <button
                            id="removeEmoji"
                            class="emoji-remove"
                        >
                            선택 해제
                        </button>

                    </div>


                    <!-- 이모지 보드 -->
                    <div class="emoji-board-wrap">

                        <div
                            id="emojiBoard"
                            class="emoji-board"
                        >

                            <div class="emoji-loading">

                                <span class="spinner"></span>

                                치지직 이모지를 불러오는 중...

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- 푸터 -->
            <div class="modal-footer">

                <button
                    id="cancelButton"
                    class="btn btn-secondary"
                >
                    취소
                </button>

                <button
                    id="saveButton"
                    class="btn btn-primary"
                >
                    <i class="ph ph-check"></i>
                    저장
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           기본 설정
        ========================================================= */

        const EMOJI_API_URL =
            "https://chzzk.dico.page/emojipacks";

        const STORAGE_KEY =
            "monthly_calendar_data_v2";


        /* =========================================================
           현재 날짜
        ========================================================= */

        const today = new Date();

        let currentYear =
            today.getFullYear();

        let currentMonth =
            today.getMonth();


        /* =========================================================
           현재 선택된 날짜
        ========================================================= */

        let selectedDate = null;


        /* =========================================================
           이모지 데이터
        ========================================================= */

        let emojis = [];

        let selectedEmoji = null;


        /* =========================================================
           DOM
        ========================================================= */

        const calendarTitle =
            document.getElementById("calendarTitle");

        const calendarBody =
            document.getElementById("calendarBody");

        const prevMonth =
            document.getElementById("prevMonth");

        const nextMonth =
            document.getElementById("nextMonth");

        const todayButton =
            document.getElementById("todayButton");

        const downloadButton =
            document.getElementById("downloadButton");

        const memo =
            document.getElementById("memo");


        /* =========================================================
           모달 DOM
        ========================================================= */

        const modalBackdrop =
            document.getElementById("modalBackdrop");

        const modalDate =
            document.getElementById("modalDate");

        const scheduleText =
            document.getElementById("scheduleText");

        const textColor =
            document.getElementById("textColor");

        const colorValue =
            document.getElementById("colorValue");

        const emojiSearch =
            document.getElementById("emojiSearch");

        const emojiPack =
            document.getElementById("emojiPack");

        const emojiBoard =
            document.getElementById("emojiBoard");

        const selectedEmojiBox =
            document.getElementById("selectedEmojiBox");

        const selectedEmojiPreview =
            document.getElementById("selectedEmojiPreview");

        const selectedEmojiName =
            document.getElementById("selectedEmojiName");

        const removeEmoji =
            document.getElementById("removeEmoji");

        const closeModal =
            document.getElementById("closeModal");

        const cancelButton =
            document.getElementById("cancelButton");

        const saveButton =
            document.getElementById("saveButton");


        /* =========================================================
           데이터 불러오기
        ========================================================= */

        function loadData() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {

                    return {
                        days: {},
                        memo: ""
                    };

                }

                const data =
                    JSON.parse(saved);

                return {

                    days:
                        data.days || {},

                    memo:
                        data.memo || ""

                };

            } catch (error) {

                console.error(
                    "저장 데이터 불러오기 실패:",
                    error
                );

                return {
                    days: {},
                    memo: ""
                };

            }

        }


        /* =========================================================
           데이터 저장
        ========================================================= */

        function saveData(data) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(data)
                );

            } catch (error) {

                console.error(
                    "데이터 저장 실패:",
                    error
                );

            }

        }


        /* =========================================================
           전체 데이터
        ========================================================= */

        let appData =
            loadData();


        /* =========================================================
           날짜 키
        ========================================================= */

        function getDateKey(
            year,
            month,
            day
        ) {

            return [
                year,
                String(month + 1).padStart(2, "0"),
                String(day).padStart(2, "0")
            ].join("-");

        }


        /* =========================================================
           달력 렌더링
        ========================================================= */

        function renderCalendar() {

            calendarTitle.textContent =
                `${currentYear}년 ${currentMonth + 1}월`;

            calendarBody.innerHTML = "";


            const firstDay =
                new Date(
                    currentYear,
                    currentMonth,
                    1
                ).getDay();


            const lastDate =
                new Date(
                    currentYear,
                    currentMonth + 1,
                    0
                ).getDate();


            const previousLastDate =
                new Date(
                    currentYear,
                    currentMonth,
                    0
                ).getDate();


            let dayNumber = 1;

            let nextMonthDay = 1;


            /*
             * 최대 6주
             */
            for (
                let week = 0;
                week < 6;
                week++
            ) {

                const row =
                    document.createElement("tr");


                for (
                    let weekday = 0;
                    weekday < 7;
                    weekday++
                ) {

                    const cell =
                        document.createElement("td");


                    let displayDay;

                    let cellYear =
                        currentYear;

                    let cellMonth =
                        currentMonth;

                    let isOtherMonth =
                        false;


                    /*
                     * 이전 달
                     */
                    if (
                        week === 0 &&
                        weekday < firstDay
                    ) {

                        displayDay =
                            previousLastDate -
                            firstDay +
                            weekday +
                            1;

                        cellMonth--;

                        isOtherMonth = true;

                        if (cellMonth < 0) {

                            cellMonth = 11;
                            cellYear--;

                        }

                    }


                    /*
                     * 현재 달
                     */
                    else if (
                        dayNumber <= lastDate
                    ) {

                        displayDay =
                            dayNumber++;

                    }


                    /*
                     * 다음 달
                     */
                    else {

                        displayDay =
                            nextMonthDay++;

                        cellMonth++;

                        isOtherMonth = true;

                        if (cellMonth > 11) {

                            cellMonth = 0;
                            cellYear++;

                        }

                    }


                    const dateKey =
                        getDateKey(
                            cellYear,
                            cellMonth,
                            displayDay
                        );


                    const dayData =
                        appData.days[dateKey];


                    /* 날짜 영역 */
                    const dayHeader =
                        document.createElement("div");

                    dayHeader.className =
                        "flex items-center justify-between";


                    const dayNumberElement =
                        document.createElement("div");

                    dayNumberElement.className =
                        "day-number";


                    if (isOtherMonth) {

                        dayNumberElement.classList.add(
                            "other-month"
                        );

                    }


                    /*
                     * 오늘 날짜
                     */
                    if (
                        cellYear === today.getFullYear() &&
                        cellMonth === today.getMonth() &&
                        displayDay === today.getDate()
                    ) {

                        dayNumberElement.classList.add(
                            "today"
                        );

                    }


                    dayNumberElement.textContent =
                        displayDay;


                    dayHeader.appendChild(
                        dayNumberElement
                    );


                    cell.appendChild(
                        dayHeader
                    );


                    /* 내용 */
                    const content =
                        document.createElement("div");

                    content.className =
                        "day-content";


                    /*
                     * 이모지
                     */
                    if (
                        dayData &&
                        dayData.emoji &&
                        dayData.emoji.image
                    ) {

                        const emojiContainer =
                            document.createElement("div");

                        emojiContainer.className =
                            "day-emoji";


                        const emojiImage =
                            document.createElement("img");

                        emojiImage.src =
                            dayData.emoji.image;

                        emojiImage.alt =
                            dayData.emoji.name ||
                            "치지직 이모지";

                        emojiImage.loading =
                            "lazy";

                        emojiContainer.appendChild(
                            emojiImage
                        );

                        content.appendChild(
                            emojiContainer
                        );

                    }


                    /*
                     * 일정 텍스트
                     */
                    if (
                        dayData &&
                        dayData.text
                    ) {

                        const text =
                            document.createElement("div");

                        text.className =
                            "day-text";

                        text.style.color =
                            dayData.color ||
                            "#252936";

                        text.textContent =
                            dayData.text;

                        content.appendChild(
                            text
                        );

                    }


                    cell.appendChild(
                        content
                    );


                    /*
                     * 다른 달 날짜도 클릭 가능
                     */
                    cell.addEventListener(
                        "click",
                        () => {

                            openModal(
                                cellYear,
                                cellMonth,
                                displayDay
                            );

                        }
                    );


                    row.appendChild(
                        cell
                    );

                }


                calendarBody.appendChild(
                    row
                );


                /*
                 * 실제 달력에 필요한 주까지만 표시
                 */
                if (
                    dayNumber > lastDate &&
                    week >= 4
                ) {

                    break;

                }

            }

        }


        /* =========================================================
           모달 열기
        ========================================================= */

        function openModal(
            year,
            month,
            day
        ) {

            selectedDate = {
                year,
                month,
                day
            };


            const dateKey =
                getDateKey(
                    year,
                    month,
                    day
                );


            const data =
                appData.days[dateKey] || {};


            const date =
                new Date(
                    year,
                    month,
                    day
                );


            const weekdayNames = [
                "일",
                "월",
                "화",
                "수",
                "목",
                "금",
                "토"
            ];


            modalDate.textContent =
                `${year}년 ${month + 1}월 ${day}일 (${weekdayNames[date.getDay()]})`;


            scheduleText.value =
                data.text || "";


            textColor.value =
                data.color || "#252936";


            colorValue.textContent =
                textColor.value;


            emojiSearch.value =
                "";


            selectedEmoji =
                data.emoji
                    ? {
                        ...data.emoji
                    }
                    : null;


            updateSelectedEmoji();


            renderEmojiBoard();


            modalBackdrop.classList.remove(
                "hidden"
            );


            setTimeout(
                () => scheduleText.focus(),
                50
            );

        }


        /* =========================================================
           모달 닫기
        ========================================================= */

        function closeModalWindow() {

            modalBackdrop.classList.add(
                "hidden"
            );

            selectedDate = null;

        }


        /* =========================================================
           선택 이모지 UI
        ========================================================= */

        function updateSelectedEmoji() {

            selectedEmojiPreview.innerHTML =
                "";

            if (!selectedEmoji) {

                selectedEmojiBox.classList.add(
                    "hidden"
                );

                return;

            }


            const image =
                document.createElement("img");

            image.src =
                selectedEmoji.image;

            image.alt =
                selectedEmoji.name ||
                "선택된 이모지";


            selectedEmojiPreview.appendChild(
                image
            );


            selectedEmojiName.textContent =
                selectedEmoji.code ||
                selectedEmoji.name ||
                "";


            selectedEmojiBox.classList.remove(
                "hidden"
            );

        }


        /* =========================================================
           이모지 제거
        ========================================================= */

        removeEmoji.addEventListener(
            "click",
            () => {

                selectedEmoji = null;

                updateSelectedEmoji();

                renderEmojiBoard();

            }
        );


        /* =========================================================
           치지직 이모지 API 로드
        ========================================================= */

        async function loadEmojis() {

            emojiBoard.innerHTML = `
                <div class="emoji-loading">
                    <span class="spinner"></span>
                    치지직 이모지를 불러오는 중...
                </div>
            `;


            try {

                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                console.log(
                    "치지직 이모지 API:",
                    json
                );


                /*
                 * 실제 API 구조:
                 *
                 * {
                 *     "emojis": {
                 *         "{:ag_1:}": {
                 *             "ag_1":
                 *             "https://....png"
                 *         }
                 *     }
                 * }
                 *
                 * 따라서 바로
                 *
                 * Object.entries(json.emojis)
                 *
                 * 했을 때 value가 이미지 URL이 아니라
                 * 또 하나의 객체입니다.
                 */


                const source =
                    json &&
                    json.emojis
                        ? json.emojis
                        : json;


                const result = [];

                const duplicateCheck =
                    new Set();


                /*
                 * 전체 이모지 순회
                 */
                Object.entries(
                    source || {}
                ).forEach(
                    (
                        [outerCode, emojiData]
                    ) => {


                        /*
                         * -------------------------------------------------
                         * 구조 1
                         *
                         * "{:ag_1:}": {
                         *     "ag_1": "이미지 URL"
                         * }
                         * -------------------------------------------------
                         */
                        if (
                            emojiData &&
                            typeof emojiData === "object" &&
                            !Array.isArray(emojiData)
                        ) {

                            Object.entries(
                                emojiData
                            ).forEach(
                                (
                                    [name, image]
                                ) => {

                                    if (
                                        typeof image !==
                                        "string"
                                    ) {

                                        return;

                                    }


                                    if (
                                        !image.startsWith(
                                            "http"
                                        )
                                    ) {

                                        return;

                                    }


                                    const code =
                                        outerCode ||
                                        `{:${name}:}`;


                                    const uniqueKey =
                                        `${name}|${image}`;


                                    if (
                                        duplicateCheck.has(
                                            uniqueKey
                                        )
                                    ) {

                                        return;

                                    }


                                    duplicateCheck.add(
                                        uniqueKey
                                    );


                                    const pack =
                                        getEmojiPack(
                                            name
                                        );


                                    result.push({

                                        code:
                                            code,

                                        name:
                                            name,

                                        image:
                                            image,

                                        pack:
                                            pack,

                                        search:
                                            `${code} ${name} ${pack}`.toLowerCase()

                                    });

                                }
                            );


                            return;

                        }


                        /*
                         * -------------------------------------------------
                         * 구조 2
                         *
                         * 혹시 API가 다음처럼 변경되는 경우도 지원
                         *
                         * "{:ag_1:}":
                         * "https://....png"
                         * -------------------------------------------------
                         */
                        if (
                            typeof emojiData ===
                            "string"
                        ) {

                            if (
                                !emojiData.startsWith(
                                    "http"
                                )
                            ) {

                                return;

                            }


                            const name =
                                outerCode
                                    .replace(
                                        /^\{:/,
                                        ""
                                    )
                                    .replace(
                                        /:\}$/,
                                        ""
                                    );


                            const uniqueKey =
                                `${name}|${emojiData}`;


                            if (
                                duplicateCheck.has(
                                    uniqueKey
                                )
                            ) {

                                return;

                            }


                            duplicateCheck.add(
                                uniqueKey
                            );


                            const pack =
                                getEmojiPack(
                                    name
                                );


                            result.push({

                                code:
                                    outerCode,

                                name:
                                    name,

                                image:
                                    emojiData,

                                pack:
                                    pack,

                                search:
                                    `${outerCode} ${name} ${pack}`.toLowerCase()

                            });

                        }

                    }
                );


                /*
                 * 이름순 정렬
                 */
                result.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name,
                            "en"
                        )
                );


                emojis =
                    result;


                console.log(
                    `치지직 이모지 ${emojis.length}개 로드 완료`
                );


                /*
                 * 팩 목록 생성
                 */
                buildEmojiPackList();


                /*
                 * 이모지 보드 출력
                 */
                renderEmojiBoard();


            } catch (error) {

                console.error(
                    "치지직 이모지 로드 실패:",
                    error
                );


                emojiBoard.innerHTML = `
                    <div class="emoji-empty">
                        치지직 이모지를 불러오지 못했습니다.<br>
                        브라우저 콘솔에서 오류를 확인해주세요.
                    </div>
                `;


                emojiPack.innerHTML = `
                    <option value="">
                        이모지 로드 실패
                    </option>
                `;

            }

        }


        /* =========================================================
           이모지팩 이름 추출
        ========================================================= */

        function getEmojiPack(
            name
        ) {

            if (
                !name ||
                typeof name !== "string"
            ) {

                return "기타";

            }


            /*
             * 예:
             *
             * ag_1
             * d_1
             * mlb_1
             * chky_1
             *
             * → ag
             * → d
             * → mlb
             * → chky
             */


            const match =
                name.match(
                    /^(.+?)_\d+$/
                );


            if (match) {

                return match[1];

            }


            /*
             * 숫자 패턴이 없는 경우
             */
            const underscoreIndex =
                name.indexOf("_");


            if (
                underscoreIndex > 0
            ) {

                return name.substring(
                    0,
                    underscoreIndex
                );

            }


            return name;

        }


        /* =========================================================
           이모지팩 목록 생성
        ========================================================= */

        function buildEmojiPackList() {

            const counts =
                new Map();


            emojis.forEach(
                emoji => {

                    const pack =
                        emoji.pack ||
                        "기타";


                    counts.set(
                        pack,
                        (counts.get(pack) || 0) + 1
                    );

                }
            );


            /*
             * 전체 이모지
             */
            emojiPack.innerHTML =
                "";


            const allOption =
                document.createElement("option");

            allOption.value =
                "";

            allOption.textContent =
                `전체 이모지 (${emojis.length})`;


            emojiPack.appendChild(
                allOption
            );


            /*
             * 팩 정렬
             */
            const packEntries =
                Array.from(
                    counts.entries()
                ).sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0],
                            "en"
                        )
                );


            packEntries.forEach(
                (
                    [pack, count]
                ) => {

                    const option =
                        document.createElement("option");


                    option.value =
                        pack;


                    option.textContent =
                        `${pack} (${count})`;


                    emojiPack.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================================================
           이모지 보드 렌더링
        ========================================================= */

        function renderEmojiBoard() {

            const search =
                emojiSearch.value
                    .trim()
                    .toLowerCase();


            const pack =
                emojiPack.value;


            const filtered =
                emojis.filter(
                    emoji => {

                        const matchesSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );


                        const matchesPack =
                            !pack ||
                            emoji.pack === pack;


                        return (
                            matchesSearch &&
                            matchesPack
                        );

                    }
                );


            emojiBoard.innerHTML =
                "";


            if (
                filtered.length === 0
            ) {

                emojiBoard.innerHTML = `
                    <div class="emoji-empty">
                        검색 결과가 없습니다.
                    </div>
                `;

                return;

            }


            const fragment =
                document.createDocumentFragment();


            filtered.forEach(
                emoji => {

                    const button =
                        document.createElement("button");


                    button.type =
                        "button";


                    button.className =
                        "emoji-item";


                    /*
                     * 현재 선택된 이모지 표시
                     */
                    if (
                        selectedEmoji &&
                        selectedEmoji.image ===
                            emoji.image
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }


                    const image =
                        document.createElement("img");


                    image.src =
                        emoji.image;


                    image.alt =
                        emoji.name;


                    image.title =
                        `${emoji.code}`;


                    image.loading =
                        "lazy";


                    button.appendChild(
                        image
                    );


                    /*
                     * 이모지 선택
                     */
                    button.addEventListener(
                        "click",
                        () => {

                            selectEmoji(
                                emoji
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            emojiBoard.appendChild(
                fragment
            );

        }


        /* =========================================================
           이모지 선택
        ========================================================= */

        function selectEmoji(
            emoji
        ) {

            selectedEmoji = {

                code:
                    emoji.code,

                name:
                    emoji.name,

                image:
                    emoji.image,

                pack:
                    emoji.pack

            };


            updateSelectedEmoji();

            renderEmojiBoard();

        }


        /* =========================================================
           이전 달
        ========================================================= */

        prevMonth.addEventListener(
            "click",
            () => {

                currentMonth--;

                if (
                    currentMonth < 0
                ) {

                    currentMonth = 11;

                    currentYear--;

                }

                renderCalendar();

            }
        );


        /* =========================================================
           다음 달
        ========================================================= */

        nextMonth.addEventListener(
            "click",
            () => {

                currentMonth++;

                if (
                    currentMonth > 11
                ) {

                    currentMonth = 0;

                    currentYear++;

                }

                renderCalendar();

            }
        );


        /* =========================================================
           오늘
        ========================================================= */

        todayButton.addEventListener(
            "click",
            () => {

                currentYear =
                    today.getFullYear();

                currentMonth =
                    today.getMonth();

                renderCalendar();

            }
        );


        /* =========================================================
           색상 변경
        ========================================================= */

        textColor.addEventListener(
            "input",
            () => {

                colorValue.textContent =
                    textColor.value;

            }
        );


        /* =========================================================
           검색
        ========================================================= */

        emojiSearch.addEventListener(
            "input",
            () => {

                renderEmojiBoard();

            }
        );


        /* =========================================================
           팩 변경
        ========================================================= */

        emojiPack.addEventListener(
            "change",
            () => {

                renderEmojiBoard();

            }
        );


        /* =========================================================
           저장
        ========================================================= */

        saveButton.addEventListener(
            "click",
            () => {

                if (!selectedDate) {

                    return;

                }


                const dateKey =
                    getDateKey(
                        selectedDate.year,
                        selectedDate.month,
                        selectedDate.day
                    );


                const text =
                    scheduleText.value.trim();


                /*
                 * 내용이 하나도 없는 경우
                 * 해당 날짜 데이터를 삭제
                 */
                if (
                    !text &&
                    !selectedEmoji
                ) {

                    delete appData.days[
                        dateKey
                    ];

                }

                else {

                    appData.days[
                        dateKey
                    ] = {

                        text:
                            text,

                        color:
                            textColor.value,

                        emoji:
                            selectedEmoji
                                ? {
                                    ...selectedEmoji
                                }
                                : null

                    };

                }


                saveData(
                    appData
                );


                renderCalendar();

                closeModalWindow();

            }
        );


        /* =========================================================
           취소
        ========================================================= */

        cancelButton.addEventListener(
            "click",
            () => {

                closeModalWindow();

            }
        );


        /* =========================================================
           X 버튼
        ========================================================= */

        closeModal.addEventListener(
            "click",
            () => {

                closeModalWindow();

            }
        );


        /* =========================================================
           배경 클릭으로 닫기
        ========================================================= */

        modalBackdrop.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    modalBackdrop
                ) {

                    closeModalWindow();

                }

            }
        );


        /* =========================================================
           ESC로 닫기
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape" &&
                    !modalBackdrop.classList.contains(
                        "hidden"
                    )
                ) {

                    closeModalWindow();

                }

            }
        );


        /* =========================================================
           월간 메모 자동 저장
        ========================================================= */

        memo.addEventListener(
            "input",
            () => {

                appData.memo =
                    memo.value;

                saveData(
                    appData
                );

            }
        );


        /* =========================================================
           메모 초기화
        ========================================================= */

        memo.value =
            appData.memo || "";


        /* =========================================================
           PNG 다운로드
        ========================================================= */

        downloadButton.addEventListener(
            "click",
            async () => {

                const target =
                    document.getElementById(
                        "calendarCapture"
                    );


                if (
                    typeof html2canvas ===
                    "undefined"
                ) {

                    alert(
                        "이미지 생성 라이브러리를 불러오지 못했습니다."
                    );

                    return;

                }


                const originalText =
                    downloadButton.innerHTML;


                downloadButton.innerHTML = `
                    <span class="spinner"></span>
                    생성 중
                `;


                downloadButton.disabled =
                    true;


                try {

                    const canvas =
                        await html2canvas(
                            target,
                            {
                                backgroundColor:
                                    "#ffffff",

                                scale:
                                    Math.min(
                                        window.devicePixelRatio ||
                                            1,
                                        2
                                    ),

                                useCORS:
                                    true,

                                logging:
                                    false
                            }
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.download =
                        `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-calendar.png`;


                    link.href =
                        canvas.toDataURL(
                            "image/png"
                        );


                    link.click();


                } catch (error) {

                    console.error(
                        "PNG 생성 실패:",
                        error
                    );


                    alert(
                        "PNG 이미지를 생성하지 못했습니다."
                    );

                }


                downloadButton.innerHTML =
                    originalText;


                downloadButton.disabled =
                    false;

            }
        );


        /* =========================================================
           초기 실행
        ========================================================= */

        renderCalendar();


        /*
         * 치지직 이모지 로드
         */
        loadEmojis();

    </script>

</body>
</html>
