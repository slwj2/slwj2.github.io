<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 다이어리 캘린더</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for cute handwriting style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- html2canvas for saving as image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Phosphor Icons for UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'handwriting': ['"Nanum Pen Script"', 'cursive'],
                        'sans': ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        'diary-bg': '#FAF8F5',
                        'diary-line': '#A94442',
                        'diary-sun': '#D9534F',
                        'diary-sat': '#5BC0DE',
                        'diary-text': '#333333',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e7eb; 
            overflow-x: hidden; /* 좌우 스와이프 시 화면 밀림 방지 */
        }

        /* ------------------ 캘린더 기본 스타일 ------------------ */
        .diary-paper {
            background-color: #FAF8F5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.02);
            position: relative;
        }

        .calendar-grid {
            border: 2px solid #A94442;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }

        .calendar-header-cell {
            border-bottom: 2px solid #A94442;
            border-right: 1px solid rgba(169, 68, 66, 0.2); 
            background-color: #FDF4F5;
        }
        .calendar-header-cell:last-child { border-right: none; }

        .calendar-cell {
            border-bottom: 1px solid rgba(169, 68, 66, 0.2);
            border-right: 1px solid rgba(169, 68, 66, 0.2);
            box-sizing: border-box; 
            min-height: 100px; /* 모바일을 위해 기본은 약간 작게 */
            position: relative;
            background-color: white;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) { .calendar-cell { min-height: 140px; } }
        .calendar-cell:nth-child(7n) { border-right: none; }
        .calendar-cell.last-row { border-bottom: none; }

        /* ------------------ 스프링 제본 디자인 ------------------ */
        .spring-wrapper {
            position: absolute;
            top: -24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            padding: 0 20px;
            z-index: 10;
        }
        .spring {
            width: 14px;
            height: 40px;
            background: linear-gradient(to right, #d4d4d4 0%, #ffffff 40%, #a3a3a3 100%);
            border-radius: 7px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.3);
            position: relative;
        }
        .spring::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 1px;
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
            z-index: -1;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* ------------------ 백그라운드 캡처 전용 스타일 (1480x1309 완벽 비율 & 투명) ------------------ */
        #hidden-capture-container {
            padding: 40px !important;
            background-color: transparent !important;
            align-items: center !important;
            display: flex !important;
            justify-content: center !important;
        }
        #hidden-capture-container .diary-paper {
            width: 1400px !important; 
            height: 1229px !important; /* 1309 - 80 */
            display: flex !important;
            flex-direction: column !important;
            flex: none !important;
            margin: 0 !important; 
            padding: 60px 50px 50px 50px !important;
            border-radius: 24px !important; 
            /* rgba 반투명을 쓰면 캡처 시 까맣게 타는 현상 발생 -> 100% 불투명한 동일 색상 헥스코드로 대체 */
            border: 2px solid #EDD9D9 !important; 
            background-color: #FAF8F5 !important;
            box-shadow: none !important; /* 투명 배경 캡처 시 가장자리 까만 그림자 띠 제거 */
        }
        
        /* 캡처 시 스프링 크기 최적화 */
        #hidden-capture-container .spring-wrapper { top: -25px !important; }
        #hidden-capture-container .spring { width: 20px !important; height: 50px !important; border-radius: 10px !important; box-shadow: 2px 3px 5px rgba(0,0,0,0.1) !important; }
        #hidden-capture-container .spring::after { width: 16px !important; height: 16px !important; bottom: -8px !important; left: 2px !important; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5) !important; }
        
        /* 캡처 시 글자색 100% 강제 (색상 탁해짐 방지) */
        #hidden-capture-container .text-diary-sun { color: #D9534F !important; }
        #hidden-capture-container .text-diary-sat { color: #5BC0DE !important; }
        #hidden-capture-container .text-diary-text { color: #333333 !important; }
        #hidden-capture-container .text-diary-line { color: #A94442 !important; }

        /* 캡처 시 폰트 및 간격 조정 */
        #hidden-capture-container .mb-4, #hidden-capture-container .mb-6 { margin-bottom: 25px !important; }
        #hidden-capture-container .text-3xl, #hidden-capture-container .md\:text-5xl { font-size: 56px !important; line-height: 1 !important; color: #A94442 !important; }
        #hidden-capture-container #calendar-title { font-size: 52px !important; color: #A94442 !important; }
        
        /* 캡처 시 캘린더 격자 */
        #hidden-capture-container .calendar-grid {
            flex: 1 1 0 !important;
            border: 3px solid #A94442 !important; /* 진하고 선명한 테두리 */
            border-radius: 12px !important;
            background-color: white !important;
            overflow: hidden !important;
            display: flex !important; 
            flex-direction: column !important; 
            min-height: 0 !important;
        }
        #hidden-capture-container .grid-cols-7 > div.calendar-header-cell {
            font-size: 32px !important;
            padding: 16px 0 !important;
            border-bottom: 3px solid #A94442 !important;
            border-right: 1px solid #EDD9D9 !important; /* rgba 대신 단색 */
            background-color: #FDF4F5 !important;
        }
        #hidden-capture-container .grid-cols-7 > div.calendar-header-cell:last-child { border-right: none !important; }
        
        #hidden-capture-container #calendar-days {
            flex: 1 1 0 !important;
            display: grid !important; 
            grid-template-rows: repeat(var(--row-count, 5), minmax(0, 1fr)) !important; 
            min-height: 0 !important;
            background-color: white !important;
        }
        #hidden-capture-container .calendar-cell {
            border-bottom: 1px solid #EDD9D9 !important; /* rgba 대신 단색 */
            border-right: 1px solid #EDD9D9 !important; /* rgba 대신 단색 */
            padding: 16px !important;
            height: 100% !important;
            display: flex !important; 
            flex-direction: column !important;
            background-color: white !important;
        }
        
        /* 캡처 시 셀 내부 텍스트 및 이미지 큼직하게 키우기 */
        #hidden-capture-container .day-number {
            font-size: 32px !important;
            margin-bottom: 8px !important;
            font-weight: 700 !important;
        }
        #hidden-capture-container .day-content {
            gap: 12px !important;
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
        }
        #hidden-capture-container .day-img { 
            max-height: 120px !important; 
            max-width: 95% !important;
            width: auto !important;
            height: auto !important;
            object-fit: unset !important; /* 블랙박스 오류 방지를 위해 강제 해제 */
            display: block !important;
        }
        #hidden-capture-container .schedule-text { 
            font-size: 46px !important; /* 텍스트 크기 확대 및 강제 고정 */
            line-height: 1.2 !important; 
            width: 100% !important;
            text-align: center !important;
            font-family: 'Nanum Pen Script', cursive !important; /* 캡처 시 폰트 풀림 방지 */
        }
        
        /* 캡처 시 메모 영역 */
        #hidden-capture-container .desktop-memo { 
            display: flex !important; flex-direction: column !important;
            margin-top: 35px !important; 
            padding: 30px 35px !important; 
            background-color: #FDF4F5 !important; 
            border: 3px solid #A94442 !important; 
            border-radius: 12px !important; 
            height: 220px !important;
            flex-shrink: 0 !important;
        }
        #hidden-capture-container .desktop-memo > span.absolute {
            top: -30px !important; left: 24px !important; font-size: 42px !important; padding: 0 15px !important;
            color: #A94442 !important; background-color: #FAF8F5 !important;
        }
        #hidden-capture-container #global-memo-render {
            min-height: 2.5rem !important; font-size: 40px !important; padding: 0 !important; line-height: 1.5 !important; display: block !important;
        }
    </style>
</head>

    <script>
        let currentDate = new Date();
        let calendarData = {};
        let editingDateStr = null;
        let pendingImageDataUrl = null;

        function init() {
            generateSprings();
            renderCalendar();
            initSwipeGestures();
        }

        // ---------- 스와이프 제스처 로직 (모바일 디스코드 느낌) ----------
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const SWIPE_THRESHOLD = 60; // 스와이프 민감도

        function initSwipeGestures() {
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});

            document.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, {passive: true});
        }

        function handleSwipe() {
            // 모달이 열려있으면 스와이프 무시
            if (!document.getElementById('edit-modal').classList.contains('hidden')) return;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // 상하 스크롤이 좌우 스와이프보다 크면(스크롤 중이면) 무시
            if (Math.abs(diffY) > Math.abs(diffX)) return; 
            
            const leftDrawer = document.getElementById('left-drawer');
            const rightDrawer = document.getElementById('right-drawer');
            const isLeftOpen = !leftDrawer.classList.contains('-translate-x-full');
            const isRightOpen = !rightDrawer.classList.contains('translate-x-full');

            // 오른쪽으로 스와이프 (왼쪽 메뉴 열기 or 오른쪽 메모장 닫기)
            if (diffX > SWIPE_THRESHOLD) {
                if (isRightOpen) toggleRightMenu();
                else if (!isLeftOpen) toggleLeftMenu();
            }
            // 왼쪽으로 스와이프 (오른쪽 메모장 열기 or 왼쪽 메뉴 닫기)
            else if (diffX < -SWIPE_THRESHOLD) {
                if (isLeftOpen) toggleLeftMenu();
                else if (!isRightOpen) toggleRightMenu();
            }
        }

        function toggleLeftMenu() {
            const drawer = document.getElementById('left-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            if (drawer.classList.contains('-translate-x-full')) {
                closeAllDrawers(); // 다른 거 닫기
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function toggleRightMenu() {
            const drawer = document.getElementById('right-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            if (drawer.classList.contains('translate-x-full')) {
                closeAllDrawers();
                drawer.classList.remove('translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function closeAllDrawers() {
            document.getElementById('left-drawer').classList.add('-translate-x-full');
            document.getElementById('right-drawer').classList.add('translate-x-full');
            document.getElementById('drawer-backdrop').classList.add('hidden');
        }

        // 모바일-PC 메모장 동기화
        function syncMemos(sourceId, targetId) {
            document.getElementById(targetId).value = document.getElementById(sourceId).value;
        }

        // -----------------------------------------------------------

        function generateSprings() {
            const container = document.getElementById('springs-container');
            container.innerHTML = '';
            for(let i = 0; i < 15; i++) {
                const spring = document.createElement('div');
                spring.className = 'spring';
                container.appendChild(spring);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const titleStr = `${year}.${String(month + 1).padStart(2, '0')}`;
            document.getElementById('calendar-title').textContent = titleStr;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const totalCells = Math.ceil((firstDayIndex + lastDay) / 7) * 7;
            let daysHtml = '';

            for (let i = 1; i <= totalCells; i++) {
                let dayNumber;
                let isCurrentMonth = true;
                let dateStr = '';

                if (i <= firstDayIndex) {
                    dayNumber = prevLastDay - firstDayIndex + i;
                    isCurrentMonth = false;
                } else if (i <= firstDayIndex + lastDay) {
                    dayNumber = i - firstDayIndex;
                    dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
                } else {
                    dayNumber = i - (firstDayIndex + lastDay);
                    isCurrentMonth = false;
                }

                const colIndex = (i - 1) % 7;
                let textClass = 'text-gray-400 text-xs md:text-sm'; 
                if (isCurrentMonth) {
                    if (colIndex === 0) textClass = 'text-diary-sun font-bold'; 
                    else if (colIndex === 6) textClass = 'text-diary-sat font-bold';
                    else textClass = 'text-diary-text font-bold'; 
                }

                let cellClasses = 'calendar-cell p-1 cursor-pointer hover:bg-pink-50 group flex flex-col';
                if (i > totalCells - 7) cellClasses += ' last-row';

                const dayData = calendarData[dateStr] || { text: '', color: '#333333', image: null };
                const formattedText = dayData.text ? dayData.text.replace(/\n/g, '<br>') : '';

                if (isCurrentMonth) {
                    daysHtml += `
                        <div class="${cellClasses}" onclick="openModal('${dateStr}')">
                            <div class="${textClass} text-sm md:text-lg font-sans ml-1 day-number">${dayNumber}</div>
                            <div class="w-full mt-1 flex-1 flex flex-col items-center justify-start gap-1 overflow-hidden pointer-events-none day-content">
                                ${dayData.image ? `<img src="${dayData.image}" class="day-img max-w-[95%] max-h-[60px] md:max-h-[80px] object-contain">` : ''}
                                ${formattedText ? `<div style="color: ${dayData.color};" class="font-handwriting text-base md:text-xl leading-tight break-words text-center w-full schedule-text">${formattedText}</div>` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    daysHtml += `
                        <div class="${cellClasses} bg-gray-50/50">
                            <div class="${textClass} ml-1 day-number">${dayNumber}</div>
                        </div>
                    `;
                }
            }

            daysContainer.innerHTML = daysHtml;
            daysContainer.style.setProperty('--row-count', totalCells / 7);
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function openModal(dateStr) {
            editingDateStr = dateStr;
            const data = calendarData[dateStr] || { text: '', color: '#333333', image: null };

            const [y, m, d] = dateStr.split('-');
            document.getElementById('modal-date-title').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
            document.getElementById('modal-text').value = data.text;
            document.getElementById('modal-color').value = data.color;

            pendingImageDataUrl = data.image;
            updateImagePreviewUI();

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingDateStr = null;
            pendingImageDataUrl = null;
            document.getElementById('modal-image-upload').value = ''; 
        }

        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    pendingImageDataUrl = canvas.toDataURL('image/png');
                    updateImagePreviewUI();
                };
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function clearImage() {
            pendingImageDataUrl = null;
            document.getElementById('modal-image-upload').value = '';
            updateImagePreviewUI();
        }

        function updateImagePreviewUI() {
            const previewContainer = document.getElementById('modal-image-preview-container');
            const previewImg = document.getElementById('modal-image-preview');

            if (pendingImageDataUrl) {
                previewImg.src = pendingImageDataUrl;
                previewContainer.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewContainer.classList.add('hidden');
            }
        }

        function saveDayData() {
            if (!editingDateStr) return;
            const text = document.getElementById('modal-text').value.trim();
            const color = document.getElementById('modal-color').value;

            calendarData[editingDateStr] = { text: text, color: color, image: pendingImageDataUrl };
            if (!text && !pendingImageDataUrl) delete calendarData[editingDateStr];

            closeModal();
            renderCalendar(); 
        }

        async function downloadCalendar() {
            const liveArea = document.getElementById('capture-area');
            const hiddenContainer = document.getElementById('hidden-capture-container');
            
            let memoText = document.getElementById('global-memo').value;
            if (!memoText && document.getElementById('mobile-memo')) {
                memoText = document.getElementById('mobile-memo').value;
            }
            
            try {
                // 폰트가 완벽히 로드될 때까지 강제 대기 (글씨체 풀림 방지 핵심 로직)
                await document.fonts.ready;

                hiddenContainer.style.display = 'flex';

                const clone = liveArea.cloneNode(true);
                clone.id = 'cloned-capture-area';
                clone.className = 'w-full h-full'; 
                
                const textarea = clone.querySelector('#global-memo');
                const renderDiv = clone.querySelector('#global-memo-render');
                const desktopMemo = clone.querySelector('.desktop-memo');
                
                if (desktopMemo) {
                    desktopMemo.classList.remove('hidden', 'md:flex');
                    desktopMemo.style.display = 'flex';
                }
                
                renderDiv.textContent = memoText || "여기에 중요한 메모나 공지를 적어보세요...";
                if(!memoText) renderDiv.classList.add('text-pink-300');
                else renderDiv.classList.remove('text-pink-300');
                
                if(textarea) textarea.style.display = 'none';
                if(renderDiv) renderDiv.classList.remove('hidden');

                hiddenContainer.innerHTML = '';
                hiddenContainer.appendChild(clone);

                // CSS 렌더링을 위한 대기 시간을 약간 늘림
                await new Promise(r => setTimeout(r, 400));

                const canvas = await html2canvas(hiddenContainer, {
                    width: 1480,
                    height: 1309,
                    windowWidth: 1480,
                    windowHeight: 1309,
                    scale: 1, 
                    backgroundColor: null, 
                    logging: false,
                    useCORS: true 
                });

                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');

                const titleStr = document.getElementById('calendar-title').textContent.replace('.', '_');
                link.download = `다이어리_${titleStr}_1480x1309.png`;
                link.href = image;
                link.click();

            } catch (error) {
                console.error("Capture failed:", error);
                alert("이미지 저장 중 오류가 발생했습니다.");
            } finally {
                hiddenContainer.style.display = 'none';
                hiddenContainer.innerHTML = '';
            }
        }

        window.onload = init;
    </script>
</body>
