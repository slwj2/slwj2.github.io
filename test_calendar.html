<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],
                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    }
                }
            }
        };
    </script>

    <style>

        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            background:
                linear-gradient(
                    135deg,
                    #eeeeee 0%,
                    #e7e7e7 50%,
                    #eeeeee 100%
                );

            color: #333333;
            font-family: "Quicksand", sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d3d3d3;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bcbcbc;
        }


        /* =========================================================
           메인 다이어리 종이
        ========================================================= */

        .diary-paper {
            position: relative;

            width: 100%;

            background: #faf8f5;

            border: 2px solid #eadede;
            border-radius: 24px;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.12),
                inset 0 0 35px rgba(120, 80, 80, 0.025);

            overflow: visible;
        }


        /* =========================================================
           스프링
        ========================================================= */

        .spring-wrapper {
            position: absolute;

            top: -22px;
            left: 0;

            width: 100%;

            padding: 0 38px;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            z-index: 20;

            pointer-events: none;
        }

        .spring {
            position: relative;

            width: 16px;
            height: 42px;

            flex-shrink: 0;

            background:
                linear-gradient(
                    to right,
                    #a7a7a7 0%,
                    #f9f9f9 30%,
                    #ffffff 48%,
                    #c2c2c2 72%,
                    #858585 100%
                );

            border-radius: 9px;

            box-shadow:
                1px 3px 5px rgba(0, 0, 0, 0.25);

            z-index: 2;
        }

        .spring::before {
            content: "";

            position: absolute;

            top: -2px;
            left: 1px;

            width: 14px;
            height: 10px;

            border-radius: 50%;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff,
                    #c7c7c7
                );

            opacity: 0.9;
        }

        .spring::after {
            content: "";

            position: absolute;

            left: 1px;
            bottom: -7px;

            width: 14px;
            height: 14px;

            background: #666666;

            border-radius: 50%;

            box-shadow:
                inset 1px 1px 3px rgba(255,255,255,0.5),
                1px 2px 3px rgba(0,0,0,0.15);
        }


        /* =========================================================
           상단 날짜
        ========================================================= */

        .calendar-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;

            min-height: 72px;

            padding: 10px 10px 8px;
        }

        #calendar-title {
            color: #a94442;

            font-size: 42px;
            font-weight: 700;

            letter-spacing: 0.04em;

            line-height: 1;
        }


        /* =========================================================
           달력 전체
        ========================================================= */

        .calendar-grid {
            width: 100%;

            border: 2px solid #a94442;
            border-radius: 14px;

            overflow: hidden;

            background: #ffffff;
        }


        /* =========================================================
           요일 헤더
        ========================================================= */

        .calendar-weekdays {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            background: #fdf0f1;

            border-bottom: 2px solid #a94442;
        }

        .calendar-header-cell {
            min-width: 0;

            padding: 10px 4px;

            text-align: center;

            color: #a94442;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 22px;
            font-weight: 700;

            line-height: 1;

            border-right: 1px solid #efdada;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-header-cell.sun {
            color: #df5555;
        }

        .calendar-header-cell.sat {
            color: #4f8ce8;
        }


        /* =========================================================
           날짜 영역
        ========================================================= */

        #calendar-days {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            background: #ffffff;
        }


        /* =========================================================
           날짜 셀
        ========================================================= */

        .calendar-cell {
            position: relative;

            min-width: 0;
            min-height: 170px;

            padding: 12px;

            background: #ffffff;

            border-right: 1px solid #eeeeee;
            border-bottom: 1px solid #eeeeee;

            display: flex;
            flex-direction: column;

            transition:
                background-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }

        .calendar-cell.current-month {
            cursor: pointer;
        }

        .calendar-cell.current-month:hover {
            background: #fffafa;

            box-shadow:
                inset 0 0 0 1px rgba(169, 68, 66, 0.08);
        }

        .calendar-cell.other-month {
            background: #fcfcfc;

            cursor: default;
        }


        /* =========================================================
           날짜 숫자
        ========================================================= */

        .day-number {
            width: max-content;

            min-width: 28px;
            height: 28px;

            padding: 2px 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Quicksand", sans-serif;

            font-size: 18px;
            font-weight: 700;

            line-height: 1;

            color: #4b4b4b;

            border-radius: 50%;

            flex-shrink: 0;
        }

        .day-number.sun {
            color: #df5555;
        }

        .day-number.sat {
            color: #4f8ce8;
        }

        .day-number.other {
            color: #c9c9c9;
        }

        .day-number.today {
            color: white;

            background: #7160e8;

            box-shadow:
                0 2px 5px rgba(113, 96, 232, 0.25);
        }


        /* =========================================================
           날짜 내부
        ========================================================= */

        .day-content {
            width: 100%;

            min-width: 0;

            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            gap: 6px;

            padding: 5px 2px 4px;

            overflow: hidden;
        }


        /* =========================================================
           치지직 이모지
        ========================================================= */

        .day-emoji {
            display: block;

            width: 38px;
            height: 38px;

            max-width: 38px;
            max-height: 38px;

            object-fit: contain;

            flex-shrink: 0;

            image-rendering: auto;

            user-select: none;

            pointer-events: none;
        }


        /* =========================================================
           일정 텍스트
        ========================================================= */

        .schedule-text {
            width: 100%;

            color: #333333;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 21px;
            font-weight: 400;

            line-height: 1.12;

            text-align: center;

            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: anywhere;

            padding: 0 2px;
        }


        /* =========================================================
           메모
        ========================================================= */

        .desktop-memo {
            position: relative;

            width: 100%;

            margin-top: 18px;

            padding: 25px 28px 20px;

            background: #fdf0f1;

            border: 2px solid #a94442;
            border-radius: 14px;

            min-height: 145px;
        }

        .memo-label {
            position: absolute;

            top: -19px;
            left: 22px;

            padding: 0 12px;

            background: #faf8f5;

            color: #a94442;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 30px;
            font-weight: 700;

            line-height: 1.2;
        }

        #global-memo {
            width: 100%;

            min-height: 90px;

            background: transparent;

            border: none;
            outline: none;

            resize: vertical;

            color: #426aa8;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 23px;

            line-height: 1.35;
        }

        #global-memo::placeholder {
            color: #9bb4db;
        }


        /* =========================================================
           모바일 메모
        ========================================================= */

        .mobile-memo {
            width: 100%;
            height: 100%;

            background: transparent;

            border: none;
            outline: none;

            resize: none;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 22px;

            line-height: 1.5;

            color: #426aa8;
        }


        /* =========================================================
           모바일
        ========================================================= */

        @media (max-width: 767px) {

            body {
                background: #eeeeee;
            }

            .diary-paper {
                border-radius: 18px;

                padding:
                    42px 10px 18px !important;
            }

            .spring-wrapper {
                top: -17px;

                padding:
                    0 18px;
            }

            .spring {
                width: 10px;
                height: 30px;

                border-radius: 6px;
            }

            .spring::before {
                width: 8px;
                height: 7px;
            }

            .spring::after {
                width: 10px;
                height: 10px;

                left: 0;
                bottom: -5px;
            }

            .calendar-top {
                min-height: 48px;

                padding:
                    0 5px 8px;
            }

            #calendar-title {
                font-size: 30px;
            }

            .calendar-grid {
                border-radius: 10px;
            }

            .calendar-header-cell {
                padding: 8px 2px;

                font-size: 17px;
            }

            .calendar-cell {
                min-height: 105px;

                padding: 6px;
            }

            .day-number {
                min-width: 23px;
                height: 23px;

                font-size: 14px;
            }

            .day-emoji {
                width: 29px;
                height: 29px;

                max-width: 29px;
                max-height: 29px;
            }

            .schedule-text {
                font-size: 16px;
                line-height: 1.08;
            }

            .desktop-memo {
                margin-top: 18px;

                padding:
                    22px 15px 12px;

                min-height: 125px;
            }

            .memo-label {
                left: 14px;

                top: -16px;

                font-size: 25px;
            }

            #global-memo {
                min-height: 82px;

                font-size: 19px;
            }
        }


        /* =========================================================
           모바일 메뉴
        ========================================================= */

        .drawer {
            will-change: transform;
        }


        /* =========================================================
           이모지 모달
        ========================================================= */

        .emoji-modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 16px;

            background: rgba(0, 0, 0, 0.58);

            backdrop-filter: blur(5px);
        }

        .emoji-modal-card {
            width: 100%;
            max-width: 470px;

            max-height: 92vh;

            overflow: hidden;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.25);

            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 15px 18px;

            background: #fdeff0;

            border-bottom: 1px solid #f2d7d8;
        }

        .modal-body {
            padding: 18px;

            overflow-y: auto;
        }

        .field-label {
            display: block;

            margin-bottom: 7px;

            color: #444444;

            font-size: 14px;
            font-weight: 700;
        }

        .input-box {
            width: 100%;

            border: 1px solid #d7d7d7;
            border-radius: 9px;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        .input-box:focus {
            border-color: #e3a2a5;

            box-shadow:
                0 0 0 3px rgba(227, 162, 165, 0.16);
        }

        #modal-text {
            min-height: 90px;

            padding: 11px;

            resize: vertical;

            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 21px;

            line-height: 1.3;
        }


        /* =========================================================
           이모지 선택 영역
        ========================================================= */

        .emoji-section {
            margin-top: 18px;
        }

        .emoji-tools {
            display: grid;

            grid-template-columns:
                1fr;

            gap: 8px;
        }

        #emojiSearch {
            height: 42px;

            padding:
                0 12px;

            font-size: 14px;
        }

        #emojiPack {
            height: 42px;

            padding:
                0 10px;

            background: white;

            border: 1px solid #d7d7d7;
            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        .emoji-board {
            margin-top: 10px;

            height: 245px;

            overflow-y: auto;

            padding: 7px;

            border: 1px solid #e5e5e5;

            border-radius: 10px;

            background: #fafafa;

            display: grid;

            grid-template-columns:
                repeat(8, minmax(0, 1fr));

            align-content: start;

            gap: 4px;
        }

        .emoji-item {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 4px;

            border: none;
            border-radius: 7px;

            background: transparent;

            transition:
                background 0.12s,
                transform 0.12s;
        }

        .emoji-item:hover {
            background: #eeeeee;

            transform: scale(1.05);
        }

        .emoji-item.selected {
            background: #ffe3e5;

            box-shadow:
                inset 0 0 0 2px #e29a9d;
        }

        .emoji-item img {
            width: 31px;
            height: 31px;

            object-fit: contain;

            pointer-events: none;
        }

        .emoji-empty {
            grid-column: 1 / -1;

            padding: 35px 10px;

            text-align: center;

            color: #999999;

            font-size: 14px;
        }


        /* =========================================================
           선택된 이모지 미리보기
        ========================================================= */

        .selected-emoji-area {
            display: flex;

            align-items: center;

            gap: 10px;

            min-height: 48px;

            margin-top: 10px;

            padding: 8px 10px;

            background: #fafafa;

            border: 1px solid #eeeeee;

            border-radius: 9px;
        }

        #selectedEmojiPreview {
            width: 32px;
            height: 32px;

            object-fit: contain;
        }

        #selectedEmojiName {
            color: #777777;

            font-size: 13px;
        }


        /* =========================================================
           모달 하단
        ========================================================= */

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 13px 18px;

            background: #fafafa;

            border-top: 1px solid #eeeeee;
        }

        .modal-button {
            padding:
                9px 17px;

            border: none;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;
        }


        /* =========================================================
           캡처 전용 영역
        ========================================================= */

        #hidden-capture-container {
            position: fixed;

            left: -10000px;
            top: 0;

            width: 1480px;
            height: 1309px;

            overflow: hidden;

            background: transparent;

            z-index: -100;
        }

        #hidden-capture-container .diary-paper {
            width: 1400px;
            height: 1229px;

            margin: 40px;

            padding:
                58px 48px 40px;

            border-radius: 24px;

            box-shadow: none;
        }

        #hidden-capture-container .spring-wrapper {
            top: -22px;

            padding:
                0 40px;
        }

        #hidden-capture-container .spring {
            width: 18px;
            height: 45px;

            border-radius: 9px;
        }

        #hidden-capture-container .spring::after {
            width: 15px;
            height: 15px;

            bottom: -7px;
        }

        #hidden-capture-container .calendar-top {
            min-height: 65px;

            padding:
                0 5px 10px;
        }

        #hidden-capture-container #calendar-title {
            font-size: 44px;
        }

        #hidden-capture-container .calendar-header-cell {
            padding:
                10px 4px;

            font-size: 22px;
        }

        #hidden-capture-container .calendar-cell {
            min-height: 0;

            height: 100%;

            padding: 9px;

            overflow: hidden;
        }

        #hidden-capture-container #calendar-days {
            grid-template-rows:
                repeat(var(--row-count), minmax(0, 1fr));
        }

        #hidden-capture-container .day-number {
            min-width: 30px;
            height: 30px;

            font-size: 19px;
        }

        #hidden-capture-container .day-emoji {
            width: 38px;
            height: 38px;

            max-width: 38px;
            max-height: 38px;
        }

        #hidden-capture-container .schedule-text {
            font-size: 22px;

            line-height: 1.1;
        }

        #hidden-capture-container .desktop-memo {
            margin-top: 17px;

            min-height: 130px;

            padding:
                24px 28px 15px;
        }

        #hidden-capture-container .memo-label {
            font-size: 30px;
        }

        #hidden-capture-container #global-memo {
            min-height: 85px;

            font-size: 23px;
        }


        /* =========================================================
           캡처 중 textarea 대신 표시되는 메모
        ========================================================= */

        #global-memo-render {
            display: none;
        }

        .capture-mode #global-memo {
            display: none !important;
        }

        .capture-mode #global-memo-render {
            display: block !important;
        }

    </style>
</head>


<body>

    <!-- =========================================================
         모바일 상단 메뉴
    ========================================================= -->

    <div
        class="
            md:hidden
            w-full
            bg-white
            shadow-sm
            px-4
            py-3
            flex
            items-center
            justify-between
            sticky
            top-0
            z-30
        "
    >

        <button
            onclick="toggleLeftMenu()"
            class="
                w-10
                h-10
                rounded-xl
                bg-gray-100
                flex
                items-center
                justify-center
            "
        >
            <i class="ph ph-list text-xl"></i>
        </button>

        <div
            class="
                font-bold
                text-gray-700
                flex
                items-center
                gap-2
            "
        >
            <i class="ph ph-calendar-heart text-pink-500 text-xl"></i>
            다이어리
        </div>

        <button
            onclick="toggleRightMenu()"
            class="
                w-10
                h-10
                rounded-xl
                bg-pink-100
                text-pink-600
                flex
                items-center
                justify-center
            "
        >
            <i class="ph ph-note-pencil text-xl"></i>
        </button>

    </div>


    <!-- =========================================================
         모바일 왼쪽 메뉴
    ========================================================= -->

    <div
        id="left-drawer"
        class="
            drawer
            fixed
            inset-y-0
            left-0
            w-64
            bg-white
            shadow-2xl
            transform
            -translate-x-full
            transition-transform
            duration-300
            z-50
            p-5
            flex
            flex-col
            md:hidden
        "
    >

        <div
            class="
                text-xl
                font-bold
                text-gray-800
                pb-4
                mb-5
                border-b
            "
        >
            메뉴
        </div>

        <div class="flex flex-col gap-3">

            <button
                onclick="changeMonth(-1); toggleLeftMenu();"
                class="
                    p-3
                    bg-gray-50
                    rounded-xl
                    text-left
                    flex
                    items-center
                    gap-3
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
                이전 달
            </button>

            <button
                onclick="goToToday(); toggleLeftMenu();"
                class="
                    p-3
                    bg-gray-50
                    rounded-xl
                    text-left
                    flex
                    items-center
                    gap-3
                    font-bold
                "
            >
                <i class="ph ph-calendar-check text-xl"></i>
                오늘
            </button>

            <button
                onclick="changeMonth(1); toggleLeftMenu();"
                class="
                    p-3
                    bg-gray-50
                    rounded-xl
                    text-left
                    flex
                    items-center
                    gap-3
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
                다음 달
            </button>

        </div>

        <div class="mt-auto">

            <button
                onclick="downloadCalendar(); toggleLeftMenu();"
                class="
                    w-full
                    py-3
                    rounded-xl
                    bg-pink-500
                    text-white
                    font-bold
                    flex
                    items-center
                    justify-center
                    gap-2
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지 저장
            </button>

        </div>

    </div>


    <!-- =========================================================
         모바일 오른쪽 메모 메뉴
    ========================================================= -->

    <div
        id="right-drawer"
        class="
            drawer
            fixed
            inset-y-0
            right-0
            w-72
            bg-pink-50
            shadow-2xl
            transform
            translate-x-full
            transition-transform
            duration-300
            z-50
            p-5

    <!-- =========================================================
         JavaScript
    ========================================================= -->

    <script>

        /* =========================================================
           기본 설정
        ========================================================= */

        const EMOJI_API_URL =
            "https://chzzk.dico.page/emojipacks";

        const STORAGE_KEY =
            "diary_calendar_data_v3";

        let currentDate = new Date();

        let calendarData = {};

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojiList = [];


        /* =========================================================
           초기화
        ========================================================= */

        function init() {

            loadLocalData();

            generateSprings();

            renderCalendar();

            loadEmojis();

            initSwipeGestures();

            loadMemo();

        }


        /* =========================================================
           localStorage 불러오기
        ========================================================= */

        function loadLocalData() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                calendarData =
                    parsed.days || {};

            } catch (error) {

                console.error(
                    "저장 데이터 불러오기 실패:",
                    error
                );

                calendarData = {};

            }

        }


        /* =========================================================
           전체 데이터 저장
        ========================================================= */

        function saveLocalData() {

            try {

                const memo =
                    document.getElementById(
                        "global-memo"
                    ).value;

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify({
                        days: calendarData,
                        memo: memo
                    })
                );

            } catch (error) {

                console.error(
                    "localStorage 저장 실패:",
                    error
                );

            }

        }


        /* =========================================================
           메모 불러오기
        ========================================================= */

        function loadMemo() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                const memo =
                    parsed.memo || "";

                document.getElementById(
                    "global-memo"
                ).value = memo;

                const mobileMemo =
                    document.getElementById(
                        "mobile-memo"
                    );

                if (mobileMemo) {
                    mobileMemo.value = memo;
                }

            } catch (error) {

                console.error(
                    "메모 불러오기 실패:",
                    error
                );

            }

        }


        /* =========================================================
           메모 저장
        ========================================================= */

        function saveMemo() {

            const desktopMemo =
                document.getElementById(
                    "global-memo"
                );

            const mobileMemo =
                document.getElementById(
                    "mobile-memo"
                );

            if (mobileMemo) {
                mobileMemo.value =
                    desktopMemo.value;
            }

            saveLocalData();

        }


        /* =========================================================
           메모 동기화
        ========================================================= */

        function syncMemos(
            sourceId,
            targetId
        ) {

            const source =
                document.getElementById(
                    sourceId
                );

            const target =
                document.getElementById(
                    targetId
                );

            if (!source || !target) {
                return;
            }

            target.value =
                source.value;

            saveLocalData();

        }


        /* =========================================================
           스프링 생성
        ========================================================= */

        function generateSprings() {

            const container =
                document.getElementById(
                    "springs-container"
                );

            container.innerHTML = "";

            const count =
                window.innerWidth < 768
                    ? 9
                    : 15;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const spring =
                    document.createElement(
                        "div"
                    );

                spring.className =
                    "spring";

                container.appendChild(
                    spring
                );

            }

        }


        /* =========================================================
           달력 렌더링
        ========================================================= */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();

            const title =
                `${year}.${String(
                    month + 1
                ).padStart(2, "0")}`;

            document.getElementById(
                "calendar-title"
            ).textContent = title;


            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            const prevLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const totalCells =
                Math.ceil(
                    (firstDay + lastDay) / 7
                ) * 7;


            const daysContainer =
                document.getElementById(
                    "calendar-days"
                );

            daysContainer.innerHTML = "";

            daysContainer.style.setProperty(
                "--row-count",
                totalCells / 7
            );


            const today =
                new Date();

            const todayStr =
                `${today.getFullYear()}-${String(
                    today.getMonth() + 1
                ).padStart(2, "0")}-${String(
                    today.getDate()
                ).padStart(2, "0")}`;


            for (
                let i = 0;
                i < totalCells;
                i++
            ) {

                let dayNumber;

                let isCurrentMonth = true;

                let dateStr = "";

                if (i < firstDay) {

                    dayNumber =
                        prevLastDay -
                        firstDay +
                        i +
                        1;

                    isCurrentMonth = false;

                } else if (
                    i <
                    firstDay + lastDay
                ) {

                    dayNumber =
                        i -
                        firstDay +
                        1;

                    dateStr =
                        `${year}-${String(
                            month + 1
                        ).padStart(2, "0")}-${String(
                            dayNumber
                        ).padStart(2, "0")}`;

                } else {

                    dayNumber =
                        i -
                        (firstDay + lastDay) +
                        1;

                    isCurrentMonth = false;

                }


                const col =
                    i % 7;


                let numberClass =
                    "day-number";


                if (!isCurrentMonth) {

                    numberClass +=
                        " other";

                } else if (col === 0) {

                    numberClass +=
                        " sun";

                } else if (col === 6) {

                    numberClass +=
                        " sat";

                }


                if (
                    isCurrentMonth &&
                    dateStr === todayStr
                ) {

                    numberClass +=
                        " today";

                }


                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "calendar-cell " +
                    (
                        isCurrentMonth
                            ? "current-month"
                            : "other-month"
                    );


                if (
                    i >= totalCells - 7
                ) {

                    cell.classList.add(
                        "last-row"
                    );

                }


                if (
                    !isCurrentMonth
                ) {

                    cell.innerHTML = `
                        <div class="${numberClass}">
                            ${dayNumber}
                        </div>
                    `;

                    daysContainer.appendChild(
                        cell
                    );

                    continue;

                }


                const data =
                    calendarData[dateStr] || {
                        text: "",
                        color: "#333333",
                        emoji: null
                    };


                let contentHtml = "";


                /* 이모지 */

                if (
                    data.emoji &&
                    data.emoji.image
                ) {

                    contentHtml += `
                        <img
                            src="${escapeAttribute(
                                data.emoji.image
                            )}"
                            class="day-emoji"
                            alt=""
                            crossorigin="anonymous"
                            draggable="false"
                        >
                    `;

                }


                /* 일정 */

                if (data.text) {

                    contentHtml += `
                        <div
                            class="schedule-text"
                            style="color:${escapeAttribute(
                                data.color || "#333333"
                            )};"
                        >
                            ${escapeHtml(
                                data.text
                            )}
                        </div>
                    `;

                }


                cell.innerHTML = `
                    <div class="${numberClass}">
                        ${dayNumber}
                    </div>

                    <div class="day-content">
                        ${contentHtml}
                    </div>
                `;


                cell.addEventListener(
                    "click",
                    function () {
                        openModal(dateStr);
                    }
                );


                daysContainer.appendChild(
                    cell
                );

            }

        }


        /* =========================================================
           HTML escape
        ========================================================= */

        function escapeHtml(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                )
                .replace(
                    /\n/g,
                    "<br>"
                );

        }


        /* =========================================================
           Attribute escape
        ========================================================= */

        function escapeAttribute(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );

        }


        /* =========================================================
           월 변경
        ========================================================= */

        function changeMonth(delta) {

            currentDate.setMonth(
                currentDate.getMonth() + delta
            );

            renderCalendar();

        }


        /* =========================================================
           오늘
        ========================================================= */

        function goToToday() {

            currentDate =
                new Date();

            renderCalendar();

        }


        /* =========================================================
           모달 열기
        ========================================================= */

        function openModal(dateStr) {

            editingDateStr =
                dateStr;


            const data =
                calendarData[dateStr] || {
                    text: "",
                    color: "#333333",
                    emoji: null
                };


            const parts =
                dateStr.split("-");


            const year =
                parts[0];

            const month =
                parseInt(
                    parts[1],
                    10
                );

            const day =
                parseInt(
                    parts[2],
                    10
                );


            document.getElementById(
                "modal-date-title"
            ).textContent =
                `${year}년 ${month}월 ${day}일`;


            document.getElementById(
                "modal-text"
            ).value =
                data.text || "";


            document.getElementById(
                "modal-color"
            ).value =
                data.color || "#333333";


            selectedEmoji =
                data.emoji
                    ? {
                        ...data.emoji
                    }
                    : null;


            updateSelectedEmojiUI();


            document.getElementById(
                "edit-modal"
            ).classList.remove(
                "hidden"
            );


            setTimeout(
                function () {

                    document.getElementById(
                        "modal-text"
                    ).focus();

                },
                50
            );

        }


        /* =========================================================
           모달 닫기
        ========================================================= */

        function closeModal() {

            document.getElementById(
                "edit-modal"
            ).classList.add(
                "hidden"
            );

            editingDateStr =
                null;

            selectedEmoji =
                null;

            updateSelectedEmojiUI();

        }


        /* =========================================================
           일정 저장
        ========================================================= */

        function saveDayData() {

            if (!editingDateStr) {
                return;
            }


            const text =
                document.getElementById(
                    "modal-text"
                ).value.trim();


            const color =
                document.getElementById(
                    "modal-color"
                ).value;


            if (
                !text &&
                !selectedEmoji
            ) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text: text,

                    color: color,

                    emoji:
                        selectedEmoji
                            ? {
                                code:
                                    selectedEmoji.code,

                                name:
                                    selectedEmoji.name,

                                image:
                                    selectedEmoji.image,

                                pack:
                                    selectedEmoji.pack
                            }
                            : null

                };

            }


            saveLocalData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           치지직 이모지 API
        ========================================================= */

        async function loadEmojis() {

            const board =
                document.getElementById(
                    "emojiBoard"
                );


            try {

                board.innerHTML = `
                    <div class="emoji-empty">
                        치지직 이모지를 불러오는 중입니다...
                    </div>
                `;


                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            method: "GET",

                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                /*
                 * 실제 API 구조:
                 *
                 * {
                 *   "emojis": {
                 *      "{:ag_1:}": {
                 *          "ag_1":
                 *          "https://....png"
                 *      }
                 *   }
                 * }
                 */


                const source =
                    json.emojis || {};


                const result = [];

                const duplicate =
                    new Set();


                Object.entries(
                    source
                ).forEach(
                    function (
                        [outerCode, emojiData]
                    ) {

                        /*
                         * API 값이 객체인 경우
                         */

                        if (
                            emojiData &&
                            typeof emojiData ===
                                "object" &&
                            !Array.isArray(
                                emojiData
                            )
                        ) {

                            Object.entries(
                                emojiData
                            ).forEach(
                                function (
                                    [name, image]
                                ) {

                                    if (
                                        typeof image !==
                                        "string"
                                    ) {
                                        return;
                                    }


                                    const code =
                                        outerCode ||
                                        `{:${name}:}`;


                                    const uniqueKey =
                                        `${name}|${image}`;


                                    if (
                                        duplicate.has(
                                            uniqueKey
                                        )
                                    ) {
                                        return;
                                    }


                                    duplicate.add(
                                        uniqueKey
                                    );


                                    const pack =
                                        getEmojiPack(
                                            name
                                        );


                                    result.push({

                                        code:
                                            code,

                                        name:
                                            name,

                                        image:
                                            image,

                                        pack:
                                            pack,

                                        search:
                                            `${name} ${code} ${pack}`
                                                .toLowerCase()

                                    });

                                }
                            );

                            return;
                        }


                        /*
                         * 혹시 API가
                         *
                         * "ag_1":
                         * "https://..."
                         *
                         * 형태로 바뀌는 경우도 대응
                         */

                        if (
                            typeof emojiData ===
                            "string"
                        ) {

                            const name =
                                outerCode
                                    .replace(
                                        /^\{:\s*/,
                                        ""
                                    )
                                    .replace(
                                        /\s*:\}$/,
                                        ""
                                    );


                            const uniqueKey =
                                `${name}|${emojiData}`;


                            if (
                                duplicate.has(
                                    uniqueKey
                                )
                            ) {
                                return;
                            }


                            duplicate.add(
                                uniqueKey
                            );


                            const pack =
                                getEmojiPack(
                                    name
                                );


                            result.push({

                                code:
                                    outerCode,

                                name:
                                    name,

                                image:
                                    emojiData,

                                pack:
                                    pack,

                                search:
                                    `${name} ${outerCode} ${pack}`
                                        .toLowerCase()

                            });

                        }

                    }
                );


                emojiList =
                    result.sort(
                        function (a, b) {

                            return a.name.localeCompare(
                                b.name,
                                undefined,
                                {
                                    numeric: true
                                }
                            );

                        }
                    );


                buildEmojiPackList();

                renderEmojiBoard();


                console.log(
                    `치지직 이모지 ${emojiList.length}개 로드 완료`
                );


            } catch (error) {

                console.error(
                    "치지직 이모지 로드 실패:",
                    error
                );


                board.innerHTML = `
                    <div class="emoji-empty">
                        이모지를 불러오지 못했습니다.<br>
                        <small>
                            ${escapeHtml(
                                error.message
                            )}
                        </small>
                    </div>
                `;

            }

        }


        /* =========================================================
           이모지팩 이름 추출
        ========================================================= */

        function getEmojiPack(name) {

            const value =
                String(name || "")
                    .trim();


            const match =
                value.match(
                    /^([a-zA-Z0-9]+)_/
                );


            if (match) {

                return match[1];

            }


            return "기타";

        }


        /* =========================================================
           이모지팩 목록
        ========================================================= */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    "emojiPack"
                );


            const counts =
                new Map();


            emojiList.forEach(
                function (emoji) {

                    const pack =
                        emoji.pack || "기타";


                    counts.set(
                        pack,
                        (
                            counts.get(pack) ||
                            0
                        ) + 1
                    );

                }
            );


            select.innerHTML = "";


            const allOption =
                document.createElement(
                    "option"
                );


            allOption.value =
                "";


            allOption.textContent =
                `전체 이모지 (${emojiList.length})`;


            select.appendChild(
                allOption
            );


            Array.from(
                counts.entries()
            )
            .sort(
                function (a, b) {

                    return a[0].localeCompare(
                        b[0],
                        undefined,
                        {
                            numeric: true
                        }
                    );

                }
            )
            .forEach(
                function (
                    [pack, count]
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        pack;


                    option.textContent =
                        `${pack} (${count})`;


                    select.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================================================
           이모지 검색 / 렌더링
        ========================================================= */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    "emojiBoard"
                );


            const search =
                document.getElementById(
                    "emojiSearch"
                ).value
                    .trim()
                    .toLowerCase();


            const pack =
                document.getElementById(
                    "emojiPack"
                ).value;


            const filtered =
                emojiList.filter(
                    function (emoji) {

                        const matchesSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );


                        const matchesPack =
                            !pack ||
                            emoji.pack === pack;


                        return (
                            matchesSearch &&
                            matchesPack
                        );

                    }
                );


            board.innerHTML = "";


            if (!filtered.length) {

                board.innerHTML = `
                    <div class="emoji-empty">
                        검색 결과가 없습니다.
                    </div>
                `;

                return;

            }


            const fragment =
                document.createDocumentFragment();


            filtered.forEach(
                function (emoji) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "emoji-item";


                    if (
                        selectedEmoji &&
                        selectedEmoji.image ===
                            emoji.image
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }


                    button.title =
                        emoji.name;


                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        emoji.image;


                    img.alt =
                        emoji.name;


                    img.loading =
                        "lazy";


                    img.crossOrigin =
                        "anonymous";


                    button.appendChild(
                        img
                    );


                    button.addEventListener(
                        "click",
                        function () {

                            selectEmoji(
                                emoji
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            board.appendChild(
                fragment
            );

        }


        /* =========================================================
           이모지 선택
        ========================================================= */

        function selectEmoji(emoji) {

            selectedEmoji = {

                code:
                    emoji.code,

                name:
                    emoji.name,

                image:
                    emoji.image,

                pack:
                    emoji.pack

            };


            updateSelectedEmojiUI();

            renderEmojiBoard();

        }


        /* =========================================================
           이모지 선택 UI
        ========================================================= */

        function updateSelectedEmojiUI() {

            const preview =
                document.getElementById(
                    "selectedEmojiPreview"
                );


            const name =
                document.getElementById(
                    "selectedEmojiName"
                );


            const clearButton =
                document.getElementById(
                    "clearEmojiButton"
                );


            if (
                selectedEmoji &&
                selectedEmoji.image
            ) {

                preview.src =
                    selectedEmoji.image;

                preview.classList.remove(
                    "hidden"
                );


                name.textContent =
                    selectedEmoji.name;


                clearButton.classList.remove(
                    "hidden"
                );

            } else {

                preview.src =
                    "";

                preview.classList.add(
                    "hidden"
                );


                name.textContent =
                    "선택된 이모지가 없습니다.";


                clearButton.classList.add(
                    "hidden"
                );

            }

        }


        /* =========================================================
           이모지 선택 해제
        ========================================================= */

        function clearEmojiSelection() {

            selectedEmoji =
                null;

            updateSelectedEmojiUI();

            renderEmojiBoard();

        }


        /* =========================================================
           모바일 메뉴
        ========================================================= */

        function toggleLeftMenu() {

            const drawer =
                document.getElementById(
                    "left-drawer"
                );

            const backdrop =
                document.getElementById(
                    "drawer-backdrop"
                );


            if (
                drawer.classList.contains(
                    "-translate-x-full"
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    "-translate-x-full"
                );

                backdrop.classList.remove(
                    "hidden"
                );

            } else {

                drawer.classList.add(
                    "-translate-x-full"
                );

                backdrop.classList.add(
                    "hidden"
                );

            }

        }


        /* =========================================================
           오른쪽 메뉴
        ========================================================= */

        function toggleRightMenu() {

            const drawer =
                document.getElementById(
                    "right-drawer"
                );

            const backdrop =
                document.getElementById(
                    "drawer-backdrop"
                );


            if (
                drawer.classList.contains(
                    "translate-x-full"
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    "translate-x-full"
                );

                backdrop.classList.remove(
                    "hidden"
                );

            } else {

                drawer.classList.add(
                    "translate-x-full"
                );

                backdrop.classList.add(
                    "hidden"
                );

            }

        }


        /* =========================================================
           메뉴 닫기
        ========================================================= */

        function closeAllDrawers() {

            document.getElementById(
                "left-drawer"
            ).classList.add(
                "-translate-x-full"
            );


            document.getElementById(
                "right-drawer"
            ).classList.add(
                "translate-x-full"
            );


            document.getElementById(
                "drawer-backdrop"
            ).classList.add(
                "hidden"
            );

        }


        /* =========================================================
           스와이프
        ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;

        const SWIPE_THRESHOLD = 60;


        function initSwipeGestures() {

            document.addEventListener(
                "touchstart",
                function (event) {

                    if (
                        !document
                            .getElementById(
                                "edit-modal"
                            )
                            .classList.contains(
                                "hidden"
                            )
                    ) {

                        return;

                    }


                    touchStartX =
                        event.changedTouches[0]
                            .screenX;

                    touchStartY =
                        event.changedTouches[0]
                            .screenY;

                },
                {
                    passive: true
                }
            );


            document.addEventListener(
                "touchend",
                function (event) {

                    if (
                        !document
                            .getElementById(
                                "edit-modal"
                            )
                            .classList.contains(
                                "hidden"
                            )
                    ) {

                        return;

                    }


                    const endX =
                        event.changedTouches[0]
                            .screenX;

                    const endY =
                        event.changedTouches[0]
                            .screenY;


                    const diffX =
                        endX -
                        touchStartX;


                    const diffY =
                        endY -
                        touchStartY;


                    if (
                        Math.abs(diffY) >
                        Math.abs(diffX)
                    ) {

                        return;

                    }


                    if (
                        Math.abs(diffX) <
                        SWIPE_THRESHOLD
                    ) {

                        return;

                    }


                    if (
                        diffX > 0
                    ) {

                        changeMonth(-1);

                    } else {

                        changeMonth(1);

                    }

                },
                {
                    passive: true
                }
            );

        }


        /* =========================================================
           캘린더 다운로드
        ========================================================= */

        async function downloadCalendar() {

            const liveArea =
                document.getElementById(
                    "capture-area"
                );


            const hidden =
                document.getElementById(
                    "hidden-capture-container"
                );


            try {

                await document.fonts.ready;


                const clone =
                    liveArea.cloneNode(
                        true
                    );


                clone.id =
                    "capture-clone";


                clone.style.width =
                    "1400px";


                clone.style.height =
                    "1229px";


                clone.style.margin =
                    "40px";


                clone.style.boxSizing =
                    "border-box";


                clone.classList.add(
                    "capture-mode"
                );


                /*
                 * 캡처용 영역에 넣기 전에
                 * 현재 메모 내용을 복사
                 */

                const memo =
                    document.getElementById(
                        "global-memo"
                    ).value;


                const memoTextarea =
                    clone.querySelector(
                        "#global-memo"
                    );


                const memoRender =
                    clone.querySelector(
                        "#global-memo-render"
                    );


                if (memoTextarea) {

                    memoTextarea.style.display =
                        "none";

                }


                if (memoRender) {

                    memoRender.textContent =
                        memo ||
                        "여기에 중요한 메모나 공지를 적어보세요...";

                    memoRender.style.display =
                        "block";

                }


                /*
                 * 다운로드 영역의 달력은
                 * 5행/6행을 자동 처리
                 */

                const days =
                    clone.querySelector(
                        "#calendar-days"
                    );


                if (days) {

                    const cells =
                        days.children.length;

                    const rows =
                        Math.ceil(
                            cells / 7
                        );

                    days.style.setProperty(
                        "--row-count",
                        rows
                    );

                }


                hidden.innerHTML =
                    "";


                hidden.appendChild(
                    clone
                );


                hidden.style.display =
                    "block";


                /*
                 * 브라우저 렌더링 완료 대기
                 */

                await new Promise(
                    function (resolve) {

                        requestAnimationFrame(
                            function () {

                                requestAnimationFrame(
                                    resolve
                                );

                            }
                        );

                    }
                );


                /*
                 * 일정 글자가 너무 길 경우
                 * 셀 안에서 자동 축소
                 */

                const cells =
                    clone.querySelectorAll(
                        ".calendar-cell.current-month"
                    );


                cells.forEach(
                    function (cell) {

                        const text =
                            cell.querySelector(
                                ".schedule-text"
                            );


                        if (!text) {
                            return;
                        }


                        let size = 22;


                        text.style.fontSize =
                            size + "px";


                        while (
                            cell.scrollHeight >
                                cell.clientHeight &&
                            size > 13
                        ) {

                            size -= 1;

                            text.style.fontSize =
                                size + "px";

                        }

                    }
                );


                await new Promise(
                    function (resolve) {

                        setTimeout(
                            resolve,
                            100
                        );

                    }
                );


                /*
                 * html2canvas
                 */

                const canvas =
                    await html2canvas(
                        hidden,
                        {

                            width: 1480,

                            height: 1309,

                            windowWidth: 1480,

                            windowHeight: 1309,

                            scale: 1,

                            backgroundColor:
                                null,

                            useCORS: true,

                            allowTaint: false,

                            logging: false

                        }
                    );


                const image =
                    canvas.toDataURL(
                        "image/png"
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                const title =
                    document.getElementById(
                        "calendar-title"
                    ).textContent
                        .replace(
                            ".",
                            "_"
                        );


                link.download =
                    `다이어리_${title}_1480x1309.png`;


                link.href =
                    image;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


            } catch (error) {

                console.error(
                    "캘린더 저장 실패:",
                    error
                );


                alert(
                    "이미지 저장 중 오류가 발생했습니다."
                );

            } finally {

                hidden.style.display =
                    "none";

                hidden.innerHTML =
                    "";

            }

        }


        /* =========================================================
           ESC로 모달 닫기
        ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    const modal =
                        document.getElementById(
                            "edit-modal"
                        );


                    if (
                        !modal.classList.contains(
                            "hidden"
                        )
                    ) {

                        closeModal();

                    }

                }

            }
        );


        /* =========================================================
           모달 바깥 클릭 닫기
        ========================================================= */

        document.getElementById(
            "edit-modal"
        ).addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();

                }

            }
        );


        /* =========================================================
           창 크기 변경 시 스프링 재생성
        ========================================================= */

        let resizeTimer = null;


        window.addEventListener(
            "resize",
            function () {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        function () {

                            generateSprings();

                        },
                        150
                    );

            }
        );


        /* =========================================================
           시작
        ========================================================= */

        window.addEventListener(
            "load",
            init
        );

    </script>
