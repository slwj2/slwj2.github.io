<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],

                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    },

                    colors: {
                        diaryBg: '#FAF8F5',
                        diaryLine: '#A94442',
                        diarySun: '#D9534F',
                        diarySat: '#4385D8',
                        diaryText: '#333333'
                    }
                }
            }
        };
    </script>

    <style>

        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #e5e7eb;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }


        /* =========================================================
           다이어리 종이
        ========================================================= */

        .diary-paper {
            position: relative;

            width: 100%;

            background: #FAF8F5;

            border: 2px solid #EDD9D9;

            border-radius: 24px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.10),
                inset 0 0 20px rgba(0, 0, 0, 0.02);

            overflow: hidden;
        }


        /* =========================================================
           스프링
        ========================================================= */

        .spring-wrapper {
            position: absolute;

            top: -22px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-evenly;

            padding: 0 55px;

            z-index: 20;

            pointer-events: none;
        }

        .spring {
            width: 15px;
            height: 42px;

            flex-shrink: 0;

            background:
                linear-gradient(
                    to right,
                    #c8c8c8 0%,
                    #ffffff 40%,
                    #a0a0a0 100%
                );

            border-radius: 8px;

            box-shadow:
                2px 3px 5px rgba(0, 0, 0, 0.25);

            position: relative;
        }

        .spring::after {
            content: '';

            position: absolute;

            bottom: -6px;
            left: 1px;

            width: 13px;
            height: 13px;

            background: #555;

            border-radius: 50%;

            box-shadow:
                inset 1px 1px 3px rgba(0, 0, 0, 0.7);

            z-index: -1;
        }


        /* =========================================================
           캘린더
        ========================================================= */

        .calendar-grid {
            width: 100%;

            border: 2px solid #A94442;

            border-radius: 12px;

            overflow: hidden;

            background: white;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        .calendar-header {
            display: grid;

            grid-template-columns: repeat(7, minmax(0, 1fr));

            flex: 0 0 48px;

            background: #FDF0F2;

            border-bottom: 2px solid #A94442;
        }

        .calendar-header-cell {
            display: flex;

            align-items: center;
            justify-content: center;

            border-right: 1px solid #EFD9DA;

            font-family: 'Nanum Pen Script', cursive;

            font-size: 24px;

            font-weight: 700;

            color: #A94442;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-header-cell.sun {
            color: #D9534F;
        }

        .calendar-header-cell.sat {
            color: #4385D8;
        }


        /* =========================================================
           날짜 영역
        ========================================================= */

        #calendar-days {
            display: grid;

            grid-template-columns: repeat(7, minmax(0, 1fr));

            grid-template-rows:
                repeat(
                    var(--row-count, 5),
                    minmax(0, 1fr)
                );

            flex: 1 1 auto;

            min-height: 0;

            background: white;
        }


        /* =========================================================
           날짜 칸
        ========================================================= */

        .calendar-cell {
            position: relative;

            min-width: 0;
            min-height: 0;

            padding: 9px;

            background: white;

            border-right: 1px solid #E9E9E9;
            border-bottom: 1px solid #E9E9E9;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            cursor: pointer;

            transition:
                background-color 0.15s ease;
        }

        .calendar-cell:hover {
            background: #FFF8F9;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }

        .calendar-cell.other-month {
            background: #FAFAFA;
            cursor: default;
        }


        /* =========================================================
           날짜 번호
        ========================================================= */

        .day-number {
            flex: 0 0 auto;

            width: fit-content;

            min-width: 28px;
            height: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-family: 'Quicksand', sans-serif;

            font-size: 18px;

            font-weight: 700;

            line-height: 1;
        }

        .day-number.sun {
            color: #D9534F;
        }

        .day-number.sat {
            color: #4385D8;
        }

        .day-number.weekday {
            color: #333333;
        }

        .day-number.other {
            color: #c7c7c7;
        }

        .day-number.today {
            background: #6C5CE7;
            color: white;
        }


        /* =========================================================
           날짜 내부
        ========================================================= */

        .day-content {
            width: 100%;

            min-height: 0;

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            gap: 4px;

            padding-top: 4px;

            overflow: hidden;
        }


        /* =========================================================
           치지직 이모지
        ========================================================= */

        .day-emoji {
            width: 36px;
            height: 36px;

            flex: 0 0 auto;

            object-fit: contain;

            image-rendering: auto;

            display: block;
        }

        .day-emoji.small {
            width: 32px;
            height: 32px;
        }


        /* =========================================================
           일정 텍스트
        ========================================================= */

        .schedule-text {
            width: 100%;

            color: #333333;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 20px;

            line-height: 1.15;

            text-align: center;

            white-space: pre-wrap;

            word-break: keep-all;

            overflow-wrap: anywhere;

            overflow: hidden;
        }


        /* =========================================================
           하단 메모
        ========================================================= */

        .desktop-memo {
            position: relative;

            width: 100%;

            flex: 0 0 150px;

            margin-top: 20px;

            padding: 23px 28px 16px;

            background: #FDF0F2;

            border: 2px solid #A94442;

            border-radius: 12px;

            overflow: hidden;
        }

        .memo-title {
            position: absolute;

            top: -17px;
            left: 20px;

            padding: 0 12px;

            background: #FAF8F5;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 30px;

            font-weight: 700;
        }

        #global-memo {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            resize: none;

            background: transparent;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 25px;

            line-height: 1.35;
        }

        #global-memo::placeholder {
            color: #D99A9D;
        }


        /* =========================================================
           이모지 선택창
        ========================================================= */

        .emoji-board {
            display: grid;

            grid-template-columns:
                repeat(
                    8,
                    minmax(0, 1fr)
                );

            gap: 3px;

            max-height: 245px;

            overflow-y: auto;

            padding: 5px;

            background: #F8F8F8;

            border: 1px solid #E5E7EB;

            border-radius: 10px;
        }

        .emoji-item {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 6px;

            background: transparent;

            cursor: pointer;

            transition:
                background-color 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-item:hover {
            background: #FCE7F3;

            transform: scale(1.05);
        }

        .emoji-item.selected {
            background: #FBCFE8;

            box-shadow:
                inset 0 0 0 2px #EC4899;
        }

        .emoji-item img {
            width: 28px;
            height: 28px;

            object-fit: contain;

            display: block;
        }

        .emoji-empty {
            grid-column: 1 / -1;

            padding: 30px 10px;

            text-align: center;

            color: #9CA3AF;

            font-size: 13px;
        }


        /* =========================================================
           스크롤바
        ========================================================= */

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;

            border-radius: 5px;
        }


        /* =========================================================
           캡처 전용 영역
           
           ★ 중요
           1480 × 1309 안에서 절대 넘치지 않도록
           모든 높이를 고정합니다.
        ========================================================= */

        #capture-wrapper {
            position: fixed;

            left: -20000px;
            top: 0;

            width: 1480px;
            height: 1309px;

            overflow: hidden;

            pointer-events: none;
        }

        #hidden-capture-container {
            width: 1480px !important;
            height: 1309px !important;

            padding: 40px !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            background: transparent !important;

            overflow: hidden !important;
        }

        #hidden-capture-container .diary-paper {
            width: 1400px !important;
            height: 1229px !important;

            flex: 0 0 1229px !important;

            padding:
                48px
                45px
                32px
                45px !important;

            margin: 0 !important;

            border-radius: 24px !important;

            border: 2px solid #EDD9D9 !important;

            box-shadow: none !important;

            background: #FAF8F5 !important;

            overflow: hidden !important;
        }

        #hidden-capture-container .spring-wrapper {
            top: -23px !important;

            padding:
                0
                55px !important;
        }

        #hidden-capture-container .spring {
            width: 17px !important;
            height: 44px !important;

            border-radius: 9px !important;
        }

        #hidden-capture-container .spring::after {
            width: 14px !important;
            height: 14px !important;

            left: 1px !important;
            bottom: -6px !important;
        }


        /* 캡처용 상단 제목 */

        #hidden-capture-container #calendar-title {
            font-family:
                'Quicksand',
                sans-serif !important;

            font-size: 42px !important;

            line-height: 1 !important;

            color: #A94442 !important;

            margin: 0 !important;
        }

        #hidden-capture-container .calendar-top {
            height: 58px !important;

            flex: 0 0 58px !important;

            margin-bottom: 16px !important;

            display: flex !important;

            align-items: flex-end !important;

            justify-content: flex-end !important;
        }


        /* 캡처용 달력 */

        #hidden-capture-container .calendar-grid {
            width: 100% !important;

            height: 900px !important;

            flex: 0 0 900px !important;

            min-height: 900px !important;

            border:
                2px solid #A94442 !important;

            border-radius: 12px !important;

            overflow: hidden !important;

            display: flex !important;

            flex-direction: column !important;

            background: white !important;
        }

        #hidden-capture-container .calendar-header {
            flex:
                0 0 50px !important;

            height: 50px !important;

            display: grid !important;
        }

        #hidden-capture-container .calendar-header-cell {
            font-size: 25px !important;

            border-right:
                1px solid #EFD9DA !important;

            border-bottom: none !important;
        }

        #hidden-capture-container #calendar-days {
            flex: 1 1 auto !important;

            height: 850px !important;

            min-height: 0 !important;

            display: grid !important;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                ) !important;

            grid-template-rows:
                repeat(
                    var(--row-count, 5),
                    minmax(0, 1fr)
                ) !important;
        }

        #hidden-capture-container .calendar-cell {
            min-height: 0 !important;

            height: 100% !important;

            padding: 8px !important;

            overflow: hidden !important;

            border-right:
                1px solid #E9E9E9 !important;

            border-bottom:
                1px solid #E9E9E9 !important;

            cursor: default !important;
        }

        #hidden-capture-container .day-number {
            width: 30px !important;
            min-width: 30px !important;

            height: 30px !important;

            font-size: 20px !important;
        }

        #hidden-capture-container .day-content {
            min-height: 0 !important;

            padding-top: 4px !important;

            gap: 3px !important;

            overflow: hidden !important;
        }

        #hidden-capture-container .day-emoji {
            width: 38px !important;
            height: 38px !important;

            max-width: 38px !important;
            max-height: 38px !important;

            flex: 0 0 38px !important;
        }

        #hidden-capture-container .schedule-text {
            width: 100% !important;

            font-size: 23px !important;

            line-height: 1.08 !important;

            text-align: center !important;

            word-break: keep-all !important;

            overflow-wrap: anywhere !important;

            white-space: pre-wrap !important;

            overflow: hidden !important;
        }


        /* 캡처용 메모 */

        #hidden-capture-container .desktop-memo {
            height: 145px !important;

            min-height: 145px !important;

            flex:
                0 0 145px !important;

            margin-top: 18px !important;

            padding:
                23px
                28px
                12px !important;

            border:
                2px solid #A94442 !important;

            border-radius: 12px !important;

            background: #FDF0F2 !important;

            overflow: hidden !important;
        }

        #hidden-capture-container .memo-title {
            top: -17px !important;
            left: 20px !important;

            font-size: 30px !important;

            padding: 0 12px !important;

            background: #FAF8F5 !important;
        }

        #hidden-capture-container #global-memo {
            display: none !important;
        }

        #hidden-capture-container #global-memo-render {
            display: block !important;

            width: 100% !important;

            height: 100% !important;

            padding: 0 !important;

            margin: 0 !important;

            color: #A94442 !important;

            font-family:
                'Nanum Pen Script',
                cursive !important;

            font-size: 29px !important;

            line-height: 1.3 !important;

            white-space: pre-wrap !important;

            word-break: keep-all !important;

            overflow-wrap: anywhere !important;

            overflow: hidden !important;
        }


        /* =========================================================
           모바일
        ========================================================= */

        @media (max-width: 767px) {

            body {
                background: #F3F4F6;
            }

            .diary-paper {
                border-radius: 16px;

                padding:
                    35px
                    8px
                    12px !important;
            }

            .spring-wrapper {
                top: -18px;

                padding: 0 8px;
            }

            .spring {
                width: 9px;
                height: 28px;

                border-radius: 5px;
            }

            .spring::after {
                width: 8px;
                height: 8px;

                left: 0;

                bottom: -4px;
            }

            .calendar-top {
                height: 45px;

                margin-bottom: 10px;
            }

            #calendar-title {
                font-size: 27px !important;
            }

            .calendar-header {
                flex-basis: 36px;
                height: 36px;
            }

            .calendar-header-cell {
                font-size: 18px;
            }

            .calendar-cell {
                padding: 5px;
            }

            .day-number {
                width: 23px;
                min-width: 23px;

                height: 23px;

                font-size: 13px;
            }

            .day-content {
                gap: 2px;

                padding-top: 2px;
            }

            .day-emoji {
                width: 28px;
                height: 28px;
            }

            .schedule-text {
                font-size: 14px;
                line-height: 1.1;
            }

            .desktop-memo {
                display: flex;

                flex-basis: 110px;

                height: 110px;

                margin-top: 12px;

                padding:
                    18px
                    14px
                    8px;
            }

            .memo-title {
                font-size: 23px;

                top: -13px;
                left: 12px;
            }

            #global-memo {
                font-size: 18px;
            }

            .emoji-board {
                grid-template-columns:
                    repeat(
                        7,
                        minmax(0, 1fr)
                    );

                max-height: 230px;
            }

            .emoji-item img {
                width: 25px;
                height: 25px;
            }
        }

    </style>
</head>


<body
    class="
        font-sans
        text-diary-text
        min-h-screen
        flex
        flex-col
        items-center
        md:p-8
    "
>


    <!-- =========================================================
         모바일 상단 메뉴
    ========================================================= -->

    <div
        class="
            md:hidden
            w-full
            flex
            justify-between
            items-center
            bg-white
            p-3
            shadow-sm
            relative
            z-20
            no-print
        "
    >

        <button
            onclick="toggleLeftMenu()"
            class="
                p-2
                bg-gray-100
                rounded-lg
            "
        >
            <i class="ph ph-list text-2xl text-gray-700"></i>
        </button>


        <div
            class="
                font-bold
                text-lg
                text-gray-700
                flex
                items-center
                gap-1
            "
        >
            <i
                class="
                    ph
                    ph-calendar-heart
                    text-pink-500
                    text-xl
                "
            ></i>

            다이어리
        </div>


        <button
            onclick="toggleRightMenu()"
            class="
                p-2
                bg-pink-100
                rounded-lg
            "
        >
            <i
                class="
                    ph
                    ph-note-pencil
                    text-2xl
                    text-pink-600
                "
            ></i>
        </button>

    </div>


    <!-- =========================================================
         모바일 왼쪽 메뉴
    ========================================================= -->

    <div
        id="left-drawer"
        class="
            fixed
            inset-y-0
            left-0
            w-64
            bg-white
            shadow-2xl
            transform
            -translate-x-full
            transition-transform
            duration-300
            z-40
            p-6
            flex
            flex-col
            md:hidden
            no-print
        "
    >

        <h2
            class="
                text-xl
                font-bold
                text-gray-800
                mb-8
                border-b
                pb-4
            "
        >
            메뉴
        </h2>


        <div class="flex flex-col gap-4">

            <button
                onclick="changeMonth(-1); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
                이전 달
            </button>


            <button
                onclick="goToToday(); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                    font-bold
                "
            >
                <i class="ph ph-calendar-check text-xl"></i>
                오늘
            </button>


            <button
                onclick="changeMonth(1); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
                다음 달
            </button>

        </div>


        <div class="mt-auto">

            <button
                onclick="downloadCalendar(); toggleLeftMenu();"
                class="
                    w-full
                    py-3
                    bg-pink-500
                    text-white
                    rounded-xl
                    font-bold
                    flex
                    items-center
                    justify-center
                    gap-2
                    shadow-md
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지 저장
            </button>

        </div>

    </div>


    <!-- =========================================================
         모바일 오른쪽 메모
    ========================================================= -->

    <div
        id="right-drawer"
        class="
            fixed
            inset-y-0
            right-0
            w-72
            bg-pink-50
            shadow-2xl
            transform
            translate-x-full
            transition-transform
            duration-300
            z-40
            p-6
            flex
            flex-col
            md:hidden
            no-print
        "
    >

        <h2
            class="
                text-xl
                font-handwriting
                text-diary-line
                font-bold
                mb-4
            "
        >
            <i class="ph-fill ph-push-pin text-pink-500"></i>
            Memo
        </h2>


        <textarea
            id="mobile-memo"
            class="
                flex-1
                w-full
                bg-transparent
                resize-none
                outline-none
                font-handwriting
                text-xl
                leading-relaxed
                text-diary-line
            "
            placeholder="여기에 중요한 메모나 공지를 적어보세요..."
            oninput="
                syncMemos(
                    'mobile-memo',
                    'global-memo'
                )
            "
        ></textarea>


        <button
            onclick="toggleRightMenu()"
            class="
                mt-4
                py-3
                bg-white
                text-gray-700
                rounded-xl
                font-bold
                shadow-sm
            "
        >
            닫기
        </button>

    </div>


    <!-- =========================================================
         모바일 배경
    ========================================================= -->

    <div
        id="drawer-backdrop"
        class="
            fixed
            inset-0
            bg-black/50
            hidden
            z-30
            md:hidden
        "
        onclick="closeAllDrawers()"
    ></div>


    <!-- =========================================================
         PC 상단 메뉴
    ========================================================= -->

    <div
        class="
            hidden
            md:flex
            w-full

    <!-- =========================================================

    <script>

        /* =========================================================
           기본 데이터
        ========================================================= */

        let currentDate = new Date();

        let calendarData = {};

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojis = [];

        const EMOJI_API_URL =
            'https://chzzk.dico.page/emojipacks';


        /* =========================================================
           초기화
        ========================================================= */

        function init() {

            loadCalendarData();

            generateSprings();

            renderCalendar();

            loadEmojis();

            initSwipeGestures();

        }


        /* =========================================================
           localStorage
        ========================================================= */

        function loadCalendarData() {

            try {

                const saved =
                    localStorage.getItem(
                        'diaryCalendarData'
                    );

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                if (
                    parsed &&
                    typeof parsed === 'object'
                ) {

                    calendarData =
                        parsed.days || {};

                    const memo =
                        parsed.memo || '';

                    document.getElementById(
                        'global-memo'
                    ).value = memo;

                    document.getElementById(
                        'mobile-memo'
                    ).value = memo;

                }

            } catch (error) {

                console.error(
                    '데이터 불러오기 실패:',
                    error
                );

            }

        }


        function saveCalendarData() {

            try {

                const memo =
                    document.getElementById(
                        'global-memo'
                    ).value;

                localStorage.setItem(
                    'diaryCalendarData',
                    JSON.stringify({
                        days: calendarData,
                        memo: memo
                    })
                );

            } catch (error) {

                console.error(
                    '데이터 저장 실패:',
                    error
                );

            }

        }


        /* =========================================================
           메모 동기화
        ========================================================= */

        function syncMemos(
            sourceId,
            targetId
        ) {

            const source =
                document.getElementById(
                    sourceId
                );

            const target =
                document.getElementById(
                    targetId
                );

            if (!source || !target) {
                return;
            }

            target.value =
                source.value;

            saveCalendarData();

        }


        /* =========================================================
           스프링 생성
        ========================================================= */

        function generateSprings() {

            const container =
                document.getElementById(
                    'springs-container'
                );

            container.innerHTML = '';

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                const spring =
                    document.createElement(
                        'div'
                    );

                spring.className =
                    'spring';

                container.appendChild(
                    spring
                );

            }

        }


        /* =========================================================
           달력 렌더링
        ========================================================= */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            /* 제목 */

            const title =
                `${year}.${String(
                    month + 1
                ).padStart(2, '0')}`;

            document.getElementById(
                'calendar-title'
            ).textContent = title;


            /* 시작 요일 */

            const firstDayIndex =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* 마지막 날짜 */

            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* 이전 달 마지막 날짜 */

            const prevLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const daysContainer =
                document.getElementById(
                    'calendar-days'
                );


            daysContainer.innerHTML = '';


            /* 5주 또는 6주 */

            const totalCells =
                Math.ceil(
                    (
                        firstDayIndex +
                        lastDay
                    ) / 7
                ) * 7;


            const rowCount =
                totalCells / 7;


            daysContainer.style.setProperty(
                '--row-count',
                rowCount
            );


            const today =
                new Date();

            const todayString =
                `${today.getFullYear()}-${String(
                    today.getMonth() + 1
                ).padStart(2, '0')}-${String(
                    today.getDate()
                ).padStart(2, '0')}`;


            let html = '';


            for (
                let i = 1;
                i <= totalCells;
                i++
            ) {

                let dayNumber;

                let isCurrentMonth =
                    true;

                let dateStr = '';


                /* 이전 달 */

                if (
                    i <= firstDayIndex
                ) {

                    dayNumber =
                        prevLastDay -
                        firstDayIndex +
                        i;

                    isCurrentMonth =
                        false;

                }


                /* 현재 달 */

                else if (
                    i <=
                    firstDayIndex +
                    lastDay
                ) {

                    dayNumber =
                        i -
                        firstDayIndex;

                    dateStr =
                        `${year}-${String(
                            month + 1
                        ).padStart(2, '0')}-${String(
                            dayNumber
                        ).padStart(2, '0')}`;

                }


                /* 다음 달 */

                else {

                    dayNumber =
                        i -
                        (
                            firstDayIndex +
                            lastDay
                        );

                    isCurrentMonth =
                        false;

                }


                const column =
                    (i - 1) % 7;


                let numberClass =
                    'weekday';


                if (!isCurrentMonth) {

                    numberClass =
                        'other';

                } else if (
                    column === 0
                ) {

                    numberClass =
                        'sun';

                } else if (
                    column === 6
                ) {

                    numberClass =
                        'sat';

                }


                if (
                    isCurrentMonth &&
                    dateStr === todayString
                ) {

                    numberClass +=
                        ' today';

                }


                if (
                    i > totalCells - 7
                ) {

                    /* 마지막 행 */

                }


                if (
                    !isCurrentMonth
                ) {

                    html += `
                        <div
                            class="
                                calendar-cell
                                other-month
                            "
                        >

                            <div
                                class="
                                    day-number
                                    ${numberClass}
                                "
                            >
                                ${dayNumber}
                            </div>

                        </div>
                    `;

                    continue;

                }


                const data =
                    calendarData[
                        dateStr
                    ] || {
                        text: '',
                        color: '#333333',
                        emoji: null
                    };


                let textHtml = '';

                if (data.text) {

                    textHtml =
                        escapeHtml(
                            data.text
                        ).replace(
                            /\n/g,
                            '<br>'
                        );

                }


                let emojiHtml = '';

                if (data.emoji) {

                    emojiHtml = `
                        <img
                            src="${escapeAttribute(
                                data.emoji.image
                            )}"
                            alt=""
                            class="
                                day-emoji
                            "
                            crossorigin="anonymous"
                        >
                    `;

                }


                html += `
                    <div
                        class="
                            calendar-cell
                            ${i > totalCells - 7
                                ? 'last-row'
                                : ''
                            }
                        "
                        onclick="
                            openModal(
                                '${dateStr}'
                            )
                        "
                    >

                        <div
                            class="
                                day-number
                                ${numberClass}
                            "
                        >
                            ${dayNumber}
                        </div>


                        <div
                            class="
                                day-content
                            "
                        >

                            ${
                                emojiHtml
                            }


                            ${
                                textHtml
                                    ? `
                                        <div
                                            class="
                                                schedule-text
                                            "
                                            style="
                                                color:
                                                ${escapeAttribute(
                                                    data.color ||
                                                    '#333333'
                                                )};
                                            "
                                        >
                                            ${textHtml}
                                        </div>
                                    `
                                    : ''
                            }

                        </div>

                    </div>
                `;

            }


            daysContainer.innerHTML =
                html;

        }


        /* =========================================================
           HTML 보안 처리
        ========================================================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        function escapeAttribute(value) {

            return escapeHtml(
                value
            );

        }


        /* =========================================================
           월 이동
        ========================================================= */

        function changeMonth(delta) {

            currentDate.setMonth(
                currentDate.getMonth() +
                delta
            );

            renderCalendar();

        }


        function goToToday() {

            currentDate =
                new Date();

            renderCalendar();

        }


        /* =========================================================
           일정 모달
        ========================================================= */

        function openModal(
            dateStr
        ) {

            editingDateStr =
                dateStr;


            const data =
                calendarData[
                    dateStr
                ] || {
                    text: '',
                    color: '#333333',
                    emoji: null
                };


            const [
                year,
                month,
                day
            ] =
                dateStr.split('-');


            document.getElementById(
                'modal-date-title'
            ).textContent =
                `${year}년 ${parseInt(
                    month
                )}월 ${parseInt(
                    day
                )}일`;


            document.getElementById(
                'modal-text'
            ).value =
                data.text || '';


            document.getElementById(
                'modal-color'
            ).value =
                data.color ||
                '#333333';


            selectedEmoji =
                data.emoji ||
                null;


            updateSelectedEmojiUI();


            document.getElementById(
                'emoji-search'
            ).value = '';


            document.getElementById(
                'emoji-pack'
            ).value = '';


            renderEmojiBoard();


            document.getElementById(
                'edit-modal'
            ).classList.remove(
                'hidden'
            );

        }


        function closeModal() {

            document.getElementById(
                'edit-modal'
            ).classList.add(
                'hidden'
            );


            editingDateStr =
                null;

            selectedEmoji =
                null;

        }


        /* =========================================================
           일정 저장
        ========================================================= */

        function saveDayData() {

            if (!editingDateStr) {
                return;
            }


            const text =
                document.getElementById(
                    'modal-text'
                ).value.trim();


            const color =
                document.getElementById(
                    'modal-color'
                ).value;


            if (
                !text &&
                !selectedEmoji
            ) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text: text,

                    color: color,

                    emoji:
                        selectedEmoji

                };

            }


            saveCalendarData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           치지직 이모지 API
        ========================================================= */

        async function loadEmojis() {

            const countLabel =
                document.getElementById(
                    'emoji-count-label'
                );


            try {

                countLabel.textContent =
                    '불러오는 중...';


                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            cache:
                                'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                const source =
                    json.emojis ||
                    json;


                const result = [];

                const duplicate =
                    new Set();


                /*
                    실제 API 구조:

                    {
                        "emojis": {
                            "{:ag_1:}": {
                                "ag_1":
                                "https://..."
                            }
                        }
                    }

                    따라서 2단계로 접근해야 합니다.
                */

                Object.entries(
                    source
                ).forEach(
                    ([outerCode, emojiData]) => {

                        if (
                            !emojiData ||
                            typeof emojiData !==
                            'object'
                        ) {
                            return;
                        }


                        Object.entries(
                            emojiData
                        ).forEach(
                            ([name, image]) => {

                                if (
                                    typeof image !==
                                    'string'
                                ) {
                                    return;
                                }


                                if (
                                    !image.startsWith(
                                        'http'
                                    )
                                ) {
                                    return;
                                }


                                const code =
                                    outerCode ||
                                    `{:${name}:}`;


                                if (
                                    duplicate.has(
                                        image
                                    )
                                ) {
                                    return;
                                }


                                duplicate.add(
                                    image
                                );


                                const pack =
                                    name
                                        .split('_')[0]
                                        .toLowerCase();


                                result.push({

                                    code:
                                        code,

                                    name:
                                        name,

                                    image:
                                        image,

                                    pack:
                                        pack,

                                    search:
                                        `${name} ${code} ${pack}`
                                            .toLowerCase()

                                });

                            }
                        );

                    }
                );


                emojis =
                    result.sort(
                        (a, b) =>
                            a.name.localeCompare(
                                b.name
                            )
                    );


                countLabel.textContent =
                    `${emojis.length}개`;


                buildEmojiPackList();

                renderEmojiBoard();

            } catch (error) {

                console.error(
                    '치지직 이모지 불러오기 실패:',
                    error
                );


                countLabel.textContent =
                    '불러오기 실패';


                document.getElementById(
                    'emoji-board'
                ).innerHTML = `
                    <div
                        class="emoji-empty"
                    >
                        치지직 이모지를
                        불러오지 못했습니다.<br>
                        잠시 후 다시 시도해주세요.
                    </div>
                `;

            }

        }


        /* =========================================================
           이모지 팩 목록
        ========================================================= */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    'emoji-pack'
                );


            const counts =
                new Map();


            emojis.forEach(
                emoji => {

                    counts.set(
                        emoji.pack,
                        (
                            counts.get(
                                emoji.pack
                            ) || 0
                        ) + 1
                    );

                }
            );


            select.innerHTML = `
                <option value="">
                    전체 이모지 (${emojis.length})
                </option>
            `;


            Array.from(
                counts.entries()
            )
                .sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0]
                        )
                )
                .forEach(
                    ([pack, count]) => {

                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            pack;


                        option.textContent =
                            `${pack} (${count})`;


                        select.appendChild(
                            option
                        );

                    }
                );

        }


        /* =========================================================
           이모지 검색 / 렌더링
        ========================================================= */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    'emoji-board'
                );


            const search =
                document.getElementById(
                    'emoji-search'
                )
                .value
                .trim()
                .toLowerCase();


            const pack =
                document.getElementById(
                    'emoji-pack'
                ).value;


            const filtered =
                emojis.filter(
                    emoji => {

                        const matchSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );


                        const matchPack =
                            !pack ||
                            emoji.pack ===
                            pack;


                        return (
                            matchSearch &&
                            matchPack
                        );

                    }
                );


            if (!filtered.length) {

                board.innerHTML = `
                    <div
                        class="emoji-empty"
                    >
                        검색 결과가 없습니다.
                    </div>
                `;

                return;

            }


            let html = '';


            filtered.forEach(
                emoji => {

                    const selected =
                        selectedEmoji &&
                        selectedEmoji.image ===
                        emoji.image;


                    html += `
                        <button
                            type="button"
                            class="
                                emoji-item
                                ${selected
                                    ? 'selected'
                                    : ''
                                }
                            "
                            title="${escapeAttribute(
                                emoji.name
                            )}"
                            onclick="
                                selectEmoji(
                                    ${JSON.stringify(
                                        emoji
                                    ).replace(
                                        /"/g,
                                        '&quot;'
                                    )}
                                )
                            "
                        >

                            <img
                                src="${escapeAttribute(
                                    emoji.image
                                )}"
                                alt=""
                                loading="lazy"
                                crossorigin="anonymous"
                            >

                        </button>
                    `;

                }
            );


            board.innerHTML =
                html;

        }


        /* =========================================================
           이모지 선택
        ========================================================= */

        function selectEmoji(
            emoji
        ) {

            selectedEmoji = {

                code:
                    emoji.code,

                name:
                    emoji.name,

                image:
                    emoji.image,

                pack:
                    emoji.pack

            };


            updateSelectedEmojiUI();

            renderEmojiBoard();

        }


        /* =========================================================
           이모지 제거
        ========================================================= */

        function clearEmoji() {

            selectedEmoji =
                null;

            updateSelectedEmojiUI();

            renderEmojiBoard();

        }


        /* =========================================================
           선택된 이모지 UI
        ========================================================= */

        function updateSelectedEmojiUI() {

            const preview =
                document.getElementById(
                    'selected-emoji-preview'
                );


            const name =
                document.getElementById(
                    'selected-emoji-name'
                );


            if (!selectedEmoji) {

                preview.innerHTML = `
                    <span
                        class="
                            text-xs
                            text-gray-400
                        "
                    >
                        없음
                    </span>
                `;


                name.textContent =
                    '이모지를 선택하세요.';


                return;

            }


            preview.innerHTML = `
                <img
                    src="${escapeAttribute(
                        selectedEmoji.image
                    )}"
                    class="
                        w-8
                        h-8
                        object-contain
                    "
                    crossorigin="anonymous"
                >
            `;


            name.textContent =
                selectedEmoji.name;

        }


        /* =========================================================
           모바일 메뉴
        ========================================================= */

        function toggleLeftMenu() {

            const drawer =
                document.getElementById(
                    'left-drawer'
                );

            const backdrop =
                document.getElementById(
                    'drawer-backdrop'
                );


            if (
                drawer.classList.contains(
                    '-translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    '-translate-x-full'
                );

                backdrop.classList.remove(
                    'hidden'
                );

            } else {

                drawer.classList.add(
                    '-translate-x-full'
                );

                backdrop.classList.add(
                    'hidden'
                );

            }

        }


        function toggleRightMenu() {

            const drawer =
                document.getElementById(
                    'right-drawer'
                );

            const backdrop =
                document.getElementById(
                    'drawer-backdrop'
                );


            if (
                drawer.classList.contains(
                    'translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    'translate-x-full'
                );

                backdrop.classList.remove(
                    'hidden'
                );

            } else {

                drawer.classList.add(
                    'translate-x-full'
                );

                backdrop.classList.add(
                    'hidden'
                );

            }

        }


        function closeAllDrawers() {

            document.getElementById(
                'left-drawer'
            ).classList.add(
                '-translate-x-full'
            );


            document.getElementById(
                'right-drawer'
            ).classList.add(
                'translate-x-full'
            );


            document.getElementById(
                'drawer-backdrop'
            ).classList.add(
                'hidden'
            );

        }


        /* =========================================================
           모바일 스와이프
        ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchEndX = 0;

        let touchEndY = 0;


        const SWIPE_THRESHOLD = 60;


        function initSwipeGestures() {

            document.addEventListener(
                'touchstart',
                event => {

                    touchStartX =
                        event.changedTouches[0]
                            .screenX;

                    touchStartY =
                        event.changedTouches[0]
                            .screenY;

                },
                {
                    passive: true
                }
            );


            document.addEventListener(
                'touchend',
                event => {

                    touchEndX =
                        event.changedTouches[0]
                            .screenX;

                    touchEndY =
                        event.changedTouches[0]
                            .screenY;

                    handleSwipe();

                },
                {
                    passive: true
                }
            );

        }


        function handleSwipe() {

            if (
                !document
                    .getElementById(
                        'edit-modal'
                    )
                    .classList
                    .contains('hidden')
            ) {
                return;
            }


            const diffX =
                touchEndX -
                touchStartX;


            const diffY =
                touchEndY -
                touchStartY;


            if (
                Math.abs(diffY) >
                Math.abs(diffX)
            ) {
                return;
            }


            const leftDrawer =
                document.getElementById(
                    'left-drawer'
                );


            const rightDrawer =
                document.getElementById(
                    'right-drawer'
                );


            const leftOpen =
                !leftDrawer.classList.contains(
                    '-translate-x-full'
                );


            const rightOpen =
                !rightDrawer.classList.contains(
                    'translate-x-full'
                );


            if (
                diffX >
                SWIPE_THRESHOLD
            ) {

                if (rightOpen) {

                    toggleRightMenu();

                } else if (!leftOpen) {

                    toggleLeftMenu();

                }

            } else if (
                diffX <
                -SWIPE_THRESHOLD
            ) {

                if (leftOpen) {

                    toggleLeftMenu();

                } else if (!rightOpen) {

                    toggleRightMenu();

                }

            }

        }


        /* =========================================================
           캘린더 이미지 저장
        ========================================================= */

        async function downloadCalendar() {

            const liveArea =
                document.getElementById(
                    'capture-area'
                );


            const hiddenContainer =
                document.getElementById(
                    'hidden-capture-container'
                );


            try {

                /* 폰트 로딩 완료 */

                await document.fonts.ready;


                /* 기존 내용 제거 */

                hiddenContainer.innerHTML =
                    '';


                /* 실제 캘린더 복제 */

                const clone =
                    liveArea.cloneNode(
                        true
                    );


                clone.id =
                    'cloned-capture-area';


                clone.className =
                    'w-full';


                /* 메모 값 */

                let memoText =
                    document.getElementById(
                        'global-memo'
                    ).value;


                if (
                    !memoText
                ) {

                    memoText =
                        document.getElementById(
                            'mobile-memo'
                        ).value;

                }


                /* 캡처용 메모 */

                const textarea =
                    clone.querySelector(
                        '#global-memo'
                    );


                const memoRender =
                    clone.querySelector(
                        '#global-memo-render'
                    );


                if (textarea) {

                    textarea.style.display =
                        'none';

                }


                if (memoRender) {

                    memoRender.textContent =
                        memoText ||
                        '';

                    memoRender.classList.remove(
                        'hidden'
                    );

                }


                /* 모바일/PC 클래스 문제 제거 */

                const memo =
                    clone.querySelector(
                        '.desktop-memo'
                    );


                if (memo) {

                    memo.classList.remove(
                        'hidden'
                    );

                    memo.style.display =
                        'flex';

                }


                /* 캡처 영역에 삽입 */

                hiddenContainer.appendChild(
                    clone
                );


                /* 렌더링 안정화 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            150
                        )
                );


                /*
                    일정 텍스트 자동 축소

                    6주 달에서도 텍스트가
                    날짜 칸 밖으로 나가지 않도록
                    최대 23px에서 줄입니다.
                */

                const cells =
                    clone.querySelectorAll(
                        '.calendar-cell'
                    );


                cells.forEach(
                    cell => {

                        const text =
                            cell.querySelector(
                                '.schedule-text'
                            );


                        if (!text) {
                            return;
                        }


                        let size = 23;


                        text.style.setProperty(
                            'font-size',
                            `${size}px`,
                            'important'
                        );


                        while (
                            cell.scrollHeight >
                                cell.clientHeight &&
                            size > 13
                        ) {

                            size -= 1;


                            text.style.setProperty(
                                'font-size',
                                `${size}px`,
                                'important'
                            );

                        }

                    }
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            100
                        )
                );


                /* =================================================
                   핵심 캡처
                   
                   반드시 1480 × 1309
                ================================================= */

                const canvas =
                    await html2canvas(
                        hiddenContainer,
                        {

                            width: 1480,

                            height: 1309,

                            windowWidth: 1480,

                            windowHeight: 1309,

                            scale: 1,

                            backgroundColor:
                                null,

                            useCORS:
                                true,

                            allowTaint:
                                false,

                            logging:
                                false

                        }
                    );


                /* PNG */

                const image =
                    canvas.toDataURL(
                        'image/png'
                    );


                const title =
                    document.getElementById(
                        'calendar-title'
                    )
                    .textContent
                    .replace(
                        '.',
                        '_'
                    );


                const link =
                    document.createElement(
                        'a'
                    );


                link.download =
                    `다이어리_${title}_1480x1309.png`;


                link.href =
                    image;


                link.click();


            } catch (error) {

                console.error(
                    '이미지 저장 실패:',
                    error
                );


                alert(
                    '이미지 저장 중 오류가 발생했습니다.'
                );

            } finally {

                hiddenContainer.innerHTML =
                    '';

            }

        }


        /* =========================================================
           ESC로 모달 닫기
        ========================================================= */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Escape'
                ) {

                    closeModal();

                    closeAllDrawers();

                }

            }
        );


        /* =========================================================
           모달 바깥 클릭
        ========================================================= */

        document
            .getElementById(
                'edit-modal'
            )
            .addEventListener(
                'click',
                event => {

                    if (
                        event.target.id ===
                        'edit-modal'
                    ) {

                        closeModal();

                    }

                }
            );


        /* =========================================================
           시작
        ========================================================= */

        window.addEventListener(
            'load',
            init
        );

    </script>
