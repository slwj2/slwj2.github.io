<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],

                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    },

                    colors: {
                        diaryBg: '#FAF8F5',
                        diaryLine: '#A94442',
                        diarySun: '#D9534F',
                        diarySat: '#4285D4',
                        diaryText: '#333333'
                    }
                }
            }
        };
    </script>

    <style>

        /* =========================================================
           기본
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            overflow-x: hidden;
            font-family: 'Quicksand', sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }


        /* =========================================================
           다이어리 종이
        ========================================================= */

        .diary-paper {
            position: relative;

            width: 100%;
            max-width: 1400px;

            /*
             * 세로가 계속 커지는 문제를 방지하기 위해
             * 캘린더 전체 높이를 기준으로 설계합니다.
             */
            min-height: 0;

            background: #FAF8F5;

            border: 2px solid #E8DADA;

            border-radius: 24px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.18),
                inset 0 0 25px rgba(0, 0, 0, 0.015);

            overflow: visible;
        }


        /* =========================================================
           스프링
        ========================================================= */

        .spring-wrapper {
            position: absolute;

            top: -22px;
            left: 0;

            width: 100%;

            padding: 0 70px;

            display: flex;
            justify-content: space-between;

            z-index: 20;

            pointer-events: none;
        }

        .spring {
            width: 16px;
            height: 44px;

            border-radius: 9px;

            background:
                linear-gradient(
                    to right,
                    #9b9b9b 0%,
                    #ffffff 35%,
                    #dddddd 55%,
                    #8d8d8d 100%
                );

            box-shadow:
                2px 3px 5px rgba(0, 0, 0, 0.3);

            position: relative;
        }

        .spring::after {
            content: '';

            position: absolute;

            left: 1px;
            bottom: -7px;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #333;

            box-shadow:
                inset 1px 1px 3px rgba(0, 0, 0, 0.8);
        }


        /* =========================================================
           상단 날짜
        ========================================================= */

        .calendar-title {
            color: #A94442;

            font-size: clamp(
                28px,
                4vw,
                52px
            );

            font-weight: 700;

            letter-spacing: 0.04em;

            line-height: 1;
        }


        /* =========================================================
           달력
        ========================================================= */

        .calendar-grid {
            width: 100%;

            border: 3px solid #A94442;

            border-radius: 14px;

            overflow: hidden;

            background: white;
        }


        /* =========================================================
           요일
        ========================================================= */

        .calendar-week {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            height: 52px;

            background: #FDF0F1;

            border-bottom: 3px solid #A94442;
        }

        .calendar-header-cell {
            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 25px;

            font-weight: 700;

            color: #A94442;

            border-right:
                1px solid #EBDADA;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-header-cell.sun {
            color: #D9534F;
        }

        .calendar-header-cell.sat {
            color: #4285D4;
        }


        /* =========================================================
           날짜 영역
        ========================================================= */

        #calendar-days {
            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            /*
             * JS에서 자동으로 5행 / 6행 설정
             */
            grid-template-rows:
                repeat(
                    var(--row-count, 5),
                    minmax(0, 1fr)
                );

            /*
             * 전체 캘린더 높이를 제한합니다.
             * 이 부분이 기존 세로가 계속 커지는 문제를 막습니다.
             */
            height: 780px;

            background: white;
        }


        /* =========================================================
           날짜 한 칸
        ========================================================= */

        .calendar-cell {
            position: relative;

            min-width: 0;
            min-height: 0;

            padding: 8px;

            background: #fff;

            border-right:
                1px solid #E9E2E2;

            border-bottom:
                1px solid #E9E2E2;

            overflow: hidden;

            cursor: pointer;

            transition:
                background-color 0.15s ease;
        }

        .calendar-cell:hover {
            background: #FFF9FA;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }


        /* =========================================================
           날짜 번호
        ========================================================= */

        .day-number {
            width: fit-content;

            min-width: 26px;
            height: 26px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 4px;

            font-size: 20px;

            line-height: 1;

            font-weight: 700;
        }

        .other-month {
            color: #C7C7C7 !important;
        }

        .sun-number {
            color: #D9534F;
        }

        .sat-number {
            color: #4285D4;
        }

        .normal-number {
            color: #333;
        }


        /* =========================================================
           오늘 날짜 표시
        ========================================================= */

        .today-number {
            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 50%;

            background: #7057E8;

            color: white !important;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 700;

            box-shadow:
                0 2px 5px rgba(112, 87, 232, 0.25);
        }


        /* =========================================================
           날짜 내용
        ========================================================= */

        .day-content {
            width: 100%;
            height: calc(100% - 32px);

            min-width: 0;
            min-height: 0;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            justify-content: flex-start;

            overflow: hidden;

            pointer-events: none;
        }


        /* =========================================================
           일정 한 줄 그룹
        ========================================================= */

        .schedule-line {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 3px;

            /*
             * 이모지 + 글자가 하나의 그룹으로 움직이게 합니다.
             */
            flex-wrap: nowrap;

            /*
             * 한 줄에서 이모지가 따로 떨어지거나
             * 강제로 다음 줄로 넘어가지 않게 합니다.
             */
            white-space: nowrap;

            overflow: hidden;

            min-width: 0;

            margin-bottom: 2px;
        }


        /* =========================================================
           일정 텍스트
        ========================================================= */

        .schedule-text {
            min-width: 0;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 23px;

            line-height: 1.15;

            font-weight: 400;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            /*
             * 이모지와 글자가 같은 span 그룹에 들어가도록
             * inline-flex를 사용합니다.
             */
            display: inline-flex;

            align-items: center;

            flex-wrap: nowrap;

            max-width: 100%;
        }


        /* =========================================================
           치지직 이모지
        ========================================================= */

        .inline-emoji {
            display: inline-block;

            width: 28px;
            height: 28px;

            min-width: 28px;
            min-height: 28px;

            object-fit: contain;

            vertical-align: middle;

            margin: 0 1px;

            /*
             * 이미지 때문에 줄바꿈되는 것을 방지합니다.
             */
            flex: 0 0 auto;
        }


        /*
         * 이모지 하나 또는 여러 개를
         * 하나의 그룹으로 취급합니다.
         */
        .emoji-group {
            display: inline-flex;

            align-items: center;

            flex-wrap: nowrap;

            white-space: nowrap;

            vertical-align: middle;

            flex: 0 0 auto;
        }


        /* =========================================================
           일정 내용이 길 경우
        ========================================================= */

        .schedule-text.compact {
            font-size: 19px;
        }

        .schedule-text.tiny {
            font-size: 16px;
        }

        .schedule-text.micro {
            font-size: 14px;
        }


        /* =========================================================
           하단 메모
        ========================================================= */

        .desktop-memo {
            position: relative;

            margin-top: 18px;

            min-height: 145px;

            padding: 25px 28px 18px;

            background: #FDF0F1;

            border: 3px solid #A94442;

            border-radius: 13px;
        }

        .memo-title {
            position: absolute;

            top: -20px;
            left: 20px;

            padding: 0 12px;

            background: #FAF8F5;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 32px;

            font-weight: 700;

            line-height: 1;
        }

        #global-memo {
            width: 100%;

            min-height: 90px;

            resize: none;

            outline: none;

            border: none;

            background: transparent;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 25px;

            line-height: 1.35;
        }

        #global-memo::placeholder {
            color: #D7A6A6;
        }


        /* =========================================================
           모바일
        ========================================================= */

        @media (max-width: 767px) {

            body {
                background: #FAF8F5;
            }

            .diary-paper {
                border-radius: 0;

                border-left: none;
                border-right: none;

                padding:
                    45px 8px 15px;
            }

            .spring-wrapper {
                padding: 0 25px;
            }

            .spring {
                width: 10px;
                height: 32px;
            }

            .spring::after {
                width: 9px;
                height: 9px;

                bottom: -5px;
                left: 0;
            }

            .calendar-week {
                height: 38px;
            }

            .calendar-header-cell {
                font-size: 17px;
            }

            #calendar-days {
                /*
                 * 모바일에서는 화면 폭에 맞춰
                 * 지나치게 세로로 길어지지 않도록 합니다.
                 */
                height: 520px;
            }

            .calendar-cell {
                padding: 5px;
            }

            .day-number {
                min-width: 21px;
                height: 21px;

                font-size: 15px;
            }

            .today-number {
                width: 25px;
                height: 25px;

                min-width: 25px;
            }

            .inline-emoji {
                width: 20px;
                height: 20px;

                min-width: 20px;
                min-height: 20px;
            }

            .schedule-text {
                font-size: 16px;
            }

            .schedule-text.compact {
                font-size: 14px;
            }

            .schedule-text.tiny {
                font-size: 12px;
            }

            .schedule-text.micro {
                font-size: 11px;
            }

            .desktop-memo {
                min-height: 120px;

                margin-top: 15px;

                padding:
                    22px 16px 10px;
            }

            .memo-title {
                font-size: 26px;

                top: -16px;
            }

            #global-memo {
                font-size: 20px;
            }
        }


        /* =========================================================
           이모지 선택 모달
        ========================================================= */

        .emoji-board {
            display: grid;

            grid-template-columns:
                repeat(8, minmax(0, 1fr));

            gap: 4px;

            max-height: 260px;

            overflow-y: auto;

            padding: 6px;

            background: #F8F8F8;

            border-radius: 10px;
        }

        .emoji-button {
            width: 100%;

            aspect-ratio: 1 / 1;

            border: none;

            border-radius: 7px;

            background: white;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background-color 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-button:hover {
            background: #FFF0F2;

            transform: scale(1.05);
        }

        .emoji-button.selected {
            background: #FBD5DB;

            box-shadow:
                inset 0 0 0 2px #E77788;
        }

        .emoji-button img {
            width: 30px;
            height: 30px;

            object-fit: contain;
        }

        .emoji-code {
            display: none;
        }


        /* =========================================================
           캡처용 영역
        ========================================================= */

        #hidden-capture-container {
            position: fixed;

            left: -99999px;
            top: 0;

            width: 1480px;
            height: 1309px;

            overflow: hidden;

            background: transparent;

            z-index: -9999;
        }

        #hidden-capture-container .capture-paper {
            width: 1400px;
            height: 1229px;

            margin: 40px;

            padding:
                58px 50px 38px;

            background: #FAF8F5;

            border:
                2px solid #E8DADA;

            border-radius: 24px;

            box-shadow: none;

            position: relative;

            display: flex;

            flex-direction: column;
        }

        #hidden-capture-container .calendar-title {
            font-size: 52px;
        }

        #hidden-capture-container .calendar-week {
            height: 48px;
        }

        #hidden-capture-container .calendar-header-cell {
            font-size: 25px;
        }

        #hidden-capture-container #calendar-days {
            /*
             * 1229px 종이 안에서
             * 헤더 / 달력 / 메모가 정확하게 들어가도록
             * 고정 높이를 사용합니다.
             */
            height: 760px;
        }

        #hidden-capture-container .calendar-cell {
            padding: 8px;
        }

        #hidden-capture-container .day-number {
            font-size: 20px;
        }

        #hidden-capture-container .today-number {
            width: 32px;
            height: 32px;

            min-width: 32px;
        }

        #hidden-capture-container .inline-emoji {
            width: 28px;
            height: 28px;

            min-width: 28px;
            min-height: 28px;
        }

        #hidden-capture-container .schedule-text {
            font-size: 22px;
        }

        #hidden-capture-container .schedule-text.compact {
            font-size: 18px;
        }

        #hidden-capture-container .schedule-text.tiny {
            font-size: 15px;
        }

        #hidden-capture-container .schedule-text.micro {
            font-size: 13px;
        }

        #hidden-capture-container .desktop-memo {
            height: 150px;

            min-height: 150px;

            margin-top: 18px;

            padding:
                24px 28px 12px;

            flex-shrink: 0;
        }

        #hidden-capture-container .memo-title {
            font-size: 32px;
        }

        #hidden-capture-container #global-memo {
            display: none;
        }

        #hidden-capture-container #capture-memo-render {
            display: block;

            width: 100%;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 27px;

            line-height: 1.4;

            white-space: pre-wrap;

            word-break: break-word;
        }

    </style>
</head>


<body>

    <!-- =========================================================
         모바일 상단
    ========================================================= -->

    <div
        class="md:hidden w-full bg-white p-3 flex items-center justify-between shadow-sm"
    >

        <button
            onclick="changeMonth(-1)"
            class="p-2 rounded-lg bg-gray-100"
        >
            <i class="ph ph-caret-left text-xl"></i>
        </button>

        <div
            id="mobile-title"
            class="font-bold text-gray-700"
        >
            2026.09
        </div>

        <button
            onclick="changeMonth(1)"
            class="p-2 rounded-lg bg-gray-100"
        >
            <i class="ph ph-caret-right text-xl"></i>
        </button>

    </div>


    <!-- =========================================================
         PC 네비게이션
    ========================================================= -->

    <div
        class="
            hidden
            md:flex
            w-full
            max-w-5xl
            mx-auto
            mt-5
            mb-5
            px-5
            items-center
            justify-between
            bg-white
            rounded-2xl
            shadow-sm
            py-3
        "
    >

        <div
            class="font-bold text-gray-700 text-lg"
        >
            다이어리 캘린더
        </div>

        <div
            class="flex items-center gap-2"
        >

            <button
                onclick="changeMonth(-1)"
                class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200"
            >
                <i class="ph ph-caret-left text-xl"></i>
            </button>

            <button
                onclick="goToToday()"
                class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 font-bold"
            >
                오늘
            </button>

            <button
                onclick="changeMonth(1)"
                class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200"
            >
                <i class="ph ph-caret-right text-xl"></i>
            </button>

            <button
                onclick="downloadCalendar()"
                class="
                    ml-2
                    px-5
                    py-2
                    rounded-lg
                    bg-pink-500
                    hover:bg-pink-600
                    text-white
                    font-bold
                    flex
                    items-center
                    gap-2
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지 저장
            </button>

        </div>

    </div>


    <!-- =========================================================
         캘린더 본체
    ========================================================= -->

    <main
        id="capture-area"
        class="w-full max-w-[1400px] mx-auto p-2 md:p-0"
    >

        <div
            id="diary-paper"
            class="diary-paper p-3 md:p-10 pt-12 md:pt-16"
        >

            <!-- 스프링 -->
            <div
                id="springs-container"
                class="spring-wrapper"
            ></div>


            <!-- =================================================
                 날짜 제목
            ================================================= -->

            <div
                class="
                    flex
                    justify-end
                    items-center
                    mb-4
                    md:mb-5
                    px-1
                "
            >

                <div
                    id="calendar-title"
                    class="calendar-title"
                >
                    2026.09
                </div>

            </div>


            <!-- =================================================
                 달력
            ================================================= -->

            <div class="calendar-grid">

                <!-- 요일 -->
                <div class="calendar-week">

                    <div class="calendar-header-cell sun">
                        Sun
                    </div>

                    <div class="calendar-header-cell">
                        Mon
                    </div>

                    <div class="calendar-header-cell">
                        Tue
                    </div>

                    <div class="calendar-header-cell">
                        Wed
                    </div>

                    <div class="calendar-header-cell">
                        Thu
                    </div>

                    <div class="calendar-header-cell">
                        Fri
                    </div>

                    <div class="calendar-header-cell sat">
                        Sat
                    </div>

                </div>


                <!-- 날짜 -->
                <div
                    id="calendar-days"
                    style="--row-count: 5;"
                ></div>

            </div>


            <!-- =================================================
                 메모
            ================================================= -->

            <div class="desktop-memo">

                <span class="memo-title">
                    Memo
                </span>

                <textarea
                    id="global-memo"
                    placeholder="여기에 중요한 메모나 공지를 적어보세요..."
                    oninput="saveMemo()"
                ></textarea>

                <!-- 이미지 저장용 -->
                <div
                    id="capture-memo-render"
                    style="display:none;"
                ></div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         일정 수정 모달
    ========================================================= -->

    <div
        id="edit-modal"
        class="
            hidden
            fixed
            inset-0
            bg-black/60
            backdrop-blur-sm
            items-center
            justify-center
            z-50
            p-4
        "
    >

        <div
            class="
                bg-white
                rounded-2xl
                shadow-2xl
                w-full
                max-w-lg
                overflow-hidden
            "
        >

            <!-- 모달 헤더 -->
            <div
                class="
                    bg-pink-100
                    px-5
                    py-4
                    flex
                    items-center
                    justify-between
                    border-b
                    border-pink-200
                "
            >

                <div
                    class="font-bold text-lg text-gray-800"
                >
                    <i class="ph-fill ph-calendar-blank text-pink-500"></i>

                    <span id="modal-date-title">
                        일정
                    </span>
                </div>

                <button
                    onclick="closeModal()"
                    class="p-2 text-gray-500 hover:text-gray-800"
                >
                    <i class="ph ph-x text-2xl"></i>
                </button>

            </div>


            <!-- 모달 내용 -->
            <div class="p-5 space-y-5">

                <!-- 일정 -->
                <div>

                    <label
                        class="
                            block
                            text-sm
                            font-bold
                            text-gray-700
                            mb-2
                        "
                    >
                        일정 내용
                    </label>

                    <textarea
                        id="modal-text"

    <!-- =========================================================

    <div id="hidden-capture-container"></div>


    <script>

        /* =========================================================
           전역 변수
        ========================================================= */

        let currentDate = new Date();

        let calendarData = {};

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojis = [];

        const EMOJI_API_URL =
            'https://chzzk.dico.page/emojipacks';

        const STORAGE_KEY =
            'cute_diary_calendar_v3';


        /* =========================================================
           초기화
        ========================================================= */

        async function init() {

            loadSavedData();

            generateSprings();

            renderCalendar();

            await loadEmojis();

            initSwipe();

        }


        /* =========================================================
           저장 데이터 불러오기
        ========================================================= */

        function loadSavedData() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    calendarData = {};
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                calendarData =
                    parsed.calendarData || {};

                const memo =
                    parsed.memo || '';

                const memoElement =
                    document.getElementById(
                        'global-memo'
                    );

                if (memoElement) {
                    memoElement.value = memo;
                }

            } catch (error) {

                console.error(
                    '저장 데이터 불러오기 실패:',
                    error
                );

                calendarData = {};

            }

        }


        /* =========================================================
           전체 저장
        ========================================================= */

        function saveAllData() {

            const memo =
                document.getElementById(
                    'global-memo'
                ).value;

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                    calendarData,
                    memo
                })
            );

        }


        /* =========================================================
           메모 저장
        ========================================================= */

        function saveMemo() {
            saveAllData();
        }


        /* =========================================================
           스프링 생성
        ========================================================= */

        function generateSprings() {

            const container =
                document.getElementById(
                    'springs-container'
                );

            container.innerHTML = '';

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                const spring =
                    document.createElement('div');

                spring.className =
                    'spring';

                container.appendChild(
                    spring
                );

            }

        }


        /* =========================================================
           날짜 포맷
        ========================================================= */

        function makeDateString(
            year,
            month,
            day
        ) {

            return `${year}-${String(
                month + 1
            ).padStart(2, '0')}-${String(
                day
            ).padStart(2, '0')}`;

        }


        /* =========================================================
           캘린더 렌더링
        ========================================================= */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();

            const title =
                `${year}.${String(
                    month + 1
                ).padStart(2, '0')}`;

            document.getElementById(
                'calendar-title'
            ).textContent = title;

            const mobileTitle =
                document.getElementById(
                    'mobile-title'
                );

            if (mobileTitle) {
                mobileTitle.textContent =
                    title;
            }


            /* 첫 번째 요일 */
            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            /* 이번 달 마지막 날짜 */
            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /*
             * 필요한 주 수 계산
             */
            const rowCount =
                Math.ceil(
                    (firstDay + lastDay) / 7
                );


            const daysContainer =
                document.getElementById(
                    'calendar-days'
                );

            daysContainer.innerHTML = '';

            daysContainer.style.setProperty(
                '--row-count',
                rowCount
            );


            /*
             * 이전 달 마지막 날짜
             */
            const previousLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const totalCells =
                rowCount * 7;


            /*
             * 오늘 날짜
             */
            const today =
                new Date();

            const todayString =
                makeDateString(
                    today.getFullYear(),
                    today.getMonth(),
                    today.getDate()
                );


            let html = '';


            /* =====================================================
               날짜 셀
            ===================================================== */

            for (
                let index = 0;
                index < totalCells;
                index++
            ) {

                let dayNumber;

                let dateString = '';

                let currentMonth = true;


                /*
                 * 이전 달
                 */
                if (index < firstDay) {

                    dayNumber =
                        previousLastDay -
                        firstDay +
                        index +
                        1;

                    currentMonth = false;

                }

                /*
                 * 이번 달
                 */
                else if (
                    index <
                    firstDay + lastDay
                ) {

                    dayNumber =
                        index -
                        firstDay +
                        1;

                    dateString =
                        makeDateString(
                            year,
                            month,
                            dayNumber
                        );

                }

                /*
                 * 다음 달
                 */
                else {

                    dayNumber =
                        index -
                        firstDay -
                        lastDay +
                        1;

                    currentMonth = false;

                }


                const column =
                    index % 7;


                let numberClass =
                    'normal-number';


                if (!currentMonth) {

                    numberClass =
                        'other-month';

                } else if (column === 0) {

                    numberClass =
                        'sun-number';

                } else if (column === 6) {

                    numberClass =
                        'sat-number';

                }


                /*
                 * 오늘이면 원형 표시
                 */
                const isToday =
                    currentMonth &&
                    dateString === todayString;


                if (isToday) {
                    numberClass =
                        'today-number';
                }


                const isLastRow =
                    index >=
                    totalCells - 7;


                const data =
                    currentMonth
                        ? (
                            calendarData[
                                dateString
                            ] || {}
                        )
                        : {};


                /*
                 * 일정 내용
                 */
                const text =
                    data.text || '';


                /*
                 * 일정 렌더링
                 */
                const contentHtml =
                    currentMonth
                        ? renderScheduleContent(
                            text,
                            data.color ||
                                '#333333'
                        )
                        : '';


                html += `
                    <div
                        class="
                            calendar-cell
                            ${isLastRow ? 'last-row' : ''}
                        "
                        ${
                            currentMonth
                                ? `onclick="openModal('${dateString}')"`
                                : ''
                        }
                    >

                        <div
                            class="
                                day-number
                                ${numberClass}
                            "
                        >
                            ${dayNumber}
                        </div>

                        <div
                            class="day-content"
                        >
                            ${contentHtml}
                        </div>

                    </div>
                `;

            }


            daysContainer.innerHTML =
                html;

        }


        /* =========================================================
           일정 텍스트 + 이모지 렌더링
        ========================================================= */

        function renderScheduleContent(
            text,
            color
        ) {

            if (!text) {
                return '';
            }


            /*
             * 줄바꿈 기준으로 먼저 분리합니다.
             *
             * 각 줄은 하나의 schedule-line 그룹입니다.
             */
            const lines =
                text.split(/\r?\n/);


            return lines
                .map(line => {

                    if (!line.trim()) {
                        return '';
                    }


                    const content =
                        parseEmojiText(
                            line,
                            color
                        );


                    return `
                        <div class="schedule-line">
                            <span
                                class="
                                    schedule-text
                                    ${getTextSizeClass(line)}
                                "
                                style="color:${escapeHtml(color)};"
                            >
                                ${content}
                            </span>
                        </div>
                    `;

                })
                .join('');

        }


        /* =========================================================
           일정 글자 크기 자동
        ========================================================= */

        function getTextSizeClass(text) {

            /*
             * 코드 길이를 기준으로
             * 긴 일정은 작게 표시합니다.
             */

            if (text.length > 42) {
                return 'micro';
            }

            if (text.length > 30) {
                return 'tiny';
            }

            if (text.length > 20) {
                return 'compact';
            }

            return '';

        }


        /* =========================================================
           이모지 코드 파싱
        ========================================================= */

        function parseEmojiText(
            text,
            color
        ) {

            /*
             * {sub_01}
             * {ag_01}
             * {mlb_01}
             * 같은 형식을 찾습니다.
             */

            const regex =
                /\{([a-zA-Z0-9_]+)\}/g;


            let result = '';

            let lastIndex = 0;

            let match;


            while (
                (match =
                    regex.exec(text))
                !== null
            ) {

                /*
                 * 이모지 앞쪽 일반 텍스트
                 */
                result +=
                    escapeHtml(
                        text.slice(
                            lastIndex,
                            match.index
                        )
                    );


                const code =
                    match[1];


                /*
                 * 실제 이모지 찾기
                 */
                const emoji =
                    findEmoji(code);


                if (emoji) {

                    /*
                     * 이모지를 별도의 이미지가 아닌
                     * 같은 inline 그룹으로 묶습니다.
                     */
                    result += `
                        <span
                            class="emoji-group"
                            title="{${escapeHtml(code)}}"
                        >
                            <img
                                class="inline-emoji"
                                src="${escapeHtml(emoji.image)}"
                                alt="{${escapeHtml(code)}}"
                            >
                        </span>
                    `;

                } else {

                    /*
                     * API에 없는 코드라면
                     * 코드 자체를 표시합니다.
                     */
                    result +=
                        escapeHtml(
                            match[0]
                        );

                }


                lastIndex =
                    regex.lastIndex;

            }


            /*
             * 마지막 텍스트
             */
            result +=
                escapeHtml(
                    text.slice(lastIndex)
                );


            return result;

        }


        /* =========================================================
           이모지 찾기
        ========================================================= */

        function findEmoji(code) {

            return emojis.find(
                emoji =>
                    emoji.code === code
            );

        }


        /* =========================================================
           치지직 이모지 API 로딩
        ========================================================= */

        async function loadEmojis() {

            const countLabel =
                document.getElementById(
                    'emoji-count-label'
                );

            const board =
                document.getElementById(
                    'emoji-board'
                );


            try {

                countLabel.textContent =
                    '불러오는 중...';


                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                /*
                 * 실제 API 구조:
                 *
                 * {
                 *   "emojis": {
                 *      "{:ag_1:}": {
                 *          "ag_1":
                 *          "https://..."
                 *      }
                 *   }
                 * }
                 */

                const source =
                    json.emojis || {};


                const loaded = [];


                /*
                 * 중복 방지
                 */
                const seen =
                    new Set();


                Object.entries(
                    source
                ).forEach(
                    ([outerCode, emojiData]) => {

                        /*
                         * API 값이 객체인지 확인
                         */
                        if (
                            !emojiData ||
                            typeof emojiData !==
                            'object'
                        ) {
                            return;
                        }


                        Object.entries(
                            emojiData
                        ).forEach(
                            ([name, image]) => {

                                if (
                                    typeof image !==
                                    'string'
                                ) {
                                    return;
                                }


                                if (
                                    !image.startsWith(
                                        'http'
                                    )
                                ) {
                                    return;
                                }


                                /*
                                 * API 이름에서
                                 * 팩 이름 추출
                                 *
                                 * sub_01
                                 * ->
                                 * sub
                                 */
                                const parts =
                                    name.split('_');


                                const pack =
                                    parts[0] ||
                                    '기타';


                                /*
                                 * 코드에는
                                 * { }를 넣지 않습니다.
                                 *
                                 * 저장:
                                 * sub_01
                                 *
                                 * 표시:
                                 * {sub_01}
                                 */
                                const code =
                                    name;


                                if (
                                    seen.has(code)
                                ) {
                                    return;
                                }


                                seen.add(code);


                                loaded.push({

                                    code,

                                    name,

                                    image,

                                    pack,

                                    search:
                                        `${name} ${pack}`
                                            .toLowerCase()

                                });

                            }
                        );

                    }
                );


                /*
                 * 이름 순 정렬
                 */
                loaded.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                numeric: true
                            }
                        )
                );


                emojis = loaded;


                countLabel.textContent =
                    `${emojis.length}개`;


                buildEmojiPackList();

                renderEmojiBoard();


                console.log(
                    `치지직 이모지 ${emojis.length}개 로드 완료`
                );


            } catch (error) {

                console.error(
                    '치지직 이모지 로딩 실패:',
                    error
                );


                countLabel.textContent =
                    '로드 실패';


                board.innerHTML = `
                    <div
                        class="
                            col-span-full
                            text-center
                            text-red-400
                            py-8
                        "
                    >
                        이모지를 불러오지 못했습니다.<br>
                        <span class="text-xs">
                            ${escapeHtml(
                                error.message
                            )}
                        </span>
                    </div>
                `;

            }

        }


        /* =========================================================
           이모지팩 목록
        ========================================================= */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    'emoji-pack'
                );


            const counts =
                new Map();


            emojis.forEach(
                emoji => {

                    counts.set(
                        emoji.pack,
                        (
                            counts.get(
                                emoji.pack
                            ) || 0
                        ) + 1
                    );

                }
            );


            const packs =
                [...counts.entries()]
                    .sort(
                        (a, b) =>
                            a[0].localeCompare(
                                b[0],
                                undefined,
                                {
                                    numeric: true
                                }
                            )
                    );


            select.innerHTML = `
                <option value="">
                    전체 이모지 (${emojis.length})
                </option>
            `;


            packs.forEach(
                ([pack, count]) => {

                    const option =
                        document.createElement(
                            'option'
                        );

                    option.value =
                        pack;

                    option.textContent =
                        `${pack} (${count})`;

                    select.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================================================
           이모지 보드
        ========================================================= */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    'emoji-board'
                );


            const search =
                document.getElementById(
                    'emoji-search'
                ).value
                    .trim()
                    .toLowerCase();


            const pack =
                document.getElementById(
                    'emoji-pack'
                ).value;


            let filtered =
                emojis.filter(
                    emoji => {

                        const matchesSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );

                        const matchesPack =
                            !pack ||
                            emoji.pack === pack;

                        return (
                            matchesSearch &&
                            matchesPack
                        );

                    }
                );


            if (!filtered.length) {

                board.innerHTML = `
                    <div
                        class="
                            col-span-full
                            text-center
                            text-gray-400
                            py-8
                        "
                    >
                        이모지가 없습니다.
                    </div>
                `;

                return;
            }


            board.innerHTML =
                filtered
                    .map(
                        emoji => `
                            <button
                                type="button"
                                class="
                                    emoji-button
                                    ${
                                        selectedEmoji &&
                                        selectedEmoji.code ===
                                            emoji.code
                                            ? 'selected'
                                            : ''
                                    }
                                "
                                onclick="selectEmoji('${escapeJs(
                                    emoji.code
                                )}')"
                                title="{${escapeHtml(
                                    emoji.code
                                )}}"
                            >

                                <img
                                    src="${escapeHtml(
                                        emoji.image
                                    )}"
                                    alt="{${escapeHtml(
                                        emoji.code
                                    )}}"
                                    loading="lazy"
                                >

                            </button>
                        `
                    )
                    .join('');

        }


        /* =========================================================
           이모지 선택
        ========================================================= */

        function selectEmoji(code) {

            const emoji =
                findEmoji(code);


            if (!emoji) {
                return;
            }


            selectedEmoji = emoji;


            /*
             * textarea에 실제로
             *
             * {sub_01}
             *
             * 형태로 삽입합니다.
             */
            insertEmojiCode(
                `{${emoji.code}}`
            );


            renderEmojiBoard();

        }


        /* =========================================================
           textarea에 이모지 코드 삽입
        ========================================================= */

        function insertEmojiCode(code) {

            const textarea =
                document.getElementById(
                    'modal-text'
                );


            const start =
                textarea.selectionStart;


            const end =
                textarea.selectionEnd;


            const value =
                textarea.value;


            /*
             * 선택된 부분을 이모지 코드로 교체
             */
            textarea.value =
                value.substring(
                    0,
                    start
                ) +
                code +
                value.substring(
                    end
                );


            /*
             * 커서를 이모지 코드 뒤로 이동
             */
            const newPosition =
                start + code.length;


            textarea.focus();


            textarea.setSelectionRange(
                newPosition,
                newPosition
            );

        }


        /* =========================================================
           일정 모달 열기
        ========================================================= */

        function openModal(dateStr) {

            editingDateStr =
                dateStr;


            const data =
                calendarData[
                    dateStr
                ] || {
                    text: '',
                    color: '#333333'
                };


            const [
                year,
                month,
                day
            ] =
                dateStr.split('-');


            document.getElementById(
                'modal-date-title'
            ).textContent =
                `${year}년 ${parseInt(
                    month
                )}월 ${parseInt(
                    day
                )}일`;


            document.getElementById(
                'modal-text'
            ).value =
                data.text || '';


            document.getElementById(
                'modal-color'
            ).value =
                data.color ||
                '#333333';


            selectedEmoji = null;


            document.getElementById(
                'emoji-search'
            ).value = '';


            document.getElementById(
                'emoji-pack'
            ).value = '';


            renderEmojiBoard();


            const modal =
                document.getElementById(
                    'edit-modal'
                );


            modal.classList.remove(
                'hidden'
            );

            modal.classList.add(
                'flex'
            );

        }


        /* =========================================================
           모달 닫기
        ========================================================= */

        function closeModal() {

            const modal =
                document.getElementById(
                    'edit-modal'
                );


            modal.classList.add(
                'hidden'
            );

            modal.classList.remove(
                'flex'
            );


            editingDateStr =
                null;

            selectedEmoji =
                null;

        }


        /* =========================================================
           일정 저장
        ========================================================= */

        function saveDayData() {

            if (!editingDateStr) {
                return;
            }


            const text =
                document.getElementById(
                    'modal-text'
                ).value.trim();


            const color =
                document.getElementById(
                    'modal-color'
                ).value;


            /*
             * 내용이 없으면 날짜 데이터를 제거합니다.
             */
            if (!text) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text,

                    color

                };

            }


            saveAllData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           일정 삭제
        ========================================================= */

        function deleteDayData() {

            if (!editingDateStr) {
                return;
            }


            delete calendarData[
                editingDateStr
            ];


            saveAllData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           이전 / 다음 달
        ========================================================= */

        function changeMonth(delta) {

            currentDate.setMonth(
                currentDate.getMonth() +
                delta
            );


            renderCalendar();

        }


        /* =========================================================
           오늘
        ========================================================= */

        function goToToday() {

            currentDate =
                new Date();


            renderCalendar();

        }


        /* =========================================================
           이미지 저장
        ========================================================= */

        async function downloadCalendar() {

            const hidden =
                document.getElementById(
                    'hidden-capture-container'
                );


            try {

                await document.fonts.ready;


                /*
                 * 현재 캘린더를 복제합니다.
                 */
                const source =
                    document.getElementById(
                        'capture-area'
                    );


                const clone =
                    source.cloneNode(
                        true
                    );


                /*
                 * 캡처용 paper
                 */
                const paper =
                    clone.querySelector(
                        '.diary-paper'
                    );


                paper.classList.add(
                    'capture-paper'
                );


                /*
                 * 메모 textarea 대신
                 * 텍스트 렌더링용 div 사용
                 */
                const textarea =
                    clone.querySelector(
                        '#global-memo'
                    );


                const memoRender =
                    clone.querySelector(
                        '#capture-memo-render'
                    );


                const memo =
                    document.getElementById(
                        'global-memo'
                    ).value;


                if (textarea) {

                    textarea.style.display =
                        'none';

                }


                if (memoRender) {

                    memoRender.style.display =
                        'block';

                    memoRender.textContent =
                        memo ||
                        '';

                }


                hidden.innerHTML =
                    '';

                hidden.appendChild(
                    clone
                );


                /*
                 * 브라우저 렌더링 대기
                 */
                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            300
                        )
                );


                /*
                 * 1480 x 1309 PNG
                 */
                const canvas =
                    await html2canvas(
                        hidden,
                        {
                            width: 1480,

                            height: 1309,

                            windowWidth: 1480,

                            windowHeight: 1309,

                            scale: 1,

                            backgroundColor:
                                null,

                            useCORS: true,

                            allowTaint: false,

                            logging: false
                        }
                    );


                const image =
                    canvas.toDataURL(
                        'image/png'
                    );


                const link =
                    document.createElement(
                        'a'
                    );


                const title =
                    document.getElementById(
                        'calendar-title'
                    ).textContent
                        .replace(
                            '.',
                            '_'
                        );


                link.download =
                    `다이어리_${title}_1480x1309.png`;


                link.href =
                    image;


                link.click();


            } catch (error) {

                console.error(
                    '이미지 저장 실패:',
                    error
                );


                alert(
                    '이미지 저장 중 오류가 발생했습니다.'
                );

            } finally {

                hidden.innerHTML =
                    '';

            }

        }


        /* =========================================================
           모바일 스와이프
        ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;


        function initSwipe() {

            document.addEventListener(
                'touchstart',
                event => {

                    if (
                        !event.changedTouches
                            .length
                    ) {
                        return;
                    }


                    touchStartX =
                        event
                            .changedTouches[0]
                            .screenX;


                    touchStartY =
                        event
                            .changedTouches[0]
                            .screenY;

                },
                {
                    passive: true
                }
            );


            document.addEventListener(
                'touchend',
                event => {

                    if (
                        !event.changedTouches
                            .length
                    ) {
                        return;
                    }


                    const endX =
                        event
                            .changedTouches[0]
                            .screenX;


                    const endY =
                        event
                            .changedTouches[0]
                            .screenY;


                    const diffX =
                        endX -
                        touchStartX;


                    const diffY =
                        endY -
                        touchStartY;


                    /*
                     * 세로 스크롤이면 무시
                     */
                    if (
                        Math.abs(diffY) >
                        Math.abs(diffX)
                    ) {
                        return;
                    }


                    if (
                        Math.abs(diffX) <
                        70
                    ) {
                        return;
                    }


                    /*
                     * 모달이 열려 있으면
                     * 달을 넘기지 않습니다.
                     */
                    if (
                        !document
                            .getElementById(
                                'edit-modal'
                            )
                            .classList
                            .contains(
                                'hidden'
                            )
                    ) {
                        return;
                    }


                    if (
                        diffX < 0
                    ) {

                        changeMonth(1);

                    } else {

                        changeMonth(-1);

                    }

                },
                {
                    passive: true
                }
            );

        }


        /* =========================================================
           HTML 특수문자 처리
        ========================================================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        /* =========================================================
           JavaScript 문자열용 이스케이프
        ========================================================= */

        function escapeJs(value) {

            return String(value)
                .replace(
                    /\\/g,
                    '\\\\'
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /"/g,
                    '\\"'
                );

        }


        /* =========================================================
           페이지 시작
        ========================================================= */

        window.addEventListener(
            'load',
            init
        );


        /* =========================================================
           ESC로 모달 닫기
        ========================================================= */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key !==
                    'Escape'
                ) {
                    return;
                }


                const modal =
                    document.getElementById(
                        'edit-modal'
                    );


                if (
                    !modal.classList
                        .contains(
                            'hidden'
                        )
                ) {

                    closeModal();

                }

            }
        );

    </script>
