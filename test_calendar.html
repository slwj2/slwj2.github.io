<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'handwriting': ['"Nanum Pen Script"', 'cursive'],
                        'sans': ['Quicksand', 'sans-serif'],

                    colors: {
                        'diary-bg': '#FAF8F5',
                        'diary-line': '#A94442',

    <style>
        body {
            background-color: #e5e7eb; 
            overflow-x: hidden;
        }

        /* ------------------ 캘린더 기본 스타일 ------------------ */
        .diary-paper {
            background-color: #FAF8F5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.02);
            position: relative;
        }

        .calendar-grid {
            border: 2px solid #A94442;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }

        .calendar-header-cell {
            border-bottom: 2px solid #A94442;
            border-right: 1px solid rgba(169, 68, 66, 0.2); 
            background-color: #FDF4F5;
        }
        .calendar-header-cell:last-child { border-right: none; }

        .calendar-cell {
            border-bottom: 1px solid rgba(169, 68, 66, 0.2);
            border-right: 1px solid rgba(169, 68, 66, 0.2);
            box-sizing: border-box; 
            min-height: 100px;
            height: auto; /* 내용이 많으면 자연스럽게 늘어나게 설정 */
            position: relative;
            background-color: white;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) { .calendar-cell { min-height: 140px; } }
        .calendar-cell:nth-child(7n) { border-right: none; }
        .calendar-cell.last-row { border-bottom: none; }

        /* ------------------ 스프링 제본 디자인 ------------------ */
        .spring-wrapper {
            position: absolute;
            top: -24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            padding: 0 20px;
            z-index: 10;
        }
        .spring {
            width: 14px;
            height: 40px;
            background: linear-gradient(to right, #d4d4d4 0%, #ffffff 40%, #a3a3a3 100%);
            border-radius: 7px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.3);
            position: relative;
        }
        .spring::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 1px;
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
            z-index: -1;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* ------------------ 백그라운드 캡처 전용 스타일 (1480x1309) ------------------ */
        #hidden-capture-container {
            padding: 40px !important;
            background-color: transparent !important;
            align-items: center !important;
            display: flex !important;
            justify-content: center !important;
        }
        #hidden-capture-container .diary-paper {
            width: 1400px !important; 
            height: 1229px !important; /* 위아래 40px 패딩 고려하여 정확한 높이 지정 */
            display: flex !important;
            flex-direction: column !important;
            flex: none !important;
            margin: 0 !important; 
            padding: 60px 50px 50px 50px !important;
            border-radius: 24px !important; 
            border: 2px solid #EDD9D9 !important; /* 헥스코드 강제 변환 */
            background-color: #FAF8F5 !important;
            box-shadow: none !important; 
        }
        
        #hidden-capture-container .spring-wrapper { top: -25px !important; }
        #hidden-capture-container .spring { width: 20px !important; height: 50px !important; border-radius: 10px !important; box-shadow: 2px 3px 5px rgba(0,0,0,0.1) !important; }
        #hidden-capture-container .spring::after { width: 16px !important; height: 16px !important; bottom: -8px !important; left: 2px !important; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5) !important; }
        
        #hidden-capture-container .text-diary-sun { color: #D9534F !important; }

        #hidden-capture-container .text-diary-text { color: #333333 !important; }
        #hidden-capture-container .text-diary-line { color: #A94442 !important; }

        #hidden-capture-container .mb-4, #hidden-capture-container .mb-6 { margin-bottom: 25px !important; }
        #hidden-capture-container .text-3xl, #hidden-capture-container .md\:text-5xl { font-size: 56px !important; line-height: 1 !important; color: #A94442 !important; }

    </style>

    <script>
        let currentDate = new Date();
        let calendarData = {};
        let editingDateStr = null;
        let pendingImageDataUrl = null;

        function init() {
            generateSprings();
            renderCalendar();
            initSwipeGestures();
        }

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const SWIPE_THRESHOLD = 60; 

        function initSwipeGestures() {
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});

            document.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, {passive: true});
        }

        function handleSwipe() {
            if (!document.getElementById('edit-modal').classList.contains('hidden')) return;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX)) return; 
            
            const leftDrawer = document.getElementById('left-drawer');
            const rightDrawer = document.getElementById('right-drawer');
            const isLeftOpen = !leftDrawer.classList.contains('-translate-x-full');
            const isRightOpen = !rightDrawer.classList.contains('translate-x-full');

            if (diffX > SWIPE_THRESHOLD) {
                if (isRightOpen) toggleRightMenu();
                else if (!isLeftOpen) toggleLeftMenu();
            }
            else if (diffX < -SWIPE_THRESHOLD) {
                if (isLeftOpen) toggleLeftMenu();
                else if (!isRightOpen) toggleRightMenu();
            }
        }

        function toggleLeftMenu() {
            const drawer = document.getElementById('left-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            if (drawer.classList.contains('-translate-x-full')) {
                closeAllDrawers(); 
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function toggleRightMenu() {
            const drawer = document.getElementById('right-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            if (drawer.classList.contains('translate-x-full')) {
                closeAllDrawers();
                drawer.classList.remove('translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function closeAllDrawers() {
            document.getElementById('left-drawer').classList.add('-translate-x-full');
            document.getElementById('right-drawer').classList.add('translate-x-full');
            document.getElementById('drawer-backdrop').classList.add('hidden');
        }

        function syncMemos(sourceId, targetId) {
            document.getElementById(targetId).value = document.getElementById(sourceId).value;
        }

        function generateSprings() {
            const container = document.getElementById('springs-container');
            container.innerHTML = '';
            for(let i = 0; i < 15; i++) {
                const spring = document.createElement('div');
                spring.className = 'spring';
                container.appendChild(spring);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const titleStr = `${year}.${String(month + 1).padStart(2, '0')}`;
            document.getElementById('calendar-title').textContent = titleStr;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const totalCells = Math.ceil((firstDayIndex + lastDay) / 7) * 7;
            let daysHtml = '';

            for (let i = 1; i <= totalCells; i++) {
                let dayNumber;
                let isCurrentMonth = true;
                let dateStr = '';

                if (i <= firstDayIndex) {
                    dayNumber = prevLastDay - firstDayIndex + i;
                    isCurrentMonth = false;
                } else if (i <= firstDayIndex + lastDay) {
                    dayNumber = i - firstDayIndex;
                    dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
                } else {
                    dayNumber = i - (firstDayIndex + lastDay);
                    isCurrentMonth = false;
                }

                const colIndex = (i - 1) % 7;
                let textClass = 'text-gray-400 text-xs md:text-sm'; 
                if (isCurrentMonth) {
                    if (colIndex === 0) textClass = 'text-diary-sun font-bold'; 
                    else if (colIndex === 6) textClass = 'text-diary-sat font-bold';
                    else textClass = 'text-diary-text font-bold'; 
                }

                let cellClasses = 'calendar-cell p-1.5 cursor-pointer hover:bg-pink-50 group flex flex-col';
                if (i > totalCells - 7) cellClasses += ' last-row';

                const dayData = calendarData[dateStr] || { text: '', color: '#333333', image: null };
                const formattedText = dayData.text ? dayData.text.replace(/\n/g, '<br>') : '';

                // 웹사이트 화면에서는 높이 제한을 없애서 자유롭게 반응형으로 늘어나게 합니다. (overflow-hidden 제거)
                if (isCurrentMonth) {
                    daysHtml += `
                        <div class="${cellClasses}" onclick="openModal('${dateStr}')">
                            <div class="${textClass} text-sm md:text-lg font-sans ml-1 day-number">${dayNumber}</div>
                            <div class="w-full mt-1 flex-1 flex flex-col items-center justify-start gap-1 pointer-events-none day-content">
                                ${dayData.image ? `<img src="${dayData.image}" class="day-img max-w-[95%] max-h-[60px] md:max-h-[80px] object-contain">` : ''}
                                ${formattedText ? `<div style="color: ${dayData.color};" class="font-handwriting text-lg md:text-2xl leading-tight break-all text-center w-full schedule-text">${formattedText}</div>` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    daysHtml += `
                        <div class="${cellClasses} bg-gray-50/50">
                            <div class="${textClass} ml-1 day-number">${dayNumber}</div>
                        </div>
                    `;
                }
            }

            daysContainer.innerHTML = daysHtml;
            daysContainer.style.setProperty('--row-count', totalCells / 7);
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function openModal(dateStr) {
            editingDateStr = dateStr;
            const data = calendarData[dateStr] || { text: '', color: '#333333', image: null };

            const [y, m, d] = dateStr.split('-');
            document.getElementById('modal-date-title').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
            document.getElementById('modal-text').value = data.text;
            document.getElementById('modal-color').value = data.color;

            pendingImageDataUrl = data.image;
            updateImagePreviewUI();

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingDateStr = null;
            pendingImageDataUrl = null;
            document.getElementById('modal-image-upload').value = ''; 
        }

        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    pendingImageDataUrl = canvas.toDataURL('image/png');
                    updateImagePreviewUI();
                };
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function clearImage() {
            pendingImageDataUrl = null;
            document.getElementById('modal-image-upload').value = '';
            updateImagePreviewUI();
        }

        function updateImagePreviewUI() {
            const previewContainer = document.getElementById('modal-image-preview-container');
            const previewImg = document.getElementById('modal-image-preview');

            if (pendingImageDataUrl) {
                previewImg.src = pendingImageDataUrl;
                previewContainer.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewContainer.classList.add('hidden');
            }
        }

        function saveDayData() {
            if (!editingDateStr) return;
            const text = document.getElementById('modal-text').value.trim();
            const color = document.getElementById('modal-color').value;

            calendarData[editingDateStr] = { text: text, color: color, image: pendingImageDataUrl };
            if (!text && !pendingImageDataUrl) delete calendarData[editingDateStr];

            closeModal();
            renderCalendar(); 
        }

        async function downloadCalendar() {
            const liveArea = document.getElementById('capture-area');
            const hiddenContainer = document.getElementById('hidden-capture-container');
            
            let memoText = document.getElementById('global-memo').value;
            if (!memoText && document.getElementById('mobile-memo')) {
                memoText = document.getElementById('mobile-memo').value;
            }
            
            try {
                await document.fonts.ready;
                // 숨겨진 컨테이너를 브라우저 렌더링 트리에 포함시켜 높이 측정이 가능하게 만듦
                hiddenContainer.style.display = 'flex';

                const clone = liveArea.cloneNode(true);
                clone.id = 'cloned-capture-area';
                clone.className = 'w-full h-full'; 
                
                const textarea = clone.querySelector('#global-memo');
                const renderDiv = clone.querySelector('#global-memo-render');
                const desktopMemo = clone.querySelector('.desktop-memo');
                
                if (desktopMemo) {
                    desktopMemo.classList.remove('hidden', 'md:flex');
                    desktopMemo.style.display = 'flex';
                }
                
                renderDiv.textContent = memoText || "여기에 중요한 메모나 공지를 적어보세요...";
                if(!memoText) renderDiv.classList.add('text-pink-300');
                else renderDiv.classList.remove('text-pink-300');
                
                if(textarea) textarea.style.display = 'none';
                if(renderDiv) renderDiv.classList.remove('hidden');

                hiddenContainer.innerHTML = '';
                hiddenContainer.appendChild(clone);

                // 브라우저가 화면을 계산할 약간의 시간을 줌
                await new Promise(r => setTimeout(r, 100));

                // 핵심: 캡처 전 텍스트 반응형 자동 스케일링 (Auto-Scaling)
                // 내용이 넘치면 글자 크기를 부드럽게 줄여서 잘림을 방지합니다.
                const cloneCells = clone.querySelectorAll('.calendar-cell');
                cloneCells.forEach(cell => {
                    const textEl = cell.querySelector('.schedule-text');
                    if (textEl) {
                        let size = 32;
                        textEl.style.setProperty('font-size', size + 'px', 'important');
                        
                        // 내용 전체 높이(scrollHeight)가 칸 높이(clientHeight)를 넘어가면 축소 시작
                        while (cell.scrollHeight > cell.clientHeight && size > 14) {
                            size -= 1;
                            textEl.style.setProperty('font-size', size + 'px', 'important');
                        }
                    }
                });

                await new Promise(r => setTimeout(r, 100)); // 스케일링 후 안정화 대기

                const canvas = await html2canvas(hiddenContainer, {
                    width: 1480,
                    height: 1309,
                    windowWidth: 1480,
                    windowHeight: 1309,
                    scale: 1, 
                    backgroundColor: null, 
                    logging: false,
                    useCORS: true 
                });

                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');

                const titleStr = document.getElementById('calendar-title').textContent.replace('.', '_');
                link.download = `다이어리_${titleStr}_1480x1309.png`;
                link.href = image;
                link.click();

            } catch (error) {
                console.error("Capture failed:", error);
                alert("이미지 저장 중 오류가 발생했습니다.");
            } finally {
                hiddenContainer.style.display = 'none';
                hiddenContainer.innerHTML = '';
            }
        }

        window.onload = init;
    </script>
