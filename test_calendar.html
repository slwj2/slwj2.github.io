<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],
                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    },

                    colors: {
                        diary: {
                            bg: '#FAF8F5',
                            paper: '#FFFDFB',
                            line: '#A94442',
                            lightLine: '#E8CACA',
                            pink: '#FDF0F1',
                            pink2: '#F8DDE0',
                            red: '#B33A3A',
                            text: '#3F3F46',
                            muted: '#9CA3AF',
                            blue: '#4267A9'
                        }
                    }
                }
            }
        };
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    #ffffff 0%,
                    #f4f1ef 55%,
                    #e8e5e3 100%
                );

            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        /* =========================================================
           다이어리 종이
        ========================================================= */

        .diary-paper {
            position: relative;

            background:
                linear-gradient(
                    rgba(255,255,255,0.2),
                    rgba(255,255,255,0.2)
                ),
                #FAF8F5;

            box-shadow:
                0 18px 45px rgba(0,0,0,0.13),
                inset 0 0 35px rgba(130,80,80,0.035);

            border: 2px solid #EDD9D9;
        }

        /* =========================================================
           스프링
        ========================================================= */

        .spring-wrapper {
            position: absolute;

            top: -25px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-evenly;

            padding: 0 25px;

            z-index: 20;

            pointer-events: none;
        }

        .spring {
            width: 15px;
            height: 43px;

            background:
                linear-gradient(
                    to right,
                    #bdbdbd 0%,
                    #ffffff 35%,
                    #e5e5e5 55%,
                    #929292 100%
                );

            border-radius: 9px;

            box-shadow:
                2px 4px 5px rgba(0,0,0,0.28);

            position: relative;
        }

        .spring::after {
            content: '';

            position: absolute;

            bottom: -7px;
            left: 1px;

            width: 13px;
            height: 13px;

            background: #222;

            border-radius: 50%;

            box-shadow:
                inset 1px 1px 3px rgba(255,255,255,0.2);
        }

        /* =========================================================
           캘린더
        ========================================================= */

        .calendar-grid {
            border: 3px solid #A94442;

            border-radius: 14px;

            overflow: hidden;

            background: #ffffff;

            box-shadow:
                0 2px 0 rgba(169,68,66,0.05);
        }

        .calendar-header-cell {
            min-width: 0;

            padding: 8px 0;

            background: #FDEDEE;

            color: #A94442;

            border-right:
                1px solid rgba(169,68,66,0.2);

            border-bottom:
                3px solid #A94442;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        /* =========================================================
           날짜 칸
        ========================================================= */

        .calendar-cell {
            position: relative;

            min-width: 0;
            min-height: 125px;

            padding: 8px;

            background: #ffffff;

            border-right:
                1px solid rgba(169,68,66,0.18);

            border-bottom:
                1px solid rgba(169,68,66,0.18);

            display: flex;
            flex-direction: column;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                transform 0.1s ease;
        }

        .calendar-cell:hover {
            background: #FFF8F8;
        }

        .calendar-cell:active {
            transform: scale(0.995);
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }

        .other-month {
            background: #FAFAFA;
            cursor: default;
        }

        .other-month .day-number {
            color: #C8C8C8 !important;
        }

        /* =========================================================
           날짜 번호
        ========================================================= */

        .day-number {
            font-family: 'Quicksand', sans-serif;

            font-size: 19px;

            line-height: 1;

            font-weight: 700;

            color: #444;

            width: fit-content;

            margin-bottom: 5px;

            position: relative;

            z-index: 2;
        }

        .day-number.today {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #7357E8;

            color: white;

            margin-top: -2px;
        }

        /* =========================================================
           날짜 내용
        ========================================================= */

        .day-content {
            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            gap: 4px;

            overflow: hidden;
        }

        /* =========================================================
           치지직 이모지
        ========================================================= */

        .day-emoji {
            width: 34px;
            height: 34px;

            object-fit: contain;

            flex-shrink: 0;

            image-rendering: auto;

            user-select: none;
        }

        .day-emoji-row {
            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 34px;
        }

        /* =========================================================
           일정 글자
        ========================================================= */

        .schedule-text {
            width: 100%;

            color: #333;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 23px;

            line-height: 1.15;

            text-align: center;

            word-break: keep-all;

            overflow-wrap: anywhere;

            white-space: pre-wrap;
        }

        /* =========================================================
           메모
        ========================================================= */

        .desktop-memo {
            position: relative;

            margin-top: 18px;

            padding:
                25px
                28px
                22px;

            min-height: 145px;

            background: #FDEDEE;

            border:
                3px solid #A94442;

            border-radius: 13px;

            box-shadow:
                0 2px 0 rgba(169,68,66,0.04);
        }

        .memo-title {
            position: absolute;

            top: -24px;
            left: 20px;

            padding:
                0 13px;

            background: #FAF8F5;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 34px;

            font-weight: 700;
        }

        #global-memo {
            width: 100%;

            min-height: 90px;

            background: transparent;

            border: none;

            outline: none;

            resize: none;

            color: #4267A9;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 25px;

            line-height: 1.45;
        }

        #global-memo::placeholder {
            color: #A8B8D5;
        }

        /* =========================================================
           이모지 선택기
        ========================================================= */

        .emoji-board {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(42px, 1fr)
                );

            gap: 3px;

            max-height: 230px;

            overflow-y: auto;

            padding: 5px;
        }

        .emoji-button {
            width: 42px;
            height: 42px;

            margin: auto;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: transparent;

            transition:
                background-color 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-button:hover {
            background: #FDEDEE;

            transform: scale(1.08);
        }

        .emoji-button.selected {
            background: #F8D7DA;

            box-shadow:
                inset 0 0 0 2px #A94442;
        }

        .emoji-button img {
            width: 32px;
            height: 32px;

            object-fit: contain;

            pointer-events: none;
        }

        .emoji-preview {
            width: 48px;
            height: 48px;

            object-fit: contain;
        }

        /* =========================================================
           스크롤바
        ========================================================= */

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D7B9BC;

            border-radius: 20px;
        }

        /* =========================================================
           모바일
        ========================================================= */

        @media (max-width: 767px) {

            body {
                background: #F4F1EF;
            }

            .diary-paper {
                border-radius: 16px;
            }

            .calendar-cell {
                min-height: 82px;

                padding: 5px;
            }

            .day-number {
                font-size: 13px;
            }

            .day-number.today {
                width: 25px;
                height: 25px;

                font-size: 12px;
            }

            .day-emoji {
                width: 27px;
                height: 27px;
            }

            .day-emoji-row {
                min-height: 27px;
            }

            .schedule-text {
                font-size: 15px;
            }

            .calendar-header-cell {
                padding: 5px 0;

                font-size: 13px;
            }

            .desktop-memo {
                min-height: 130px;

                padding: 22px 17px 15px;
            }

            .memo-title {
                font-size: 28px;

                top: -20px;
                left: 14px;
            }

            #global-memo {
                font-size: 20px;
            }

            .spring-wrapper {
                padding: 0 10px;
            }

            .spring {
                width: 10px;
                height: 32px;
            }

            .spring::after {
                width: 9px;
                height: 9px;

                bottom: -5px;
            }
        }

        /* =========================================================
           이미지 캡처용 스타일
        ========================================================= */

        #hidden-capture-container {
            position: absolute;

            left: -99999px;
            top: 0;

            width: 1480px;
            height: 1309px;

            padding: 40px;

            overflow: hidden;

            background: transparent;

            display: none;
        }

        #hidden-capture-container .diary-paper {
            width: 1400px !important;
            height: 1229px !important;

            padding:
                60px
                50px
                50px !important;

            border-radius: 24px !important;

            box-shadow: none !important;

            background: #FAF8F5 !important;
        }

        #hidden-capture-container .spring-wrapper {
            top: -25px !important;
        }

        #hidden-capture-container .spring {
            width: 20px !important;
            height: 50px !important;
        }

        #hidden-capture-container .spring::after {
            width: 16px !important;
            height: 16px !important;

            bottom: -8px !important;
        }

        #hidden-capture-container .calendar-grid {
            flex: 1;

            min-height: 0;

            border-width: 3px !important;

            border-radius: 14px !important;

            display: flex !important;

            flex-direction: column !important;
        }

        #hidden-capture-container #calendar-days {
            flex: 1 !important;

            min-height: 0 !important;

            display: grid !important;

            grid-template-rows:
                repeat(
                    var(--row-count),
                    minmax(0, 1fr)
                ) !important;
        }

        #hidden-capture-container .calendar-cell {
            min-height: 0 !important;

            height: 100% !important;

            padding: 8px !important;

            overflow: hidden !important;
        }

        #hidden-capture-container .day-number {
            font-size: 26px !important;
        }

        #hidden-capture-container .day-number.today {
            width: 40px !important;
            height: 40px !important;

            font-size: 22px !important;
        }

        #hidden-capture-container .day-emoji {
            width: 48px !important;
            height: 48px !important;
        }

        #hidden-capture-container .day-emoji-row {
            min-height: 48px !important;
        }

        #hidden-capture-container .schedule-text {
            font-size: 32px !important;

            line-height: 1.1 !important;
        }

        #hidden-capture-container .desktop-memo {
            flex-shrink: 0 !important;

            height: 180px !important;

            margin-top: 30px !important;

            padding: 30px 35px !important;
        }

        #hidden-capture-container .memo-title {
            top: -29px !important;
            left: 22px !important;

            font-size: 42px !important;
        }

        #hidden-capture-container #global-memo {
            display: none !important;
        }

        #hidden-capture-container #global-memo-render {
            display: block !important;

            width: 100% !important;

            min-height: 90px !important;

            color: #4267A9 !important;

            font-family:
                'Nanum Pen Script',
                cursive !important;

            font-size: 38px !important;

            line-height: 1.45 !important;

            white-space: pre-wrap !important;

            word-break: break-word !important;
        }

    </style>
</head>

<body class="font-sans text-diary-text min-h-screen">

    <!-- =========================================================
         모바일 상단 메뉴
    ========================================================== -->

    <div
        class="
            md:hidden
            w-full
            bg-white
            px-4
            py-3
            flex
            items-center
            justify-between
            shadow-sm
            no-print
        "
    >

        <button
            onclick="toggleLeftMenu()"
            class="p-2 rounded-lg bg-gray-100"
        >
            <i class="ph ph-list text-2xl"></i>
        </button>

        <div
            id="mobile-title"
            class="font-bold text-lg text-gray-700"
        >
            다이어리
        </div>

        <button
            onclick="toggleRightMenu()"
            class="p-2 rounded-lg bg-pink-100 text-pink-600"
        >
            <i class="ph ph-note-pencil text-2xl"></i>
        </button>

    </div>


    <!-- =========================================================
         모바일 왼쪽 메뉴
    ========================================================== -->

    <div
        id="left-drawer"
        class="
            fixed
            inset-y-0
            left-0
            w-64
            bg-white
            shadow-2xl
            transform
            -translate-x-full
            transition-transform
            duration-300
            z-50
            p-6
            flex
            flex-col
            md:hidden
        "
    >

        <h2
            class="
                text-xl
                font-bold
                mb-8
                pb-4
                border-b
            "
        >
            메뉴
        </h2>

        <div class="flex flex-col gap-3">

            <button
                onclick="changeMonth(-1); closeAllDrawers();"
                class="
                    p-3
                    rounded-xl
                    bg-gray-50
                    flex
                    items-center
                    gap-3
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
                이전 달
            </button>

            <button
                onclick="goToToday(); closeAllDrawers();"
                class="
                    p-3
                    rounded-xl
                    bg-gray-50
                    flex
                    items-center
                    gap-3
                    font-bold
                "
            >
                <i class="ph ph-calendar-check text-xl"></i>
                오늘
            </button>

            <button
                onclick="changeMonth(1); closeAllDrawers();"
                class="
                    p-3
                    rounded-xl
                    bg-gray-50
                    flex
                    items-center
                    gap-3
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
                다음 달
            </button>

        </div>

        <button
            onclick="downloadCalendar(); closeAllDrawers();"
            class="
                mt-auto
                w-full
                py-3
                rounded-xl
                bg-pink-500
                text-white
                font-bold
                flex
                justify-center
                items-center
                gap-2
            "
        >
            <i class="ph ph-download-simple text-xl"></i>
            이미지 저장
        </button>

    </div>


    <!-- =========================================================
         모바일 오른쪽 메모
    ========================================================== -->

    <div
        id="right-drawer"
        class="
            fixed
            inset-y-0
            right-0
            w-72
            bg-pink-50
            shadow-2xl
            transform
            translate-x-full
            transition-transform
            duration-300
            z-50
            p-6
            flex
            flex-col
            md:hidden
        "
    >

        <h2
            class="
                text-2xl
                font-handwriting
                text-diary-line
                font-bold
                mb-4
            "
        >
            Memo
        </h2>

        <textarea
            id="mobile-memo"
            class="
                flex-1
                w-full
                resize-none
                outline-none
                bg-transparent
                font-handwriting
                text-xl
                leading-relaxed
                text-blue-600
            "
            placeholder="메모를 입력하세요..."
        ></textarea>

        <button
            onclick="toggleRightMenu()"
            class="
                mt-4
                py-3
                bg-white
                rounded-xl
                font-bold
                border
            "
        >
            닫기
        </button>

    </div>


    <!-- =========================================================
         모바일 백드롭
    ========================================================== -->

    <div
        id="drawer-backdrop"
        class="
            fixed
            inset-0
            bg-black/50
            hidden
            z-40
            md:hidden
        "
        onclick="closeAllDrawers()"
    ></div>


    <!-- =========================================================
         PC 상단 메뉴
    ========================================================== -->

    <div
        class="
            hidden
            md:flex
            w-full
            max-w-6xl
            mx-auto
            px-4
            pt-6
            pb-4
            items-center
            justify-between
            no-print
        "
    >

        <div
            class="
                text-xl
                font-bold
                text-gray-700
                flex
                items-center
                gap-2
            "
        >
            <i class="ph ph-calendar-heart text-pink-500 text-2xl"></i>
            다이어리
        </div>

        <div class="flex items-center gap-2">

            <button
                onclick="changeMonth(-1)"
                class="
                    p-2
                    rounded-full
                    bg-white
                    shadow-sm
                    hover:bg-gray-100
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
            </button>

            <button
                onclick="goToToday()"
                class="
                    px-4
                    py-2
                    rounded-lg
                    bg-white
                    shadow-sm
                    font-bold
                "
            >
                오늘
            </button>

            <button
                onclick="changeMonth(1)"
                class="
                    p-2
                    rounded-full
                    bg-white
                    shadow-sm
                    hover:bg-gray-100
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
            </button>

            <button
                onclick="downloadCalendar()"
                class="
                    ml-3
                    px-5
                    py-2
                    rounded-lg
                    bg-pink-500
                    text-white
                    font-bold
                    shadow-md
                    flex
                    items-center
                    gap-2
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지로 저장
            </button>

        </div>

    </div>


    <!-- =========================================================
         캘린더
    ========================================================== -->

    <main
        id="capture-area"
        class="
            w-full
            max-w-6xl
            mx-auto
            px-2
            md:px-4
            pb-8
        "
    >

        <div
            class="
                diary-paper
                rounded-2xl
                p-3
                md:p-8
                pt-10
                md:pt-14
            "
        >

            <!-- 스프링 -->
            <div
                id="springs-container"
                class="spring-wrapper"
            ></div>


            <!-- =================================================
                 헤더
            ================================================== -->

            <div
                class="
                    flex
                    justify-end
                    items-center
                    mb-4
                    md:mb-6
                    px-1
                    md:px-2
                "
            >

                <div
                    id="calendar-title"
                    class="
                        font-sans
                        text-3xl
                        md:text-5xl
                        font-bold
                        tracking-wider
                        text-diary-line
                    "
                >
                    2026.09
                </div>

            </div>


            <!-- =================================================
                 달력
            ================================================== -->

            <div class="calendar-grid">

                <!-- 요일 -->
                <div
                    class="
                        grid
                        grid-cols-7
                        text-center
                        font-bold
                        font-handwriting
                        text-lg
                        md:text-2xl
                    "
                >

                    <div
                        class="
                            calendar-header-cell
                            text-red-500
                        "
                    >
                        Sun
                    </div>

                    <div class="calendar-header-cell">
                        Mon
                    </div>

                    <div class="calendar-header-cell">
                        Tue
                    </div>

                    <div class="calendar-header-cell">
                        Wed
                    </div>

                    <div class="calendar-header-cell">
                        Thu
                    </div>

                    <div class="calendar-header-cell">
                        Fri
                    </div>

                    <div
                        class="
                            calendar-header-cell
                            text-blue-500
                        "
                    >
                        Sat
                    </div>

                </div>


                <!-- 날짜 -->
                <div
                    id="calendar-days"
                    class="grid grid-cols-7"
                ></div>

            </div>


            <!-- =================================================
                 메모
            ================================================== -->

            <div class="desktop-memo">

                <div class="memo-title">
                    Memo
                </div>

                <textarea
                    id="global-memo"
                    placeholder="여기에 중요한 메모나 공지를 적어보세요..."
                ></textarea>

                <!-- 이미지 저장용 -->
                <div
                    id="global-memo-render"
                    class="hidden"
                ></div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         일정 편집 모달
    ========================================================== -->

    <div
        id="edit-modal"
        class="
            hidden
            fixed
            inset-0
            bg-black/60
            backdrop-blur-sm
            items-center
            justify-center
            z-[100]
            p-4
        "
    >

        <div
            class="
                bg-white
                rounded-2xl
                shadow-2xl
                w-full
                max-w-lg
                overflow-hidden
            "
        >

            <!-- 모달 헤더 -->
            <div
                class="
                    bg-pink-100
                    p-4
                    border-b
                    border-pink-200
                    flex

    <script>

        /* =========================================================
           기본 변수
        ========================================================= */

        const EMOJI_API_URL =
            'https://chzzk.dico.page/emojipacks';

        const STORAGE_KEY =
            'cute_diary_calendar_v3';

        let currentDate = new Date();

        let calendarData = {};

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojis = [];


        /* =========================================================
           초기화
        ========================================================== */

        function init() {

            loadData();

            generateSprings();

            renderCalendar();

            initEventListeners();

            initSwipeGestures();

            loadEmojis();

        }


        /* =========================================================
           localStorage
        ========================================================== */

        function loadData() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                calendarData =
                    parsed.calendarData || {};

                const memo =
                    parsed.memo || '';

                document.getElementById(
                    'global-memo'
                ).value = memo;

                document.getElementById(
                    'mobile-memo'
                ).value = memo;

            } catch (error) {

                console.error(
                    '저장 데이터 불러오기 실패:',
                    error
                );

                calendarData = {};

            }

        }


        function saveData() {

            const memo =
                document.getElementById(
                    'global-memo'
                ).value;

            const data = {

                calendarData,

                memo

            };

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        }


        /* =========================================================
           이벤트 등록
        ========================================================== */

        function initEventListeners() {

            const globalMemo =
                document.getElementById(
                    'global-memo'
                );

            const mobileMemo =
                document.getElementById(
                    'mobile-memo'
                );

            globalMemo.addEventListener(
                'input',
                () => {

                    mobileMemo.value =
                        globalMemo.value;

                    saveData();

                }
            );

            mobileMemo.addEventListener(
                'input',
                () => {

                    globalMemo.value =
                        mobileMemo.value;

                    saveData();

                }
            );


            document.getElementById(
                'emoji-search'
            ).addEventListener(
                'input',
                renderEmojiBoard
            );


            document.getElementById(
                'emoji-pack'
            ).addEventListener(
                'change',
                renderEmojiBoard
            );


            document.getElementById(
                'edit-modal'
            ).addEventListener(
                'click',
                event => {

                    if (
                        event.target.id ===
                        'edit-modal'
                    ) {
                        closeModal();
                    }

                }
            );

        }


        /* =========================================================
           스프링 생성
        ========================================================== */

        function generateSprings() {

            const container =
                document.getElementById(
                    'springs-container'
                );

            container.innerHTML = '';

            const count =
                window.innerWidth < 768
                    ? 9
                    : 15;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const spring =
                    document.createElement(
                        'div'
                    );

                spring.className =
                    'spring';

                container.appendChild(
                    spring
                );

            }

        }


        /* =========================================================
           달력 렌더링
        ========================================================== */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            const title =
                `${year}.${String(
                    month + 1
                ).padStart(2, '0')}`;

            document.getElementById(
                'calendar-title'
            ).textContent = title;

            document.getElementById(
                'mobile-title'
            ).textContent = title;


            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();

            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();

            const previousLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const totalCells =
                Math.ceil(
                    (
                        firstDay +
                        lastDay
                    ) / 7
                ) * 7;


            const daysContainer =
                document.getElementById(
                    'calendar-days'
                );

            daysContainer.innerHTML = '';

            daysContainer.style.setProperty(
                '--row-count',
                totalCells / 7
            );


            const today =
                new Date();

            let html = '';


            for (
                let i = 0;
                i < totalCells;
                i++
            ) {

                let dayNumber;

                let isCurrentMonth = true;

                let dateStr = '';


                if (i < firstDay) {

                    dayNumber =
                        previousLastDay -
                        firstDay +
                        i +
                        1;

                    isCurrentMonth = false;

                } else if (
                    i <
                    firstDay + lastDay
                ) {

                    dayNumber =
                        i -
                        firstDay +
                        1;

                    dateStr =
                        `${year}-${String(
                            month + 1
                        ).padStart(2, '0')}-${String(
                            dayNumber
                        ).padStart(2, '0')}`;

                } else {

                    dayNumber =
                        i -
                        (
                            firstDay +
                            lastDay
                        ) +
                        1;

                    isCurrentMonth = false;

                }


                const col =
                    i % 7;


                let numberClass =
                    'day-number';


                if (isCurrentMonth) {

                    if (col === 0) {

                        numberClass +=
                            ' text-red-500';

                    } else if (col === 6) {

                        numberClass +=
                            ' text-blue-500';

                    }

                }


                const isToday =
                    isCurrentMonth &&
                    today.getFullYear() === year &&
                    today.getMonth() === month &&
                    today.getDate() === dayNumber;


                if (isToday) {

                    numberClass =
                        'day-number today';

                }


                const data =
                    calendarData[dateStr] || {

                        text: '',

                        color: '#333333',

                        emoji: null

                    };


                const text =
                    escapeHtml(
                        data.text || ''
                    ).replace(
                        /\n/g,
                        '<br>'
                    );


                let emojiHtml = '';


                if (
                    data.emoji &&
                    data.emoji.image
                ) {

                    emojiHtml = `
                        <div class="day-emoji-row">
                            <img
                                src="${escapeAttribute(
                                    data.emoji.image
                                )}"
                                class="day-emoji"
                                alt=""
                                crossorigin="anonymous"
                            >
                        </div>
                    `;

                }


                let textHtml = '';


                if (text) {

                    textHtml = `
                        <div
                            class="schedule-text"
                            style="color:${escapeAttribute(
                                data.color || '#333333'
                            )};"
                        >
                            ${text}
                        </div>
                    `;

                }


                if (isCurrentMonth) {

                    html += `
                        <div
                            class="
                                calendar-cell
                                ${i >= totalCells - 7
                                    ? 'last-row'
                                    : ''}
                            "
                            onclick="openModal('${dateStr}')"
                        >

                            <div
                                class="${numberClass}"
                            >
                                ${dayNumber}
                            </div>

                            <div
                                class="day-content"
                            >

                                ${emojiHtml}

                                ${textHtml}

                            </div>

                        </div>
                    `;

                } else {

                    html += `
                        <div
                            class="
                                calendar-cell
                                other-month
                                ${i >= totalCells - 7
                                    ? 'last-row'
                                    : ''}
                            "
                        >

                            <div
                                class="day-number"
                            >
                                ${dayNumber}
                            </div>

                        </div>
                    `;

                }

            }


            daysContainer.innerHTML =
                html;

        }


        /* =========================================================
           HTML 이스케이프
        ========================================================== */

        function escapeHtml(value) {

            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');

        }


        function escapeAttribute(value) {

            return escapeHtml(value);

        }


        /* =========================================================
           월 이동
        ========================================================== */

        function changeMonth(delta) {

            currentDate.setMonth(
                currentDate.getMonth() + delta
            );

            renderCalendar();

        }


        function goToToday() {

            currentDate =
                new Date();

            renderCalendar();

        }


        /* =========================================================
           모달 열기
        ========================================================== */

        function openModal(dateStr) {

            editingDateStr =
                dateStr;


            const data =
                calendarData[dateStr] || {

                    text: '',

                    color: '#333333',

                    emoji: null

                };


            const parts =
                dateStr.split('-');


            const year =
                parts[0];

            const month =
                parseInt(parts[1]);

            const day =
                parseInt(parts[2]);


            document.getElementById(
                'modal-date-title'
            ).textContent =
                `${year}년 ${month}월 ${day}일`;


            document.getElementById(
                'modal-text'
            ).value =
                data.text || '';


            document.getElementById(
                'modal-color'
            ).value =
                data.color || '#333333';


            selectedEmoji =
                data.emoji
                    ? { ...data.emoji }
                    : null;


            renderSelectedEmoji();


            document.getElementById(
                'edit-modal'
            ).classList.remove(
                'hidden'
            );

            document.getElementById(
                'edit-modal'
            ).classList.add(
                'flex'
            );

            document.body.style.overflow =
                'hidden';

        }


        /* =========================================================
           모달 닫기
        ========================================================== */

        function closeModal() {

            document.getElementById(
                'edit-modal'
            ).classList.add(
                'hidden'
            );

            document.getElementById(
                'edit-modal'
            ).classList.remove(
                'flex'
            );

            document.body.style.overflow =
                '';

            editingDateStr =
                null;

            selectedEmoji =
                null;

        }


        /* =========================================================
           일정 저장
        ========================================================== */

        function saveDayData() {

            if (!editingDateStr) {
                return;
            }


            const text =
                document.getElementById(
                    'modal-text'
                ).value.trim();


            const color =
                document.getElementById(
                    'modal-color'
                ).value;


            if (
                !text &&
                !selectedEmoji
            ) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text,

                    color,

                    emoji:
                        selectedEmoji
                            ? {
                                ...selectedEmoji
                            }
                            : null

                };

            }


            saveData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           일정 삭제
        ========================================================== */

        function deleteDayData() {

            if (!editingDateStr) {
                return;
            }


            delete calendarData[
                editingDateStr
            ];


            saveData();

            closeModal();

            renderCalendar();

        }


        /* =========================================================
           치지직 이모지 API
        ========================================================== */

        async function loadEmojis() {

            const board =
                document.getElementById(
                    'emoji-board'
                );

            const status =
                document.getElementById(
                    'emoji-status'
                );


            try {

                status.textContent =
                    '치지직 이모지를 불러오는 중...';


                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            method: 'GET',

                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const json =
                    await response.json();


                /*
                 * API 실제 구조:
                 *
                 * {
                 *   "emojis": {
                 *      "{:ag_1:}": {
                 *          "ag_1":
                 *          "https://....png"
                 *      }
                 *   }
                 * }
                 */


                const source =
                    json.emojis || json;


                const result = [];

                const duplicateCheck =
                    new Set();


                Object.entries(
                    source
                ).forEach(
                    ([outerCode, emojiData]) => {

                        if (
                            !emojiData ||
                            typeof emojiData !==
                            'object'
                        ) {
                            return;
                        }


                        Object.entries(
                            emojiData
                        ).forEach(
                            ([name, image]) => {

                                if (
                                    typeof image !==
                                    'string'
                                ) {
                                    return;
                                }


                                if (
                                    !image.startsWith(
                                        'http'
                                    )
                                ) {
                                    return;
                                }


                                const key =
                                    `${name}|${image}`;


                                if (
                                    duplicateCheck.has(
                                        key
                                    )
                                ) {
                                    return;
                                }


                                duplicateCheck.add(
                                    key
                                );


                                /*
                                 * ag_1
                                 * d_1
                                 * mlb_1
                                 * chky_1
                                 *
                                 * 첫 번째 '_' 앞을
                                 * 이모지팩으로 사용합니다.
                                 */

                                const pack =
                                    name.includes('_')
                                        ? name.split('_')[0]
                                        : name;


                                result.push({

                                    code:
                                        outerCode,

                                    name,

                                    image,

                                    pack,

                                    search:
                                        `${name} ${outerCode} ${pack}`
                                            .toLowerCase()

                                });

                            }
                        );

                    }
                );


                emojis =
                    result.sort(
                        (a, b) =>
                            a.name.localeCompare(
                                b.name,
                                undefined,
                                {
                                    numeric: true
                                }
                            )
                    );


                buildEmojiPackList();

                renderEmojiBoard();


                status.textContent =
                    `전체 이모지 ${emojis.length}개`;

            } catch (error) {

                console.error(
                    '치지직 이모지 로딩 실패:',
                    error
                );


                status.textContent =
                    '이모지를 불러오지 못했습니다.';


                board.innerHTML = `
                    <div
                        class="
                            col-span-full
                            py-8
                            text-center
                            text-sm
                            text-red-400
                        "
                    >
                        <i
                            class="
                                ph
                                ph-warning-circle
                                text-2xl
                                block
                                mb-2
                            "
                        ></i>

                        이모지를 불러오지 못했습니다.

                        <div
                            class="
                                text-xs
                                text-gray-400
                                mt-2
                            "
                        >
                            브라우저의 CORS 설정을 확인해주세요.
                        </div>
                    </div>
                `;

            }

        }


        /* =========================================================
           이모지팩 목록
        ========================================================== */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    'emoji-pack'
                );


            const currentValue =
                select.value;


            const counts =
                new Map();


            emojis.forEach(
                emoji => {

                    counts.set(
                        emoji.pack,

                        (
                            counts.get(
                                emoji.pack
                            ) || 0
                        ) + 1
                    );

                }
            );


            select.innerHTML = `
                <option value="">
                    전체 이모지 (${emojis.length})
                </option>
            `;


            [...counts.entries()]
                .sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0],
                            undefined,
                            {
                                numeric: true
                            }
                        )
                )
                .forEach(
                    ([pack, count]) => {

                        const option =
                            document.createElement(
                                'option'
                            );

                        option.value =
                            pack;

                        option.textContent =
                            `${pack} (${count})`;

                        select.appendChild(
                            option
                        );

                    }
                );


            if (
                [...select.options]
                    .some(
                        option =>
                            option.value ===
                            currentValue
                    )
            ) {

                select.value =
                    currentValue;

            }

        }


        /* =========================================================
           이모지 보드
        ========================================================== */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    'emoji-board'
                );


            const search =
                document.getElementById(
                    'emoji-search'
                ).value
                    .trim()
                    .toLowerCase();


            const pack =
                document.getElementById(
                    'emoji-pack'
                ).value;


            const filtered =
                emojis.filter(
                    emoji => {

                        const matchesSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );


                        const matchesPack =
                            !pack ||
                            emoji.pack ===
                                pack;


                        return (
                            matchesSearch &&
                            matchesPack
                        );

                    }
                );


            const status =
                document.getElementById(
                    'emoji-status'
                );


            status.textContent =
                `${filtered.length}개 표시`;


            if (!filtered.length) {

                board.innerHTML = `
                    <div
                        class="
                            col-span-full
                            py-8
                            text-center
                            text-sm
                            text-gray-400
                        "
                    >
                        검색 결과가 없습니다.
                    </div>
                `;

                return;

            }


            const fragment =
                document.createDocumentFragment();


            filtered.forEach(
                emoji => {

                    const button =
                        document.createElement(
                            'button'
                        );


                    button.type =
                        'button';


                    button.className =
                        'emoji-button';


                    if (
                        selectedEmoji &&
                        selectedEmoji.name ===
                            emoji.name
                    ) {

                        button.classList.add(
                            'selected'
                        );

                    }


                    button.title =
                        emoji.name;


                    const img =
                        document.createElement(
                            'img'
                        );


                    img.src =
                        emoji.image;

                    img.alt =
                        emoji.name;

                    img.loading =
                        'lazy';

                    img.crossOrigin =
                        'anonymous';


                    button.appendChild(
                        img
                    );


                    button.addEventListener(
                        'click',
                        () => {

                            selectEmoji(
                                emoji
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            board.innerHTML = '';

            board.appendChild(
                fragment
            );

        }


        /* =========================================================
           이모지 선택
        ========================================================== */

        function selectEmoji(emoji) {

            selectedEmoji = {

                code:
                    emoji.code,

                name:
                    emoji.name,

                image:
                    emoji.image,

                pack:
                    emoji.pack

            };


            renderSelectedEmoji();

            renderEmojiBoard();

        }


        /* =========================================================
           이모지 선택 표시
        ========================================================== */

        function renderSelectedEmoji() {

            const preview =
                document.getElementById(
                    'selected-emoji-preview'
                );


            if (
                !selectedEmoji
            ) {

                preview.innerHTML = `
                    <span
                        class="text-sm text-gray-400"
                    >
                        이모지를 선택해주세요
                    </span>
                `;

                return;

            }


            preview.innerHTML = `
                <div
                    class="
                        flex
                        items-center
                        gap-3
                    "
                >

                    <img
                        src="${escapeAttribute(
                            selectedEmoji.image
                        )}"
                        class="emoji-preview"
                        alt=""
                        crossorigin="anonymous"
                    >

                    <div
                        class="
                            text-xs
                            text-gray-500
                        "
                    >
                        ${escapeHtml(
                            selectedEmoji.name
                        )}
                    </div>

                </div>
            `;

        }


        /* =========================================================
           이모지 선택 해제
        ========================================================== */

        function clearSelectedEmoji() {

            selectedEmoji =
                null;

            renderSelectedEmoji();

            renderEmojiBoard();

        }


        /* =========================================================
           모바일 메뉴
        ========================================================== */

        function toggleLeftMenu() {

            const drawer =
                document.getElementById(
                    'left-drawer'
                );


            if (
                drawer.classList.contains(
                    '-translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    '-translate-x-full'
                );

                document.getElementById(
                    'drawer-backdrop'
                ).classList.remove(
                    'hidden'
                );

            } else {

                closeAllDrawers();

            }

        }


        function toggleRightMenu() {

            const drawer =
                document.getElementById(
                    'right-drawer'
                );


            if (
                drawer.classList.contains(
                    'translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    'translate-x-full'
                );

                document.getElementById(
                    'drawer-backdrop'
                ).classList.remove(
                    'hidden'
                );

            } else {

                closeAllDrawers();

            }

        }


        function closeAllDrawers() {

            document.getElementById(
                'left-drawer'
            ).classList.add(
                '-translate-x-full'
            );


            document.getElementById(
                'right-drawer'
            ).classList.add(
                'translate-x-full'
            );


            document.getElementById(
                'drawer-backdrop'
            ).classList.add(
                'hidden'
            );

        }


        /* =========================================================
           스와이프
        ========================================================== */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchEndX = 0;

        let touchEndY = 0;


        const SWIPE_THRESHOLD =
            60;


        function initSwipeGestures() {

            document.addEventListener(
                'touchstart',
                event => {

                    touchStartX =
                        event.changedTouches[0]
                            .screenX;

                    touchStartY =
                        event.changedTouches[0]
                            .screenY;

                },
                {
                    passive: true
                }
            );


            document.addEventListener(
                'touchend',
                event => {

                    touchEndX =
                        event.changedTouches[0]
                            .screenX;

                    touchEndY =
                        event.changedTouches[0]
                            .screenY;

                    handleSwipe();

                },
                {
                    passive: true
                }
            );

        }


        function handleSwipe() {

            const modal =
                document.getElementById(
                    'edit-modal'
                );


            if (
                !modal.classList.contains(
                    'hidden'
                )
            ) {
                return;
            }


            const diffX =
                touchEndX -
                touchStartX;


            const diffY =
                touchEndY -
                touchStartY;


            if (
                Math.abs(diffY) >
                Math.abs(diffX)
            ) {
                return;
            }


            if (
                Math.abs(diffX) <
                SWIPE_THRESHOLD
            ) {
                return;
            }


            if (diffX < 0) {

                changeMonth(1);

            } else {

                changeMonth(-1);

            }

        }


        /* =========================================================
           이미지 저장
        ========================================================== */

        async function downloadCalendar() {

            const liveArea =
                document.getElementById(
                    'capture-area'
                );


            const hiddenContainer =
                document.getElementById(
                    'hidden-capture-container'
                );


            const memoText =
                document.getElementById(
                    'global-memo'
                ).value;


            try {

                await document.fonts.ready;


                const clone =
                    liveArea.cloneNode(
                        true
                    );


                clone.id =
                    'capture-clone';


                clone.style.width =
                    '1400px';


                clone.style.height =
                    '1229px';


                clone.style.maxWidth =
                    'none';


                clone.style.padding =
                    '0';


                clone.className =
                    '';


                hiddenContainer.innerHTML =
                    '';


                hiddenContainer.style.display =
                    'flex';


                hiddenContainer.appendChild(
                    clone
                );


                /*
                 * 캡처 전용 CSS가 제대로 적용되도록
                 * 약간 기다립니다.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            150
                        )
                );


                const memo =
                    clone.querySelector(
                        '#global-memo'
                    );


                const memoRender =
                    clone.querySelector(
                        '#global-memo-render'
                    );


                if (memo) {

                    memo.style.display =
                        'none';

                }


                if (memoRender) {

                    memoRender.classList.remove(
                        'hidden'
                    );

                    memoRender.style.display =
                        'block';

                    memoRender.textContent =
                        memoText ||
                        '여기에 중요한 메모나 공지를 적어보세요...';

                }


                /*
                 * 캘린더 안 일정이 너무 길 경우
                 * 자동으로 글자 크기를 줄입니다.
                 */

                const cells =
                    clone.querySelectorAll(
                        '.calendar-cell'
                    );


                cells.forEach(
                    cell => {

                        const text =
                            cell.querySelector(
                                '.schedule-text'
                            );


                        if (!text) {
                            return;
                        }


                        let size = 32;


                        text.style.setProperty(
                            'font-size',
                            `${size}px`,
                            'important'
                        );


                        while (
                            cell.scrollHeight >
                                cell.clientHeight &&
                            size > 15
                        ) {

                            size -= 1;


                            text.style.setProperty(
                                'font-size',
                                `${size}px`,
                                'important'
                            );

                        }

                    }
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            100
                        )
                );


                const canvas =
                    await html2canvas(
                        hiddenContainer,
                        {

                            width: 1480,

                            height: 1309,

                            windowWidth: 1480,

                            windowHeight: 1309,

                            scale: 1,

                            backgroundColor:
                                null,

                            useCORS: true,

                            allowTaint: false,

                            logging: false

                        }
                    );


                const image =
                    canvas.toDataURL(
                        'image/png'
                    );


                const link =
                    document.createElement(
                        'a'
                    );


                const title =
                    document.getElementById(
                        'calendar-title'
                    ).textContent
                        .replace(
                            '.',
                            '_'
                        );


                link.download =
                    `다이어리_${title}_1480x1309.png`;


                link.href =
                    image;


                link.click();


            } catch (error) {

                console.error(
                    '이미지 저장 실패:',
                    error
                );


                alert(
                    '이미지 저장 중 오류가 발생했습니다.'
                );

            } finally {

                hiddenContainer.style.display =
                    'none';

                hiddenContainer.innerHTML =
                    '';

            }

        }


        /* =========================================================
           ESC 키
        ========================================================== */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Escape'
                ) {

                    closeModal();

                    closeAllDrawers();

                }

            }
        );


        /* =========================================================
           시작
        ========================================================== */

        window.addEventListener(
            'load',
            init
        );

    </script>
