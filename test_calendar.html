<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>다이어리 캘린더</title>

    <!-- =========================================================
         외부 라이브러리
    ========================================================== -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: [
                            '"Nanum Pen Script"',
                            'cursive'
                        ],

                        sans: [
                            'Quicksand',
                            'sans-serif'
                        ]
                    },

                    colors: {
                        'diary-bg': '#FAF8F5',
                        'diary-line': '#A94442',
                        'diary-sun': '#D9534F',
                        'diary-sat': '#4A86D4',
                        'diary-text': '#333333'
                    }
                }
            }
        };
    </script>

    <style>

        /* =========================================================
           기본
        ========================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #e5e7eb;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        /* 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        /* =========================================================
           다이어리 본체
        ========================================================== */

        .diary-paper {
            width: 100%;

            background: #FAF8F5;

            border: 2px solid #EDD9D9;

            border-radius: 24px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10),
                inset 0 0 20px rgba(0, 0, 0, 0.015);

            position: relative;

            padding:
                58px
                44px
                42px;
        }

        /* =========================================================
           스프링
        ========================================================== */

        .spring-wrapper {
            position: absolute;

            top: -21px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-evenly;

            padding: 0 45px;

            z-index: 10;

            pointer-events: none;
        }

        .spring {
            width: 16px;
            height: 42px;

            background:
                linear-gradient(
                    to right,
                    #a8a8a8 0%,
                    #f7f7f7 40%,
                    #ffffff 52%,
                    #a5a5a5 100%
                );

            border-radius: 8px;

            box-shadow:
                2px 4px 5px rgba(0, 0, 0, 0.28);

            position: relative;
        }

        .spring::after {
            content: '';

            position: absolute;

            width: 13px;
            height: 13px;

            left: 1.5px;
            bottom: -6px;

            background: #555;

            border-radius: 50%;

            box-shadow:
                inset 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        /* =========================================================
           캘린더
        ========================================================== */

        .calendar-grid {
            width: 100%;

            height: 720px;

            border:
                2px solid #A94442;

            border-radius: 12px;

            overflow: hidden;

            background: white;

            display: flex;
            flex-direction: column;
        }

        /* 요일 */
        .calendar-week-header {
            flex:
                0 0 48px;

            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            background: #FDF0F1;

            border-bottom:
                2px solid #A94442;
        }

        .calendar-header-cell {
            display: flex;

            align-items: center;
            justify-content: center;

            border-right:
                1px solid #EDD9D9;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 23px;

            font-weight: bold;

            color: #A94442;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-header-cell.sun {
            color: #D9534F;
        }

        .calendar-header-cell.sat {
            color: #4A86D4;
        }

        /* 날짜 영역 */
        #calendar-days {
            flex: 1;

            min-height: 0;

            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            grid-template-rows:
                repeat(
                    var(--row-count, 5),
                    minmax(0, 1fr)
                );

            background: white;
        }

        /* 날짜 한 칸 */
        .calendar-cell {
            min-width: 0;
            min-height: 0;

            position: relative;

            padding: 8px;

            background: white;

            border-right:
                1px solid #E8E8E8;

            border-bottom:
                1px solid #E8E8E8;

            cursor: pointer;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            transition:
                background-color 0.15s ease;
        }

        .calendar-cell:hover {
            background: #FFF8F9;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.last-row {
            border-bottom: none;
        }

        .calendar-cell.other-month {
            background: #FCFCFC;

            cursor: default;
        }

        /* =========================================================
           날짜 번호
           
           중요:
           오늘 날짜를 별도로 표시하지 않습니다.
           .today 스타일 자체를 사용하지 않습니다.
        ========================================================== */

        .day-number-wrapper {
            height: 30px;

            flex:
                0 0 30px;

            display: flex;

            align-items: flex-start;
            justify-content: flex-start;
        }

        .day-number {
            width: auto;
            height: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                'Quicksand',
                sans-serif;

            font-size: 18px;

            font-weight: 700;

            line-height: 1;

            padding: 0 2px;
        }

        .other-month .day-number {
            color: #C9C9C9;
        }

        .day-number.sun {
            color: #D9534F;
        }

        .day-number.sat {
            color: #4A86D4;
        }

        /* =========================================================
           날짜 내용
        ========================================================== */

        .day-content {
            min-width: 0;
            min-height: 0;

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            padding:
                2px;

            overflow: hidden;
        }

        /*
            일정 전체 그룹

            텍스트와 이모지를 하나의 흐름으로 표시합니다.
        */

        .schedule-group {
            width: 100%;

            display: block;

            text-align: center;

            line-height: 1.12;

            word-break: keep-all;

            overflow-wrap: normal;

            white-space: normal;
        }

        /*
            이모지와 텍스트를 inline 형태로 유지
        */

        .inline-emoji-group {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            vertical-align: middle;

            white-space: nowrap;

            break-inside: avoid;

            page-break-inside: avoid;

            margin:
                0 1px;
        }

        /*
            캘린더에 표시되는 치지직 이모지

            스티커처럼 크게 나오지 않고
            채팅 이모지처럼 작게 표시합니다.
        */

        .calendar-emoji {
            width: 26px;
            height: 26px;

            max-width: 26px;
            max-height: 26px;

            object-fit: contain;

            display: inline-block;

            vertical-align: middle;

            flex:
                0 0 auto;
        }

        /*
            일정 텍스트
        */

        .schedule-text {
            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 23px;

            line-height: 1.1;

            white-space: pre-wrap;

            word-break: keep-all;

            overflow-wrap: normal;

            text-align: center;
        }

        /* =========================================================
           메모
        ========================================================== */

        .desktop-memo {
            position: relative;

            margin-top: 18px;

            width: 100%;

            min-height: 118px;

            padding:
                25px
                24px
                15px;

            background: #FDF1F2;

            border:
                2px solid #A94442;

            border-radius: 12px;

            display: flex;

            flex-direction: column;
        }

        .memo-title {
            position: absolute;

            top: -18px;
            left: 18px;

            padding:
                0 12px;

            background: #FAF8F5;

            color: #A94442;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 29px;

            font-weight: bold;
        }

        #global-memo {
            width: 100%;

            min-height: 70px;

            background: transparent;

            border: none;
            outline: none;

            resize: none;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 23px;

            line-height: 1.4;

            color: #3D5F9E;
        }

        #global-memo::placeholder {
            color: #D6A9AD;
        }

        /* =========================================================
           모바일
        ========================================================== */

        @media (max-width: 767px) {

            body {
                background: #FAF8F5;
            }

            .diary-paper {
                border-radius: 0;

                border-left: none;
                border-right: none;

                padding:
                    48px
                    8px
                    20px;
            }

            .spring-wrapper {
                padding: 0 10px;
            }

            .spring {
                width: 11px;
                height: 32px;
            }

            .spring::after {
                width: 10px;
                height: 10px;

                left: 0.5px;

                bottom: -5px;
            }

            .calendar-grid {
                height: 540px;

                border-radius: 9px;
            }

            .calendar-week-header {
                flex-basis: 38px;
            }

            .calendar-header-cell {
                font-size: 18px;
            }

            .calendar-cell {
                padding: 5px;
            }

            .day-number-wrapper {
                height: 24px;

                flex-basis: 24px;
            }

            .day-number {
                height: 23px;

                font-size: 14px;
            }

            .calendar-emoji {
                width: 21px;
                height: 21px;

                max-width: 21px;
                max-height: 21px;
            }

            .schedule-text {
                font-size: 18px;
            }

            .desktop-memo {
                min-height: 110px;

                padding:
                    23px
                    16px
                    12px;
            }

            #global-memo {
                font-size: 20px;
            }

        }

        /* =========================================================
           이모지 선택기
        ========================================================== */

        .emoji-picker {
            border:
                1px solid #E5E7EB;

            border-radius: 12px;

            background: #FAFAFA;

            overflow: hidden;
        }

        .emoji-toolbar {
            padding: 10px;

            background: white;

            border-bottom:
                1px solid #E5E7EB;
        }

        .emoji-grid {
            height: 220px;

            overflow-y: auto;

            padding: 10px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(44px, 1fr)
                );

            gap: 5px;

            align-content: start;
        }

        .emoji-item {
            width: 44px;
            height: 44px;

            margin: 0 auto;

            border: 1px solid transparent;

            border-radius: 8px;

            background: transparent;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background-color 0.12s ease,
                border-color 0.12s ease,
                transform 0.12s ease;
        }

        .emoji-item:hover {
            background: #FCECEF;

            border-color: #F2C7CD;

            transform: scale(1.04);
        }

        .emoji-item.selected {
            background: #FDE7EA;

            border-color: #D95363;
        }

        .emoji-item img {
            width: 34px;
            height: 34px;

            object-fit: contain;
        }

        .emoji-empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 35px 10px;

            color: #9CA3AF;

            font-size: 13px;
        }

        .emoji-loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 35px 10px;

            color: #9CA3AF;

            font-size: 13px;
        }

        /* 선택된 이모지 미리보기 */
        .selected-emoji-preview {
            min-height: 40px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                7px
                10px;

            background: #FFF7F8;

            border:
                1px solid #F4D6DA;

            border-radius: 8px;
        }

        .selected-emoji-preview img {
            width: 28px;
            height: 28px;

            object-fit: contain;
        }

        .selected-emoji-code {
            font-size: 12px;

            color: #9CA3AF;
        }

        /* =========================================================
           캡처용
        ========================================================== */

        #hidden-capture-container {
            position: absolute;

            left: -99999px;
            top: -99999px;

            width: 1480px;
            height: 1309px;

            overflow: hidden;

            background: transparent;
        }

        #hidden-capture-container .diary-paper {
            width: 1400px;
            height: 1229px;

            margin: 0;

            padding:
                55px
                45px
                35px;

            border-radius: 24px;

            box-shadow: none;
        }

        #hidden-capture-container .calendar-grid {
            height: 720px;

            border-width: 3px;

            border-radius: 12px;
        }

        #hidden-capture-container .calendar-week-header {
            flex-basis: 52px;
        }

        #hidden-capture-container .calendar-header-cell {
            font-size: 30px;
        }

        #hidden-capture-container .calendar-cell {
            padding: 8px;
        }

        #hidden-capture-container .day-number-wrapper {
            height: 34px;

            flex-basis: 34px;
        }

        #hidden-capture-container .day-number {
            font-size: 25px;

            height: 28px;
        }

        #hidden-capture-container .calendar-emoji {
            width: 28px;
            height: 28px;

            max-width: 28px;
            max-height: 28px;
        }

        #hidden-capture-container .schedule-text {
            font-size: 30px;
        }

        #hidden-capture-container .desktop-memo {
            margin-top: 18px;

            min-height: 130px;

            padding:
                28px
                30px
                15px;
        }

        #hidden-capture-container .memo-title {
            top: -22px;
            background: transparent; 
            font-size: 38px;
        }

        #hidden-capture-container #global-memo-render {
            display: block;

            min-height: 70px;

            font-family:
                'Nanum Pen Script',
                cursive;

            font-size: 34px;

            line-height: 1.4;

            white-space: pre-wrap;

            word-break: break-word;

            color: #3D5F9E;
        }

        /* =========================================================
           인쇄/캡처 보조
        ========================================================== */

        .capture-only {
            display: none !important;
        }

    </style>
</head>

<body
    class="
        font-sans
        text-diary-text
        min-h-screen
        md:p-8
        flex
        flex-col
        items-center
    "
>

    <!-- =========================================================
         캡처 전용 영역
    ========================================================== -->

    <div id="hidden-capture-container"></div>

    <!-- =========================================================
         모바일 상단 헤더
    ========================================================== -->

    <div
        class="
            md:hidden
            w-full
            flex
            justify-between
            items-center
            bg-white
            p-4
            shadow-sm
            relative
            z-20
        "
    >

        <button
            onclick="toggleLeftMenu()"
            class="
                p-2
                bg-gray-100
                rounded-lg
                hover:bg-gray-200
            "
        >
            <i class="ph ph-list text-2xl text-gray-700"></i>
        </button>

        <h1
            class="
                font-bold
                text-lg
                text-gray-700
            "
        >
            다이어리
        </h1>

        <button
            onclick="toggleRightMenu()"
            class="
                p-2
                bg-pink-100
                rounded-lg
                hover:bg-pink-200
            "
        >
            <i
                class="
                    ph
                    ph-note-pencil
                    text-2xl
                    text-pink-600
                "
            ></i>
        </button>

    </div>

    <!-- =========================================================
         모바일 왼쪽 메뉴
    ========================================================== -->

    <div
        id="left-drawer"
        class="
            fixed
            inset-y-0
            left-0
            w-64
            bg-white
            shadow-2xl
            transform
            -translate-x-full
            transition-transform
            duration-300
            z-40
            p-6
            flex
            flex-col
            md:hidden
        "
    >

        <h2
            class="
                text-xl
                font-bold
                text-gray-800
                mb-8
                border-b
                pb-4
            "
        >
            메뉴
        </h2>

        <div class="flex flex-col gap-4">

            <button
                onclick="changeMonth(-1); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
                이전 달
            </button>

            <button
                onclick="goToToday(); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                "
            >
                <i class="ph ph-calendar-check text-xl"></i>
                오늘
            </button>

            <button
                onclick="changeMonth(1); toggleLeftMenu();"
                class="
                    flex
                    items-center
                    gap-3
                    p-3
                    bg-gray-50
                    rounded-lg
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
                다음 달
            </button>

        </div>

        <div class="mt-auto">

            <button
                onclick="downloadCalendar(); toggleLeftMenu();"
                class="
                    w-full
                    py-3
                    bg-pink-500
                    text-white
                    rounded-xl
                    font-bold
                    flex
                    items-center
                    justify-center
                    gap-2
                    shadow-md
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지로 저장
            </button>

        </div>

    </div>

    <!-- =========================================================
         모바일 오른쪽 메모
    ========================================================== -->

    <div
        id="right-drawer"
        class="
            fixed
            inset-y-0
            right-0
            w-72
            bg-pink-50
            shadow-2xl
            transform
            translate-x-full
            transition-transform
            duration-300
            z-40
            p-6
            flex
            flex-col
            md:hidden
            border-l
            border-pink-200
        "
    >

        <h2
            class="
                text-xl
                font-handwriting
                text-diary-line
                font-bold
                mb-4
                flex
                items-center
                gap-2
            "
        >
            <i
                class="
                    ph-fill
                    ph-push-pin
                    text-pink-500
                "
            ></i>
            Memo
        </h2>

        <textarea
            id="mobile-memo"
            class="
                flex-1
                w-full
                bg-transparent
                resize-none
                outline-none
                font-handwriting
                text-xl
                leading-relaxed
                text-diary-line
            "
            placeholder="여기에 중요한 메모나 공지를 적어보세요..."
            oninput="syncMemos('mobile-memo', 'global-memo')"
        ></textarea>

        <button
            onclick="toggleRightMenu()"
            class="
                mt-4
                py-3
                bg-white
                text-gray-700
                rounded-xl
                font-bold
                shadow-sm
                border
                border-gray-200
            "
        >
            닫기
        </button>

    </div>

    <!-- =========================================================
         모바일 배경
    ========================================================== -->

    <div
        id="drawer-backdrop"
        class="
            fixed
            inset-0
            bg-black/50
            hidden
            z-30
            md:hidden
        "
        onclick="closeAllDrawers()"
    ></div>

    <!-- =========================================================
         PC 상단 메뉴
    ========================================================== -->

    <div
        class="
            hidden
            md:flex
            w-full
            max-w-5xl
            justify-between
            items-center
            mb-8
            bg-white
            p-4
            rounded-2xl
            shadow-sm
        "
    >

        <h1
            class="
                text-2xl
                font-bold
                text-gray-700
            "
        >
            나만의 다이어리
        </h1>

        <div class="flex gap-3">

            <button
                onclick="changeMonth(-1)"
                class="
                    p-2
                    bg-gray-100
                    hover:bg-gray-200
                    rounded-full
                "
            >
                <i class="ph ph-caret-left text-xl"></i>
            </button>

            <button
                onclick="goToToday()"
                class="
                    px-4
                    py-2
                    bg-gray-100
                    hover:bg-gray-200
                    rounded-lg
                    font-bold
                "
            >
                오늘
            </button>

            <button
                onclick="changeMonth(1)"
                class="
                    p-2
                    bg-gray-100
                    hover:bg-gray-200
                    rounded-full
                "
            >
                <i class="ph ph-caret-right text-xl"></i>
            </button>

            <button
                onclick="downloadCalendar()"
                class="
                    ml-3
                    px-5
                    py-2
                    bg-pink-500
                    hover:bg-pink-600
                    text-white
                    rounded-lg
                    font-bold
                    shadow-md
                    flex
                    items-center
                    gap-2
                "
            >
                <i class="ph ph-download-simple text-xl"></i>
                이미지로 저장
            </button>

        </div>

    </div>

    <!-- =========================================================
         실제 캘린더
    ========================================================== -->

    <div
        id="capture-area"
        class="
            w-full
            max-w-5xl
        "
    >

    <script>

        /* =========================================================
           기본 변수
        ========================================================== */

        const EMOJI_API_URL =
            'https://chzzk.dico.page/emojipacks';

        const STORAGE_KEY =
            'cute_diary_calendar_v4';

        let currentDate =
            new Date();

        let calendarData = {};

        let globalMemo = '';

        let editingDateStr = null;

        let selectedEmoji = null;

        let emojiList = [];

        let emojiPacks = [];

        /* =========================================================
           초기화
        ========================================================== */

        function init() {

            loadSavedData();

            generateSprings();

            renderCalendar();

            loadEmojis();

            initSwipeGestures();

        }

        /* =========================================================
           저장 데이터 불러오기
        ========================================================== */

        function loadSavedData() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                calendarData =
                    parsed.calendarData || {};

                globalMemo =
                    parsed.globalMemo || '';

                const memo =
                    document.getElementById(
                        'global-memo'
                    );

                const mobileMemo =
                    document.getElementById(
                        'mobile-memo'
                    );

                if (memo) {
                    memo.value = globalMemo;
                }

                if (mobileMemo) {
                    mobileMemo.value = globalMemo;
                }

            } catch (error) {

                console.error(
                    '저장 데이터 불러오기 실패:',
                    error
                );

                calendarData = {};

                globalMemo = '';

            }

        }

        /* =========================================================
           전체 데이터 저장
        ========================================================== */

        function saveAllData() {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify({
                        calendarData:
                            calendarData,

                        globalMemo:
                            globalMemo
                    })
                );

            } catch (error) {

                console.error(
                    '저장 실패:',
                    error
                );

            }

        }

        /* =========================================================
           메모 저장
        ========================================================== */

        function saveMemo() {

            const memo =
                document.getElementById(
                    'global-memo'
                );

            globalMemo =
                memo.value;

            const mobileMemo =
                document.getElementById(
                    'mobile-memo'
                );

            if (mobileMemo) {
                mobileMemo.value =
                    globalMemo;
            }

            saveAllData();

        }

        /* =========================================================
           메모 동기화
        ========================================================== */

        function syncMemos(
            sourceId,
            targetId
        ) {

            const source =
                document.getElementById(
                    sourceId
                );

            const target =
                document.getElementById(
                    targetId
                );

            if (!source || !target) {
                return;
            }

            target.value =
                source.value;

            globalMemo =
                source.value;

            saveAllData();

        }

        /* =========================================================
           스프링 생성
        ========================================================== */

        function generateSprings() {

            const container =
                document.getElementById(
                    'springs-container'
                );

            container.innerHTML = '';

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                const spring =
                    document.createElement(
                        'div'
                    );

                spring.className =
                    'spring';

                container.appendChild(
                    spring
                );

            }

        }

        /* =========================================================
           오늘 날짜 문자열
           
           현재 날짜를 비교하기 위한 용도입니다.
           단, 오늘 날짜에 특별한 CSS는 적용하지 않습니다.
        ========================================================== */

        function getTodayString() {

            const today =
                new Date();

            return [
                today.getFullYear(),

                String(
                    today.getMonth() + 1
                ).padStart(2, '0'),

                String(
                    today.getDate()
                ).padStart(2, '0')

            ].join('-');

        }

        /* =========================================================
           캘린더 렌더링
        ========================================================== */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();

            /* 상단 날짜 */

            const title =
                `${year}.${String(
                    month + 1
                ).padStart(2, '0')}`;

            document.getElementById(
                'calendar-title'
            ).textContent =
                title;

            /* 해당 월 첫 요일 */

            const firstDayIndex =
                new Date(
                    year,
                    month,
                    1
                ).getDay();

            /* 해당 월 마지막 날짜 */

            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();

            /* 이전 달 마지막 날짜 */

            const prevLastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();

            const daysContainer =
                document.getElementById(
                    'calendar-days'
                );

            daysContainer.innerHTML = '';

            /*
                5주 또는 6주
            */

            const totalCells =
                Math.ceil(
                    (
                        firstDayIndex +
                        lastDay
                    ) / 7
                ) * 7;

            const rowCount =
                totalCells / 7;

            daysContainer.style.setProperty(
                '--row-count',
                rowCount
            );

            const todayString =
                getTodayString();

            /* =====================================================
               날짜 생성
            ====================================================== */

            for (
                let i = 1;
                i <= totalCells;
                i++
            ) {

                let dayNumber;

                let isCurrentMonth =
                    true;

                let dateStr = '';

                /*
                    이전 달
                */

                if (
                    i <= firstDayIndex
                ) {

                    dayNumber =
                        prevLastDay -
                        firstDayIndex +
                        i;

                    isCurrentMonth =
                        false;

                }

                /*
                    현재 달
                */

                else if (
                    i <=
                    firstDayIndex +
                    lastDay
                ) {

                    dayNumber =
                        i -
                        firstDayIndex;

                    dateStr =
                        `${year}-${String(
                            month + 1
                        ).padStart(2, '0')}-${String(
                            dayNumber
                        ).padStart(2, '0')}`;

                }

                /*
                    다음 달
                */

                else {

                    dayNumber =
                        i -
                        (
                            firstDayIndex +
                            lastDay
                        );

                    isCurrentMonth =
                        false;

                }

                const colIndex =
                    (i - 1) % 7;

                let dayNumberClass =
                    'day-number';

                /*
                    일요일
                */

                if (
                    isCurrentMonth &&
                    colIndex === 0
                ) {

                    dayNumberClass +=
                        ' sun';

                }

                /*
                    토요일
                */

                else if (
                    isCurrentMonth &&
                    colIndex === 6
                ) {

                    dayNumberClass +=
                        ' sat';

                }

                /*
                    중요:
                    여기에서는 오늘 날짜를 확인해도
                    "today" 클래스를 절대로 추가하지 않습니다.
                    
                    따라서 오늘 날짜 역시
                    일반 날짜와 동일하게 표시됩니다.
                */

                let cellClasses =
                    'calendar-cell';

                if (
                    !isCurrentMonth
                ) {

                    cellClasses +=
                        ' other-month';

                }

                if (
                    i > totalCells - 7
                ) {

                    cellClasses +=
                        ' last-row';

                }

                /*
                    현재 달 일정 데이터
                */

                const dayData =
                    calendarData[dateStr] || {
                        text: '',
                        color: '#333333',
                        emoji: null
                    };

                const cell =
                    document.createElement(
                        'div'
                    );

                cell.className =
                    cellClasses;

                /*
                    날짜 번호
                */

                const numberWrapper =
                    document.createElement(
                        'div'
                    );

                numberWrapper.className =
                    'day-number-wrapper';

                const number =
                    document.createElement(
                        'div'
                    );

                number.className =
                    dayNumberClass;

                number.textContent =
                    dayNumber;

                numberWrapper.appendChild(
                    number
                );

                cell.appendChild(
                    numberWrapper
                );

                /*
                    현재 달이면 일정 표시
                */

                if (isCurrentMonth) {

                    cell.onclick =
                        function() {
                            openModal(
                                dateStr
                            );
                        };

                    const content =
                        document.createElement(
                            'div'
                        );

                    content.className =
                        'day-content';

                    if (
                        dayData.text
                    ) {

                        const scheduleGroup =
                            createScheduleHTML(
                                dayData.text,
                                dayData.color
                            );

                        content.appendChild(
                            scheduleGroup
                        );

                    }

                    cell.appendChild(
                        content
                    );

                }

                daysContainer.appendChild(
                    cell
                );

            }

        }

        /* =========================================================
           일정 텍스트 + 치지직 이모지 변환
        ========================================================== */

        function createScheduleHTML(
            text,
            color
        ) {

            const group =
                document.createElement(
                    'div'
                );

            group.className =
                'schedule-group';

            group.style.color =
                color || '#333333';

            /*
                {sub_01}
                {ag_01}
                {mlb_01}

                같은 코드 찾기
            */

            const tokenRegex =
                /\{([a-zA-Z0-9_]+)\}/g;

            let lastIndex = 0;

            let match;

            while (
                (
                    match =
                    tokenRegex.exec(text)
                ) !== null
            ) {

                /*
                    이모지 코드 앞 일반 텍스트
                */

                if (
                    match.index >
                    lastIndex
                ) {

                    const plainText =
                        text.substring(
                            lastIndex,
                            match.index
                        );

                    group.appendChild(
                        document.createTextNode(
                            plainText
                        )
                    );

                }

                const code =
                    match[1];

                /*
                    실제 이모지 검색
                */

                const emoji =
                    findEmojiByCode(
                        code
                    );

                if (emoji) {

                    const emojiSpan =
                        document.createElement(
                            'span'
                        );

                    emojiSpan.className =
                        'inline-emoji-group';

                    const img =
                        document.createElement(
                            'img'
                        );

                    img.className =
                        'calendar-emoji';

                    img.src =
                        emoji.image;

                    img.alt =
                        `{${emoji.name}}`;

                    img.title =
                        `{${emoji.name}}`;

                    img.crossOrigin =
                        'anonymous';

                    emojiSpan.appendChild(
                        img
                    );

                    group.appendChild(
                        emojiSpan
                    );

                } else {

                    /*
                        API에서 아직 이모지를
                        찾지 못한 경우 코드 그대로 표시
                    */

                    const codeText =
                        document.createTextNode(
                            `{${code}}`
                        );

                    group.appendChild(
                        codeText
                    );

                }

                lastIndex =
                    tokenRegex.lastIndex;

            }

            /*
                마지막 일반 텍스트
            */

            if (
                lastIndex <
                text.length
            ) {

                group.appendChild(
                    document.createTextNode(
                        text.substring(
                            lastIndex
                        )
                    )
                );

            }

            return group;

        }

        /* =========================================================
           이모지 코드 검색
        ========================================================== */

        function findEmojiByCode(
            code
        ) {

            const normalized =
                String(code)
                    .replace(
                        /^\{|\}$/g,
                        ''
                    )
                    .toLowerCase();

            return emojiList.find(
                emoji =>
                    emoji.name.toLowerCase() ===
                    normalized
            ) || null;

        }

        /* =========================================================
           월 변경
        ========================================================== */

        function changeMonth(
            delta
        ) {

            currentDate.setMonth(
                currentDate.getMonth() +
                delta
            );

            renderCalendar();

        }

        /* =========================================================
           오늘로 이동
        ========================================================== */

        function goToToday() {

            currentDate =
                new Date();

            renderCalendar();

        }

        /* =========================================================
           일정 모달 열기
        ========================================================== */

        function openModal(
            dateStr
        ) {

            editingDateStr =
                dateStr;

            const data =
                calendarData[dateStr] || {
                    text: '',
                    color: '#333333',
                    emoji: null
                };

            const [
                year,
                month,
                day
            ] =
                dateStr.split('-');

            document.getElementById(
                'modal-date-title'
            ).textContent =
                `${year}년 ${parseInt(
                    month
                )}월 ${parseInt(
                    day
                )}일`;

            document.getElementById(
                'modal-text'
            ).value =
                data.text || '';

            document.getElementById(
                'modal-color'
            ).value =
                data.color ||
                '#333333';

            /*
                기존 선택 이모지
            */

            selectedEmoji =
                data.emoji || null;

            updateSelectedEmojiUI();

            document.getElementById(
                'edit-modal'
            ).classList.remove(
                'hidden'
            );

        }

        /* =========================================================
           모달 닫기
        ========================================================== */

        function closeModal() {

            document.getElementById(
                'edit-modal'
            ).classList.add(
                'hidden'
            );

            editingDateStr =
                null;

            selectedEmoji =
                null;

            updateSelectedEmojiUI();

        }

        /* =========================================================
           일정 저장
        ========================================================== */

        function saveDayData() {

            if (
                !editingDateStr
            ) {
                return;
            }

            const text =
                document.getElementById(
                    'modal-text'
                ).value.trim();

            const color =
                document.getElementById(
                    'modal-color'
                ).value;

            /*
                아무것도 없으면 삭제
            */

            if (
                !text
            ) {

                delete calendarData[
                    editingDateStr
                ];

            } else {

                calendarData[
                    editingDateStr
                ] = {

                    text:
                        text,

                    color:
                        color,

                    emoji:
                        selectedEmoji
                        ? {
                            code:
                                selectedEmoji.code,

                            name:
                                selectedEmoji.name,

                            image:
                                selectedEmoji.image,

                            pack:
                                selectedEmoji.pack
                        }
                        : null

                };

            }

            saveAllData();

            closeModal();

            renderCalendar();

        }

        /* =========================================================
           치지직 이모지 API 불러오기
           
           실제 API 구조:

           emojis: {
               "{:ag_1:}": {
                   "ag_1":
                   "https://..."
               }
           }

           중첩 객체이므로 2단계로 파싱합니다.
        ========================================================== */

        async function loadEmojis() {

            const board =
                document.getElementById(
                    'emoji-board'
                );

            board.innerHTML = `
                <div class="emoji-loading">
                    치지직 이모지를 불러오는 중...
                </div>
            `;

            try {

                const response =
                    await fetch(
                        EMOJI_API_URL,
                        {
                            cache: 'no-store'
                        }
                    );

                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const json =
                    await response.json();

                const source =
                    json.emojis || {};

                const result = [];

                /*
                    중복 방지
                */

                const seen =
                    new Set();

                /*
                    첫 번째 객체
                */

                Object.entries(
                    source
                ).forEach(
                    ([
                        outerCode,
                        emojiData
                    ]) => {

                        /*
                            실제 이미지 객체
                        */

                        if (
                            !emojiData ||
                            typeof emojiData !==
                            'object'
                        ) {
                            return;
                        }

                        /*
                            두 번째 객체
                        */

                        Object.entries(
                            emojiData
                        ).forEach(
                            ([
                                name,
                                image
                            ]) => {

                                if (
                                    typeof image !==
                                    'string'
                                ) {
                                    return;
                                }

                                if (
                                    !image.startsWith(
                                        'http'
                                    )
                                ) {
                                    return;
                                }

                                /*
                                    중복 방지
                                */

                                const key =
                                    `${name}|${image}`;

                                if (
                                    seen.has(key)
                                ) {
                                    return;
                                }

                                seen.add(key);

                                /*
                                    pack 추출

                                    ag_01
                                    sub_01
                                    mlb_01

                                    -> ag
                                    -> sub
                                    -> mlb
                                */

                                const pack =
                                    name.includes('_')
                                        ? name.split(
                                            '_'
                                        )[0]
                                        : name;

                                result.push({

                                    code:
                                        `{${name}}`,

                                    name:
                                        name,

                                    image:
                                        image,

                                    pack:
                                        pack,

                                    search:
                                        name.toLowerCase()

                                });

                            }
                        );

                    }
                );

                /*
                    이름순 정렬
                */

                result.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name,
                            'ko'
                        )
                );

                emojiList =
                    result;

                /*
                    팩 목록
                */

                buildEmojiPackList();

                /*
                    이모지 표시
                */

                renderEmojiBoard();

                console.log(
                    `치지직 이모지 ${emojiList.length}개 로드 완료`
                );

            } catch (error) {

                console.error(
                    '치지직 이모지 로드 실패:',
                    error
                );

                board.innerHTML = `
                    <div class="emoji-empty">
                        치지직 이모지를 불러오지 못했습니다.<br>
                        <span class="text-xs">
                            ${escapeHtml(
                                error.message
                            )}
                        </span>
                    </div>
                `;

            }

        }

        /* =========================================================
           이모지팩 목록 생성
        ========================================================== */

        function buildEmojiPackList() {

            const select =
                document.getElementById(
                    'emoji-pack'
                );

            select.innerHTML = '';

            /*
                전체
            */

            const allOption =
                document.createElement(
                    'option'
                );

            allOption.value = '';

            allOption.textContent =
                `전체 이모지 (${emojiList.length})`;

            select.appendChild(
                allOption
            );

            /*
                팩별 개수
            */

            const packMap =
                new Map();

            emojiList.forEach(
                emoji => {

                    const count =
                        packMap.get(
                            emoji.pack
                        ) || 0;

                    packMap.set(
                        emoji.pack,
                        count + 1
                    );

                }
            );

            emojiPacks =
                Array.from(
                    packMap.entries()
                ).sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0],
                            'ko'
                        )
                );

            emojiPacks.forEach(
                ([
                    pack,
                    count
                ]) => {

                    const option =
                        document.createElement(
                            'option'
                        );

                    option.value =
                        pack;

                    option.textContent =
                        `${pack} (${count})`;

                    select.appendChild(
                        option
                    );

                }
            );

        }

        /* =========================================================
           이모지 보드 렌더링
        ========================================================== */

        function renderEmojiBoard() {

            const board =
                document.getElementById(
                    'emoji-board'
                );

            if (
                !emojiList.length
            ) {

                board.innerHTML = `
                    <div class="emoji-empty">
                        이모지가 없습니다.
                    </div>
                `;

                return;

            }

            const searchInput =
                document.getElementById(
                    'emoji-search'
                );

            const packSelect =
                document.getElementById(
                    'emoji-pack'
                );

            const search =
                (
                    searchInput?.value ||
                    ''
                )
                .trim()
                .toLowerCase();

            const pack =
                packSelect?.value ||
                '';

            const filtered =
                emojiList.filter(
                    emoji => {

                        const matchSearch =
                            !search ||
                            emoji.search.includes(
                                search
                            );

                        const matchPack =
                            !pack ||
                            emoji.pack === pack;

                        return (
                            matchSearch &&
                            matchPack
                        );

                    }
                );

            board.innerHTML = '';

            if (
                !filtered.length
            ) {

                board.innerHTML = `
                    <div class="emoji-empty">
                        검색 결과가 없습니다.
                    </div>
                `;

                return;

            }

            filtered.forEach(
                emoji => {

                    const button =
                        document.createElement(
                            'button'
                        );

                    button.type =
                        'button';

                    button.className =
                        'emoji-item';

                    if (
                        selectedEmoji &&
                        selectedEmoji.name ===
                        emoji.name
                    ) {

                        button.classList.add(
                            'selected'
                        );

                    }

                    button.title =
                        emoji.code;

                    button.onclick =
                        function() {
                            selectEmoji(
                                emoji
                            );
                        };

                    const img =
                        document.createElement(
                            'img'
                        );

                    img.src =
                        emoji.image;

                    img.alt =
                        emoji.name;

                    img.loading =
                        'lazy';

                    img.crossOrigin =
                        'anonymous';

                    button.appendChild(
                        img
                    );

                    board.appendChild(
                        button
                    );

                }
            );

        }

        /* =========================================================
           이모지 선택
        ========================================================== */

        function selectEmoji(
            emoji
        ) {

            selectedEmoji =
                emoji;

            updateSelectedEmojiUI();

            /*
                현재 커서 위치에
                {sub_01}
                같은 형태로 삽입
            */

            insertEmojiCode(
                emoji.code
            );

            renderEmojiBoard();

        }

        /* =========================================================
           이모지 코드 삽입
        ========================================================== */

        function insertEmojiCode(
            code
        ) {

            const textarea =
                document.getElementById(
                    'modal-text'
                );

            if (!textarea) {
                return;
            }

            const start =
                textarea.selectionStart;

            const end =
                textarea.selectionEnd;

            const value =
                textarea.value;

            textarea.value =
                value.substring(
                    0,
                    start
                ) +
                code +
                value.substring(
                    end
                );

            const cursor =
                start +
                code.length;

            textarea.focus();

            textarea.setSelectionRange(
                cursor,
                cursor
            );

        }

        /* =========================================================
           선택된 이모지 UI
        ========================================================== */

        function updateSelectedEmojiUI() {

            const preview =
                document.getElementById(
                    'selected-emoji-preview'
                );

            const image =
                document.getElementById(
                    'selected-emoji-image'
                );

            const code =
                document.getElementById(
                    'selected-emoji-code'
                );

            if (
                !selectedEmoji
            ) {

                preview.classList.add(
                    'hidden'
                );

                image.src =
                    '';

                code.textContent =
                    '';

                return;

            }

            preview.classList.remove(
                'hidden'
            );

            image.src =
                selectedEmoji.image;

            code.textContent =
                selectedEmoji.code;

        }

        /* =========================================================
           선택 이모지 제거
        ========================================================== */

        function clearSelectedEmoji() {

            selectedEmoji =
                null;

            updateSelectedEmojiUI();

            renderEmojiBoard();

        }

        /* =========================================================
           HTML 이스케이프
        ========================================================== */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }

        /* =========================================================
           모바일 메뉴
        ========================================================== */

        function toggleLeftMenu() {

            const drawer =
                document.getElementById(
                    'left-drawer'
                );

            const backdrop =
                document.getElementById(
                    'drawer-backdrop'
                );

            if (
                drawer.classList.contains(
                    '-translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    '-translate-x-full'
                );

                backdrop.classList.remove(
                    'hidden'
                );

            } else {

                drawer.classList.add(
                    '-translate-x-full'
                );

                backdrop.classList.add(
                    'hidden'
                );

            }

        }

        /* =========================================================
           모바일 메모 메뉴
        ========================================================== */

        function toggleRightMenu() {

            const drawer =
                document.getElementById(
                    'right-drawer'
                );

            const backdrop =
                document.getElementById(
                    'drawer-backdrop'
                );

            if (
                drawer.classList.contains(
                    'translate-x-full'
                )
            ) {

                closeAllDrawers();

                drawer.classList.remove(
                    'translate-x-full'
                );

                backdrop.classList.remove(
                    'hidden'
                );

                /*
                    열 때 메모 동기화
                */

                const mobileMemo =
                    document.getElementById(
                        'mobile-memo'
                    );

                mobileMemo.value =
                    globalMemo;

            } else {

                drawer.classList.add(
                    'translate-x-full'
                );

                backdrop.classList.add(
                    'hidden'
                );

            }

        }

        /* =========================================================
           메뉴 닫기
        ========================================================== */

        function closeAllDrawers() {

            document.getElementById(
                'left-drawer'
            ).classList.add(
                '-translate-x-full'
            );

            document.getElementById(
                'right-drawer'
            ).classList.add(
                'translate-x-full'
            );

            document.getElementById(
                'drawer-backdrop'
            ).classList.add(
                'hidden'
            );

        }

        /* =========================================================
           모바일 스와이프
        ========================================================== */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchEndX = 0;

        let touchEndY = 0;

        const SWIPE_THRESHOLD =
            60;

        function initSwipeGestures() {

            document.addEventListener(
                'touchstart',
                event => {

                    touchStartX =
                        event.changedTouches[0]
                            .screenX;

                    touchStartY =
                        event.changedTouches[0]
                            .screenY;

                },
                {
                    passive: true
                }
            );

            document.addEventListener(
                'touchend',
                event => {

                    touchEndX =
                        event.changedTouches[0]
                            .screenX;

                    touchEndY =
                        event.changedTouches[0]
                            .screenY;

                    handleSwipe();

                },
                {
                    passive: true
                }
            );

        }

        function handleSwipe() {

            const modal =
                document.getElementById(
                    'edit-modal'
                );

            if (
                !modal.classList.contains(
                    'hidden'
                )
            ) {
                return;
            }

            const diffX =
                touchEndX -
                touchStartX;

            const diffY =
                touchEndY -
                touchStartY;

            if (
                Math.abs(diffY) >
                Math.abs(diffX)
            ) {
                return;
            }

            const leftDrawer =
                document.getElementById(
                    'left-drawer'
                );

            const rightDrawer =
                document.getElementById(
                    'right-drawer'
                );

            const isLeftOpen =
                !leftDrawer.classList.contains(
                    '-translate-x-full'
                );

            const isRightOpen =
                !rightDrawer.classList.contains(
                    'translate-x-full'
                );

            if (
                diffX >
                SWIPE_THRESHOLD
            ) {

                if (
                    isRightOpen
                ) {

                    toggleRightMenu();

                } else if (
                    !isLeftOpen
                ) {

                    toggleLeftMenu();

                }

            } else if (
                diffX <
                -SWIPE_THRESHOLD
            ) {

                if (
                    isLeftOpen
                ) {

                    toggleLeftMenu();

                } else if (
                    !isRightOpen
                ) {

                    toggleRightMenu();

                }

            }

        }

        /* =========================================================
           이미지 저장
        ========================================================== */

        async function downloadCalendar() {

            const liveArea =
                document.getElementById(
                    'capture-area'
                );

            const hiddenContainer =
                document.getElementById(
                    'hidden-capture-container'
                );

            try {

                /*
                    폰트가 모두 로드될 때까지 기다림
                */

                await document.fonts.ready;

                /*
                    기존 캘린더 복사
                */

                const clone =
                    liveArea.cloneNode(
                        true
                    );

                /*
                    캡처용 스타일
                */

                clone.style.width = '1400px';
                clone.style.height = '1229px';

                clone.style.margin =
                    '0';

                /*
                    textarea는 캡처할 수 없으므로
                    텍스트 표시용 div로 교체
                */

                const textarea =
                    clone.querySelector(
                        '#global-memo'
                    );

                const memoRender =
                    clone.querySelector(
                        '#global-memo-render'
                    );

                if (
                    textarea
                ) {

                    textarea.style.display =
                        'none';

                }

                if (
                    memoRender
                ) {

                    memoRender.classList.remove(
                        'hidden'
                    );

                    memoRender.textContent =
                        globalMemo ||
                        '';

                }

                /*
                    기존 hidden 상태 제거
                */

                const memo =
                    clone.querySelector(
                        '.desktop-memo'
                    );
/*
    캡처용 .memo-title 배경 투명 처리
*/

                const memoTitle =
                    clone.querySelector(
                        '.memo-title'
                    );

               if (
                    memoTitle
               ) {

                    memoTitle.style.background =
                        'transparent';

                    memoTitle.style.backgroundColor =
                        'transparent';

               }


                if (
                    memo
                ) {

                    memo.classList.remove(
                        'hidden'
                    );

                    memo.style.display =
                        'flex';
                    memo.style.height =
                        '270px';
                }

                /*
                    캡처 영역 초기화
                */

                hiddenContainer.innerHTML =
                    '';

                hiddenContainer.appendChild(
                    clone
                );

                /*
                    브라우저 렌더링 대기
                */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            300
                        )
                );

                /*
                    html2canvas
                */

                const canvas = await html2canvas(hiddenContainer, {
    width: 1400,
    height: 1229,
    windowWidth: 1400,
    windowHeight: 1229,
    scale: 1,
    backgroundColor: null,
    useCORS: true,
    allowTaint: false,
    logging: false
});

                const image =
                    canvas.toDataURL(
                        'image/png'
                    );

                const link =
                    document.createElement(
                        'a'
                    );

                const title =
                    document.getElementById(
                        'calendar-title'
                    ).textContent
                        .replace(
                            '.',
                            '_'
                        );

                link.download =
                    `다이어리_${title}.png`;

                link.href =
                    image;

                link.click();

            } catch (
                error
            ) {

                console.error(
                    '이미지 저장 실패:',
                    error
                );

                alert(
                    '이미지 저장 중 오류가 발생했습니다.'
                );

            } finally {

                hiddenContainer.innerHTML =
                    '';

            }

        }

        /* =========================================================
           시작
        ========================================================== */

        window.addEventListener(
            'load',
            init
        );

    </script>
