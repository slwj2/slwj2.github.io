<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>치지직 후원 오버레이</title>

    <style>
        /* =========================================
           기본 설정
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;

            /* OBS 배경 투명 */
            background: transparent;

            /* 스크롤 제거 */
            overflow: hidden;

            /* 글꼴 */
            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }


        /* =========================================
           화면 중앙 정렬
           ========================================= */

        .overlay {
            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 30px;

            /* 완전 투명 */
            background: transparent;
        }


        /* =========================================
           후원 알림 전체 영역
           
           배경 / 테두리 / 그림자 없음
           ========================================= */

        .donation-content {
            width: min(700px, 90vw);

            text-align: center;

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(20px)
                scale(0.96);
        }


        /* =========================================
           표시 상태
           ========================================= */

        .donation-content.show {
            visibility: visible;

            animation:
                donation-in 0.45s ease-out forwards;
        }


        /* =========================================
           사라지는 상태
           ========================================= */

        .donation-content.hide {
            visibility: visible;

            animation:
                donation-out 0.5s ease-in forwards;
        }


        /* =========================================
           후원 감사 문구
           
           별도의 박스 없음
           배경 없음
           ========================================= */

        .donation-title {
            margin: 0;

            color: #ffffff;

            font-size: 30px;

            font-weight: 800;

            line-height: 1.4;

            text-align: center;

            word-break: keep-all;

            /*
             * 방송 화면에서 잘 보이도록
             * 검은색 그림자를 적용합니다.
             */
            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.75);
        }


        /* =========================================
           닉네임
           ========================================= */

        .nickname {
            color: #ffffff;

            font-weight: 900;
        }


        /* =========================================
           치즈 금액
           ========================================= */

        .amount {
            color: #ff5c8a;

            font-weight: 900;
        }


        /* =========================================
           후원자가 작성한 채팅
           
           이 박스만 표시됩니다.
           ========================================= */

        .donation-message {
            margin-top: 18px;

            padding: 18px 22px;

            /* 채팅 박스 */
            background: #f5f5f5;

            border-radius: 10px;

            color: #333333;

            font-size: 22px;

            font-weight: 600;

            line-height: 1.5;

            text-align: center;

            word-break: keep-all;

            overflow-wrap: break-word;
        }


        /* =========================================
           등장 애니메이션
           ========================================= */

        @keyframes donation-in {

            0% {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.96);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           사라지는 애니메이션
           ========================================= */

        @keyframes donation-out {

            0% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-15px)
                    scale(0.97);
            }
        }
    </style>
</head>


<body>

    <!-- =========================================
         OBS 오버레이
         ========================================= -->

    <div class="overlay">

        <!--
            바깥 흰색 박스 없음

            이 영역은 단순히 내용만 묶어주는
            투명한 컨테이너입니다.
        -->
        <div
            id="donationContent"
            class="donation-content"
        >

            <!-- =================================
                 후원 감사 문구
                 
                 박스 없음
                 ================================= -->

            <div
                id="donationTitle"
                class="donation-title"
            >

                <span
                    id="nickname"
                    class="nickname"
                >
                    스누피
                </span>

                님! 치즈

                <span
                    id="amount"
                    class="amount"
                >
                    1,000원
                </span>

                후원 감사합니다.

            </div>


            <!-- =================================
                 후원 메시지
                 
                 유일한 네모 박스
                 ================================= -->

            <div
                id="donationMessage"
                class="donation-message"
            >
                오늘도 방송 잘보고있어요 😊
            </div>

        </div>

    </div>


    <script>

        /* =========================================
           HTML 요소 가져오기
           ========================================= */

        const donationContent =
            document.getElementById(
                "donationContent"
            );

        const nicknameElement =
            document.getElementById(
                "nickname"
            );

        const amountElement =
            document.getElementById(
                "amount"
            );

        const messageElement =
            document.getElementById(
                "donationMessage"
            );


        /* =========================================
           타이머
           ========================================= */

        let hideTimer = null;

        let removeTimer = null;


        /* =========================================
           후원 알림 표시 함수
           ========================================= */

        function showDonation(
            nickname,
            amount,
            message
        ) {

            /* 기존 타이머 제거 */
            if (hideTimer !== null) {

                clearTimeout(hideTimer);

                hideTimer = null;
            }


            if (removeTimer !== null) {

                clearTimeout(removeTimer);

                removeTimer = null;
            }


            /* 닉네임 변경 */
            nicknameElement.textContent =
                nickname;


            /* 후원 금액 변경 */
            amountElement.textContent =
                amount;


            /* 후원 메시지 변경 */
            messageElement.textContent =
                message;


            /* 기존 애니메이션 제거 */
            donationContent.classList.remove(
                "show"
            );

            donationContent.classList.remove(
                "hide"
            );


            /*
             * 애니메이션 재실행을 위한
             * 강제 리플로우
             */
            void donationContent.offsetWidth;


            /* 등장 */
            donationContent.classList.add(
                "show"
            );


            /* =====================================
               5초 후 사라지기 시작
               ===================================== */

            hideTimer = setTimeout(() => {

                donationContent.classList.remove(
                    "show"
                );

                donationContent.classList.add(
                    "hide"
                );

            }, 5000);


            /* =====================================
               5.5초 후 완전히 숨김
               ===================================== */

            removeTimer = setTimeout(() => {

                donationContent.classList.remove(
                    "hide"
                );

                donationContent.style.visibility =
                    "hidden";

            }, 5500);
        }


        /* =========================================
           테스트용 후원
           ========================================= */

        showDonation(
            "홍길동",
            "1,000원",
            "오늘도 방송 잘보고있어요 😊"
        );

    </script>

</body>
</html>
