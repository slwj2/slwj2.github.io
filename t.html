<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 화면 크기에 맞게 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confetti Overlay</title>

    <style>
        /* 모든 요소의 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        /* 전체 화면 */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;

            /* 완전 투명 배경 */
            background: transparent;

            /* 화면 밖 효과 숨김 */
            overflow: hidden;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;

            /* 마우스 입력 방해 방지 */
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- 파티션을 그리는 Canvas -->
    <canvas id="canvas"></canvas>

    <script>
        "use strict";


        /* =========================================================
           Canvas 설정
        ========================================================= */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: true
            });


        /* 화면 크기 */
        let width = 0;
        let height = 0;


        /* 장치 픽셀 비율 */
        let dpr = 1;


        /* =========================================================
           효과 설정
        ========================================================= */

        const CONFIG = {

            /* 화면에 동시에 존재하는 파티션 개수 */
            confettiCount: 160,

            /* 최소 크기 */
            minSize: 3,

            /* 최대 크기 */
            maxSize: 9,

            /* 최소 낙하 속도 */
            minSpeed: 0.7,

            /* 최대 낙하 속도 */
            maxSpeed: 2.7,

            /* 중력 */
            gravity: 0.012,

            /* 바람 */
            wind: 0.012,

            /* 좌우 흔들림 */
            swingAmount: 0.45,

            /* 화면 아래 페이드 영역 */
            fadeDistance: 140
        };


        /* =========================================================
           파티션 색상
        ========================================================= */

        const COLORS = [

            "#ff3b30",
            "#ff9500",
            "#ffcc00",
            "#34c759",
            "#00c7be",
            "#32ade6",
            "#007aff",
            "#5856d6",
            "#af52de",
            "#ff2d55",
            "#ffffff"
        ];


        /* =========================================================
           랜덤 숫자
        ========================================================= */

        function random(min, max) {

            return Math.random() *
                (max - min) +
                min;
        }


        /* =========================================================
           랜덤 색상
        ========================================================= */

        function randomColor() {

            return COLORS[
                Math.floor(
                    Math.random() *
                    COLORS.length
                )
            ];
        }


        /* =========================================================
           값 제한
        ========================================================= */

        function clamp(
            value,
            min,
            max
        ) {

            return Math.max(
                min,
                Math.min(
                    max,
                    value
                )
            );
        }


        /* =========================================================
           Canvas 크기 설정
        ========================================================= */

        function resizeCanvas() {

            /* 현재 화면 크기 */
            width =
                window.innerWidth;

            height =
                window.innerHeight;


            /* 최대 2배까지만 사용 */
            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            /* 실제 렌더링 해상도 */
            canvas.width =
                Math.floor(
                    width * dpr
                );

            canvas.height =
                Math.floor(
                    height * dpr
                );


            /* CSS 크기 */
            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            /* 논리 좌표 */
            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        /* 화면 크기 변경 */
        window.addEventListener(
            "resize",
            resizeCanvas,
            {
                passive: true
            }
        );


        /* 최초 실행 */
        resizeCanvas();


        /* =========================================================
           파티션 클래스
        ========================================================= */

        class Confetti {

            constructor() {

                /* -------------------------------------------------
                   위치
                ------------------------------------------------- */

                this.x =
                    random(
                        -20,
                        width + 20
                    );

                this.y =
                    random(
                        -height,
                        0
                    );


                /* -------------------------------------------------
                   크기
                ------------------------------------------------- */

                this.width =
                    random(
                        CONFIG.minSize,
                        CONFIG.maxSize
                    );

                this.height =
                    random(
                        CONFIG.minSize,
                        CONFIG.maxSize * 1.8
                    );


                /* -------------------------------------------------
                   낙하 속도
                ------------------------------------------------- */

                this.vx =
                    random(
                        -0.35,
                        0.35
                    );

                this.vy =
                    random(
                        CONFIG.minSpeed,
                        CONFIG.maxSpeed
                    );


                /* -------------------------------------------------
                   회전
                ------------------------------------------------- */

                this.rotation =
                    random(
                        0,
                        Math.PI * 2
                    );


                this.rotationSpeed =
                    random(
                        -0.1,
                        0.1
                    );


                /* -------------------------------------------------
                   좌우 흔들림
                ------------------------------------------------- */

                this.swing =
                    random(
                        0,
                        Math.PI * 2
                    );

                this.swingSpeed =
                    random(
                        0.01,
                        0.035
                    );


                /* -------------------------------------------------
                   색상
                ------------------------------------------------- */

                this.color =
                    randomColor();


                /* -------------------------------------------------
                   투명도
                ------------------------------------------------- */

                this.alpha =
                    random(
                        0.65,
                        1
                    );
            }


            /* =====================================================
               파티션 이동
            ===================================================== */

            update() {

                /* 좌우 흔들림 */
                this.swing +=
                    this.swingSpeed;


                /* 자연스러운 좌우 움직임 */
                this.x +=
                    this.vx +
                    Math.sin(
                        this.swing
                    ) *
                    CONFIG.swingAmount;


                /* 아래 방향 이동 */
                this.y +=
                    this.vy;


                /* 아주 약한 중력 */
                this.vy +=
                    CONFIG.gravity;


                /* 바람 */
                this.x +=
                    CONFIG.wind;


                /* 회전 */
                this.rotation +=
                    this.rotationSpeed;


                /* =================================================
                   화면 아래쪽 페이드
                ================================================= */

                if (
                    this.y >
                    height -
                    CONFIG.fadeDistance
                ) {

                    const distance =
                        height -
                        this.y;

                    this.alpha =
                        clamp(
                            distance /
                            CONFIG.fadeDistance,
                            0,
                            1
                        );
                }


                /* =================================================
                   화면 밖으로 나갔을 경우
                ================================================= */

                if (
                    this.y >
                    height + 30 ||
                    this.x <
                    -50 ||
                    this.x >
                    width + 50
                ) {

                    this.reset();
                }
            }


            /* =====================================================
               파티션 재생성
            ===================================================== */

            reset() {

                /* 위쪽 랜덤 위치 */
                this.x =
                    random(
                        -20,
                        width + 20
                    );

                this.y =
                    random(
                        -120,
                        -10
                    );


                /* 속도 초기화 */
                this.vx =
                    random(
                        -0.35,
                        0.35
                    );

                this.vy =
                    random(
                        CONFIG.minSpeed,
                        CONFIG.maxSpeed
                    );


                /* 회전 초기화 */
                this.rotation =
                    random(
                        0,
                        Math.PI * 2
                    );


                /* 새로운 색상 */
                this.color =
                    randomColor();


                /* 투명도 */
                this.alpha =
                    random(
                        0.65,
                        1
                    );
            }


            /* =====================================================
               파티션 렌더링
            ===================================================== */

            draw() {

                /* Canvas 상태 저장 */
                ctx.save();


                /* 위치 */
                ctx.translate(
                    this.x,
                    this.y
                );


                /* 회전 */
                ctx.rotate(
                    this.rotation
                );


                /* 투명도 */
                ctx.globalAlpha =
                    this.alpha;


                /* =================================================
                   파티션이 펄럭이는 효과
                ================================================= */

                const flutter =
                    0.55 +
                    Math.abs(
                        Math.sin(
                            this.rotation * 2
                        )
                    ) *
                    0.45;


                ctx.scale(
                    flutter,
                    1
                );


                /* =================================================
                   그라데이션
                ================================================= */

                const gradient =
                    ctx.createLinearGradient(
                        -this.width,
                        -this.height,
                        this.width,
                        this.height
                    );


                /* 밝은 부분 */
                gradient.addColorStop(
                    0,
                    "#ffffff"
                );


                /* 메인 색상 */
                gradient.addColorStop(
                    0.3,
                    this.color
                );


                /* 끝부분 */
                gradient.addColorStop(
                    1,
                    this.color
                );


                /* 그라데이션 적용 */
                ctx.fillStyle =
                    gradient;


                /* =================================================
                   파티션 모양
                ================================================= */

                const w =
                    this.width;

                const h =
                    this.height;

                const radius =
                    Math.min(
                        2,
                        w / 2
                    );


                ctx.beginPath();


                /* 위쪽 */
                ctx.moveTo(
                    -w / 2 + radius,
                    -h / 2
                );

                ctx.lineTo(
                    w / 2 - radius,
                    -h / 2
                );


                /* 오른쪽 위 */
                ctx.quadraticCurveTo(
                    w / 2,
                    -h / 2,
                    w / 2,
                    -h / 2 + radius
                );


                /* 오른쪽 */
                ctx.lineTo(
                    w / 2,
                    h / 2 - radius
                );


                /* 오른쪽 아래 */
                ctx.quadraticCurveTo(
                    w / 2,
                    h / 2,
                    w / 2 - radius,
                    h / 2
                );


                /* 아래 */
                ctx.lineTo(
                    -w / 2 + radius,
                    h / 2
                );


                /* 왼쪽 아래 */
                ctx.quadraticCurveTo(
                    -w / 2,
                    h / 2,
                    -w / 2,
                    h / 2 - radius
                );


                /* 왼쪽 */
                ctx.lineTo(
                    -w / 2,
                    -h / 2 + radius
                );


                /* 왼쪽 위 */
                ctx.quadraticCurveTo(
                    -w / 2,
                    -h / 2,
                    -w / 2 + radius,
                    -h / 2
                );


                /* 닫기 */
                ctx.closePath();


                /* 파티션 출력 */
                ctx.fill();


                /* Canvas 상태 복원 */
                ctx.restore();
            }
        }


        /* =========================================================
           파티션 배열
        ========================================================= */

        const confetti = [];


        /* =========================================================
           파티션 생성
           
           ※ 폭죽 파티션 생성 없음
           ※ 사방으로 퍼지는 burst 없음
        ========================================================= */

        for (
            let i = 0;
            i < CONFIG.confettiCount;
            i++
        ) {

            confetti.push(
                new Confetti()
            );
        }


        /* =========================================================
           폭죽 사방 발사 로직
           
           요청에 따라 제거/주석 처리

           아래와 같은 로직은 사용하지 않습니다.

           const angle = random(0, Math.PI * 2);

           const speed = random(
               1.5,
               5.5
           );

           this.vx =
               Math.cos(angle) *
               speed;

           this.vy =
               Math.sin(angle) *
               speed;

           ========================================================= */


        /*
        =========================================================
        폭죽 섬광 로직

        요청에 따라 비활성화

        class Flash {

            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.life = 20;
            }

            update() {
                this.radius += 2;
                this.life--;
            }

            draw() {
                // 폭죽 섬광
            }
        }

        =========================================================
        */


        /* =========================================================
           애니메이션
        ========================================================= */

        function animate() {

            /* 이전 프레임 삭제 */
            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /* =====================================================
               모든 파티션 업데이트
            ===================================================== */

            for (
                let i = 0;
                i < confetti.length;
                i++
            ) {

                /* 파티션 이동 */
                confetti[i].update();


                /* 파티션 그리기 */
                confetti[i].draw();
            }


            /* 다음 프레임 */
            requestAnimationFrame(
                animate
            );
        }


        /* =========================================================
           애니메이션 시작
        ========================================================= */

        animate();

    </script>

</body>
</html>
